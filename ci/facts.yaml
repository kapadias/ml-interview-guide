# Drift sentinels: canonical facts asserted program-wide.
# ci/check_drift.py greps every volume; a "forbid" hit or a missing "require" fails CI.
# Each entry: id, fact (human-readable), forbid (regex list), scope (repos)
#
# Keep patterns NARROW and line-local. Broad windows (\s\S across 200 chars) were
# tried and rejected: they flag the passages that state the fact CORRECTLY -- e.g.
# "FP8 dense roof: 1979 TFLOP/s" (true) and "quote the dense number, not the
# 2:4-sparsity 1979" (a warning against the very error). A checker that cries wolf
# gets ignored, so these sentinels deliberately accept false negatives. They cannot
# catch an error split across table rows (a chapter-5 table listed GPT-2 as
# post-norm for months); reviewing tables is a human job.
#
# Facts deliberately NOT sentinelled, because no pattern separates the error from
# the correct discussion of it:
#   * Llama 3 405B MFU. Meta reports 30.84M H100-hours, which implies ~35%
#     end-to-end, not the ~40% a naive 6ND estimate gives. Every attempted regex
#     also flagged the numbers card, which correctly prints both figures side by
#     side to teach the gap. The content is fixed in [DL 25] and the numbers card;
#     keeping the check would have trained readers to ignore CI.
facts:
  - id: chinchilla-direction
    fact: "Chinchilla-optimal is D ≈ 20N (20 tokens per parameter), never N ≈ 20D"
    forbid:
      - 'N \\approx 20 \\times D'
      - 'N \\approx 20D'
    scope: [dl, nlp, sr, cml]
  - id: gpt2-prenorm
    fact: "GPT-2 uses pre-norm (LayerNorm moved to block inputs)"
    forbid:
      - 'GPT-2 (?:uses|used|is|was) (?:a |the )?post-norm'
      - 'GPT-2[^\n]{0,80}post-norm'
    scope: [dl, nlp]
  - id: o1-not-mcts
    fact: "Reasoning models are trained with outcome-based verifiable rewards; PRM+MCTS search is the superseded hypothesis"
    forbid:
      - 'PRMs are foundational to o1'
      - '(?:mechanism|principle|approach) behind o1[^.]{0,80}MCTS'
      - 'o1[^.]{0,60}(?:works|operates) by[^.]{0,40}MCTS(?![^.]*superseded)'
    scope: [dl, nlp]
  - id: esmm-product
    fact: "ESMM supervises pCTCVR = pCTR x pCVR; CVR is never computed as the ratio CTCVR/CTR"
    forbid:
      - 'ratio CTCVR/CTR'
      - 'CTCVR / CTR'
    scope: [dl, sr]
  - id: h100-dense-bf16
    fact: "H100 dense BF16 is ~990 TFLOPS (1979 is the 2:4 sparsity number)"
    forbid:
      - '495 TFLOPS'
      - '1,?979[^\n]{0,30}(?:TFLOPS?|TFLOP/s)[^\n]{0,20}(?:BF16|bf16) dense'
      - '(?:BF16|bf16) dense[^\n]{0,30}1,?979'
    scope: [dl, nlp, sr]
  - id: vocab-gpt2-bert
    fact: "GPT-2 vocab 50,257 (byte-level BPE); BERT 30,522 (WordPiece)"
    forbid:
      - '32K \(GPT-2\)'
      - '50K \(BERT\)'
    scope: [dl, nlp]
  - id: mape-asymmetry
    fact: "MAPE penalizes over-prediction MORE (under-forecast caps at 100%, over-forecast is unbounded), so it biases forecasts low"
    forbid:
      - 'penali[sz]es over-prediction less'
      - 'over-prediction less than under-prediction'
    scope: [dl, cml, sr]
  - id: ab-sample-size
    fact: "2% CTR, 1% relative lift needs ~7.84M per group by n=16p(1-p)/delta^2"
    forbid:
      - '1\.6M samples per group'
    scope: [dl, cml]
