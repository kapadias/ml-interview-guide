<title>Coupang Loop Prep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --card:#FCFDFC; --raise:#F4F7F5;
  --ink:#141A18; --body:#2A3431; --muted:#5E6B66; --faint:#93A19B;
  --accent:#0E6E63; --accent-soft:#D7E6E2; --flag:#A6402C; --flag-soft:#F5E4DF;
  --rule:#DBE2DE; --tick:#C2CDC8; --ok:#0E6E63; --shaky:#B5822A; --again:#A6402C;
  --push:#3A4A6E; --push-soft:#E9EDF5; --num:#7A621A; --num-soft:#F4F1E3;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
  --push:#93A9DC; --push-soft:#1A2030; --num:#D9BE6A; --num-soft:#2A2718;
}}
:root[data-theme="dark"]{
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
  --push:#93A9DC; --push-soft:#1A2030; --num:#D9BE6A; --num-soft:#2A2718;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--sans);
  font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;color:var(--ink);text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono);font-size:.86em;background:var(--raise);
  padding:.08em .32em;border-radius:3px;color:var(--ink)}
a{color:var(--accent)}

.wrap{max-width:840px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-block:11px 0}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--faint);padding-top:6px}
.sub:empty{display:none}
.top .spacer{flex:1}
.tbtn{font-size:.74rem;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:4px}
.tbtn:hover{color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.83rem;font-weight:600;padding:8px 13px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin-left:5px}

.spine{display:flex;gap:2px;margin-top:9px;height:14px;align-items:flex-end;
  overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.spine::-webkit-scrollbar{display:none}
.tick{flex:1 0 3px;min-width:3px;height:8px;background:var(--tick);border-radius:1px;
  padding:0;transition:height .12s ease}
.tick[data-g="solid"]{background:var(--ok)}
.tick[data-g="shaky"]{background:var(--shaky)}
.tick[data-g="again"]{background:var(--again)}
.tick[aria-current="true"]{height:14px;background:var(--ink)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 12px}
.chip{font-size:.73rem;font-weight:600;padding:4px 9px;border-radius:20px;
  border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C110F}
}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:24px 28px 22px;margin-top:18px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.71rem;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-bottom:11px}
.eyebrow .n{font-family:var(--mono);letter-spacing:0;color:var(--accent)}
.eyebrow .sec{color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:3px}
.eyebrow .dot{color:var(--rule)}
.q{font-size:1.38rem;line-height:1.28;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.clock{margin-top:18px}
.track{position:relative;height:4px;background:var(--rule);border-radius:2px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px}
.fill.over{background:var(--flag)}
.target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45}
.clockrow{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.73rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.clockrow .el{color:var(--ink);font-weight:600;font-size:.88rem}
.clockrow .el.over{color:var(--flag)}
.clockrow .spacer{flex:1}
.go{font-family:var(--sans);font-weight:600;font-size:.77rem;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.go:hover{text-decoration:underline}
.veil{margin-top:20px;padding:18px;border:1px dashed var(--rule);border-radius:8px;
  text-align:center;color:var(--muted);font-size:.87rem}
.veil b{display:block;color:var(--ink);font-weight:600;font-size:1rem;margin-bottom:3px}
.veil kbd{font-family:var(--mono);font-size:.77rem;background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ink)}
.lab{font-size:.69rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:22px 0 6px}
.lab.f{color:var(--flag)}
.say{font-family:var(--serif);font-size:1.06rem;line-height:1.62;color:var(--body);max-width:64ch}
.say p{margin:0 0 .85em}
.say p:last-child{margin-bottom:0}
ul.tight{margin:0;padding-left:1.15em;max-width:64ch}
ul.tight li{margin-bottom:5px}
ul.tight li::marker{color:var(--faint)}
.nums{list-style:none;padding:0;margin:0;max-width:64ch}
.nums li{font-family:var(--mono);font-size:.83rem;line-height:1.5;color:var(--ink);
  padding:6px 0 6px 13px;border-left:2px solid var(--accent-soft)}
.cp{margin-top:18px;background:var(--accent-soft);border-radius:8px;padding:13px 16px;
  font-size:.93rem;color:var(--ink);max-width:64ch}
.cp b{font-weight:700}
.marker{background:var(--raise);border-radius:8px;padding:14px 17px;max-width:64ch;overflow-x:auto}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}
.grade{display:flex;gap:9px;margin-top:24px;padding-top:18px;
  border-top:1px solid var(--rule);flex-wrap:wrap}
.gbtn{flex:1 1 130px;padding:10px 12px;border-radius:7px;border:1px solid var(--rule);
  font-weight:600;font-size:.86rem;color:var(--ink);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn .k{font-family:var(--mono);font-size:.71rem;color:var(--faint);font-weight:400}
.gbtn[data-g="solid"]:hover,.gbtn[data-g="solid"][aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
.gbtn[data-g="shaky"]:hover,.gbtn[data-g="shaky"][aria-pressed="true"]{color:var(--shaky);border-color:var(--shaky)}
.gbtn[data-g="again"]:hover,.gbtn[data-g="again"][aria-pressed="true"]{color:var(--again);border-color:var(--again)}
.nav{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:.79rem;color:var(--muted)}
.nav button{font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--accent)}
.nav .spacer{flex:1}
.src{margin-top:18px;font-size:.71rem;color:var(--faint);font-family:var(--mono)}

/* prose panes */
.prose{max-width:70ch;margin-top:8px}
.prose h2{font-size:1.7rem;letter-spacing:-.02em;margin:30px 0 10px}
.prose h3{font-size:1.16rem;margin:28px 0 7px;color:var(--accent)}
.prose h4{font-size:1rem;margin:20px 0 5px}
.prose p{margin:0 0 .95em;font-family:var(--serif);font-size:1.05rem;line-height:1.62}
.prose li{font-family:var(--serif);font-size:1.03rem;line-height:1.55;margin-bottom:6px}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1em}
.prose blockquote{margin:18px 0;padding:14px 18px;background:var(--accent-soft);
  border-radius:8px;border-left:3px solid var(--accent)}
.prose blockquote p{margin:0;font-size:1rem}
.prose hr{border:none;border-top:1px solid var(--rule);margin:26px 0}
.tw{overflow-x:auto;margin:0 0 18px}
.prose table{border-collapse:collapse;width:100%;font-size:.89rem;font-family:var(--sans)}
.prose th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule);
  color:var(--ink);font-weight:700;font-size:.79rem;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.prose td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.prose tbody tr:hover{background:var(--raise)}

/* coding pane */
.prob{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:20px 24px;margin-top:14px}
.prob h3{font-size:1.14rem;margin-bottom:4px}
.ptag{font-family:var(--mono);font-size:.7rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em}
.ptag .d{color:var(--accent)}
.prompt{font-family:var(--serif);font-size:1.02rem;margin:8px 0 0;color:var(--body)}
.reveal{margin-top:12px;font-size:.79rem;font-weight:600;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.reveal:hover{text-decoration:underline}
pre{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:13px 15px;overflow-x:auto;margin:0;font-size:.81rem;line-height:1.5}
pre code{background:none;padding:0;font-size:1em}

/* ---- figures: SVG authored once, sized here so cairosvg stays happy ---- */
figure.dg{margin:22px 0 20px;padding:0}
figure.dg svg{display:block;width:100%;max-width:100%;height:auto}
figure.dg figcaption{font-family:var(--sans);font-size:.8rem;line-height:1.5;
  color:var(--muted);margin-top:9px;max-width:66ch}

/* ---- decision blocks: the choice, the alternative, and the price ---- */
.decide{border:1.5px solid var(--accent);border-radius:9px;margin:20px 0;
  overflow:hidden;background:var(--card)}
.decide .dt{background:var(--accent);color:#fff;font-family:var(--sans);
  font-weight:700;font-size:.87rem;padding:7px 13px;letter-spacing:.005em}
:root[data-theme="dark"] .decide .dt{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .decide .dt{color:#0C110F}
}
.decide .drow{display:flex;gap:12px;padding:8px 13px;
  border-top:1px solid var(--rule);align-items:baseline}
.decide .drow:first-of-type{border-top:none}
.dk{flex:0 0 68px;font-family:var(--mono);font-size:.66rem;font-weight:600;
  letter-spacing:.09em;color:var(--accent);text-transform:uppercase;padding-top:2px}
.dk.over{color:var(--muted)}
.dk.cost,.dk.but{color:var(--num)}
.dk.fallback,.dk.drop-it-if{color:var(--push)}
.dv{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.5;color:var(--body)}

/* ---- callouts ---- */
.co{border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 7px 7px 0;padding:11px 15px;margin:18px 0;
  font-family:var(--serif);font-size:1.02rem;line-height:1.55;color:var(--ink);
  max-width:68ch}
.co .col{display:block;font-family:var(--mono);font-size:.66rem;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
  margin-bottom:4px}
.co.trap{border-left-color:var(--flag);background:var(--flag-soft)}
.co.trap .col{color:var(--flag)}
.co.push{border-left-color:var(--push);background:var(--push-soft)}
.co.push .col{color:var(--push)}
.co.num{border-left-color:var(--num);background:var(--num-soft);
  font-family:var(--mono);font-size:.84rem;line-height:1.7}
.co.num .col{color:var(--num)}

/* ---- display math ---- */
.mathbox{border:1px solid var(--rule);border-radius:8px;background:var(--card);
  padding:2px 14px;margin:16px 0;overflow-x:auto}
.prose pre.fig{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:14px 16px;overflow-x:auto;margin:4px 0 6px;font-size:.78rem;
  line-height:1.42;color:var(--ink)}
.prose pre.fig.wide{font-size:.7rem}
.figcap{font-family:var(--sans)!important;font-size:.76rem!important;color:var(--muted);
  margin:0 0 20px!important;letter-spacing:.01em}

@media (max-width:600px){
  .wrap{padding-inline:16px}
  .card,.prob{padding:18px 16px}
  .q{font-size:1.18rem}
  .say{font-size:1.01rem}
  .gbtn{flex:1 1 100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:-16px;padding-inline:16px}
  .filters::-webkit-scrollbar{display:none}
  .prose p,.prose li{font-size:1rem}
  /* Diagrams are 62-74 monospace columns; at this size they fit a 390px
     screen instead of scrolling inside their own box. */
  .prose pre.fig{font-size:.6rem;line-height:1.35;padding:10px 11px}
  .prose pre.fig.wide{font-size:.52rem}
  .decide .drow{flex-direction:column;gap:3px;padding:8px 11px}
  .dk{flex:none}
  .dv{font-size:.97rem}
  .co{font-size:.98rem;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="wrap" style="padding-block:0">
    <div class="topbar">
      <span class="brand">Coupang <span>Search &amp; Discovery</span></span>
      <span class="spacer"></span>
      <button class="tbtn" id="shuffle">Shuffle</button>
      <button class="tbtn" id="theme">Theme</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="sub" id="sub"></div>
    <div id="chrome"></div>
  </div>
</div>
<div class="wrap"><div id="stage"></div></div>

<script id="deck" type="application/json">/*__DATA__*/null</script>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]]},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script>

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('deck').textContent);
var WPM = 150, KEY = 'coupang.progress.v1';
var TABS = [
  {id:'brief',    label:'The loop'},
  {id:'deepdive', label:'The set-piece question'},
  {id:'aisearch', label:'AI-powered search'},
  {id:'vectors',  label:'Vector retrieval'},
  {id:'depth',    label:'ML depth',   n:D.depth.length},
  {id:'parth',    label:"Parth's round"},
  {id:'breadth',  label:'ML breadth', n:D.breadth.length},
  {id:'project', label:'Project deep-dive'},
  {id:'coding',  label:'Coding',     n:D.coding.length}
];
var st = {tab:'brief', grades:{}, i:{depth:0,breadth:0}, section:{depth:null,breadth:null},
          revealed:false, open:{}, order:{depth:null,breadth:null}};
var timer = {t0:0, raf:0, running:false};
var dbref = null;

try{ st.grades = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ st.grades = {}; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(st.grades)); }catch(e){} }
function persist(){
  saveLocal();
  if(dbref) dbref.set({grades:st.grades, updatedAt:new Date().toISOString()})
    .catch(function(){ sub('saved on this device only'); });
}
function sub(t){ var e=document.getElementById('sub'); if(e) e.textContent=t; }

if(window.claude && window.claude.use){
  window.claude.use('db').then(function(db){
    if(!db) return;
    dbref = db.doc('progress/state');
    dbref.onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(d && d.grades){
        var changed=false;
        for(var k in d.grades){ if(!st.grades[k]){ st.grades[k]=d.grades[k]; changed=true; } }
        if(changed){ saveLocal(); render(); }
      }
      sub('synced');
    }, function(){ sub('local only'); });
    persist();
  });
}

function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function rich(s){
  return s.split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/).map(function(p,i){
    if(i%2) return p;
    p = esc(p);
    p = p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    p = p.replace(/`([^`]+)`/g,'<code>$1</code>');
    return p;
  }).join('');
}
function paras(s){
  return s.split(/\n+/).filter(function(p){return p.trim();})
    .map(function(p){return '<p>'+rich(p.trim())+'</p>';}).join('');
}
function items(a,cls){
  return '<ul class="tight '+(cls||'')+'">'+a.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
}
function mm(s){ return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function isDrill(){ return st.tab==='depth' || st.tab==='breadth'; }
function words(q){ return q.say.split(/\s+/).length; }

function baseOrder(tab){
  if(!st.order[tab]) st.order[tab] = D[tab].map(function(_,i){return i;});
  return st.order[tab];
}
function pool(){
  var tab = st.tab;
  return baseOrder(tab).filter(function(ix){
    return !st.section[tab] || D[tab][ix].section === st.section[tab]; });
}
function current(){ var p=pool(); return D[st.tab][p[Math.min(st.i[st.tab], p.length-1)]]; }

function paintTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab" data-tab="'+t.id+'" aria-selected="'+(st.tab===t.id)+'">'
      + esc(t.label) + (t.n ? '<span class="n">'+t.n+'</span>' : '') + '</button>';
  }).join('');
}
function paintChrome(){
  var el = document.getElementById('chrome');
  if(!isDrill()){ el.innerHTML=''; return; }
  var tab = st.tab, secs = [], counts = {};
  D[tab].forEach(function(q){
    if(counts[q.section]===undefined){ secs.push(q.section); counts[q.section]=0; }
    counts[q.section]++;
  });
  var p = pool();
  var done = p.filter(function(ix){ return st.grades[key(D[tab][ix])]; }).length;
  var solid = p.filter(function(ix){ return st.grades[key(D[tab][ix])]==='solid'; }).length;
  var html = '<div class="spine">' + p.map(function(ix,n){
    var q=D[tab][ix], g=st.grades[key(q)];
    return '<button class="tick" data-n="'+n+'"'+(g?' data-g="'+g+'"':'')
      + (n===st.i[tab]?' aria-current="true"':'')
      + ' title="'+esc(q.question.slice(0,80))+'"></button>';
  }).join('') + '</div>';
  html += '<div class="filters"><button class="chip" data-sec="" aria-pressed="'
       + (!st.section[tab]) + '">All ' + D[tab].length + '</button>'
       + secs.map(function(s){
           return '<button class="chip" data-sec="'+esc(s)+'" aria-pressed="'
             + (st.section[tab]===s)+'">'+esc(s)+' '+counts[s]+'</button>';
         }).join('') + '</div>';
  el.innerHTML = html;
  sub((st.i[tab]+1)+' / '+p.length+'  ·  '+solid+' solid, '+(done-solid)+' to revisit');
}
function key(q){ return st.tab + ':' + q.id; }

function stopTimer(){ timer.running=false; cancelAnimationFrame(timer.raf); }
function startTimer(){
  var target = words(current())/WPM*60;
  timer.t0 = performance.now(); timer.running = true;
  var fill=document.getElementById('fill'), el=document.getElementById('elapsed');
  (function tick(){
    if(!timer.running) return;
    var s=(performance.now()-timer.t0)/1000;
    fill.style.width = Math.min(100, s/(target*1.35)*100)+'%';
    fill.classList.toggle('over', s>target);
    el.textContent = mm(s); el.classList.toggle('over', s>target);
    timer.raf = requestAnimationFrame(tick);
  })();
  var g=document.getElementById('go'); if(g) g.textContent='Stop';
}

function renderCard(){
  var p = pool(), tab = st.tab;
  if(!p.length) return '<div class="card">Nothing in this section.</div>';
  st.i[tab] = Math.max(0, Math.min(st.i[tab], p.length-1));
  var q = current(), target = words(q)/WPM*60, g = st.grades[key(q)];
  var h = '<div class="card">';
  h += '<div class="eyebrow"><span class="n">'+String(q.id).padStart(3,'0')+'</span>'
     + '<span class="sec">'+esc(q.section)+'</span>'
     + '<span>'+esc(q.level)+'</span><span class="dot">/</span><span>'+esc(q.type)+'</span></div>';
  h += '<h2 class="q">'+rich(q.question)+'</h2>';
  h += '<div class="clock"><div class="track"><div class="fill" id="fill"></div>'
     + '<div class="target" style="left:'+(100/1.35)+'%"></div></div>'
     + '<div class="clockrow"><span class="el" id="elapsed">0:00</span>'
     + '<span>of ~'+mm(target)+' spoken</span><span class="spacer"></span>'
     + '<button class="go" id="go">Start answering</button></div></div>';
  if(!st.revealed){
    h += '<div class="veil"><b>Say it out loud first.</b>Then <kbd>space</kbd> for the answer.</div>';
  } else {
    h += '<div class="lab">Say this</div><div class="say">'+paras(q.say)+'</div>';
    if(q.numbers && q.numbers.length)
      h += '<div class="lab">Numbers worth quoting</div><ul class="nums">'
         + q.numbers.map(function(n){return '<li>'+rich(n)+'</li>';}).join('')+'</ul>';
    if(q.whiteboard)
      h += '<div class="lab">If they hand you the marker</div><div class="marker">'+rich(q.whiteboard)+'</div>';
    if(q.coupang)
      h += '<div class="cp"><b>At Coupang.</b> '+rich(q.coupang)+'</div>';
    h += '<div class="lab f">Loses the signal</div>'+items(q.red_flags);
    h += '<div class="lab">Then they ask</div>'+items(q.followups);
    h += '<div class="src">'+esc(q.source||'')+'</div>';
  }
  h += '<div class="grade">'+gbtn('solid','Had it','1',g)+gbtn('shaky','Shaky','2',g)
     + gbtn('again','Again','3',g)+'</div>';
  h += '<div class="nav"><button data-nav="-1">&larr; Previous</button>'
     + '<span class="spacer"></span><button data-nav="1">Next &rarr;</button></div></div>';
  return h;
}
function gbtn(g,label,k,cur){
  return '<button class="gbtn" data-g="'+g+'" aria-pressed="'+(cur===g)
       + '">'+esc(label)+' <span class="k">'+k+'</span></button>';
}

function renderCoding(){
  var section = null, h = '<div class="prose">'+D.codingIntro+'</div>';
  D.coding.forEach(function(p){
    if(p.section !== section){ section = p.section; h += '<h3 class="pgroup" style="margin-top:26px">'+esc(section)+'</h3>'; }
    var open = st.open['c'+p.n];
    h += '<div class="prob"><div class="ptag">Problem '+p.n+' · <span class="d">'
       + esc(p.difficulty)+'</span></div><h3>'+esc(p.title)+'</h3>'
       + '<p class="prompt">'+rich(p.prompt)+'</p>'
       + '<div class="lab">What makes you recognise it</div><div class="say">'+rich(p.cue)+'</div>'
       + '<button class="reveal" data-open="c'+p.n+'">'+(open?'Hide solution':'Show approach and solution')+'</button>';
    if(open){
      h += '<div class="lab">Approach</div><div class="say">'+rich(p.approach)+'</div>'
         + '<div class="lab">Complexity</div><div class="say">'+rich(p.complexity)+'</div>'
         + '<div class="lab">Edge cases to raise before you code</div>'+items(p.edges)
         + '<div class="lab">Reference solution</div><pre><code>'+esc(p.code)+'</code></pre>'
         + '<div class="lab">Then they ask</div><div class="say">'+rich(p.followup)+'</div>';
    }
    h += '</div>';
  });
  return h;
}

function render(){
  paintTabs(); paintChrome(); stopTimer();
  var stage = document.getElementById('stage');
  if(st.tab==='brief')         stage.innerHTML = '<div class="prose">'+D.brief+'</div>';
  else if(st.tab==='deepdive') stage.innerHTML = '<div class="prose">'+D.deepdive+'</div>';
  else if(st.tab==='aisearch') stage.innerHTML = '<div class="prose">'+D.aiSearch+'</div>';
  else if(st.tab==='vectors')  stage.innerHTML = '<div class="prose">'+D.vectorRetrieval+'</div>';
  else if(st.tab==='parth')    stage.innerHTML = '<div class="prose">'+D.breadthRound+'</div>';
  else if(st.tab==='project')  stage.innerHTML = '<div class="prose">'+D.project+'</div>';
  else if(st.tab==='coding')  stage.innerHTML = renderCoding();
  else                        stage.innerHTML = renderCard();
  if(window.MathJax && window.MathJax.typesetPromise)
    window.MathJax.typesetPromise([stage]).catch(function(){});
  if(!isDrill()) sub('');
}

function go(n){ st.i[st.tab] += n; st.revealed=false; render(); }
function grade(g){
  if(!isDrill()) return;
  var q=current(), k=key(q);
  if(st.grades[k]===g) delete st.grades[k]; else st.grades[k]=g;
  persist();
  if(st.grades[k]) go(1); else render();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ st.tab=t.dataset.tab; st.revealed=false; render(); window.scrollTo(0,0); return; }
  if(t.classList.contains('chip')){
    st.section[st.tab] = t.dataset.sec || null; st.i[st.tab]=0; st.revealed=false; render(); return;
  }
  if(t.classList.contains('tick')){ st.i[st.tab]=+t.dataset.n; st.revealed=false; render(); return; }
  if(t.dataset.open){ st.open[t.dataset.open] = !st.open[t.dataset.open]; render(); return; }
  if(t.id==='go'){ timer.running ? (stopTimer(), t.textContent='Start answering') : startTimer(); return; }
  if(t.id==='shuffle'){
    if(!isDrill()) return;
    var o = baseOrder(st.tab);
    for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), s=o[i]; o[i]=o[j]; o[j]=s; }
    st.i[st.tab]=0; st.revealed=false; render(); return;
  }
  if(t.id==='theme'){
    var r=document.documentElement;
    var dark=r.getAttribute('data-theme')==='dark' ||
      (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme', dark?'light':'dark'); return;
  }
  if(t.dataset.nav){ go(+t.dataset.nav); return; }
  if(t.classList.contains('gbtn')){ grade(t.dataset.g); return; }
});

document.addEventListener('keydown', function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  var k=e.key;
  if(k>='1'&&k<='5'&&!isDrill()){ st.tab=TABS[+k-1].id; render(); return; }
  if(!isDrill()) return;
  if(k===' '){ e.preventDefault(); if(st.revealed) go(1); else { st.revealed=true; render(); } }
  else if(k==='ArrowRight'||k==='j'){ e.preventDefault(); go(1); }
  else if(k==='ArrowLeft'||k==='k'){ e.preventDefault(); go(-1); }
  else if(k==='1'){ grade('solid'); }
  else if(k==='2'){ grade('shaky'); }
  else if(k==='3'){ grade('again'); }
  else if(k==='t'){ timer.running ? stopTimer() : startTimer(); }
});

var hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(function(){ return {tab:st.tab, i:st.i}; });
var boot = function(d){
  if(d && d.tab){ st.tab=d.tab; if(d.i) st.i=d.i; }
  render();
};
hot && hot.ready ? hot.ready(boot) : boot((hot && hot.data) || {});
})();
</script>
