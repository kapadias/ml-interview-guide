<title>Breadth &amp; Depth Drill</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --card:#FCFDFC; --raise:#F6F8F6;
  --ink:#141A18; --body:#2A3431; --muted:#5E6B66; --faint:#93A19B;
  --accent:#0E6E63; --accent-soft:#D7E6E2; --flag:#A6402C; --flag-soft:#F2DFD9;
  --rule:#DBE2DE; --tick:#C2CDC8; --ok:#0E6E63; --shaky:#B5822A; --again:#A6402C;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
}}
:root[data-theme="dark"]{
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--sans);
  font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--ink);text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono);font-size:.88em;background:var(--raise);
  padding:.08em .3em;border-radius:3px;color:var(--ink)}

/* ---- shell ---- */
.wrap{max-width:820px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-block:12px 10px;margin-bottom:22px}
.topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;color:var(--ink);letter-spacing:-.01em;
  font-stretch:105%}
.brand span{color:var(--accent)}
.count{font-family:var(--mono);font-size:.76rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.top .spacer{flex:1}
.tbtn{font-size:.76rem;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:4px}
.tbtn:hover{color:var(--accent);background:var(--accent-soft)}

/* ---- the spine: every question, coloured by how it went ---- */
.spine{display:flex;gap:2px;margin-top:11px;height:15px;align-items:flex-end;
  overflow-x:auto;scrollbar-width:none}
.spine::-webkit-scrollbar{display:none}
.tick{flex:1 0 3px;min-width:3px;height:8px;background:var(--tick);border-radius:1px;
  padding:0;transition:height .12s ease}
.tick[data-g="solid"]{background:var(--ok)}
.tick[data-g="shaky"]{background:var(--shaky)}
.tick[data-g="again"]{background:var(--again)}
.tick[aria-current="true"]{height:15px;background:var(--ink)}

/* ---- filters ---- */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:.74rem;font-weight:600;letter-spacing:.02em;padding:4px 9px;
  border-radius:20px;border:1px solid var(--rule);color:var(--muted);
  white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C110F}
}

/* ---- card ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:26px 30px 24px}
.eyebrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-bottom:12px}
.eyebrow .n{font-family:var(--mono);letter-spacing:0;color:var(--accent)}
.eyebrow .dot{color:var(--rule)}
.eyebrow .round{color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:3px;letter-spacing:.06em}
.q{font-size:1.45rem;line-height:1.28;font-weight:600;letter-spacing:-.015em;
  font-stretch:103%;color:var(--ink)}

/* ---- the timer: a spoken answer has a length, so show it ---- */
.clock{margin-top:20px}
.track{position:relative;height:4px;background:var(--rule);border-radius:2px;
  overflow:visible}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);
  border-radius:2px}
.fill.over{background:var(--flag)}
.target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);
  opacity:.45}
.clockrow{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.74rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.clockrow .el{color:var(--ink);font-weight:600;font-size:.9rem}
.clockrow .el.over{color:var(--flag)}
.clockrow .spacer{flex:1}
.go{font-family:var(--sans);font-weight:600;font-size:.78rem;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.go:hover{text-decoration:underline}

/* ---- reveal ---- */
.veil{margin-top:22px;padding:20px;border:1px dashed var(--rule);border-radius:8px;
  text-align:center;color:var(--muted);font-size:.88rem}
.veil b{display:block;color:var(--ink);font-weight:600;font-size:1rem;
  margin-bottom:3px;font-family:var(--sans)}
.veil kbd{font-family:var(--mono);font-size:.78rem;background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ink)}
.lab{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:24px 0 7px}
.lab.f{color:var(--flag)}
.say{font-family:var(--serif);font-size:1.075rem;line-height:1.62;color:var(--body);
  max-width:64ch}
.say p{margin:0 0 .85em}
.say p:last-child{margin-bottom:0}
ul.tight{margin:0;padding-left:1.15em;max-width:64ch}
ul.tight li{margin-bottom:5px}
ul.tight li::marker{color:var(--faint)}
.nums{list-style:none;padding:0;margin:0;max-width:64ch}
.nums li{font-family:var(--mono);font-size:.84rem;line-height:1.5;color:var(--ink);
  padding:6px 0 6px 13px;border-left:2px solid var(--accent-soft)}
.flags li{color:var(--body)}
.marker{background:var(--flag-soft);border-radius:8px;padding:15px 18px;
  max-width:64ch;overflow-x:auto}
:root[data-theme="dark"] .marker{background:var(--raise)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .marker{background:var(--raise)}
}
.marker .tex{font-family:var(--mono);font-size:.86rem;color:var(--ink);
  display:block;margin-bottom:9px;overflow-x:auto}
.marker .note{font-family:var(--serif);font-size:.98rem;color:var(--body)}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}

/* ---- grading ---- */
.grade{display:flex;gap:9px;margin-top:26px;padding-top:20px;
  border-top:1px solid var(--rule);flex-wrap:wrap}
.gbtn{flex:1 1 130px;padding:11px 12px;border-radius:7px;border:1px solid var(--rule);
  font-weight:600;font-size:.87rem;color:var(--ink);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn:hover{border-color:currentColor}
.gbtn .k{font-family:var(--mono);font-size:.72rem;color:var(--faint);font-weight:400}
.gbtn[data-g="solid"]:hover,.gbtn[data-g="solid"][aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
.gbtn[data-g="shaky"]:hover,.gbtn[data-g="shaky"][aria-pressed="true"]{color:var(--shaky);border-color:var(--shaky)}
.gbtn[data-g="again"]:hover,.gbtn[data-g="again"][aria-pressed="true"]{color:var(--again);border-color:var(--again)}

.nav{display:flex;align-items:center;gap:16px;margin-top:18px;
  font-size:.8rem;color:var(--muted)}
.nav button{font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--accent)}
.nav .spacer{flex:1}
.src{margin-top:20px;font-size:.72rem;color:var(--faint);font-family:var(--mono)}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.sync{font-family:var(--mono);font-size:.68rem;color:var(--faint)}

@media (max-width:600px){
  .wrap{padding-inline:16px}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .count .detail{display:none}
  .clockrow .go{width:100%;text-align:right}
  .card{padding:20px 18px}
  .q{font-size:1.22rem}
  .say{font-size:1.02rem}
  .gbtn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="wrap" style="padding-block:0">
    <div class="topbar">
      <span class="brand">Breadth <span>&amp;</span> Depth Drill</span>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <span class="sync" id="sync"></span>
      <button class="tbtn" id="shuffle">Shuffle</button>
      <button class="tbtn" id="theme">Theme</button>
    </div>
    <div class="spine" id="spine"></div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<div class="wrap">
  <div id="stage"></div>
</div>

<script id="deck" type="application/json">/*__DATA__*/null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<script>
(function(){
"use strict";
var DECK = JSON.parse(document.getElementById('deck').textContent);
var QS = DECK.questions, TOPICS = DECK.topics;
var WPM = 150;                       // an unhurried interview pace
var KEY = 'drill.progress.v1';

var state = {grades:{}, i:0, topic:null, revealed:false, order:QS.map(function(q,i){return i;})};
var timer = {t0:0, raf:0, running:false};
var dbref = null;

/* ---------- persistence: db when the viewer has it, localStorage otherwise ---- */
function readLocal(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function writeLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state.grades)); }catch(e){}
}
function persist(){
  writeLocal();
  if(dbref){ dbref.set({grades:state.grades, updatedAt:new Date().toISOString()})
    .catch(function(){ note('saved on this device only'); }); }
}
function note(t){ var el=document.getElementById('sync'); if(el) el.textContent=t; }

state.grades = readLocal();

if(window.claude && window.claude.use){
  window.claude.use('db').then(function(db){
    if(!db) return;
    dbref = db.doc('progress/state');
    dbref.onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(d && d.grades){
        // Remote wins only where we have nothing: never lose a grade to a stale device.
        var changed = false;
        for(var k in d.grades){ if(!state.grades[k]){ state.grades[k]=d.grades[k]; changed=true; } }
        if(changed){ writeLocal(); paintSpine(); render(); }
      }
      note('synced');
    }, function(){ note('local only'); });
    persist();
  });
}

/* ---------- text ---------- */
function esc(s){ return s.replace(/[&<>]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

// Escape everything except the math spans, which MathJax needs verbatim.
function rich(s){
  var parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/);
  return parts.map(function(p,i){
    if(i%2) return p;
    p = esc(p);
    p = p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    p = p.replace(/`([^`]+)`/g,'<code>$1</code>');
    return p;
  }).join('');
}
function paras(s){
  return s.split(/\n+/).filter(function(p){return p.trim();})
    .map(function(p){ return '<p>'+rich(p.trim())+'</p>'; }).join('');
}
function items(a, cls){
  return '<ul class="tight '+(cls||'')+'">'+a.map(function(x){
    return '<li>'+rich(x)+'</li>'; }).join('')+'</ul>';
}
function mm(s){ var m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }

/* ---------- selection ---------- */
function pool(){
  return state.order.filter(function(ix){
    return !state.topic || QS[ix].topic === state.topic; });
}
function current(){ var p=pool(); return QS[p[Math.min(state.i, p.length-1)]]; }

/* ---------- chrome ---------- */
function paintFilters(){
  var el = document.getElementById('filters');
  var counts = {};
  QS.forEach(function(q){ counts[q.topic]=(counts[q.topic]||0)+1; });
  var html = '<button class="chip" data-t="" aria-pressed="'+(!state.topic)+'">All '+QS.length+'</button>';
  TOPICS.forEach(function(t){
    if(!counts[t]) return;
    html += '<button class="chip" data-t="'+esc(t)+'" aria-pressed="'+(state.topic===t)+'">'
         + esc(t)+' '+counts[t]+'</button>';
  });
  el.innerHTML = html;
}
function paintSpine(){
  var p = pool();
  document.getElementById('spine').innerHTML = p.map(function(ix,n){
    var q=QS[ix], g=state.grades[q.id];
    return '<button class="tick" data-n="'+n+'"'+(g?' data-g="'+g+'"':'')
      +(n===state.i?' aria-current="true"':'')
      +' title="'+esc(q.question.slice(0,80))+'"></button>';
  }).join('');
  var done = p.filter(function(ix){ return state.grades[QS[ix].id]; }).length;
  var solid = p.filter(function(ix){ return state.grades[QS[ix].id]==='solid'; }).length;
  document.getElementById('count').innerHTML =
    (state.i+1)+' / '+p.length
    +'<span class="detail">   ·   '+solid+' solid, '+(done-solid)+' to revisit</span>';
}

/* ---------- timer ---------- */
function stopTimer(){ timer.running=false; cancelAnimationFrame(timer.raf); }
function startTimer(){
  var q=current(), target=q.words/WPM*60;
  timer.t0=performance.now(); timer.running=true;
  var fill=document.getElementById('fill'), el=document.getElementById('elapsed');
  (function tick(){
    if(!timer.running) return;
    var s=(performance.now()-timer.t0)/1000;
    var pct=Math.min(100, s/(target*1.35)*100);
    fill.style.width=pct+'%';
    fill.classList.toggle('over', s>target);
    el.textContent=mm(s); el.classList.toggle('over', s>target);
    timer.raf=requestAnimationFrame(tick);
  })();
  var go=document.getElementById('go'); if(go) go.textContent='Stop';
}

/* ---------- the card ---------- */
function render(){
  var p=pool();
  if(!p.length){ document.getElementById('stage').innerHTML =
    '<div class="empty">Nothing in this topic.</div>'; return; }
  state.i = Math.max(0, Math.min(state.i, p.length-1));
  stopTimer();
  var q = current(), target = q.words/WPM*60, g = state.grades[q.id];
  var h = '<div class="card">';
  h += '<div class="eyebrow"><span class="n">'+String(q.id).padStart(3,'0')+'</span>'
     + '<span class="round">'+esc(q.round)+'</span>'
     + '<span>'+esc(q.topic)+'</span><span class="dot">/</span>'
     + '<span>'+esc(q.level)+'</span><span class="dot">/</span>'
     + '<span>'+esc(q.type)+'</span></div>';
  h += '<h2 class="q">'+rich(q.question)+'</h2>';

  h += '<div class="clock"><div class="track">'
     + '<div class="fill" id="fill"></div>'
     + '<div class="target" style="left:'+(100/1.35)+'%" title="target length"></div></div>'
     + '<div class="clockrow"><span class="el" id="elapsed">0:00</span>'
     + '<span>of ~'+mm(target)+' spoken</span><span class="spacer"></span>'
     + '<button class="go" id="go">Start answering</button></div></div>';

  if(!state.revealed){
    h += '<div class="veil"><b>Say it out loud first.</b>'
       + 'Then <kbd>space</kbd> to see what a strong answer sounds like.</div>';
  } else {
    h += '<div class="lab">Say this</div><div class="say">'+paras(q.say)+'</div>';
    if(q.numbers && q.numbers.length){
      h += '<div class="lab">Numbers worth quoting</div><ul class="nums">'
         + q.numbers.map(function(n){ return '<li>'+rich(n)+'</li>'; }).join('')+'</ul>';
    }
    if(q.whiteboard){
      h += '<div class="lab">If they hand you the marker</div><div class="marker">'
         + rich(q.whiteboard)+'</div>';
    }
    h += '<div class="lab f">Loses the signal</div>'+items(q.red_flags,'flags');
    h += '<div class="lab">Then they ask</div>'+items(q.followups);
    if(q.chapter_title){
      h += '<div class="src">'+esc(q.volume_name||'')+' · '+esc(q.chapter_title)+'</div>';
    }
  }

  h += '<div class="grade">'
     + gbtn('solid','Had it','1',g) + gbtn('shaky','Shaky','2',g) + gbtn('again','Again','3',g)
     + '</div>';
  h += '<div class="nav"><button data-nav="-1">&larr; Previous</button>'
     + '<span class="spacer"></span><button data-nav="1">Next &rarr;</button></div>';
  h += '</div>';
  document.getElementById('stage').innerHTML = h;
  if(state.revealed && window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise([document.getElementById('stage')]).catch(function(){});
  }
  paintSpine();
}
function gbtn(g,label,key,cur){
  return '<button class="gbtn" data-g="'+g+'" aria-pressed="'+(cur===g)+'">'
    + esc(label)+' <span class="k">'+key+'</span></button>';
}

/* ---------- actions ---------- */
function go(n){ state.i += n; state.revealed=false; render(); }
function jump(n){ state.i = n; state.revealed=false; render(); }
function reveal(){ if(!state.revealed){ state.revealed=true; stopTimer(); render(); } }
function grade(g){
  var q=current();
  state.grades[q.id] = (state.grades[q.id]===g) ? undefined : g;
  if(!state.grades[q.id]) delete state.grades[q.id];
  persist();
  if(state.grades[q.id]) go(1); else render();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.classList.contains('chip')){
    state.topic = t.dataset.t || null; state.i=0; state.revealed=false;
    paintFilters(); render(); return;
  }
  if(t.classList.contains('tick')){ jump(+t.dataset.n); return; }
  if(t.id==='go'){ timer.running ? (stopTimer(), t.textContent='Start answering')
                                 : startTimer(); return; }
  if(t.id==='shuffle'){
    for(var i=state.order.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), s=state.order[i];
      state.order[i]=state.order[j]; state.order[j]=s;
    }
    state.i=0; state.revealed=false; render(); return;
  }
  if(t.id==='theme'){
    var r=document.documentElement;
    var dark=r.getAttribute('data-theme')==='dark' ||
      (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme', dark?'light':'dark'); return;
  }
  if(t.dataset.nav){ go(+t.dataset.nav); return; }
  if(t.classList.contains('gbtn')){ grade(t.dataset.g); return; }
});

document.addEventListener('keydown', function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  var k=e.key;
  if(k===' '){ e.preventDefault(); state.revealed ? go(1) : reveal(); }
  else if(k==='ArrowRight'||k==='j'){ e.preventDefault(); go(1); }
  else if(k==='ArrowLeft'||k==='k'){ e.preventDefault(); go(-1); }
  else if(k==='1'){ grade('solid'); }
  else if(k==='2'){ grade('shaky'); }
  else if(k==='3'){ grade('again'); }
  else if(k==='t'){ if(!timer.running) startTimer(); else stopTimer(); }
});

if(window.claude && window.claude.use){
  var hot = window.claude.hot;
  if(hot && hot.snapshot) hot.snapshot(function(){ return {i:state.i, topic:state.topic}; });
  var boot = function(d){ if(d && typeof d.i==='number'){ state.i=d.i; state.topic=d.topic||null; }
    paintFilters(); render(); };
  hot && hot.ready ? hot.ready(boot) : boot((hot && hot.data) || {});
} else {
  paintFilters(); render();
}
})();
</script>
