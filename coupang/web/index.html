(--rule)\" stroke-width=\"1.2\"/><text x=\"83.0\" y=\"45.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">serving</text><text x=\"83.0\" y=\"61.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">computes features</text><rect x=\"8\" y=\"92\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"83.0\" y=\"109.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">training</text><text x=\"83.0\" y=\"125.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">recomputes them</text><line x1=\"83\" y1=\"68\" x2=\"83\" y2=\"88\" stroke=\"var(--flag)\" stroke-width=\"1.4\" marker-end=\"url(#arrowF-skew)\"/><text x=\"168\" y=\"84\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--flag)\">different code, different</text><text x=\"168\" y=\"99\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--flag)\">cutoff -&gt; skew you find</text><text x=\"168\" y=\"114\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--flag)\">three months later</text><text x=\"372\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" fill=\"var(--accent)\">LOG-AND-TRAIN  (robust)</text><rect x=\"372\" y=\"28\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"447.0\" y=\"45.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">serving</text><text x=\"447.0\" y=\"61.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">computes features</text><line x1=\"522\" y1=\"48\" x2=\"556\" y2=\"48\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-skew)\"/><rect x=\"556\" y=\"28\" width=\"136\" height=\"40\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"624.0\" y=\"52.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">log the vector</text><line x1=\"624\" y1=\"68\" x2=\"624\" y2=\"88\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-skew)\"/><rect x=\"480\" y=\"92\" width=\"212\" height=\"40\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"586.0\" y=\"109.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">training reads exactly</text><text x=\"586.0\" y=\"125.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">what serving computed</text></svg><figcaption>Figure 13. Logging the served feature vector removes training-serving skew by construction -- whatever was wrong at serving is equally wrong at training, so the model learns around it. The cost is storage: roughly 200 floats per impression, and you can sample.</figcaption></figure>\n<p>The cost is storage — you are logging a 200-float vector per impression — and at this volume that is real but affordable, and you can sample it.</p>\n<p><strong>Behavioural features dominate and are empty on the tail.</strong> Historical CTR and CVR for a query-item pair will top your feature importance chart and be missing for exactly the long-tail queries in the prompt. Train with explicit missingness rather than imputing zero, so the model can learn a separate regime instead of reading &quot;no data&quot; as &quot;bad.&quot; Then report NDCG by query-frequency decile and make the tail deciles a shipping gate, not a diagnostic you run after someone complains.</p>\n<h3>Exploration: how a new listing ever gets ranked at all</h3>\n<p>This is the closed loop from earlier, and it is a real business problem in a marketplace, not an ML nicety. A new product has no behavioural features, so the ranker scores it low, so it gets no impressions, so it never acquires the features that would let it rank. Sellers notice.</p>\n<p>Three mechanisms, cheapest first.</p>\n<p><strong>Reserve exposure.</strong> Give new or low-impression items a small guaranteed share of slots — one slot in the first grid, or a fixed fraction of traffic. Blunt, trivially implementable, easy to measure, and it works.</p>\n<p><strong>Score by an optimistic bound rather than the mean.</strong> The model&#x27;s uncertainty about a cold item is large; UCB-style, add a term proportional to that uncertainty so unexplored items get a chance in proportion to how little you know. Thompson sampling from the posterior is the cleaner version. This is strictly better than a reserved slot because the exploration is targeted, and strictly harder because you need a calibrated uncertainty estimate.</p>\n<p><strong>Lean on content features.</strong> The same argument as cold-start retrieval: a ranker whose features are mostly behavioural cannot score a new item at all, while one with strong content and embedding features can make a reasonable guess on day zero. ID-feature dropout during training applies here exactly as it does in the item tower.</p>\n<p>The metric to instrument: <strong>time-to-first-hundred-impressions for a new listing</strong>, and the conversion rate of items in their first week versus steady state. If new items convert <em>better</em> than established ones, your ranker is under-exploring and you are leaving money on the table.</p>\n<h2>The metrics, in full</h2>\n<p>She asked about CVR; have the whole board ready, and know which one you would actually ship on.</p>\n<div class=\"tw\"><table><thead><tr><th>Group</th><th>Metric</th><th>What it is for, and what it hides</th></tr></thead><tbody><tr><td><strong>Engagement</strong></td><td>CTR</td><td>Fast, high-volume, the workhorse. Rewards clickbait thumbnails.</td></tr><tr><td></td><td>Click position / MRR of first click</td><td>Are good results near the top, not just present</td></tr><tr><td></td><td>Add-to-cart rate</td><td>Much stronger intent than click, still same-session</td></tr><tr><td></td><td>Dwell time / long click</td><td>Proxy for satisfaction; needs a threshold you must justify</td></tr><tr><td><strong>Conversion</strong></td><td>CVR per click</td><td>The stated objective. Denominator is clicks, so it is blind to whether anyone clicked.</td></tr><tr><td></td><td>CVR per search session</td><td>The one I would actually ship on. Captures retrieval failure, which per-click CVR cannot see.</td></tr><tr><td></td><td>CTCVR</td><td>Conversion per impression. The ESMM target, and the honest end-to-end rate.</td></tr><tr><td><strong>Money</strong></td><td>GMV per session</td><td>The guardrail that catches the cheap-item pathology</td></tr><tr><td></td><td>Revenue / margin per search</td><td>If they have margin data, the real objective</td></tr><tr><td></td><td>Average order value</td><td>Moves opposite to CVR under a pure-CVR ranker; that divergence is the tell</td></tr><tr><td><strong>Relevance</strong></td><td>NDCG@k</td><td>Graded, position-discounted, the offline standard. Needs judgements.</td></tr><tr><td></td><td>Recall@1000</td><td>The retrieval metric. Measure at the ranker&#x27;s candidate count.</td></tr><tr><td></td><td>Precision@k, MAP, MRR</td><td>Binary-judgement cousins; MRR when one right answer exists</td></tr><tr><td><strong>Search health</strong></td><td>Zero-result rate</td><td>The direct tail metric. For this question, a headline number.</td></tr><tr><td></td><td>Reformulation rate</td><td>The user telling you the results were wrong</td></tr><tr><td></td><td>Query abandonment</td><td>Search with no click at all</td></tr><tr><td></td><td>Clicks below the fold</td><td>Did they have to hunt</td></tr><tr><td><strong>Long-term</strong></td><td>Return / cancellation rate</td><td>A CVR win that raises returns is a loss</td></tr><tr><td></td><td>Repeat purchase, next-session return</td><td>The only real measure of satisfaction</td></tr><tr><td></td><td>Catalogue coverage, exposure Gini</td><td>Marketplace supply health; a concentrating ranker kills sellers</td></tr><tr><td><strong>System</strong></td><td>p50 / p99 latency</td><td>Latency is a quality metric — measure CVR against it</td></tr><tr><td></td><td>ECE, calibration ratio</td><td>Required if you multiply probabilities by price</td></tr></tbody></table></div>\n<div class=\"co say\"><span class=\"col\">Say this</span>I would ship on CVR per search session, with GMV per session and return rate as guardrails that cannot regress, and report tail zero-result rate separately because it is the thing this system is being built to fix.</div>\n<h2>Mobile versus web</h2>\n<p>She specified a mobile app search bar. Being able to say precisely how the web version differs is cheap signal that you have built both.</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 272\" role=\"img\" aria-label=\"Mobile shows four slots above the fold, web fifteen to twenty, so the position-bias curves differ\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-surfaces\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-surfaces\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-surfaces\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><text x=\"8\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" fill=\"var(--accent)\">MOBILE APP</text><rect x=\"8\" y=\"26\" width=\"150\" height=\"196\" rx=\"10\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.4\"/><rect x=\"18\" y=\"36\" width=\"130\" height=\"16\" rx=\"8\" fill=\"var(--raise)\"/><rect x=\"18\" y=\"60\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"48\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">1</text><rect x=\"86\" y=\"60\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"116\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">2</text><rect x=\"18\" y=\"112\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"48\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">3</text><rect x=\"86\" y=\"112\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"116\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">4</text><rect x=\"18\" y=\"164\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--raise)\" stroke=\"var(--rule)\"/><text x=\"48\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--faint)\">5</text><rect x=\"86\" y=\"164\" width=\"60\" height=\"44\" rx=\"4\" fill=\"var(--raise)\" stroke=\"var(--rule)\"/><text x=\"116\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--faint)\">6</text><line x1=\"8\" y1=\"162\" x2=\"158\" y2=\"162\" stroke=\"var(--flag)\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"162\" y=\"166\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">fold</text><text x=\"8\" y=\"242\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"var(--ink)\">4 slots above the fold</text><text x=\"8\" y=\"258\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--muted)\">steep bias curve, precision &gt; recall</text><text x=\"250\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" fill=\"var(--accent)\">WEB</text><rect x=\"250\" y=\"26\" width=\"442\" height=\"196\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.4\"/><rect x=\"262\" y=\"36\" width=\"300\" height=\"16\" rx=\"8\" fill=\"var(--raise)\"/><rect x=\"262\" y=\"60\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"300\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">1</text><rect x=\"346\" y=\"60\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"384\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">2</text><rect x=\"430\" y=\"60\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"468\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">3</text><rect x=\"514\" y=\"60\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"552\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">4</text><rect x=\"598\" y=\"60\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"636\" y=\"87\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">5</text><rect x=\"262\" y=\"112\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"300\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">6</text><rect x=\"346\" y=\"112\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"384\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">7</text><rect x=\"430\" y=\"112\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"468\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">8</text><rect x=\"514\" y=\"112\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"552\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">9</text><rect x=\"598\" y=\"112\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"636\" y=\"139\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">10</text><rect x=\"262\" y=\"164\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"300\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">11</text><rect x=\"346\" y=\"164\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"384\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">12</text><rect x=\"430\" y=\"164\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"468\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">13</text><rect x=\"514\" y=\"164\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"552\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">14</text><rect x=\"598\" y=\"164\" width=\"76\" height=\"44\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"636\" y=\"191\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">15</text><text x=\"250\" y=\"242\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"var(--ink)\">15-20 slots above the fold</text><text x=\"250\" y=\"258\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--muted)\">flatter curve, real comparison, recall &gt; precision</text></svg><figcaption>Figure 14. Four slots above the fold against fifteen to twenty. The consequence to state out loud: estimate propensities <em>per surface</em>, because one shared curve is confidently wrong on both.</figcaption></figure>\n<p><strong>Position bias is far steeper on mobile</strong>, because four items are visible instead of twenty. Practically: you must estimate propensities <em>per surface</em> — one shared propensity curve is simply wrong — and the value of getting rank 1 right is much higher on mobile. If you only fix one thing about your training labels, fix this.</p>\n<p><strong>Precision beats recall on mobile, and the reverse on web.</strong> With four slots there is no room for a hedge; showing one wrong item costs a quarter of the visible page. On web, a broader candidate set lets the user do the comparison themselves, so slightly lower precision with better coverage is often the better trade. Concretely, I would run a tighter relevance gate and more aggressive deduplication on mobile.</p>\n<p><strong>Queries are shorter and dirtier on mobile.</strong> Thumb typing means more typos, more abbreviations, and heavier reliance on typeahead and voice. So spell correction and query completion carry more weight on mobile — and the suggestion ranker becomes a first-class model rather than an afterthought, because a good suggestion converts an ambiguous tail query into a head query before retrieval ever runs. That is the cheapest fix for the problem in the prompt and I would say so.</p>\n<p><strong>Diversity matters more on mobile.</strong> Four near-identical listings — which a marketplace produces constantly — is the entire visible page. Deduplication by product identity, not just by listing, is a mobile requirement and a web nicety.</p>\n<p><strong>Latency variance is worse on mobile</strong> because of cellular networks, so the client-side budget is tighter than the server-side one suggests. Prefetching the next scroll page and progressive image loading are part of the design.</p>\n<div class=\"decide\"><div class=\"dt\">One model for mobile and web, or two?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">One ranker with surface as a feature; separate propensity curves; separate diversity and dedup policy</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Two complete stacks</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">the model can learn the surface interaction from one pipeline, but the position-bias curves are genuinely different objects and a shared curve is confidently wrong on both</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">you must evaluate per surface always, or a mobile regression hides under a web win</span></div></div>\n<p><strong>How I would handle it in the model.</strong> Surface as a feature first, not separate models — you keep one training pipeline and the model learns the interaction. Separate models only for the things that are genuinely different objects: propensity curves, definitely; the diversity and dedup policy, probably; the ranker itself, only if a surface-interaction analysis says the shared model is leaving real value behind. And evaluate per surface always, because a shared aggregate metric will hide a mobile regression under a web win.</p>\n<h2>The seam: how retrieval and ranking break each other</h2>\n<div class=\"co say\"><span class=\"col\">Say this</span>The ranker is trained on whatever candidate distribution the retriever produced. So if I change retrieval, the ranker&#x27;s training data is stale, and I would not read the experiment until I had retrained it on logs from the new candidates.</div>\n<p>Raise this yourself. It is the part of the question that requires having owned both halves, almost nobody brings it up unprompted, and it is the most direct evidence you can give that you have shipped one of these rather than read about it.</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"A closed loop: retriever feeds ranker feeds logs feeds both models\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-seam\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-seam\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-seam\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"250\" y=\"10\" width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"29.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Retriever</text><text x=\"350.0\" y=\"45.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">trained on clicks</text><line x1=\"350\" y1=\"54\" x2=\"350\" y2=\"96\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-seam)\"/><text x=\"360\" y=\"79\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" fill=\"var(--muted)\">produces the candidate distribution</text><rect x=\"250\" y=\"96\" width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"115.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Ranker</text><text x=\"350.0\" y=\"131.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">trained on THOSE candidates only</text><line x1=\"350\" y1=\"140\" x2=\"350\" y2=\"182\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-seam)\"/><text x=\"360\" y=\"165\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" fill=\"var(--muted)\">decides what is shown</text><rect x=\"250\" y=\"182\" width=\"200\" height=\"44\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"201.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Click logs</text><text x=\"350.0\" y=\"217.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">the only feedback you get</text><path d=\"M250,204 L120,204 L120,32 L250,32\" fill=\"none\" stroke=\"var(--flag)\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" marker-end=\"url(#arrowF-seam)\"/><path d=\"M450,204 L580,204 L580,118 L450,118\" fill=\"none\" stroke=\"var(--flag)\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\" marker-end=\"url(#arrowF-seam)\"/><text x=\"112\" y=\"118\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">trains</text><text x=\"588\" y=\"160\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">trains</text></svg><figcaption>Figure 15. Change either box and the other one&#x27;s training data is stale. A 6-point recall win reads as a flat A/B until the ranker has been retrained on the new candidate distribution. Never change both in one experiment.</figcaption></figure>\n<p><strong>Ranker trained on retriever v1, served with retriever v2.</strong> The ranker has never seen the newly-surfaced items; they are out of distribution and it scores them conservatively, precisely because they are unfamiliar. So a genuine 6-point recall win shows up as a flat A/B. The fix is sequencing, not modelling: ship the retrieval change to a slice, log the new candidate distribution, retrain the ranker on it, and only then read the experiment. If you tell her this before she constructs the scenario as a gotcha, you have answered the hardest follow-up in the round in advance.</p>\n<p><strong>Retriever trained on positives that the ranker chose to show.</strong> The retriever&#x27;s positives are clicks, and clicks only happen on items the ranker put on screen. So the retriever is being taught to find what the current ranker likes. Two tightly coupled models, each learning the other&#x27;s bias. Mitigations: mine positives from deeper ranks and from reformulated sessions, keep an exploration slice whose logs are used preferentially for training, and use propensity weighting on both sides rather than only the ranker.</p>\n<p><strong>Each stage&#x27;s metric is blind to the other&#x27;s failure.</strong> Retrieval recall improves while ranking gets worse, aggregate CTR is flat, and each team reports a win. The only honest end-to-end offline measure is NDCG computed over the full pipeline against a judgement set that was <em>not</em> pooled from the current system. Measure stage metrics for diagnosis and pipeline metrics for decisions.</p>\n<p><strong>The practical policy I would state.</strong> Never change retrieval and ranking in the same experiment — you cannot attribute the result. Retrain the ranker on a cadence that is a multiple of the retriever&#x27;s, always downstream of it. And keep a small always-on randomised slice whose logs are the unbiased sample everything else gets calibrated against; it costs a fraction of a percent of traffic and it is the only thing that stops the whole loop drifting somewhere nobody chose.</p>\n<h2>The follow-up tree</h2>\n<p>Everything below is a push she can make. Rehearse the answers out loud; the failure mode in this round is hesitation, not being wrong.</p>\n<h3>On retrieval training</h3>\n<p><strong>&quot;How do you set the weight on a purchase versus a click?&quot;</strong> I measure it rather than pick it. Judge a few thousand query-item pairs stratified by action, compute the probability the pair is relevant given each action, and take the log-odds difference against impressions. It comes out far flatter than intuition — about 2.6 to 1, not 10 to 1 — because the click already carries most of the relevance evidence and the purchase mostly adds price and availability, which are ranking concerns.</p>\n<p><strong>&quot;Do you treat a returned purchase as a negative?&quot;</strong> For the retriever, barely — the customer searched, found it and bought it, so it was relevant; the return is usually fit or quality. For the ranker it matters enormously, because a return is negative revenue and negative trust. Returns are a ranking signal, not a retrieval signal.</p>\n<p><strong>&quot;Why aggregate to (query, item) instead of training per event?&quot;</strong> Because the retriever has no user features — the query tower sees a string. Per-event rows therefore add no information and add popularity skew, since a pair shown a million times would contribute a million gradient steps for a signal its counts already capture. The ranker is the opposite: it has user and context features, so it needs per-impression rows and the unclicked negatives the retriever&#x27;s table discards.</p>\n<p><strong>&quot;What does your negative strategy cost?&quot;</strong> In-batch negatives are free — already encoded. Every mined or uniform negative is a full item-tower forward pass, so six explicit negatives per positive turns 4,096 encoder passes per step into about 28,000. The mitigation is caching item embeddings from the last index refresh and recomputing only on the refresh cadence, which is what ANCE does.</p>\n<p><strong>&quot;How do you split?&quot;</strong> By time, never randomly — the last two weeks are test, because you serve forward in time and a random split leaks the same pair to both sides. And a second, query-disjoint split of whole tail queries, because a time-based split still lets a head query&#x27;s embedding be learned in the training period and evaluated in the test period.</p>\n<p><strong>&quot;Why a softmax and not MSE?&quot;</strong> Because there is no target. A click is not a similarity of 1.0, so you would have to invent the label, and the model would learn whatever you invented. Beyond that, MSE optimises magnitudes nothing ever reads, and it has no normalisation — a model that outputs 0.3 for everything has a fine MSE and zero retrieval utility.</p>\n<p><strong>&quot;Why not triplet loss?&quot;</strong> Four things. It sees one negative per step, so the gradient is a noisy estimate of &quot;beat everything.&quot; Its margin is an absolute quantity in a space whose scale the model controls, so unnormalised it can be satisfied by inflating norms. The hinge switches off once satisfied, so late in training most of the batch contributes no gradient — hence semi-hard mining. And it collapses more readily. The softmax&#x27;s temperature does the margin&#x27;s job relatively rather than absolutely, and it is smooth.</p>\n<p><strong>&quot;Is triplet ever right?&quot;</strong> Yes, for verification rather than retrieval. Contrastive and triplet losses give you a calibrated distance with a usable threshold; a softmax gives you an ordering with no absolute meaning. Catalogue deduplication — is this seller&#x27;s listing the same physical product as that one — is exactly that, and it sits inside this system feeding the slate policy&#x27;s dedup step. I would train it with a margin loss.</p>\n<p><strong>&quot;Where would you use MSE in this design, then?&quot;</strong> Two places. Distilling the cross-encoder into the bi-encoder, but on the <em>margin</em> rather than the raw score, because the teacher&#x27;s absolute scale is arbitrary and only the ordering transfers. And training L1 to imitate L2, which is the same argument.</p>\n<p><strong>&quot;BPR or RankNet instead?&quot;</strong> They are the pairwise cousins and share triplet&#x27;s core limitation: one comparison at a time, and no notion that position 1 matters more than position 50. BPR is the right tool for implicit-feedback recsys with small candidate sets; for retrieval over 10M it is strictly dominated.</p>\n<p><strong>&quot;When would you use a listwise loss on the retriever?&quot;</strong> I would not. Listwise losses need the whole list, and the retriever&#x27;s &quot;list&quot; is the corpus. Listwise belongs where the candidate set is small enough to hold — the reranker, and the slate layer.</p>\n<p><strong>&quot;Why not just use a cross-encoder for retrieval?&quot;</strong> Cost. A cross-encoder is about a millisecond per pair, and 10M pairs per query is three hours. The two-tower exists so the item side can be precomputed and the query side reduced to one dot product against an index. You pay for it in expressiveness — the towers never interact — which is why the cross-encoder comes back as a reranker over 50 candidates.</p>\n<p><strong>&quot;What about generative retrieval -- would you just have an LLM generate the product IDs?&quot;</strong> Not on this path. There is a 2026 DeepMind result (Rozonoyer et al., arXiv 2601.05588) proving the expressivity case for it -- a dual encoder needs embedding dimension linear in corpus size to express arbitrary rankings where an autoregressive ranker needs constant hidden dimension -- and its headline benchmark is ESCI, which is product search. But it reports no latency numbers, beam search over 10M docIDs does not fit a 100 ms p99, and a marketplace&#x27;s churn breaks the index-as-decoder property. What I would take from it now is semantic IDs inside the ranker for cold items, and a rank-calibrated objective on the reranker. The full version of this answer is its own chapter.</p>\n<p><strong>&quot;Should the two towers share weights?&quot;</strong> No, for two reasons. Query text and product text are different distributions — three words of intent versus a hundred words of catalogue copy — and a shared encoder has to compromise. And sharing throws away the asymmetry: the item tower can be large because it is offline, the query tower must be small because it is online. Sharing forces both to the smaller budget.</p>\n<p><strong>&quot;How do you handle a brand new product with no interaction history?&quot;</strong> This is where the two-tower earns its keep: the item tower is content-based, so a new listing gets a usable embedding from its title and attributes the moment it is indexed. That is a strong argument against pure ID-embedding retrieval in a catalogue with churn.</p>\n<p><strong>&quot;Would you put an item-ID embedding in the item tower?&quot;</strong> Yes, but with ID dropout during training — randomly mask the ID feature so the model is forced to produce a good embedding from content alone. Then established items get the benefit of their learned ID and cold items degrade gracefully instead of falling off a cliff. Without dropout the model leans entirely on the ID and cold start breaks.</p>\n<p><strong>&quot;What does batch size actually do here?&quot;</strong> It sets the number of in-batch negatives, so it sets the difficulty of the classification task and the quality of the gradient. That is why these models train at thousands and use cross-device negative sharing. Past a point, more random negatives stop helping and mined hard negatives take over.</p>\n<p><strong>&quot;How do you choose the temperature?&quot;</strong> Sweep it, and diagnose on the score distributions rather than the loss — you want clear separation between positive and negative scores without the positive saturating. Start around 0.05 for normalised embeddings. Too low and the gradient collapses onto the single hardest negative; too high and the softmax is flat and there is no signal. It can be learned with a clamp.</p>\n<p><strong>&quot;What is the ratio of hard to random negatives?&quot;</strong> I would start with a handful of mined hard negatives per positive on top of the full batch as in-batch negatives plus uniform corpus negatives, and tune it. All-hard is a known failure mode — it over-fits the miner&#x27;s idea of hard, and it amplifies any false negatives you failed to filter.</p>\n<p><strong>&quot;Your hard negatives are mined from BM25. What happens once the model beats BM25?&quot;</strong> They stop being hard, and you silently stop learning from them. That is why you re-mine from the current model&#x27;s own index every epoch or two — the ANCE loop. Static negatives go stale and the training curve looks fine while the model stops improving.</p>\n<p><strong>&quot;How do you know a mined negative is not actually relevant?&quot;</strong> You do not, which is why you filter. Score every mined negative with the cross-encoder teacher and drop anything scoring above the positive. Training on a false negative is worse than training on no negative — you are explicitly teaching the model that a correct answer is wrong.</p>\n<p><strong>&quot;Why does the logQ correction matter in commerce specifically?&quot;</strong> Because in-batch negatives are sampled from the click stream, so popular items are negatives far more often, and the uncorrected model learns an anti-popularity bias — it under-retrieves exactly the items that convert. The correction subtracts the log sampling probability from every logit so the penalty is per- occurrence rather than cumulative.</p>\n<p><strong>&quot;What about items that never appear in any batch?&quot;</strong> They are never negatives for anyone, so nothing ever pushes them down, and they can surface spuriously. At 10M products with a long tail this is a large fraction of the catalogue. Fix it with mixed negative sampling — uniform draws from the full index alongside the in-batch ones.</p>\n<p><strong>&quot;Recall@1000 improved 6 points and online CTR is flat. What happened?&quot;</strong> Most likely the ranker cannot exploit the new candidates. It was trained on the distribution the <em>old</em> retriever produced, so the newly-surfaced items are out-of-distribution for it and it scores them conservatively. Retrieval and ranking are coupled: after a retrieval change you must retrain the ranker on logs from the new candidate distribution before you can read the result. The other candidates are that the new recall is on items that were never going to convert, or that your offline positives were biased toward the incumbent.</p>\n<p><strong>&quot;How would you prove the dense arm is earning its latency?&quot;</strong> Ablate it in an interleaving test, and separately measure its unique contribution — the fraction of clicked or purchased items that only the dense arm retrieved. If that number is small, the arm is paying for overlap with BM25 and should be cut or retrained.</p>\n<p><strong>&quot;What breaks if you retrain the query tower but not the item index?&quot;</strong> Silent garbage. The two towers define a joint space; a query embedded by v2 against items embedded by v1 is meaningless, and nothing errors. Version the model into the index metadata and refuse to serve a mismatch.</p>\n<h3>On the funnel</h3>\n<p><strong>&quot;Why three retrieval arms and not two?&quot;</strong> Because they fail on disjoint query populations. If the behavioural arm&#x27;s unique contribution is small once you have a good dense arm, drop it — measure, do not assume.</p>\n<p><strong>&quot;What sets the candidate count out of retrieval?&quot;</strong> The ranker&#x27;s latency budget from one side, and the recall curve from the other. Plot recall against candidate count and find where it flattens; take candidates up to that knee, and then check the knee is in the same place for tail queries, which it usually is not.</p>\n<p><strong>&quot;Where does personalisation enter?&quot;</strong> Ranking first, because it is cheap there and easy to measure. Retrieval only once you have shown that ranking-side personalisation has saturated, because a personalised retrieval arm multiplies your index cost and makes caching much harder.</p>\n<h3>On ranking</h3>\n<p><strong>&quot;Pointwise, pairwise or listwise?&quot;</strong> All three, in different places, and the constraint is calibration. The expected-value score multiplies probabilities by price, so pCTR and pCVR must be pointwise and calibrated — a LambdaMART score cannot be multiplied by a hundred dollars. Listwise belongs in a relevance model feeding the gate, and in a list-context re-ranking layer over the final fifty.</p>\n<p><strong>&quot;Walk me through LambdaRank.&quot;</strong> NDCG is a step function of the ordering so it has no usable gradient. LambdaRank skips defining a loss and writes the gradient directly: the pairwise logistic gradient multiplied by the change in NDCG you would get from swapping that pair. The multiplier is the whole idea — it makes a swap at ranks 1 and 2 worth far more than one at 50 and 51. Plug those gradients into gradient boosting and you have LambdaMART.</p>\n<p><strong>&quot;You downsampled negatives 100:1. What did that break?&quot;</strong> Calibration. The model now predicts in the downsampled base rate, so every probability is inflated and every multiplication by price is wrong by a constant. Correct it analytically with the keep rate, then verify on a reliability diagram — do not trust the formula without checking it.</p>\n<p><strong>&quot;How do you train L1?&quot;</strong> By distilling L2, not on clicks. Its job is to not discard anything L2 would have wanted, so the objective is to reproduce L2&#x27;s ordering and the metric is recall of L2&#x27;s top-k. Reporting NDCG for L1 is the same mistake as reporting NDCG for retrieval.</p>\n<p><strong>&quot;Your top feature is 30-day item CTR. What could be wrong with it?&quot;</strong> Two things. Point-in-time correctness — if it is computed from a table built today it contains clicks that happened after the impression, including the one you are predicting, and that is leakage that makes offline metrics look wonderful. And coverage: it is empty on exactly the tail queries this system is being built for, so train with explicit missingness rather than imputing zero.</p>\n<p><strong>&quot;How do you stop the ranker from being a self-fulfilling prophecy?&quot;</strong> Two levers. Propensity-weight the training labels so a click at rank 1 is not treated as the same evidence as a click at rank 20. And explore: reserved exposure for cold items, or an optimism bonus proportional to the model&#x27;s uncertainty. Without exploration, items the ranker buries generate no data and the error never corrects.</p>\n<p><strong>&quot;A new seller lists a product. When does it first rank?&quot;</strong> Instrument it — time-to-first-hundred-impressions is a real metric with a real owner. Without exploration the honest answer is &quot;possibly never,&quot; which in a marketplace is a supply problem, not an ML problem.</p>\n<p><strong>&quot;Would you use one model for CTR and CVR or two?&quot;</strong> ESMM, which is neither: two supervised heads on the full impression space, CTR and CTCVR, with CVR learned implicitly as the ratio and never given a loss of its own. That removes the sample selection bias and gives the CVR tower a representation trained on far more data.</p>\n<p><strong>&quot;MMoE or shared-bottom?&quot;</strong> Shared-bottom first, and measure each head against a single-task model trained alone. A drop is negative transfer and that is your signal to escalate to MMoE, then PLE. Escalating without the measurement gets you four times the parameters and no gain. And task loss weighting usually dominates the architecture choice anyway.</p>\n<p><strong>&quot;Your pCVR is well-ranked but badly calibrated. Does it matter?&quot;</strong> It does the moment you multiply it by price. A systematic 3x over-confidence produces a completely wrong expected-value ordering while AUC looks fine. Fix with a post-hoc monotone map on held-out data, refit on a schedule, and report calibration per price decile and per category because the aggregate hides the broken segments.</p>\n<h3>On CVR specifically</h3>\n<p><strong>&quot;Why not just train on purchases?&quot;</strong> Sixty million purchases across ten million products is far too sparse, especially on the tail, which is what the question is about. Train on clicks for volume, weight by the downstream action.</p>\n<p><strong>&quot;How long is your attribution window?&quot;</strong> Measured from the conversion delay distribution rather than chosen. And whatever it is, recent unconverted clicks are censored, not negative — either exclude the most recent window or model the delay.</p>\n<p><strong>&quot;Your pCVR is well-ranked but badly calibrated. Does it matter?&quot;</strong> It does the moment you multiply it by price, which the expected-value objective does. Then a systematic 3x over-confidence produces a completely wrong ordering. Fix with a post-hoc monotone map on held-out data; it barely moves AUC by construction.</p>\n<p><strong>&quot;MMoE or shared-bottom?&quot;</strong> Shared-bottom first, and measure each task head against a single-task model trained alone. If a task is worse in the joint model that is negative transfer and you escalate to MMoE, then PLE. Escalating without that measurement gets you four times the parameters and no gain.</p>\n<h3>On serving</h3>\n<p><strong>&quot;You are over your latency budget. What do you cut?&quot;</strong> L2 candidate count first — 1000 to 500 is usually under a point of NDCG for half the ranking cost, the best exchange rate in the system. Then quantise or distil the ranker. Then <code>ef_search</code>. Retrieval depth last, because that is the only cut that loses recall permanently. And never a silent timeout that drops an arm.</p>\n<p><strong>&quot;Would you cache?&quot;</strong> Yes, for cost and for median latency — but say clearly that it does not help p99, because p99 is the tail and the tail is what misses the cache. And in commerce the cache has a correctness problem: price and stock change constantly, so cache the ranked ID list and hydrate price and availability at request time rather than caching rendered results.</p>\n<p><strong>&quot;How do you handle filters at 2% selectivity?&quot;</strong> In-traversal filtering rather than post-filtering, and below a measured selectivity crossover, brute force over the filtered subset. A few hundred thousand exact dot products beat approximate search over ten million.</p>\n<h3>On evaluation</h3>\n<p><strong>&quot;How do you build a judgement set for tail queries?&quot;</strong> Sample by query frequency band, not uniformly, or you will get a head-only set. Judge with an LLM calibrated against a human gold set, benchmarked on human-human agreement rather than on perfect agreement, with a weekly human audit to catch drift.</p>\n<p><strong>&quot;Offline NDCG is up and the A/B is flat. What is your first move?&quot;</strong> Check that the judgement set is not stale relative to the catalogue, then check whether the gain is concentrated in a segment that carries little traffic, then check for a presentation-layer difference the offline metric cannot see. And check statistical power before concluding &quot;flat&quot; — most flat results are underpowered.</p>\n<p><strong>&quot;How much traffic do you need to detect a 1% relative CVR lift?&quot;</strong> Ask for the baseline rate, then size it. At a 2% baseline CVR, detecting a 1% relative lift at 80% power and alpha 0.05 needs on the order of tens of millions of sessions per arm. State that you would compute it rather than guess, and that if the required sample is implausible you switch to interleaving for the ranking comparison.</p>\n<h2>What I would build first</h2>\n<p>The sequencing question is where Staff shows. Four quarters, and each one ends with something measurable.</p>\n<p><strong>Q1 — instrumentation and the cheap wins.</strong> You cannot improve what you cannot measure, and this system has been running for six months with no tail segmentation. Build the judgement set stratified by query frequency, start reporting zero-result rate and recall by frequency decile, and stand up interleaving. In parallel ship the two cheapest quality wins: the category gate with confidence thresholding and a behavioural synonym layer mined from the logs. Both are days of work and both move tail queries.</p>\n<p><strong>Q2 — the dense arm, v1.</strong> Two-tower trained with in-batch negatives, the logQ correction, and mixed negative sampling. RRF fusion with BM25. HNSW over 10M int8 vectors. Ship behind interleaving and measure unique contribution on tail queries. This is the single biggest expected move on the stated problem.</p>\n<p><strong>Q3 — make it good.</strong> Train the cross-encoder. Use it three ways: false-negative filtering, distillation into the bi-encoder, and adaptive-depth reranking for positions 7+ off the blocking path, per Option C. Add ANCE hard-negative refresh. Replace RRF with a learned L1 fusion.</p>\n<p><strong>Q4 — the objective.</strong> Multi-task ranker with ESMM, delayed-feedback handling, calibration, and the expected-value objective with a relevance gate. This is last not because it is unimportant but because until retrieval is fixed, the ranker is reordering a bad candidate set.</p>\n<p>If she asks what you would do with one engineer for one month instead: the category gate and the synonym layer, and the tail measurement that proves the rest is worth funding.</p>\n<h2>The whiteboard, in order</h2>\n<p>What to draw, when, and the numbers to have on the board. Practise the first three until they come out without thinking.</p>\n<div class=\"tw\"><table><thead><tr><th>Minute</th><th>Draw</th><th>Say while drawing</th></tr></thead><tbody><tr><td>5</td><td><strong>The funnel</strong> (Fig 1)</td><td>Label each box with its millisecond budget</td></tr><tr><td>10</td><td><strong>Query decomposition</strong> (Fig 3)</td><td>Why BM25 fails on the prompt&#x27;s own example</td></tr><tr><td>15</td><td><strong>The two towers</strong> (Fig 4)</td><td>Draw them <em>different sizes</em>, and say why</td></tr><tr><td>18</td><td><strong>The weight pipeline</strong> (Fig 4b)</td><td>If she asks how positives are chosen — counts, calibrated values, propensity</td></tr><tr><td>20</td><td><strong>The loss</strong> (Fig 5)</td><td>Write it out; this is the retrieval assessment</td></tr><tr><td>22</td><td><strong>What each loss sees</strong> (Fig 5b)</td><td>Only if she asks why not triplet or MSE — four sketches, thirty seconds</td></tr><tr><td>24</td><td><strong>logQ correction</strong> (Fig 6)</td><td>One line under the loss</td></tr><tr><td>32</td><td><strong>The EV objective</strong> (Fig 8)</td><td>The pivot from retrieval to ranking</td></tr><tr><td>38</td><td><strong>LambdaRank&#x27;s lambda</strong> (Fig 10)</td><td>And why you still need calibrated pointwise heads</td></tr><tr><td>44</td><td><strong>ESMM</strong> (Fig 11)</td><td>Only if she pushes on CVR data</td></tr><tr><td>50</td><td><strong>The seam</strong> (Fig 15)</td><td>Raise it yourself; it is the highest-signal moment</td></tr></tbody></table></div>\n<p>Figures 7, 9, 12, 13 and 14 are worth knowing but not worth board time unless she asks — the training pipeline, the downsampling correction, log-and-train, the multi-task head, and the mobile/web comparison.</p>\n<p>Numbers to have in your head, not on a slide:</p>\n<div class=\"co num\"><span class=\"col\">Numbers</span>10M x 256-d int8 = 2.6 GB of vectors plus ~2.6 GB of HNSW graph. 20 requests in flight at 200 QPS and 100 ms. Six months = ~3B searches, ~1.2B clicks, ~60M purchases. Cross-encoder over 50 candidates = 10-15 ms on a T4. Clicked impressions are 1-5% of all impressions. ~100 impressions per click. Temperature ~0.05, batch size in the thousands, embedding dim 256.</div>\n<ul>\n<li>10M x 256-d int8 = <strong>2.6 GB</strong> of vectors, plus ~2.6 GB of HNSW graph at M=32</li>\n<li><strong>20 requests in flight</strong> at 200 QPS and 100 ms</li>\n<li>6 months at 200 QPS = <strong>~3B searches, ~1.2B clicks, ~60M purchases</strong></li>\n<li>Cross-encoder over 50 candidates = <strong>~10–15 ms</strong> on a T4-class GPU</li>\n<li>Clicked impressions are <strong>1–5%</strong> of all impressions — the CVR data problem</li>\n<li>~<strong>100 impressions per click</strong>, which is why you downsample negatives</li>\n<li>Temperature <strong>~0.05</strong>; batch size <strong>thousands</strong>; embedding dim <strong>256</strong></li>\n</ul>\n<h2>Next generation, and what you say about it</h2>\n<p>Nothing in this chapter changes the system you just designed. It is here because this is a 2026 search interview at a company that reads the literature, the prompt is product search over a 10M-item catalogue, and there is a recent DeepMind result whose headline benchmark is <em>e-commerce product search</em>. If she asks &quot;what about generative retrieval?&quot; -- or worse, &quot;why not just use an LLM?&quot; -- the difference between a Staff answer and a Senior one is whether you can name the result, say what it actually proves, and then decline it on serving grounds without sounding like you have not read it.</p>\n<p>Treat everything below as improvements you would sequence after Q4, not as part of the v1 design.</p>\n<h3>The result worth knowing</h3>\n<p><strong>Autoregressive Ranking: Bridging the Gap Between Dual and Cross Encoders</strong> (Rozonoyer et al., arXiv 2601.05588 -- DeepMind with UMass and UT Austin). The setup is pointwise autoregressive ranking: an LLM generates a document identifier token by token, and you rank by beam search over docIDs. No embedding table, no ANN index -- the decoder <em>is</em> the index. Two contributions, and they are different kinds of thing.</p>\n<h4>The theorem, which is the part that matters to your answer</h4>\n<p>They prove the expressive capacity of autoregressive ranking is strictly greater than a dual encoder&#x27;s. Specifically: for a dual encoder to realise <em>arbitrary</em> rankings over a corpus, the embedding dimension has to grow <strong>linearly with corpus size</strong>; the autoregressive model gets there with a <strong>constant</strong> hidden dimension.</p>\n<p>This is worth internalising because you already asserted the consequence, twice, on intuition alone. When you said the two towers never interact before the dot product and that no amount of training fixes it, and when you said 256 dimensions is enough for 10M items, you were making claims about <em>capacity</em>. The theorem gives them a shape: the ceiling on a two-tower is not optimisation and it is not data, it is the rank of a bilinear form, and the dimension you need scales with how much ranking structure you are asking a single dot product to carry.</p>\n<div class=\"co say\"><span class=\"col\">Say this</span>The two-tower&#x27;s ceiling is not a training problem, it is a capacity one -- there is a recent DeepMind result showing a dual encoder needs embedding dimension growing linearly in corpus size to express arbitrary rankings, where an autoregressive ranker needs constant hidden dimension. That is the formal version of why I put the cross-encoder back in as a reranker rather than trying to train a better bi-encoder.</div>\n<p>It also sharpens the dimension answer. &quot;256 is enough&quot; is not a universal claim -- it is a claim that the <em>head and torso</em> of this catalogue do not need more, which is exactly why the tail is the hard half of the prompt. If she pushes on dimension, that is a better second sentence than Matryoshka.</p>\n<h4>SToICaL, which is the part that generalises</h4>\n<p>The second contribution is a loss. Their observation: the standard next-token prediction objective is <strong>rank-agnostic</strong>. It is a top-1 objective, and fine-tuning an LLM for ranking with it optimises for emitting the single best docID while saying nothing about the order of everything below. SToICaL -- Simple Token-Item Calibrated Loss -- adds item-level reweighting plus prefix-tree marginalisation, so probability mass is spread across the valid docID tokens in proportion to graded relevance rather than piled onto one.</p>\n<p>You have already made this argument in this answer, one level down. It is the distillation argument: the binary click label carries one bit, the cross-encoder teacher&#x27;s score distribution carries the whole ordering, and the ordering is what a retriever actually needs. SToICaL is the same move applied to a generative model -- replace a rank-agnostic objective with a rank-calibrated one. Saying so out loud is the connection that makes it sound like you read the paper rather than the press release.</p>\n<h4>What they actually measured, and the caveats to volunteer</h4>\n<p>Two datasets: WordNet, and <strong>ESCI -- the Amazon Shopping Queries set</strong>. That second one is the reason this is worth a minute of her time and not zero: it is graded relevance over real product search, which is this prompt&#x27;s domain. The reported gains are on suppressing invalid docID generation and on ranking metrics <em>beyond</em> top-1.</p>\n<div class=\"co trap\"><span class=\"col\">The trap</span>Do not oversell it. It is a theory paper with two academic benchmarks. It reports no latency numbers and no serving cost at all, and on the shopping data one variant <em>degraded</em> top-1 while improving the rest of the list. A candidate who cites it as evidence that generative retrieval is ready for a 100 ms p99 has told the interviewer they read an abstract.</div>\n<h3>So would you build it here? No, and here is the shape of the no</h3>\n<div class=\"decide\"><div class=\"dt\">Generative retrieval for this system?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Two-tower + ANN with a cross-encoder reranker, as designed above</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Autoregressive ranking over docIDs with constrained beam search</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">the serving story does not exist yet at this budget. Beam search over a 10M-item docID space is autoregressive decoding inside a 100 ms p99 that also has to pay for query understanding, lexical retrieval, fusion and a reranker. The paper reports no latency figures because latency is not what it is about.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">you keep the expressiveness ceiling the theorem describes, and you pay for it with a reranker stage you would otherwise not need</span></div><div class=\"drow\"><span class=\"dk fallback\">FALLBACK</span><span class=\"dv\">if the catalogue were 100k items rather than 10M, or if this were an offline or low-QPS surface, the arithmetic changes and I would prototype it</span></div></div>\n<p>Three more things that make the no a real engineering judgement rather than conservatism.</p>\n<ul>\n<li><strong>Churn breaks the index-as-decoder property.</strong> A marketplace adds and delists products continuously, and this design already commits to new listings being findable within hours. In the two-tower that is an item-tower forward pass and an index insert. In a generative ranker the item inventory lives in the decoder&#x27;s weights, so a new product is either a finetune or a docID the model has never learned to emit.</li>\n<li><strong>You lose the filters.</strong> Search has hard constraints -- in stock, ships here, category. The ANN path has in-traversal filtering and a brute-force fallback below a selectivity threshold. Constrained decoding over a prefix tree can express a filter in principle, and there is no production recipe for doing it at 10M items under a latency budget.</li>\n<li><strong>It does not remove the seam, it moves it.</strong> A generative ranker still trains on logged feedback produced by its own previous decisions. Every bias in the ranking chapter -- position, selection, delayed feedback -- survives the architecture change unchanged.</li>\n</ul>\n<h3>Where it would actually go in, and when</h3>\n<p>The honest version of &quot;yes, later&quot; is specific. Three entry points, cheapest first.</p>\n<ul>\n<li><strong>Semantic IDs without generative decoding.</strong> Replace hashed item IDs in the <em>ranker</em> with RQ-VAE codes derived from content, so a cold listing inherits signal from items sharing a code prefix. This is the YouTube deployment path, it keeps every serving property of the current stack, and it attacks the cold-start half of the tail problem directly. This is the one I would actually schedule.</li>\n<li><strong>A rank-calibrated objective on the reranker.</strong> The SToICaL argument does not need a generative architecture. If the L2 reranker is an LLM-backed scorer, training it with a rank-aware loss rather than binary relevance is the same upgrade the paper describes, at a stage where the candidate set is 50 items and the cost is bounded.</li>\n<li><strong>Generative retrieval as a fourth arm, offline-evaluated.</strong> Not in the serving path. Run it over the tail slice, fuse its output in as a fourth list behind RRF, and measure whether it surfaces items the other three arms structurally cannot reach. That is the experiment the theorem predicts should pay, and it costs you one offline evaluation rather than a rearchitecture.</li>\n</ul>\n<div class=\"co push\"><span class=\"col\">She pushes</span>&quot;It sounds like you just do not want to use LLMs.&quot; -- No. I want the LLM where it is affordable and decisive, which in this system is offline: as the cross-encoder teacher, as the relevance judge for the tail judgement set, and as catalogue enrichment on marketplace listings with bad seller text. What I will not do is put autoregressive decoding on the blocking path of a mobile search bar to buy expressiveness I can get from a reranker over 50 candidates for 10 milliseconds.</div>\n<h3>What would change my mind</h3>\n<p>Worth having ready, because &quot;no&quot; with no falsifier is dogma.</p>\n<ul>\n<li>A published serving result: beam-search ranking over a catalogue of this size inside a double-digit millisecond budget, with the filter story solved.</li>\n<li>An incremental-update path, so a new listing becomes generatable without a finetune.</li>\n<li>Evidence on <em>our</em> tail, not on ESCI: the fourth-arm experiment above showing items the dense, lexical and structured arms all miss.</li>\n<li>The reranker saturating. Today the cheapest route to more expressiveness is a better cross-encoder over 50 candidates. When that curve flattens, the architecture argument starts to matter.</li>\n</ul>\n<h2>Ten things that would lose this round</h2>\n<p><strong>On retrieval</strong></p>\n<ul>\n<li>Drawing two identically-sized towers, and not knowing why they differ.</li>\n<li>Saying &quot;in-batch negatives&quot; and stopping, without the sampling bias.</li>\n<li>Quoting Recall@10 as the retrieval metric.</li>\n<li>Claiming offline recall against logged clicks is an unbiased evaluation.</li>\n</ul>\n<p><strong>On ranking</strong></p>\n<ul>\n<li>Accepting &quot;optimise CVR&quot; without naming the cheap-item pathology.</li>\n<li>Answering &quot;listwise, obviously&quot; without noticing that the expected-value objective needs calibrated probabilities a LambdaMART score cannot give you.</li>\n<li>Training on raw clicks with no propensity correction, then wondering why the model&#x27;s best feature is the old ranker&#x27;s output.</li>\n<li>Having no answer for how a brand-new listing ever gets its first impression.</li>\n</ul>\n<p><strong>On both</strong></p>\n<ul>\n<li>Spending fifteen minutes on sharding a 10M-item index that fits in RAM.</li>\n<li>Treating retrieval and ranking as two independent problems, and having nothing to say when a recall win produces a flat A/B.</li>\n</ul>","breadthRound":"<h2>Parth&#x27;s round: breadth, hiring manager, and team fit at once</h2>\n<p>This is not three rounds. It is one slot carrying three evaluations, run by the person who decides. He has <strong>two headcount and four candidates at onsite</strong>, one requisition at L6-1 and one at L6-2, and the recruiter puts you at the L6-2 end. So this round decides not only whether you get an offer but which one.</p>\n<p>It is also your <strong>second</strong> conversation with him — he screened every candidate himself before the loop. That changes the opening more than people expect, and there is a section on it below.</p>\n<h3>How it differs from Siwen&#x27;s round</h3>\n<div class=\"decide\"><div class=\"dt\">How do you pace Parth&#x27;s round versus Siwen&#x27;s?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Short answers, commit fast, stop, let him steer</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">The depth-round instinct of going three levels down</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">he samples across topics deliberately. The recruiter&#x27;s words were that Siwen &quot;will focus on one thing and just go dive deep on it,&quot; while Parth &quot;tries to poke around different topics&quot; because he wants &quot;360 knowledge on certain ML topics.&quot; Going deep unprompted burns his agenda and reads as not listening.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">you will leave depth on the table in places, which feels bad and is correct</span></div><div class=\"drow\"><span class=\"dk recover-it-by\">RECOVER IT BY</span><span class=\"dv\">offering the depth rather than taking it -- &quot;there&#x27;s a subtlety in how the negatives are mined, want me to go into it?&quot;</span></div></div>\n<div class=\"co say\"><span class=\"col\">Say this</span>Two minutes, then stop. In a breadth round the failure is not being wrong, it is still talking forty seconds after you had already answered.</div>\n<p>The rhythm to aim for is: commit in the first sentence, give the one reason that matters, name the trade-off, stop. If he wants more he will ask, and the asking is the signal he is looking for anyway.</p>\n<h3>Where he will poke</h3>\n<p>The recruiter named four areas explicitly, and the job description implies the rest. Have a two-minute answer ready for every cell.</p>\n<div class=\"tw\"><table><thead><tr><th>Area</th><th>Why it is on his list</th><th>What to be ready for</th></tr></thead><tbody><tr><td><strong>Ranking</strong></td><td>His org&#x27;s core, and the recruiter named it first</td><td>LTR families, position bias, calibration, multi-objective, offline/online gap</td></tr><tr><td><strong>Retrieval</strong></td><td>The other half of Search &amp; Discovery</td><td>Two-tower training, negatives, ANN, hybrid fusion — the depth-round material, compressed</td></tr><tr><td><strong>Computer vision</strong></td><td>Recruiter: &quot;maybe you worked on some kind of computer vision&quot;</td><td>Product image embeddings, multimodal retrieval, CLIP-style training, OCR on listings</td></tr><tr><td><strong>ML infrastructure</strong></td><td>Recruiter: &quot;how much you know about ML infra&quot;</td><td>Spark, Airflow, Kubeflow, MLflow — all named in the JD — feature stores, training pipelines, serving, versioning</td></tr><tr><td><strong>LLMs</strong></td><td>The JD asks for innovation with them</td><td>Where they belong offline vs online, distillation, cost per query, evaluation</td></tr><tr><td><strong>Experimentation</strong></td><td>Any senior ML role</td><td>Sizing, interleaving, guardrails, novelty, when a flat result is underpowered</td></tr><tr><td><strong>Classical ML</strong></td><td>The JD names XGBoost and LightGBM</td><td>GBDT vs neural on tabular, target encoding, leakage, calibration</td></tr></tbody></table></div>\n<p>Multimodal is the one most candidates have not prepared and the JD asks for explicitly. You do not need research depth — you need a position: product images are a strong signal for exactly the attributes that are missing from bad seller text (&quot;lightweight&quot;, &quot;winter&quot;), a CLIP-style dual encoder is the obvious way in, and the cost is that image embeddings go stale when sellers swap photos. That is enough to hold a five-minute conversation, which is all this round wants.</p>\n<h3>The &quot;I don&#x27;t know&quot; protocol</h3>\n<p>A breadth round is designed to find your edge. It will. The only question is what you do in the two sentences after you hit it.</p>\n<div class=\"co say\"><span class=\"col\">Say this</span>I haven&#x27;t built that. Here&#x27;s what I&#x27;d expect to be true and how I&#x27;d check it — and then say the thing you would actually check.</div>\n<p>Three rules. Never bluff a number, because the one thing he can verify on the spot is arithmetic. Never say &quot;I don&#x27;t know&quot; and stop, because that is a dead end and he still has to fill the time. And never over-apologise — one clause, then reason from what you do know. Getting to a defensible answer from first principles in front of him is a <em>better</em> signal than having memorised it.</p>\n<h3>The hiring-manager half</h3>\n<p>Somewhere in the middle he stops sampling and starts deciding. The questions shift from &quot;what do you know&quot; to &quot;what would you own.&quot; Have these ready.</p>\n<ul>\n<li><strong>&quot;What would you want to work on here?&quot;</strong> Not a pleasantry — it is a scope question. Answer with a specific problem from their stack, not a technology. &quot;Tail-query recall&quot; is an answer. &quot;LLMs&quot; is not.</li>\n<li><strong>&quot;What does your first ninety days look like?&quot;</strong> Say: read the code and the logs, find the measurement gap, ship something small that proves the loop works end to end, and only then propose the bigger thing. Candidates who describe a six-month redesign in their first ninety days read as risky.</li>\n<li><strong>&quot;How do you decide what not to do?&quot;</strong> This is <em>Ruthless Prioritization</em> arriving in technical clothing. Have a real example where you killed something.</li>\n<li><strong>&quot;How do you work with a PM who wants something you think is wrong?&quot;</strong> <em>Disagree and Commit</em>. They want both halves: the disagreement, and the committing.</li>\n<li><strong>&quot;What would you need from me?&quot;</strong> Answer it honestly and specifically. Vagueness here reads as not having thought about the job.</li>\n</ul>\n<h3>Level calibration: L6-1 versus L6-2</h3>\n<p>He is deciding which requisition you fit. The difference is not how much you know; it is the radius of what you talk about owning.</p>\n<div class=\"tw\"><table><thead><tr><th></th><th>Reads as L6-1</th><th>Reads as L6-2</th></tr></thead><tbody><tr><td><strong>Scope</strong></td><td>&quot;I owned the ranking model&quot;</td><td>&quot;I owned ranking quality, which meant fixing the labelling pipeline two teams upstream&quot;</td></tr><tr><td><strong>Problem choice</strong></td><td>Given a problem, solved it well</td><td>Chose the problem, and can say what you gave up</td></tr><tr><td><strong>Failure</strong></td><td>Describes a bug you fixed</td><td>Describes a bad call you made and what it cost</td></tr><tr><td><strong>Others</strong></td><td>Worked well with the team</td><td>Named a person who is better because of you</td></tr><tr><td><strong>Numbers</strong></td><td>Model metrics</td><td>Business metrics, and the cost side of the ledger</td></tr></tbody></table></div>\n<p>None of this means inflating. It means that when you have a choice between the narrow true answer and the wider true answer, take the wider one.</p>\n<h3>Team fit runs in both directions</h3>\n<p>The recruiter&#x27;s read is that you and Parth are &quot;genuinely a very, very good match,&quot; and that he &quot;has been here a long time.&quot; Use that: a long-tenured manager has seen several strategy cycles and will respond to questions about durability rather than hype.</p>\n<p>What he is listening for: whether you want <em>this</em> job or <em>a</em> job. Specificity is the whole tell. Mentioning that recommendations and search together are more than half of Coupang&#x27;s sales, or that the ranking objective mixes relevance with delivery speed, does more than any statement of enthusiasm.</p>\n<p><strong>Questions worth asking him</strong>, in rough priority:</p>\n<ul>\n<li>Which requisition is this, and what does the first year look like differently at L6-1 versus L6-2? <em>Ask it directly. He has two, you may as well know.</em></li>\n<li>What is the split between search and recommendations on this team, and where is the bigger gap right now?</li>\n<li>How much of the ranking objective is relevance versus attractiveness, and who owns that weighting?</li>\n<li>What does the offline-to-online correlation look like today? <em>A manager who can answer this precisely has a healthy measurement culture; one who cannot is telling you where your first ninety days go.</em></li>\n<li>Who else would I work with most closely, and what do they need that they are not getting?</li>\n<li>What is the thing about this team you would change if you could?</li>\n</ul>\n<p>Avoid asking about work-life balance, promotion timelines, or whether the team uses a particular framework. None of them are bad questions; all of them are better asked of the recruiter.</p>\n<h3>The second-conversation problem</h3>\n<p>He has already spoken with you. So the opening cannot be the same opening.</p>\n<p>Do not re-tell the stories he has already heard — he will recognise them, and it reads as a rehearsed pitch rather than a conversation. Instead, reference the first conversation and advance it: <em>&quot;When we spoke you mentioned X. I went and looked at how we handled that, and the thing I got wrong was…&quot;</em> That does three things at once — it shows you listened, it shows you thought about the job between conversations, and it opens on a self-correction, which is the single most reliable way to sound senior.</p>\n<p>Have one thing prepared that you have learned or reconsidered since you last spoke. It does not have to be large. It has to be real.</p>\n<div class=\"co trap\"><span class=\"col\">The trap</span>The worst outcome in this round is a good technical performance that leaves him unable to picture you on his team. Coverage gets you past the bar; specificity about what you would own is what picks you out of four candidates for two seats.</div>","project":"<h2>The project deep-dive round</h2>\n<p>Nominally a leadership round. In practice: you pick one project, talk for ten minutes, and then spend thirty-five minutes being pushed on it. It is scored against the 15 leadership principles, but the evidence is technical — the interviewer is checking whether the detail holds up four levels down. Coupang&#x27;s own guidance names <strong>SBI (Situation, Behaviour, Impact)</strong> and tells candidates to &quot;incorporate data into examples&quot; because &quot;data drives everything that we do.&quot;</p>\n<blockquote><strong>Send me your project document and I will fill this in properly</strong> — the narrative, the numbers, the specific follow-ups your architecture invites, and where each leadership principle is evidenced. Everything below is the structure it will be poured into, and is worth reading first so you know what I will be asking you for.</blockquote>\n<h3>Choosing which project</h3>\n<p>Pick for <strong>depth of decision-making</strong>, not for glamour. The best project for this round has: a decision you made that a reasonable engineer would have made differently, a number attached to the outcome, something that went wrong, and at least one other team involved. A flawless project is a bad interview project — there is nothing to dive into.</p>\n<p>Rule of thumb: if you cannot name three things you would do differently, pick a different project.</p>\n<p>A project that touches ranking, retrieval, recommendations, or large-scale feature pipelines will land harder here than one that does not, because the interviewer can go deeper with you. But a deeply-understood project outside the domain beats a shallowly-understood one inside it.</p>\n<h3>The narrative spine — ten beats, ten minutes</h3>\n<p>Most candidates deliver beats 1, 5 and 9 and wonder why the round felt thin. The ones that score deliver 3, 4, 7 and 10.</p>\n<ol>\n<li><strong>The business problem, in one sentence a PM would recognise.</strong> Not &quot;we improved NDCG.&quot; Something like &quot;tail queries returned nothing useful and 15% of sessions with a tail query ended without a click.&quot;</li>\n<li><strong>Why it was worth doing.</strong> The size of the prize, estimated before you started. If you cannot say how you sized it, say that — but know that this is where <em>Wow the Customer</em> and <em>Ruthless Prioritization</em> get scored.</li>\n<li><strong>What you inherited.</strong> The existing system, honestly. Its actual failure mode, not a strawman.</li>\n<li><strong>The decision point.</strong> The two or three real options, and why you chose the one you chose. <strong>This is the centre of the round.</strong> Have the rejected option ready in as much detail as the chosen one.</li>\n<li><strong>What you built.</strong> Architecture at the level of a whiteboard box diagram, then one level down on the part that was hard.</li>\n<li><strong>What broke.</strong> Something always breaks. The specific bug, how you found it, how long it took. <em>Dive Deep</em> lives here.</li>\n<li><strong>How you knew it worked.</strong> The experiment design, the metric, the guardrail metrics, the duration, the decision rule you set <em>before</em> you looked.</li>\n<li><strong>The result, with a number and a unit.</strong> And the confidence interval or the sample size, because a Staff candidate who quotes a point estimate without either invites an easy follow-up.</li>\n<li><strong>What it cost.</strong> Serving cost, latency, engineer-months, complexity added. <em>Hate Waste</em> is a principle here — &quot;we save costs rather than simply cut them.&quot;</li>\n<li><strong>What you would do differently, and what you learned.</strong> Non-defensively. <em>Learn Voraciously</em> says &quot;Ego is the enemy,&quot; and they mean it as a scoring criterion.</li>\n</ol>\n<h3>The numbers you must know cold</h3>\n<p>Being unable to produce these is the single most common way this round goes badly. Write them on one page and memorise it. If a number is an estimate, know that it is, and say so.</p>\n<div class=\"tw\"><table><thead><tr><th></th><th>What to have ready</th></tr></thead><tbody><tr><td><strong>Scale</strong></td><td>Rows of training data. Number of users / items / queries. QPS at peak. Index size.</td></tr><tr><td><strong>Mode
