<title>Coupang Loop Prep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --card:#FCFDFC; --raise:#F4F7F5;
  --ink:#141A18; --body:#2A3431; --muted:#5E6B66; --faint:#93A19B;
  --accent:#0E6E63; --accent-soft:#D7E6E2; --flag:#A6402C; --flag-soft:#F5E4DF;
  --rule:#DBE2DE; --tick:#C2CDC8; --ok:#0E6E63; --shaky:#B5822A; --again:#A6402C;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
}}
:root[data-theme="dark"]{
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--sans);
  font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;color:var(--ink);text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono);font-size:.86em;background:var(--raise);
  padding:.08em .32em;border-radius:3px;color:var(--ink)}
a{color:var(--accent)}

.wrap{max-width:840px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-block:11px 0}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--faint);padding-top:6px}
.sub:empty{display:none}
.top .spacer{flex:1}
.tbtn{font-size:.74rem;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:4px}
.tbtn:hover{color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.83rem;font-weight:600;padding:8px 13px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin-left:5px}

.spine{display:flex;gap:2px;margin-top:9px;height:14px;align-items:flex-end;
  overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.spine::-webkit-scrollbar{display:none}
.tick{flex:1 0 3px;min-width:3px;height:8px;background:var(--tick);border-radius:1px;
  padding:0;transition:height .12s ease}
.tick[data-g="solid"]{background:var(--ok)}
.tick[data-g="shaky"]{background:var(--shaky)}
.tick[data-g="again"]{background:var(--again)}
.tick[aria-current="true"]{height:14px;background:var(--ink)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 12px}
.chip{font-size:.73rem;font-weight:600;padding:4px 9px;border-radius:20px;
  border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C110F}
}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:24px 28px 22px;margin-top:18px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.71rem;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-bottom:11px}
.eyebrow .n{font-family:var(--mono);letter-spacing:0;color:var(--accent)}
.eyebrow .sec{color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:3px}
.eyebrow .dot{color:var(--rule)}
.q{font-size:1.38rem;line-height:1.28;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.clock{margin-top:18px}
.track{position:relative;height:4px;background:var(--rule);border-radius:2px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px}
.fill.over{background:var(--flag)}
.target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45}
.clockrow{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.73rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.clockrow .el{color:var(--ink);font-weight:600;font-size:.88rem}
.clockrow .el.over{color:var(--flag)}
.clockrow .spacer{flex:1}
.go{font-family:var(--sans);font-weight:600;font-size:.77rem;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.go:hover{text-decoration:underline}
.veil{margin-top:20px;padding:18px;border:1px dashed var(--rule);border-radius:8px;
  text-align:center;color:var(--muted);font-size:.87rem}
.veil b{display:block;color:var(--ink);font-weight:600;font-size:1rem;margin-bottom:3px}
.veil kbd{font-family:var(--mono);font-size:.77rem;background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ink)}
.lab{font-size:.69rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:22px 0 6px}
.lab.f{color:var(--flag)}
.say{font-family:var(--serif);font-size:1.06rem;line-height:1.62;color:var(--body);max-width:64ch}
.say p{margin:0 0 .85em}
.say p:last-child{margin-bottom:0}
ul.tight{margin:0;padding-left:1.15em;max-width:64ch}
ul.tight li{margin-bottom:5px}
ul.tight li::marker{color:var(--faint)}
.nums{list-style:none;padding:0;margin:0;max-width:64ch}
.nums li{font-family:var(--mono);font-size:.83rem;line-height:1.5;color:var(--ink);
  padding:6px 0 6px 13px;border-left:2px solid var(--accent-soft)}
.cp{margin-top:18px;background:var(--accent-soft);border-radius:8px;padding:13px 16px;
  font-size:.93rem;color:var(--ink);max-width:64ch}
.cp b{font-weight:700}
.marker{background:var(--raise);border-radius:8px;padding:14px 17px;max-width:64ch;overflow-x:auto}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}
.grade{display:flex;gap:9px;margin-top:24px;padding-top:18px;
  border-top:1px solid var(--rule);flex-wrap:wrap}
.gbtn{flex:1 1 130px;padding:10px 12px;border-radius:7px;border:1px solid var(--rule);
  font-weight:600;font-size:.86rem;color:var(--ink);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn .k{font-family:var(--mono);font-size:.71rem;color:var(--faint);font-weight:400}
.gbtn[data-g="solid"]:hover,.gbtn[data-g="solid"][aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
.gbtn[data-g="shaky"]:hover,.gbtn[data-g="shaky"][aria-pressed="true"]{color:var(--shaky);border-color:var(--shaky)}
.gbtn[data-g="again"]:hover,.gbtn[data-g="again"][aria-pressed="true"]{color:var(--again);border-color:var(--again)}
.nav{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:.79rem;color:var(--muted)}
.nav button{font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--accent)}
.nav .spacer{flex:1}
.src{margin-top:18px;font-size:.71rem;color:var(--faint);font-family:var(--mono)}

/* prose panes */
.prose{max-width:70ch;margin-top:8px}
.prose h2{font-size:1.7rem;letter-spacing:-.02em;margin:30px 0 10px}
.prose h3{font-size:1.16rem;margin:28px 0 7px;color:var(--accent)}
.prose h4{font-size:1rem;margin:20px 0 5px}
.prose p{margin:0 0 .95em;font-family:var(--serif);font-size:1.05rem;line-height:1.62}
.prose li{font-family:var(--serif);font-size:1.03rem;line-height:1.55;margin-bottom:6px}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1em}
.prose blockquote{margin:18px 0;padding:14px 18px;background:var(--accent-soft);
  border-radius:8px;border-left:3px solid var(--accent)}
.prose blockquote p{margin:0;font-size:1rem}
.prose hr{border:none;border-top:1px solid var(--rule);margin:26px 0}
.tw{overflow-x:auto;margin:0 0 18px}
.prose table{border-collapse:collapse;width:100%;font-size:.89rem;font-family:var(--sans)}
.prose th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule);
  color:var(--ink);font-weight:700;font-size:.79rem;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.prose td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.prose tbody tr:hover{background:var(--raise)}

/* coding pane */
.prob{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:20px 24px;margin-top:14px}
.prob h3{font-size:1.14rem;margin-bottom:4px}
.ptag{font-family:var(--mono);font-size:.7rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em}
.ptag .d{color:var(--accent)}
.prompt{font-family:var(--serif);font-size:1.02rem;margin:8px 0 0;color:var(--body)}
.reveal{margin-top:12px;font-size:.79rem;font-weight:600;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.reveal:hover{text-decoration:underline}
pre{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:13px 15px;overflow-x:auto;margin:0;font-size:.81rem;line-height:1.5}
pre code{background:none;padding:0;font-size:1em}
.prose pre.fig{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:14px 16px;overflow-x:auto;margin:4px 0 6px;font-size:.78rem;
  line-height:1.42;color:var(--ink)}
.prose pre.fig.wide{font-size:.7rem}
.figcap{font-family:var(--sans)!important;font-size:.76rem!important;color:var(--muted);
  margin:0 0 20px!important;letter-spacing:.01em}

@media (max-width:600px){
  .wrap{padding-inline:16px}
  .card,.prob{padding:18px 16px}
  .q{font-size:1.18rem}
  .say{font-size:1.01rem}
  .gbtn{flex:1 1 100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:-16px;padding-inline:16px}
  .filters::-webkit-scrollbar{display:none}
  .prose p,.prose li{font-size:1rem}
  /* Diagrams are 62-74 monospace columns; at this size they fit a 390px
     screen instead of scrolling inside their own box. */
  .prose pre.fig{font-size:.6rem;line-height:1.35;padding:10px 11px}
  .prose pre.fig.wide{font-size:.52rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="deck" type="application/json">{"brief":"<h2>The loop</h2>\n<p>Four rounds: <strong>ML depth</strong>, <strong>ML breadth</strong>, a <strong>leadership round that is really a technical project deep-dive</strong>, and <strong>DS&amp;A coding</strong>. Staff / L6.</p>\n<h3>What the org actually is</h3>\n<p>Coupang runs Search &amp; Discovery as a revenue centre, not a platform team. Their own job postings say it plainly: <em>&quot;Over half of the Coupang sales are directly attributed to search and recommendation.&quot;</em> That single sentence should shape how you talk in all four rounds — every ranking decision you describe is a decision about half the company&#x27;s revenue, and you should frame trade-offs in those terms rather than in NDCG points alone.</p>\n<p>The published architecture is a conventional three-stage funnel, and knowing their vocabulary for it costs you nothing:</p>\n<ol>\n<li><strong>Query understanding.</strong> Normalisation, segmentation, intent, spell correction, synonyms. The org explicitly hires for &quot;query/intent understanding, query recommendation and search widgets quality.&quot;</li>\n<li><strong>Retrieval.</strong> A few thousand products selected out of tens of millions.</li>\n<li><strong>Ranking.</strong> The few thousand ordered by a model over <strong>100+ criteria</strong> that mix <em>search relevance</em> with what they call <em>product attractiveness</em> — ratings, review counts, price, brand, and delivery speed.</li>\n</ol>\n<p>That second half of the ranking objective is the thing to internalise. At Coupang, ranking is explicitly not a pure relevance problem. A relevant product that cannot be Rocket-delivered tomorrow is worth less to the customer than a slightly less relevant one that can, and the ranker is where that judgement gets made. If you walk in and design a pure relevance system, you have designed someone else&#x27;s search engine.</p>\n<p>Two more facts worth having: the catalogue is millions of products against petabytes of behavioural data, and the index is <strong>multilingual — Korean, English, and Mandarin</strong>. Korean is agglutinative and written without spaces between all morphemes, so tokenisation is a real modelling decision rather than a library call. If you are asked about internationalisation, that is the specific thing to reach for.</p>\n<p>The job description names the tools: Spark, Airflow, Kubeflow, MLflow for pipelines; PyTorch/TensorFlow, XGBoost and LightGBM for models; AWS, GCP, Vertex AI, BigQuery, SageMaker for infrastructure. It also names the three directions they want pushed — <strong>LLMs, embedding-based retrieval, and multi-modal learning</strong>. Have an opinion on each, and specifically have an opinion on where an LLM does <em>not</em> belong in a 200 ms search path.</p>\n<h3>What each round is testing at L6</h3>\n<p><strong>ML depth.</strong> Not &quot;do you know retrieval&quot; — every candidate knows retrieval. The L6 bar is whether you can hold a whole stage of the funnel in your head and defend a choice against the alternative you rejected. Expect to be pushed one level past your first answer every time. The tell that you are at the bar: you volunteer the failure mode of your own proposal before they ask.</p>\n<p><strong>ML breadth.</strong> Coverage without hand-waving. They are checking that you are not a one-system specialist who would be useless when the problem turns out to be a data leak, a calibration bug, or an experiment design flaw. Answers here should be shorter than in depth — two minutes, commit to a position, stop. Rambling in breadth reads as uncertainty.</p>\n<p><strong>Leadership / project deep-dive.</strong> This is the round people underestimate. It is scored against the 15 leadership principles below, but the <em>evidence</em> is technical: they will go three or four levels into one project and see whether the detail holds up. Coupang&#x27;s own interview guidance says to prepare &quot;operation principles, reasons behind choosing a strategy as well as the trade-offs,&quot; and to use <strong>SBI — Situation, Behaviour, Impact</strong>. Their guidance also says to &quot;incorporate data into examples&quot; because &quot;data drives everything that we do.&quot; A story without numbers will not score.</p>\n<p><strong>Coding.</strong> Their published guidance is 2–3 problems, and what they say they grade is revealing: <em>&quot;Clean code, Bug free&quot;</em>, <em>&quot;Code validation, identification of edge cases&quot;</em>, and algorithm mastery in <em>&quot;sorting, recursion, and dynamic programming.&quot;</em> Note what is missing — cleverness. Optimal-but-broken loses to correct-and-tested. State your complexity, then walk one example through your own code out loud before you say you are done.</p>\n<h3>The 15 leadership principles</h3>\n<p>These are Coupang&#x27;s, verbatim, and the deep-dive round is graded against them. The right-hand column is where each one most naturally shows up — you are not expected to hit all 15, you are expected to have two or three stories that hit six or seven of them between them.</p>\n<div class=\"tw\"><table><thead><tr><th>Principle</th><th>Coupang&#x27;s words</th><th>Where it shows up</th></tr></thead><tbody><tr><td><strong>Wow the Customer</strong></td><td>&quot;We exist to transform customers&#x27; lives for the better. The customer is the beginning and the end in every decision we make.&quot;</td><td>Why the metric you optimised was the right proxy for the customer</td></tr><tr><td><strong>Ruthless Prioritization</strong></td><td>&quot;To focus on what we must win, we give up what we want to do. Laser focus requires courage and confidence.&quot;</td><td>What you cut from the project, and what it cost you</td></tr><tr><td><strong>Company-wide Perspective</strong></td><td>&quot;Leaders think like owners… We understand and consider upstream and downstream implications.&quot;</td><td>Who consumed your model&#x27;s output, and what you did to protect them</td></tr><tr><td><strong>Dive Deep</strong></td><td>&quot;Operational excellence requires hands-on leadership with a passion for detail. We dig down to the smallest details.&quot;</td><td>The debugging story. This is the one the depth round is secretly testing</td></tr><tr><td><strong>Think Systematically</strong></td><td>&quot;We build scalable processes with prompt feedback mechanisms. We take measures not only to fix defects, but also to prevent them.&quot;</td><td>The guardrail you added after the incident, not just the fix</td></tr><tr><td><strong>Simplify</strong></td><td>&quot;Complexity is the enemy of scale, speed, and customer experience.&quot;</td><td>The model or pipeline you deleted</td></tr><tr><td><strong>Disagree and Commit</strong></td><td>&quot;Constructive confrontation is essential to good decisions. Leaders challenge openly when they disagree.&quot;</td><td>The time you lost the argument and executed anyway — they want both halves</td></tr><tr><td><strong>Hire and Develop the Best</strong></td><td>&quot;Leaders raise the performance level of the team with every hire and promotion.&quot;</td><td>Mentoring, and a specific person who got better</td></tr><tr><td><strong>Deliver Results with Grit</strong></td><td>&quot;Leaders deliver impact in timely fashion and with high quality. We do not confuse long hours or effort with results.&quot;</td><td>Shipped, measured, still running</td></tr><tr><td><strong>Influence without Authority</strong></td><td>&quot;Leaders lead by communicating their ideas clearly. We drive alignment through data and insights.&quot;</td><td>How you got another team to change their schema for you</td></tr><tr><td><strong>Aim High and Find a Way</strong></td><td>&quot;We aim for jaw-dropping results and work backwards.&quot;</td><td>The goal that looked unreasonable when you set it</td></tr><tr><td><strong>Learn Voraciously</strong></td><td>&quot;We are hungry for the best ideas and seek them from all sources… Ego is the enemy.&quot;</td><td>What you were wrong about</td></tr><tr><td><strong>Demand Excellence</strong></td><td>&quot;Leaders have a passion for excellence and do not tolerate mediocrity.&quot;</td><td>The bar you refused to lower</td></tr><tr><td><strong>Move with Urgency</strong></td><td>&quot;Urgency is a sense of crisis. We treat inaction as a threat to survival. We learn by doing.&quot;</td><td>The thing you shipped in two weeks instead of specifying for two months</td></tr><tr><td><strong>Hate Waste</strong></td><td>&quot;Leaders find ways to do more with less. We save costs rather than simply cut them.&quot;</td><td>The serving-cost or GPU-hour number. Note the distinction they draw: <em>save</em>, not <em>cut</em></td></tr></tbody></table></div>\n<p>Principle 15&#x27;s phrasing is worth a beat. &quot;We save costs rather than simply cut them&quot; means an efficiency story where you removed capability scores badly; one where you held quality flat and halved the cost scores well.</p>\n<h3>Budgeting the time inside a round</h3>\n<p>A 45-minute technical round is roughly three questions. Candidates lose it by spending 20 minutes on the first. Aim for two to three minutes of answer, then stop and let them steer. If you genuinely need longer — a system design — say the shape first (&quot;three stages, and the interesting one is the second&quot;), then expand. Announcing the structure buys you the time; launching into detail without it does not.</p>\n<p>For the deep-dive round, assume 10 minutes of narrative and 35 minutes of interrogation. Most people prepare the 10 and not the 35.</p>","deepdive":"<h2>The question Siwen asks</h2>\n<p>This is the ML depth round. A recruiter read out the scorecard from the same question asked to another candidate, so treat the wording below as close to verbatim.</p>\n<blockquote><strong>Design a retrieval and ranking system for an e-commerce mobile app search bar.</strong> The goal is to retrieve highly relevant products for ambiguous, long-tail queries — for example <em>&quot;durable lightweight winter boots for toddlers&quot;</em> — while ranking the results to optimise CVR. Assume a system is already running and has collected logs for six months. <strong>10M products. 200 QPS. 100 ms latency.</strong></blockquote>\n<h3>What is actually being tested</h3>\n<p>The scorecard from the previous candidate is the most useful thing you have:</p>\n<blockquote><em>&quot;Candidate is much more comfortable and experienced with ranking models than with the retrieval side — like contrastive learning, embedding models, or softmax … likely due to less exposure to retrieval model training.&quot;</em> <em>&quot;We should schedule an in-depth ML tech round to properly assess that type of hands-on experience.&quot;</em></blockquote>\n<p>So this round exists to probe <strong>retrieval model training</strong>. The design prompt is the frame; the assessment is whether you can train a two-tower retriever and defend every choice inside it — the contrastive objective, where positives and negatives come from, the sampled-softmax correction, the temperature, the embedding geometry, how you evaluate it offline without fooling yourself.</p>\n<p>Two consequences for how you run the room. <strong>Do not spend your best minutes on ranking.</strong> Ranking is where most candidates are strong and where the answer is relatively standard; it will not differentiate you. And <strong>volunteer the retrieval-training depth before you are asked for it</strong> — when you reach the dense arm, say &quot;let me go into how I would actually train this&quot; and go.</p>\n<p>The question also has three details that are there deliberately. <em>Ambiguous, long-tail</em> tells you behavioural features are absent and lexical retrieval will under-recall. <em>Optimise CVR</em> is a trap worth stepping around carefully — a pure CVR objective has a specific pathology. <em>Six months of logs</em> tells you that you have training data and are expected to use it, and it is also a hint about how much: enough for a retrieval model, and just about enough for a fresh ranker.</p>\n<h3>The first five minutes: what to ask</h3>\n<p>Ask four questions, no more. Each one should visibly change your design, and you should say what it changes — asking a clarifying question and then ignoring the answer is worse than not asking.</p>\n<ol>\n<li><strong>&quot;Is 100 ms the end-to-end server-side p99, or the budget for retrieval alone?&quot;</strong> If it is the whole funnel, cross-encoder reranking is tight and I will size it carefully. If it is retrieval only, I have room. <em>Assume end-to-end p99 unless told otherwise, and say you are assuming it.</em></li>\n<li><strong>&quot;Is 200 QPS peak or average?&quot;</strong> It sets replica count and, more importantly, tells me how much training data six months buys. At 200 QPS average that is roughly 3 billion searches; at 200 peak with a typical diurnal curve, closer to one billion. Either is plenty for a retriever.</li>\n<li><strong>&quot;CVR of what, over what window?&quot;</strong> Conversion per search session, per click, or per impression? Same-session or 7-day attributed? This is the single most consequential clarification in the question and I will come back to it.</li>\n<li><strong>&quot;Is this a marketplace with third-party sellers, and do we control the product text?&quot;</strong> It decides whether catalogue quality is a modelling problem or a data problem, and in a marketplace it is usually the biggest single lever on tail retrieval.</li>\n</ol>\n<p>If you get one more, ask whether ads or sponsored placement blend into the same result set, because that changes the ranking objective from CVR to expected value and you do not want to discover that at minute 50.</p>\n<h3>Numbers you derive from the prompt, out loud</h3>\n<p>Doing this in the first five minutes is worth a lot — it shows the constraints are real to you rather than decorative.</p>\n<div class=\"tw\"><table><thead><tr><th>From</th><th>Derivation</th><th>Number</th></tr></thead><tbody><tr><td>10M products, 256-d fp32</td><td>10e6 x 256 x 4</td><td>10.2 GB of raw vectors</td></tr><tr><td>Same, int8 scalar-quantised</td><td>10e6 x 256 x 1</td><td>2.6 GB — fits in RAM on one box</td></tr><tr><td>HNSW graph, M = 32</td><td>10e6 x 2M x 4 bytes</td><td>~2.6 GB of graph on top</td></tr><tr><td>200 QPS at 100 ms</td><td>Little&#x27;s law: 200 x 0.1</td><td>20 requests in flight</td></tr><tr><td>6 months at 200 QPS avg</td><td>200 x 86400 x 180</td><td>~3.1B searches</td></tr><tr><td>Clicks at ~40% of searches</td><td></td><td>~1.2B click events</td></tr><tr><td>Purchases at ~2% of searches</td><td></td><td>~60M purchase events</td></tr></tbody></table></div>\n<p>The conclusion to state: <strong>this is not a scale problem, it is a quality problem.</strong> 10M products and 200 QPS fit comfortably on a handful of machines. Nothing here forces a distributed index or exotic infrastructure, and a candidate who spends twenty minutes on sharding has misread the question. What is hard is recall on ambiguous tail queries and an honest CVR objective.</p>\n<h3>The sixty minutes</h3>\n<p>Her previous round was 15 minutes resume, 60 design, 15 Q&amp;A. Budget the design block like this, and say the plan out loud at the start — it buys you permission to defer things.</p>\n<div class=\"tw\"><table><thead><tr><th>Minutes</th><th>What</th><th>Why</th></tr></thead><tbody><tr><td>0–5</td><td>Clarify, state assumptions, derive the numbers above</td><td>Establishes the constraints are real</td></tr><tr><td>5–10</td><td>Whole-system diagram and the latency budget</td><td>Gives her a map; everything later hangs off it</td></tr><tr><td>10–15</td><td>Query understanding for the tail example</td><td>Shows you understand why the query is hard</td></tr><tr><td>15–40</td><td><strong>Retrieval, and how you train it</strong></td><td>The 25 minutes that decide the round</td></tr><tr><td>40–52</td><td>Ranking for CVR, multi-task, calibration</td><td>Where you are already strong; be efficient</td></tr><tr><td>52–60</td><td>Evaluation, experimentation, what you would build first</td><td>Staff signal: sequencing under constraint</td></tr></tbody></table></div>\n<p>If she interrupts and steers, follow her — but know where you were, and say &quot;I&#x27;ll come back to negatives&quot; rather than losing the thread. The one block to protect is 15–40.</p>\n<h2>The system</h2>\n<p>Draw this first and leave it on the board. Everything afterwards is a zoom into one box, and having the map up means you can say &quot;I&#x27;m here&quot; instead of re-explaining context.</p>\n<pre class=\"fig\"><code>  &quot;durable lightweight winter boots for toddlers&quot;\n                      |\n        +-------------v--------------+\n        |   QUERY UNDERSTANDING      |  ~8 ms\n        |  normalise / spell / seg   |\n        |  attributes / intent / cat |\n        +-------------+--------------+\n                      |\n     structured query { text, category prior, attrs, constraints }\n                      |\n      +---------------+----------------+\n      |               |                |\n+-----v-----+  +------v------+  +------v------+\n|  LEXICAL  |  |    DENSE    |  |  BEHAVIOUR  |  RETRIEVAL\n|  BM25F    |  |  two-tower  |  |  q -&gt; item  |  ~25 ms\n|  inverted |  |  + HNSW     |  |  from logs  |  (parallel)\n+-----+-----+  +------+------+  +------+------+\n      |               |                |\n      +-------+-------+--------+-------+\n              |  FUSION (RRF)  |           ~2 ms\n              +-------+--------+\n                      |  ~1000 candidates\n        +-------------v--------------+\n        |   L1 RANKER  (cheap GBDT)  |  ~8 ms\n        +-------------+--------------+\n                      |  top 100-200\n        +-------------v--------------+\n        |   L2 RANKER  (multi-task)  |  ~22 ms\n        |   pCTR | pCVR | pRel       |\n        +-------------+--------------+\n                      |  top ~50\n        +-------------v--------------+\n        |  POLICY: dedup, diversity, |  ~5 ms\n        |  business rules, blending  |\n        +-------------+--------------+\n                      |\n               ~24 products to the phone</code></pre>\n<p class=\"figcap\">Figure 1. The funnel, with the latency each stage gets.</p>\n<p>Three things to say while you draw it.</p>\n<p><strong>The three retrieval arms exist because they fail on disjoint query populations.</strong> Lexical nails exact tokens and part numbers and dies on paraphrase. Dense nails paraphrase and intent and dies on rare identifiers. Behavioural — a query-to-item table mined from six months of logs — beats both on head queries and has nothing at all for the tail. The tail query in the prompt is precisely the case where only the dense arm helps, which is why the question is worded the way it is.</p>\n<p><strong>Recall is set here and can never be recovered.</strong> Everything downstream only reorders. So retrieval gets measured on recall, ranking on order, and confusing the two produces months of wasted experiments.</p>\n<p><strong>L1 exists to protect L2&#x27;s budget.</strong> A cheap model over 1000 candidates lets the expensive model see 150. Without it you either score 1000 with something cheap, or blow the budget.</p>\n<h3>The latency budget, and three ways to spend it</h3>\n<p>I am assuming 100 ms is end-to-end server-side p99, which is the harder reading. Fan-out costs are real and candidates routinely forget them: serialisation, merge, and network between services will eat 15–25 ms before any model runs.</p>\n<p><strong>Option A — all-CPU, no cross-encoder.</strong></p>\n<pre class=\"fig\"><code>  QU        |========|                       8\n  retrieval |=========================|      25   (3 arms in parallel)\n  fusion    |==|                             2\n  L1        |========|                       8\n  L2 (GBDT) |======================|         22\n  policy    |=====|                          5\n  overhead  |==================|            18   fan-out, merge, serde\n            +------------------------------------+\n            0        25        50        75   100 ms\n                                        ^ 78</code></pre>\n<p class=\"figcap\">Figure 2. Budget A. Safe, ships on commodity hardware, ~78 ms p99.</p>\n<p>Twenty-two milliseconds of headroom. This is what I would ship first.</p>\n<p><strong>Option B — add a cross-encoder reranker over the top 50.</strong> A 6-layer MiniLM-class cross-encoder at 128 tokens, batch 50, runs in roughly 10–15 ms on a T4-class GPU. That is ~93 ms p99 and it is affordable on paper. The reason I would not do this first is that the p99 is now hostage to GPU queueing: under load, batch formation and admission control dominate, and the tail of a GPU service is much worse behaved than its median.</p>\n<p><strong>Option C — adaptive depth, which is the answer I would actually defend.</strong> Spend the expensive stage only where it pays. Head queries are already well served by the behavioural arm and a GBDT; tail queries are where the cross-encoder earns its cost. So route on the query-understanding confidence and the query-frequency bucket: head and torso take path A, tail takes path B.</p>\n<p>This is not just a cost argument. <strong>Caching the head does not help your p99</strong> — p99 <em>is</em> the tail — so the common instinct to solve a latency problem with a query cache improves the median and leaves the SLO exactly where it was. To move p99 you have to make the slow path faster or the expensive path rarer. Adaptive depth does the second, and it puts the extra compute on the queries the question is about.</p>\n<p>One policy to state without being asked: <strong>never degrade by silently dropping a retrieval arm on timeout.</strong> That converts a latency problem into an invisible quality problem that shows up weeks later as an unattributable relevance regression. Degrade by reducing depth — lower <code>ef_search</code>, fewer L2 candidates — and emit a metric every time you do, so the degradation is measurable.</p>\n<h2>Query understanding on the tail</h2>\n<p>Take the query in the prompt apart on the board, because it demonstrates the problem better than any description of it.</p>\n<pre class=\"fig wide\"><code>  durable        -&gt; quality attribute, soft, no catalogue field\n  lightweight    -&gt; physical attribute, sometimes in specs, often only in text\n  winter         -&gt; season / use-case, maps to insulation, waterproofing\n  boots          -&gt; HEAD NOUN -&gt; category, the one hard constraint\n  for toddlers   -&gt; audience -&gt; age range 1-3 -&gt; size band, a real filter\n\n  hard constraints  : category = boots, audience = toddler\n  soft preferences  : durable, lightweight, winter-appropriate\n  BM25 sees         : 6 tokens, all of which appear in thousands of listings\n                      and none of which co-occur in many</code></pre>\n<p class=\"figcap\">Figure 3. &quot;durable lightweight winter boots for toddlers&quot;</p>\n<p>Now the point: <strong>BM25 will return either nothing or garbage here.</strong> Require all six terms and you get near-zero results because no title contains them all. Relax to OR-with-coordination and the scoring is dominated by whichever term is rarest — probably &quot;toddlers&quot; — so you retrieve toddler clothing rather than boots. This is the classic tail failure, and it is why the dense arm is not optional.</p>\n<p>What I would build:</p>\n<p><strong>Head-noun and category prediction, with a confidence gate.</strong> Getting <code>category = boots</code> right is worth more than everything else in query understanding combined. Predict it, and apply it as a retrieval filter <em>only</em> above a high confidence threshold, with a fallback pass that re-runs unfiltered if the filtered pass returns too few. Below threshold it goes in as a ranking feature. The asymmetry matters: a wrong filter deletes results with no recovery, a wrong feature just gets outvoted.</p>\n<p><strong>Attribute extraction as sequence labelling</strong>, trained on catalogue structured data rather than hand annotation. You already know each product&#x27;s category, audience, colour, size. Reverse that into weak labels over the query side by mining queries that led to purchases of products with a given attribute. Six months of logs is exactly what this needs.</p>\n<p><strong>Precompute the head, model the tail.</strong> The top few thousand queries carry a large share of sessions. Precompute their entire understanding offline, review them, and serve from a lookup. That gives you editorial control where the traffic is, costs nothing at serving time, and leaves the live model path for the tail — which is also where you can afford more latency under Option C.</p>\n<p><strong>Where an LLM belongs here.</strong> Offline, generating attribute annotations and query rewrites for the tail, distilled into a small model or baked into a table. Not in the 8 ms online path. Say this unprompted; it is a question she will otherwise ask.</p>\n<h2>Retrieval: the twenty-five minutes that decide the round</h2>\n<h3>The architecture, and the asymmetry that defines it</h3>\n<pre class=\"fig\"><code>    QUERY TOWER (online, ~5 ms)      ITEM TOWER (offline, nightly batch)\n   +------------------------+       +-----------------------------+\n   | &quot;durable lightweight   |       | title + brand + category    |\n   |  winter boots for      |       | + attributes + bullets      |\n   |  toddlers&quot;             |       | + (optionally) image        |\n   +-----------+------------+       +--------------+--------------+\n               |                                   |\n   +-----------v------------+       +--------------v--------------+\n   | SMALL encoder          |       | LARGE encoder               |\n   | 4-6 layers, distilled, |       | 12+ layers. No online       |\n   | must fit the budget    |       | latency constraint at all.  |\n   +-----------+------------+       +--------------+--------------+\n               |                                   |\n          f(q) in R^256                       g(d) in R^256\n               |                                   |\n               +-------------+     +---------------+\n                             |     |\n                    s(q,d) = &lt;f(q), g(d)&gt;\n                             |\n              train: contrastive over sampled negatives\n              serve: ANN over 10M precomputed g(d)</code></pre>\n<p class=\"figcap\">Figure 4. Two-tower retriever. The towers are deliberately not the same size.</p>\n<p>State the asymmetry explicitly, because most candidates draw two identical boxes. <strong>The item tower runs offline over 10M products once a night; the query tower runs inside your latency budget on every request.</strong> So you can afford a large item encoder and you cannot afford a large query encoder. That is free capacity most people leave on the table — and it is the reason two-tower beats a single shared encoder in production even though sharing weights looks tidier.</p>\n<p>The other consequence of the architecture: query and item never interact before the dot product. That is what makes ANN possible, and it is also the ceiling on quality. No amount of training makes a two-tower model reason about the interaction between &quot;lightweight&quot; and a particular boot&#x27;s spec sheet the way a cross-encoder can. So the two-tower&#x27;s job is recall, and you accept that.</p>\n<h3>Where the positives come from</h3>\n<p>Six months of logs, and the choice of positive is a modelling decision, not a data-loading detail.</p>\n<p>The graded options, weakest to strongest signal: impression, click, add to cart, purchase, purchase-without-return. The naive choice is clicks, because there are ~1.2B of them. The problem is that a click in commerce is heavily driven by the thumbnail and the price, so a click-trained retriever learns attractiveness as much as relevance.</p>\n<p>What I would do: <strong>train on clicks for coverage and weight by the downstream action.</strong> A purchased item gets a much larger weight than a clicked one, a returned purchase gets weight zero or negative. This keeps the volume that a retriever needs while bending the objective toward genuine satisfaction. If she pushes on why not train on purchases only: ~60M purchase events across 10M products is far too sparse for the tail, and the tail is the question.</p>\n<p>Two corrections I would apply to the positives:</p>\n<p><strong>Position debiasing on the positive side.</strong> A click at rank 1 is much weaker evidence than a click at rank 20, because rank 1 gets examined regardless. Down-weight positives by examination propensity, or at minimum sample positives from deeper ranks at a higher rate.</p>\n<p><strong>Session-level positives for tail queries.</strong> For a tail query with a handful of events, the click is noisy. But if the user reformulated and then purchased, attribute that purchase back to the original query. This is the single cheapest way to get usable tail training data out of six months of logs, and it directly addresses the question being asked.</p>\n<h3>The objective</h3>\n<p>Retrieval is trained as a classification problem over the corpus: given the query, pick the right item out of everything. The full softmax over 10M items is intractable, so you sample.</p>\n<pre class=\"fig\"><code>                       exp( s(q, d+) / T )\n  L  =  - log  -----------------------------------------\n                sum over  d in {d+} U N  of  exp( s(q,d) / T )\n\n  where  s(q,d) = &lt;f(q), g(d)&gt;     T = temperature\n         N      = the sampled negatives for this query</code></pre>\n<p class=\"figcap\">Figure 5. Sampled softmax / InfoNCE, for one query q with positive d+.</p>\n<p>Say what this is doing: it is a cross-entropy over a sampled candidate set, pushing the positive up and everything else down, with the temperature setting how sharply. Three things follow.</p>\n<p><strong>This is the right loss and triplet loss is not.</strong> A triplet loss with a margin looks at one negative at a time and gives you a gradient that says &quot;be further from this one thing.&quot; The softmax normalises over many negatives at once, so the gradient is informed by the whole candidate set, and it directly optimises the ranking you actually serve. Triplet also needs careful margin tuning and semi-hard mining to avoid collapsing. If she asks about BPR, it is the pairwise recsys cousin of triplet and has the same limitation.</p>\n<p><strong>The number of negatives is the difficulty knob.</strong> More negatives means a harder classification task and a better-conditioned gradient, which is why these models train at batch sizes in the thousands with cross-device negative sharing.</p>\n<p><strong>Temperature matters more than people expect.</strong> With L2-normalised embeddings the score lives in [-1, 1], so without a small temperature the softmax is nearly uniform and there is almost no gradient. Typical values are 0.01–0.05. Push it too low and the gradient concentrates entirely on the single hardest negative, which is unstable and can collapse the representation. It can be learned — CLIP learns log-temperature with a clamp — and I would start at 0.05, tune it, and watch the positive-score distribution rather than only the loss.</p>\n<h3>Negatives: where this model is actually won or lost</h3>\n<p>This is the sub-topic to be deepest on. It is named in the scorecard and it is where a candidate with real experience separates from one who has read papers.</p>\n<h4>In-batch negatives, and the bias they introduce</h4>\n<p>In a batch of N pairs, use the other N-1 items as negatives for each query. Free — no extra forward passes, since you already encoded them.</p>\n<p>The catch: <strong>your batch is not a uniform sample of the corpus.</strong> It is sampled from the click stream, so an item appears as a negative in proportion to how often it is clicked. Popular items are therefore pushed down constantly, and the model learns to under-score exactly the items that convert best. In commerce that is precisely backwards.</p>\n<p>The fix is the <strong>logQ correction</strong>, also called sampling-bias correction:</p>\n<pre class=\"fig\"><code>every logit before the softmax.\n\n    corrected logit:   s&#x27;(q,d) = s(q,d) - log p(d)\n\n    p(d) = probability that item d is drawn as a sampled negative\n         ~ its frequency in the training stream\n\n    estimate p(d) online with a streaming counter: track the average\n    gap (in steps) between consecutive occurrences of d, p(d) ~ 1/gap</code></pre>\n<p class=\"figcap\">Figure 6. logQ correction. Subtract the log sampling probability from</p>\n<p>The intuition to say out loud: an item that shows up as a negative ten times as often should be penalised a tenth as hard each time. Without it, the retriever has a systematic anti-popularity bias. This is the correction from the YouTube two-tower work, and naming it is worth doing.</p>\n<h4>The negatives that are never sampled at all</h4>\n<p>Here is the part most candidates miss, and it matters enormously at 10M products. <strong>In-batch negatives can only ever be items that appear as a positive somewhere in the batch</strong> — that is, items with engagement. In a 10M-product catalogue with a long tail, a large fraction of items have essentially zero clicks in six months. Those items are never negatives for anyone. The model has therefore never been trained to push them down, their embeddings sit wherever initialisation and the item-text encoder put them, and they can surface spuriously in ANN results for unrelated queries.</p>\n<p>The fix is <strong>mixed negative sampling</strong>: in-batch negatives plus a set of negatives drawn uniformly from the full item index. The uniform ones are easy and contribute little gradient individually, but they are the only thing covering the zero-engagement tail, and they are cheap.</p>\n<h4>Hard negatives</h4>\n<p>Random and in-batch negatives are mostly trivially wrong — a laptop for a boots query. The model saturates on them quickly and stops learning the distinctions that matter. Hard negatives are items that look right and are not: toddler <em>shoes</em> for a toddler <em>boots</em> query; adult winter boots; boots that are neither lightweight nor durable.</p>\n<p>Two sources, in order of sophistication:</p>\n<ul>\n<li><strong>BM25 top-k, not clicked.</strong> Cheap, no model needed, and a good first pass.</li>\n<li><strong>The model&#x27;s own ANN top-k, refreshed periodically</strong> — this is ANCE. As the model improves, yesterday&#x27;s hard negatives stop being hard, so you re-mine from the current index every epoch or two. Static hard negatives go stale and you silently stop learning from them.</li>\n</ul>\n<p>A typical recipe: one positive, a handful of mined hard negatives, the whole batch as in-batch negatives, plus uniform negatives. The ratio is worth tuning; all-hard is a known failure mode.</p>\n<h4>False negatives, and why they are worse than no negatives</h4>\n<p>A mined &quot;hard negative&quot; is often just an unclicked relevant item — the user bought one pair of boots, not all five good ones. Training on it teaches the model that a correct answer is wrong, which is actively destructive rather than merely unhelpful.</p>\n<p><strong>Denoise with a cross-encoder.</strong> Score every mined negative with a cross-encoder teacher and drop any that scores above the positive, or above a threshold. This is the RocketQA recipe and it is usually worth more than any architecture change you could make instead. If she asks what to do without a cross-encoder: drop mined negatives that were clicked by anyone for a similar query, and drop those whose category matches the query&#x27;s predicted category exactly.</p>\n<h3>Distillation: the highest-leverage step people skip</h3>\n<p>Train a cross-encoder on the same data. It is far more accurate because query and item interact. Then use it as a teacher: score a large set of query-item pairs and train the bi-encoder to match the teacher&#x27;s <em>score distribution</em> rather than the binary click label — KL on the softmax over the candidate set, or a margin-MSE on score differences.</p>\n<p>Why this is worth saying: the binary label carries one bit. The teacher&#x27;s scores carry the full ordering, including how much better the positive is than each negative. That ordering information is exactly what a retriever needs and what clicks cannot provide. In my experience this buys more than doubling the embedding dimension or adding layers.</p>\n<p>And it closes the loop nicely: you need the cross-encoder anyway for false-negative filtering and for Option C&#x27;s reranker, so you get three uses out of training it once.</p>\n<h3>Embedding geometry</h3>\n<p>Three decisions, each with a specific consequence.</p>\n<p><strong>Normalise or not.</strong> L2-normalise both towers and use cosine, and every item lives on the unit sphere so magnitude cannot encode popularity. That is what you want for a relevance retriever; popularity belongs in the ranker where it can be traded off explicitly. Leaving embeddings unnormalised lets magnitude carry a quality prior, which helps in pure recsys retrieval and hurts here.</p>\n<p><strong>Whatever you choose, serve it the same way.</strong> Training with unnormalised dot product and then serving a cosine index silently discards the magnitude the model learned to use. This is a real and common production bug and worth naming as one.</p>\n<p><strong>Dimension.</strong> 256 for 10M items. Storage, ANN memory and query latency are all roughly linear in dimension, and the quality gain past ~256 on a catalogue this size is small. If she pushes: train with Matryoshka representation learning so the first 64 or 128 dimensions are independently usable, then you can serve a cheap 64-d first pass and rescore with the full 256 without training twice.</p>\n<h3>Putting the training loop together</h3>\n<pre class=\"fig\"><code>  6 months of logs\n        |\n        v\n  +-----------------+   queries with clicks / ATC / purchases,\n  | build pairs     |   weighted by action, position-debiased,\n  +--------+--------+   session-attributed for tail queries\n           |\n           v\n  +-----------------+   BM25 top-k not clicked  +  ANN top-k from the\n  | mine negatives  |   CURRENT model (refresh every 1-2 epochs)\n  +--------+--------+\n           |\n           v\n  +-----------------+   cross-encoder scores every mined negative;\n  | denoise         |   drop any scoring above the positive\n  +--------+--------+\n           |\n           v\n  +-----------------+   in-batch (logQ corrected)\n  | assemble batch  |   + mined hard  + uniform from full index\n  +--------+--------+\n           |\n           v\n  +-----------------+   InfoNCE, T ~ 0.05, large batch,\n  | train two-tower |   cross-device negative sharing\n  +--------+--------+   + KL distillation from the cross-encoder\n           |\n           v\n  +-----------------+   item tower over 10M products, nightly\n  | embed corpus    |   incremental for new/changed items\n  +--------+--------+\n           |\n           v\n  +-----------------+   HNSW, int8, rebuilt nightly, hot-swapped\n  | build ANN index |\n  +-----------------+</code></pre>\n<p class=\"figcap\">Figure 7. The retrieval training pipeline.</p>\n<p>Two operational points that signal you have run one of these.</p>\n<p><strong>The index and the model must be versioned together.</strong> A query embedded by model v2 against an index built by model v1 produces silent garbage — not an error, just bad results. Pin the model version into the index metadata and refuse to serve a mismatch.</p>\n<p><strong>Refresh cadence is a product decision.</strong> Nightly full rebuild plus an incremental path for new listings, because in commerce a product that cannot be found for 24 hours after listing is a seller-facing problem. For 10M items a full item-tower pass is a few GPU-hours, so nightly is comfortable.</p>\n<h3>Evaluating the retriever without fooling yourself</h3>\n<p>Recall@K against held-out clicked or purchased items, where K is the candidate count the ranker actually receives — Recall@1000, not Recall@10. Measuring retrieval at 10 is measuring the ranker.</p>\n<p><strong>Now the trap, and I would raise it before she does.</strong> Your held-out positives are items the <em>current</em> system retrieved and displayed. A new retriever that surfaces a better item the old system never showed gets no credit for it, and can score <em>worse</em> than the incumbent while being better. Offline recall against logged positives is systematically biased toward the system that generated the logs.</p>\n<p>Four things I would do about it:</p>\n<ul>\n<li><strong>Pooled judgement.</strong> Take the union of top-K from the incumbent and the candidate, judge the pool with humans or an LLM judge calibrated against humans, and evaluate both systems against the pooled set. This is the TREC method and it exists precisely for this problem.</li>\n<li><strong>Measure the new-item rate.</strong> What fraction of the candidate&#x27;s top-100 the incumbent never retrieved? Send exactly those to judgement — it is the cheapest possible labelling budget and it answers the question directly.</li>\n<li><strong>Segment by query frequency.</strong> Aggregate recall is dominated by head traffic. Report head / torso / tail separately and make tail recall the headline number, because that is what the prompt asks for.</li>\n<li><strong>Let interleaving be the arbiter.</strong> Offline recall chooses what to test; online interleaving decides. And interleaving is enormously more sensitive than an A/B for a retrieval change, so this is cheap.</li>\n</ul>\n<p>Also track <strong>zero-result rate and low-result rate on tail queries</strong> as a direct product metric. For the query in the prompt, that is the outcome that matters.</p>\n<h3>The ANN index</h3>\n<p>For 10M x 256 the answer is HNSW and I would say so quickly — this is not the interesting part of the question and spending time here is a mistake.</p>\n<p><code>M = 32</code>, <code>efConstruction = 200</code>, <code>efSearch</code> tuned to hit a recall target against exact search. Int8 scalar quantisation of the vectors: 2.6 GB of vectors plus roughly 2.6 GB of graph, so about 5 GB, which fits in RAM on one machine with room for replicas. <strong>No PQ.</strong> IVF-PQ trades recall for memory you do not need at this size; reach for it at a billion vectors, not ten million.</p>\n<p>The one genuinely interesting ANN issue here is <strong>filtered search</strong>. Search has hard filters — in stock, ships to this address, category. HNSW degrades badly under low selectivity because the graph is built over everything and the traversal wastes its budget on nodes the filter will discard. Post-filtering at 2% selectivity means you need ~500 raw candidates to yield 10. Use in-traversal filtering, and below some selectivity threshold fall back to brute force over the filtered subset, because a few hundred thousand exact dot products is faster than approximate search over ten million. Measure where your crossover is.</p>\n<h3>Fusion</h3>\n<p>Three ranked lists, incomparable score scales. A weighted sum of BM25 and cosine fails because BM25 is unbounded and query-dependent while cosine is in [-1, 1], so the effective weight varies per query in a way you did not choose.</p>\n<p>Start with <strong>reciprocal rank fusion</strong> — sum of 1/(k + rank) across arms, k ~ 60. Rank-based, so scale-free, and it is a strong baseline that needs no tuning.</p>\n<p>Then replace it with the L1 ranker, which takes each arm&#x27;s rank and score as features along with query-understanding signals, and learns the fusion. That is strictly better than RRF because the right blend is query-dependent — identifier queries want the lexical arm, tail paraphrase queries want the dense arm — and a model can condition on that where a fixed constant cannot.</p>\n<h2>Ranking: &quot;optimise CVR&quot; is a trap, and saying so is the point</h2>\n<p>Do not accept the objective as stated. A ranker trained to maximise conversion probability and nothing else has three specific pathologies, and naming them is worth more than any architecture you could propose.</p>\n<p><strong>It ranks by cheapness.</strong> Conversion probability is highest for low-commitment purchases. Sort by pCVR and a twelve-dollar pair of toddler socks outranks the hundred-dollar boots the customer actually came for. Conversions go up, GMV goes down, and the customer did not get what they searched for.</p>\n<p><strong>It is blind to relevance when nothing converts.</strong> For a genuinely rare query, every candidate has a near-zero and near-identical pCVR, so the ordering is driven by noise in a model that has no signal. That is exactly the tail query in the prompt.</p>\n<p><strong>It compounds.</strong> Tomorrow&#x27;s training data is today&#x27;s exposure. A ranker that concentrates on safe converting items sees only those items converting, and the loop tightens.</p>\n<p>So I would rank on <strong>expected value with a relevance gate</strong>:</p>\n<pre class=\"fig\"><code>\n  score(q, d) =  pCTR(q,d) * pCVR(q,d) * value(d) * g(pRel(q,d))\n                 - lambda * pReturn(q,d) * value(d)\n\n  value(d)   = margin, or price, or contribution -- a business input,\n               not a model output. Ask which one they optimise.\n  g(pRel)    = a relevance gate: hard-drop below a threshold, then a\n               mild monotone boost. Prevents the cheap-and-irrelevant\n               failure without letting relevance dominate.\n  pReturn    = returns are negative revenue AND negative trust; a CVR\n               objective that ignores them optimises for regret.</code></pre>\n<p class=\"figcap\">Figure 8. The objective I would actually defend.</p>\n<p>Say the framing plainly: <strong>CVR is the metric, expected value is the objective.</strong> Then offer the fallback if she pushes back and wants CVR literally: keep pure pCVR ordering but make the relevance gate a hard constraint and add GMV per session as a guardrail that cannot regress. That is a reasonable position and it shows you can take direction without abandoning judgement.</p>\n<h3>The CVR model has a data problem before it has a model problem</h3>\n<h4>Sample selection bias, and ESMM</h4>\n<p>Conversion is only observed after a click, so the natural CVR training set is clicked impressions. But at serving time you score every candidate, including ones that would never be clicked. Train on a selected subset, serve on the full distribution — and the gap is exactly what your ranker is trying to change.</p>\n<p>On top of that, clicked impressions are perhaps 1–5% of all impressions, so the CVR training set is one to two orders of magnitude smaller than the CTR one, precisely where you need precision.</p>\n<p>ESMM removes both problems by never training CVR directly:</p>\n<pre class=\"fig\"><code>\n            IMPRESSION SPACE  (every impression is labelled)\n                            |\n         +------------------+-------------------+\n         |                                      |\n    +----v------+                       +-------v--------+\n    |   pCTR    |                       |     pCTCVR     |\n    |   tower   |                       |  = pCTR x pCVR |\n    | loss: BCE |                       |   loss: BCE    |\n    +----+------+                       +-------+--------+\n         |          shared embeddings           |\n         +------------------+-------------------+\n                            |\n                     +------v-------+\n                     |    pCVR      |  &lt;- no direct loss.\n                     |    tower     |     Supervised only through\n                     +--------------+     the product above.</code></pre>\n<p class=\"figcap\">Figure 9. ESMM. The CVR tower has no loss of its own.</p>\n<p>Both supervised tasks are defined over all impressions, so the bias is gone, and the CVR tower inherits representations from the CTR task which has vastly more data. The caveat to volunteer: the product is numerically touchy when pCTR is small, and a miscalibrated CTR tower propagates straight into CVR.</p>\n<h4>Delayed feedback</h4>\n<p>A conversion can land hours or days after the click. So at training time a &quot;negative&quot; might just be a conversion that has not happened yet, and your label is a function of how long you waited.</p>\n<p>Three things I would do. Pick an attribution window from the actual conversion delay distribution — measure it, do not guess; in most commerce categories the bulk lands within 24 hours but considered purchases have a long tail. Treat recent unconverted clicks as censored rather than negative, and either exclude the most recent window from training or use a delayed-feedback model that jointly models conversion and delay. And retrain often enough that the censoring window is a small fraction of your training period.</p>\n<p>The failure if you ignore it: your model systematically under-predicts CVR on exactly the most recent data, which is the data most representative of now.</p>\n<h4>Position bias</h4>\n<p>Your labels come from a ranked list, so a click at rank 1 and a click at rank 20 are not equivalent evidence. Estimate propensities — ideally by harvesting the position variation you already have across A/B tests rather than by randomising live traffic — and train with inverse-propensity weighting.</p>\n<p>On mobile this matters more than on web, for reasons in the next section.</p>\n<h4>Calibration</h4>\n<p>If you multiply pCVR by price, pCVR must be a probability, not a score. A model that ranks perfectly but is systematically 3x over-confident produces a completely wrong expected-value ordering as soon as prices vary.</p>\n<p>So: reliability diagrams on held-out data, ECE as a tracked metric, and a post-hoc calibration map — Platt or isotonic on a held-out set — refit on a schedule. Report calibration per price decile and per category, because aggregate calibration hides the segments where it is broken.</p>\n<h3>The ranking model</h3>\n<pre class=\"fig\"><code>   features: query x item x user x context   (~200 for commerce)\n                          |\n                +---------v----------+\n                |  shared bottom     |   escalate to MMoE / PLE only\n                |  (or MMoE / PLE)   |   when you MEASURE negative\n                +---------+----------+   transfer against single-task\n                          |\n        +---------+-------+-------+---------+\n        |         |               |         |\n    +---v---+ +---v---+       +---v---+ +---v----+\n    | pCTR  | | pCVR  |       | pRel  | | pReturn|\n    +---+---+ +---+---+       +---+---+ +---+----+\n        |         |               |         |\n        +---------+-------+-------+---------+\n                          |\n                    expected value (Figure 8)</code></pre>\n<p class=\"figcap\">Figure 10. Multi-task L2 ranker.</p>\n<p><strong>Which model.</strong> For an L2 with ~200 engineered tabular features, LambdaMART on LightGBM is the strong default: minutes to train on CPU, scale-invariant, monotonic constraints available when you need to guarantee that a higher-rated product never ranks lower for that reason, and legible feature importance when a PM asks why something ranked where it did. Neural wins when the signal is in raw high-cardinality IDs and user history sequences. The honest production answer is both: a neural model produces user-history and query-item embeddings offline, and those become features in the GBDT.</p>\n<p>Multi-task is the one place I would go neural first, because a GBDT does not do multi-task cleanly and ESMM needs shared representations.</p>\n<p><strong>Features, in four groups.</strong> Query-item match: BM25 per field, dense cosine, the arm ranks, category agreement, attribute overlap. Item: price percentile within category, rating, review count, seller quality, delivery speed, stock, image count. Query: frequency bucket, predicted category, length, intent. User and context: history embedding, price sensitivity, device, surface, time.</p>\n<p><strong>The freshness trap.</strong> The behavioural features — historical CTR and CVR for a query-item pair — will dominate feature importance and are near-empty on tail queries. Train with explicit missingness rather than imputing zero, so the model can learn a distinct regime instead of reading &quot;no data&quot; as &quot;bad.&quot; Then bucket your eval by query frequency and check the tail decile specifically, because aggregate NDCG will look fine while the tail falls off a cliff.</p>\n<h2>The metrics, in full</h2>\n<p>She asked about CVR; have the whole board ready, and know which one you would actually ship on.</p>\n<div class=\"tw\"><table><thead><tr><th>Group</th><th>Metric</th><th>What it is for, and what it hides</th></tr></thead><tbody><tr><td><strong>Engagement</strong></td><td>CTR</td><td>Fast, high-volume, the workhorse. Rewards clickbait thumbnails.</td></tr><tr><td></td><td>Click position / MRR of first click</td><td>Are good results near the top, not just present</td></tr><tr><td></td><td>Add-to-cart rate</td><td>Much stronger intent than click, still same-session</td></tr><tr><td></td><td>Dwell time / long click</td><td>Proxy for satisfaction; needs a threshold you must justify</td></tr><tr><td><strong>Conversion</strong></td><td>CVR per click</td><td>The stated objective. Denominator is clicks, so it is blind to whether anyone clicked.</td></tr><tr><td></td><td>CVR per search session</td><td>The one I would actually ship on. Captures retrieval failure, which per-click CVR cannot see.</td></tr><tr><td></td><td>CTCVR</td><td>Conversion per impression. The ESMM target, and the honest end-to-end rate.</td></tr><tr><td><strong>Money</strong></td><td>GMV per session</td><td>The guardrail that catches the cheap-item pathology</td></tr><tr><td></td><td>Revenue / margin per search</td><td>If they have margin data, the real objective</td></tr><tr><td></td><td>Average order value</td><td>Moves opposite to CVR under a pure-CVR ranker; that divergence is the tell</td></tr><tr><td><strong>Relevance</strong></td><td>NDCG@k</td><td>Graded, position-discounted, the offline standard. Needs judgements.</td></tr><tr><td></td><td>Recall@1000</td><td>The retrieval metric. Measure at the ranker&#x27;s candidate count.</td></tr><tr><td></td><td>Precision@k, MAP, MRR</td><td>Binary-judgement cousins; MRR when one right answer exists</td></tr><tr><td><strong>Search health</strong></td><td>Zero-result rate</td><td>The direct tail metric. For this question, a headline number.</td></tr><tr><td></td><td>Reformulation rate</td><td>The user telling you the results were wrong</td></tr><tr><td></td><td>Query abandonment</td><td>Search with no click at all</td></tr><tr><td></td><td>Clicks below the fold</td><td>Did they have to hunt</td></tr><tr><td><strong>Long-term</strong></td><td>Return / cancellation rate</td><td>A CVR win that raises returns is a loss</td></tr><tr><td></td><td>Repeat purchase, next-session return</td><td>The only real measure of satisfaction</td></tr><tr><td></td><td>Catalogue coverage, exposure Gini</td><td>Marketplace supply health; a concentrating ranker kills sellers</td></tr><tr><td><strong>System</strong></td><td>p50 / p99 latency</td><td>Latency is a quality metric — measure CVR against it</td></tr><tr><td></td><td>ECE, calibration ratio</td><td>Required if you multiply probabilities by price</td></tr></tbody></table></div>\n<p>The sentence to say: <strong>I would ship on CVR per search session with GMV per session and return rate as guardrails, and report tail zero-result rate separately because it is the thing this system is being built to fix.</strong></p>\n<h2>Mobile versus web</h2>\n<p>She specified a mobile app search bar. Being able to say precisely how the web version differs is cheap signal that you have built both.</p>\n<pre class=\"fig\"><code>\n   MOBILE APP                        WEB\n   +----------------+                +--------------------------------+\n   | [search bar ]  |                | [ search bar              ]    |\n   +----------------+                +--------------------------------+\n   | +----+ +----+  |  above         | +---+ +---+ +---+ +---+ +---+  |\n   | | 1  | | 2  |  |  the           | | 1 | | 2 | | 3 | | 4 | | 5 |  |\n   | +----+ +----+  |  fold          | +---+ +---+ +---+ +---+ +---+  |\n   | +----+ +----+  |                | +---+ +---+ +---+ +---+ +---+  |\n   | | 3  | | 4  |  |                | | 6 | | 7 | | 8 | | 9 | |10 |  |\n   | +----+ +----+  |                | +---+ +---+ +---+ +---+ +---+  |\n   +- - - - - - - - +  fold          | +---+ +---+ +---+ +---+ +---+  |\n   | | 5  | | 6  |  |                | |11 | |12 | |13 | |14 | |15 |  |\n   |   infinite     |                | +---+ +---+ +---+ +---+ +---+  |\n   |   scroll       |                |        1  2  3  4  next        |\n   +----------------+                +--------------------------------+\n\n   4 items above the fold            15-20 items above the fold\n   steep position-bias curve         flatter curve, real comparison\n   short, typo-prone queries         longer, more precise queries\n   typeahead is load-bearing         typeahead is a convenience\n   variable cellular latency         stable latency</code></pre>\n<p class=\"figcap\">Figure 11. The same query, two surfaces.</p>\n<p><strong>Position bias is far steeper on mobile</strong>, because four items are visible instead of twenty. Practically: you must estimate propensities <em>per surface</em> — one shared propensity curve is simply wrong — and the value of getting rank 1 right is much higher on mobile. If you only fix one thing about your training labels, fix this.</p>\n<p><strong>Precision beats recall on mobile, and the reverse on web.</strong> With four slots there is no room for a hedge; showing one wrong item costs a quarter of the visible page. On web, a broader candidate set lets the user do the comparison themselves, so slightly lower precision with better coverage is often the better trade. Concretely, I would run a tighter relevance gate and more aggressive deduplication on mobile.</p>\n<p><strong>Queries are shorter and dirtier on mobile.</strong> Thumb typing means more typos, more abbreviations, and heavier reliance on typeahead and voice. So spell correction and query completion carry more weight on mobile — and the suggestion ranker becomes a first-class model rather than an afterthought, because a good suggestion converts an ambiguous tail query into a head query before retrieval ever runs. That is the cheapest fix for the problem in the prompt and I would say so.</p>\n<p><strong>Diversity matters more on mobile.</strong> Four near-identical listings — which a marketplace produces constantly — is the entire visible page. Deduplication by product identity, not just by listing, is a mobile requirement and a web nicety.</p>\n<p><strong>Latency variance is worse on mobile</strong> because of cellular networks, so the client-side budget is tighter than the server-side one suggests. Prefetching the next scroll page and progressive image loading are part of the design.</p>\n<p><strong>How I would handle it in the model.</strong> Surface as a feature first, not separate models — you keep one training pipeline and the model learns the interaction. Separate models only for the things that are genuinely different objects: propensity curves, definitely; the diversity and dedup policy, probably; the ranker itself, only if a surface-interaction analysis says the shared model is leaving real value behind. And evaluate per surface always, because a shared aggregate metric will hide a mobile regression under a web win.</p>\n<h2>The follow-up tree</h2>\n<p>Everything below is a push she can make. Rehearse the answers out loud; the failure mode in this round is hesitation, not being wrong.</p>\n<h3>On retrieval training — expect the most pressure here</h3>\n<p><strong>&quot;Why not just use a cross-encoder for retrieval?&quot;</strong> Cost. A cross-encoder is about a millisecond per pair, and 10M pairs per query is three hours. The two-tower exists so the item side can be precomputed and the query side reduced to one dot product against an index. You pay for it in expressiveness — the towers never interact — which is why the cross-encoder comes back as a reranker over 50 candidates.</p>\n<p><strong>&quot;Should the two towers share weights?&quot;</strong> No, for two reasons. Query text and product text are different distributions — three words of intent versus a hundred words of catalogue copy — and a shared encoder has to compromise. And sharing throws away the asymmetry: the item tower can be large because it is offline, the query tower must be small because it is online. Sharing forces both to the smaller budget.</p>\n<p><strong>&quot;How do you handle a brand new product with no interaction history?&quot;</strong> This is where the two-tower earns its keep: the item tower is content-based, so a new listing gets a usable embedding from its title and attributes the moment it is indexed. That is a strong argument against pure ID-embedding retrieval in a catalogue with churn.</p>\n<p><strong>&quot;Would you put an item-ID embedding in the item tower?&quot;</strong> Yes, but with ID dropout during training — randomly mask the ID feature so the model is forced to produce a good embedding from content alone. Then established items get the benefit of their learned ID and cold items degrade gracefully instead of falling off a cliff. Without dropout the model leans entirely on the ID and cold start breaks.</p>\n<p><strong>&quot;What does batch size actually do here?&quot;</strong> It sets the number of in-batch negatives, so it sets the difficulty of the classification task and the quality of the gradient. That is why these models train at thousands and use cross-device negative sharing. Past a point, more random negatives stop helping and mined hard negatives take over.</p>\n<p><strong>&quot;How do you choose the temperature?&quot;</strong> Sweep it, and diagnose on the score distributions rather than the loss — you want clear separation between positive and negative scores without the positive saturating. Start around 0.05 for normalised embeddings. Too low and the gradient collapses onto the single hardest negative; too high and the softmax is flat and there is no signal. It can be learned with a clamp.</p>\n<p><strong>&quot;What is the ratio of hard to random negatives?&quot;</strong> I would start with a handful of mined hard negatives per positive on top of the full batch as in-batch negatives plus uniform corpus negatives, and tune it. All-hard is a known failure mode — it over-fits the miner&#x27;s idea of hard, and it amplifies any false negatives you failed to filter.</p>\n<p><strong>&quot;Your hard negatives are mined from BM25. What happens once the model beats BM25?&quot;</strong> They stop being hard, and you silently stop learning from them. That is why you re-mine from the current model&#x27;s own index every epoch or two — the ANCE loop. Static negatives go stale and the training curve looks fine while the model stops improving.</p>\n<p><strong>&quot;How do you know a mined negative is not actually relevant?&quot;</strong> You do not, which is why you filter. Score every mined negative with the cross-encoder teacher and drop anything scoring above the positive. Training on a false negative is worse than training on no negative — you are explicitly teaching the model that a correct answer is wrong.</p>\n<p><strong>&quot;Why does the logQ correction matter in commerce specifically?&quot;</strong> Because in-batch negatives are sampled from the click stream, so popular items are negatives far more often, and the uncorrected model learns an anti-popularity bias — it under-retrieves exactly the items that convert. The correction subtracts the log sampling probability from every logit so the penalty is per- occurrence rather than cumulative.</p>\n<p><strong>&quot;What about items that never appear in any batch?&quot;</strong> They are never negatives for anyone, so nothing ever pushes them down, and they can surface spuriously. At 10M products with a long tail this is a large fraction of the catalogue. Fix it with mixed negative sampling — uniform draws from the full index alongside the in-batch ones.</p>\n<p><strong>&quot;Recall@1000 improved 6 points and online CTR is flat. What happened?&quot;</strong> Most likely the ranker cannot exploit the new candidates. It was trained on the distribution the <em>old</em> retriever produced, so the newly-surfaced items are out-of-distribution for it and it scores them conservatively. Retrieval and ranking are coupled: after a retrieval change you must retrain the ranker on logs from the new candidate distribution before you can read the result. The other candidates are that the new recall is on items that were never going to convert, or that your offline positives were biased toward the incumbent.</p>\n<p><strong>&quot;How would you prove the dense arm is earning its latency?&quot;</strong> Ablate it in an interleaving test, and separately measure its unique contribution — the fraction of clicked or purchased items that only the dense arm retrieved. If that number is small, the arm is paying for overlap with BM25 and should be cut or retrained.</p>\n<p><strong>&quot;What breaks if you retrain the query tower but not the item index?&quot;</strong> Silent garbage. The two towers define a joint space; a query embedded by v2 against items embedded by v1 is meaningless, and nothing errors. Version the model into the index metadata and refuse to serve a mismatch.</p>\n<h3>On the funnel</h3>\n<p><strong>&quot;Why three retrieval arms and not two?&quot;</strong> Because they fail on disjoint query populations. If the behavioural arm&#x27;s unique contribution is small once you have a good dense arm, drop it — measure, do not assume.</p>\n<p><strong>&quot;What sets the candidate count out of retrieval?&quot;</strong> The ranker&#x27;s latency budget from one side, and the recall curve from the other. Plot recall against candidate count and find where it flattens; take candidates up to that knee, and then check the knee is in the same place for tail queries, which it usually is not.</p>\n<p><strong>&quot;Where does personalisation enter?&quot;</strong> Ranking first, because it is cheap there and easy to measure. Retrieval only once you have shown that ranking-side personalisation has saturated, because a personalised retrieval arm multiplies your index cost and makes caching much harder.</p>\n<h3>On ranking and CVR</h3>\n<p><strong>&quot;Why not just train on purchases?&quot;</strong> Sixty million purchases across ten million products is far too sparse, especially on the tail, which is what the question is about. Train on clicks for volume, weight by the downstream action.</p>\n<p><strong>&quot;How long is your attribution window?&quot;</strong> Measured from the conversion delay distribution rather than chosen. And whatever it is, recent unconverted clicks are censored, not negative — either exclude the most recent window or model the delay.</p>\n<p><strong>&quot;Your pCVR is well-ranked but badly calibrated. Does it matter?&quot;</strong> It does the moment you multiply it by price, which the expected-value objective does. Then a systematic 3x over-confidence produces a completely wrong ordering. Fix with a post-hoc monotone map on he
