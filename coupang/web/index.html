. Use rolling-origin or expanding-window splits, and if labels mature, like a thirty-day churn label, add purging: drop training rows whose label window overlaps validation, plus an embargo gap.\n\nRepeated entities. If one user, patient, merchant or query contributes many rows, random folds put the same entity on both sides and you're crediting the model for memorizing identity. Use GroupKFold, or split on a hash of the entity ID, and StratifiedGroupKFold when classes are imbalanced too. Near-duplicate rows are the same failure with a different key, so deduplicate before splitting.\n\nSmall or imbalanced classification doesn't invalidate random folds, but unstratified folds can end up with zero positives - so stratify.\n\nThe rule underneath all of it: the split must simulate the deployment gap. Write down what production will actually ask - new entity or known one, future period or the same - and build the split to match. That also tells you when grouping is wrong: if you'll only ever score users you've already seen, a user-disjoint split understates production performance and makes you reject a good model.","red_flags":["Recites \"use TimeSeriesSplit for time series\" with no notion of why, or applies grouping reflexively without asking what production scores.","Misses group leakage entirely - the failure that has invalidated published results.","Believes stratification fixes temporal or group problems."],"followups":["Your labels mature over thirty days - exactly how does that change the split?","The model scores both existing and brand-new users. Design the evaluation.","How would you detect group leakage if you didn't know the group key?"],"section":"Evaluation and experimentation","level":"L5","type":"Conceptual","source":"drill deck"},{"id":68,"question":"Precision is 0.95 but recall is 0.30. What do you do?","say":"First question back: is that a problem? For content moderation, where a false positive means wrongly punishing a real user, 0.95 precision at 0.30 recall may be exactly the operating point you chose on purpose. For fraud or medical screening, missing seventy percent of positives is a crisis. So I want the business cost of a false positive against a false negative before I touch anything.\n\nAssuming recall matters, the cheapest move is the threshold — you're probably at 0.5 for no reason at all. Plot the full precision-recall curve and pick the point that minimizes expected cost, not the one that looks balanced. That costs nothing and often gets most of the way.\n\nIf the threshold trade is too steep, the model is the problem, and this specific pattern — high precision, low recall — usually means it only learned the easy, obvious positives. Hard negative mining, focal loss or class weighting, oversampling rare positives, and above all better features for the subtle cases.\n\nStructurally, a cascade often beats a single threshold: keep the high-precision model as stage one for automatic action, add a higher-recall second stage over what it misses, and route the disagreements to human review. You buy recall without paying full precision. And audit the labels. Low recall sometimes means positives were labelled negative in the first place, especially when the label comes from something having been caught. Sample a hundred false negatives by hand — some fraction usually aren't errors at all.","red_flags":["\"Just lower the threshold\" without first asking which error is expensive.","Not entertaining that 0.95/0.30 might be the correct operating point.","Never questioning label quality as a cause of apparent low recall."],"followups":["How do you choose the optimal threshold?","What if stakeholders demand both above 0.90?","How does this change for a real-time system with a latency budget?"],"section":"Evaluation and experimentation","level":"L5","type":"Trade-off","source":"drill deck"},{"id":69,"question":"Your model's AUC is 0.95 but calibration is poor (ECE = 0.15). Why does this matter and how do you fix it?","say":"AUC and calibration measure different things and you can have one without the other. AUC is discrimination — can the model rank positives above negatives — and it's invariant to any monotonic transform of the scores. Calibration asks whether a 0.7 actually means seventy percent. ECE of 0.15 says that, averaged over confidence bins, predicted probability and observed frequency differ by about fifteen points.\n\nWhether that matters depends entirely on how the score gets consumed. If you only rank — search results, a recommendation feed — AUC of 0.95 is fine and calibration is cosmetic. The moment anything multiplies or thresholds the probability, it's broken. Ad auctions multiply predicted CTR by a bid, so miscalibration is systematic mispricing of every impression. A medical risk score at a fixed threshold either over-treats or misses high-risk patients. A cascade that routes to an expensive model when confidence is low will route wrong.\n\nThe fix is post-hoc and cheap, which is the key insight — you don't retrain. Temperature scaling: learn one scalar on a held-out calibration set and divide the logits by it. It's monotonic, so AUC is unchanged by construction, and it nearly always works. That's the default. Platt scaling for more flexibility, isotonic regression if you have plenty of calibration data. To prevent it at the source, label smoothing and mixup both cut the overconfidence that causes it.","numbers":["ECE 0.15 ≈ a 15-percentage-point average gap between confidence and observed accuracy"],"red_flags":["\"AUC is 0.95 so the model is fine\" — conflating discrimination with calibration.","Not knowing what ECE measures or how the bins work.","Proposing a retrain when temperature scaling on a held-out set is a one-parameter fix."],"followups":["How do you calibrate a multi-class model?","Does temperature scaling change the AUC, and why?","How do you validate calibration when the calibration set is small?"],"section":"Evaluation and experimentation","level":"L6","type":"Debugging","source":"drill deck"},{"id":70,"question":"We want to detect a 1% relative lift on a 2% click-through rate. How many users do we need, and how long should we run?","say":"Convert to an absolute effect first, because that's where people lose four orders of magnitude. A 1 percent relative lift on a 2 percent base rate is an absolute delta of 0.0002. Then n is about sixteen times p times one-minus-p, over delta squared, per group — the sixteen is two times 2.8 squared, where 2.8 is 1.96 plus 0.84, so that's 80 percent power at alpha 0.05. Plugging in: sixteen times 0.02 times 0.98 over 4e-8 gives about 7.8 million per arm, so 15.7 million users total. At two million eligible users a day that's roughly eight days, and I'd round up to two full weeks so the test covers whole weekly cycles instead of a weekday-skewed population.\n\nThen the things that separate levels. I'd reframe it as MDE rather than sample size — given the traffic we have, what's the smallest effect we could detect? If that's larger than any plausible effect, don't run the test; decide on other grounds or bundle it into a bigger change. CUPED on the pre-period click rate, with a correlation around 0.7, cuts the required n roughly in half. Only triggered users count, so if the feature fires for 30 percent of traffic the calendar time triples. And CTR is a ratio metric — with user-level randomization, compute variance by the delta method or a bootstrap over users, not over impressions, or your standard error will be far too small.","numbers":["n ≈ 16p(1−p)/δ² per arm at 80% power, α = 0.05","1% relative on a 2% base → δ = 0.0002 → ~7.8M per arm, 15.7M total","CUPED at ρ ≈ 0.7 roughly halves required n"],"red_flags":["Using the relative lift as if it were absolute — understates the requirement by four orders of magnitude","Quoting a sample size with no alpha, power or variance assumption attached","Sizing off total site traffic instead of the triggered population"],"followups":["How does the answer change at 95 percent power?","What if the metric is revenue per user instead?","What do you do when the MDE exceeds any plausible effect?"],"section":"Evaluation and experimentation","level":"L5","type":"Estimation","source":"drill deck"},{"id":71,"question":"Your model's online metrics diverge from offline metrics after 2 weeks in production. What is happening?","say":"The two-week timescale is the clue. An overnight break is a bug; a gradual divergence over two weeks is the system feeding back on itself, or the world moving.\n\nI'd check the feedback loop first, because it's the cause that specifically worsens with time. The model's rankings decide what users see, users click what they're shown, and those clicks become the next training set — position bias compounds into the labels and the model looks better to itself every week, while the offline set, frozen at launch, doesn't move. The tell is offline metrics stable while online engagement flattens. The fix is randomized exploration on a traffic slice, and unbiased learning-to-rank with inverse propensity weighting.\n\nNext, concept drift: the relationship between features and label shifted — trends, seasonality, a competitor launch — so the offline set is simply stale. That's distinct from data drift, where the inputs shifted: new demographics, a product change bringing in users the model never saw. Segmenting performance by cohort separates them. The unglamorous candidate is stale features: batch features fresh at launch are two weeks old if a refresh pipeline degraded quietly, and the model leans on outdated signal a little harder every day.\n\nThe structural fix is to stop trusting a frozen offline set — rolling evaluation windows, and off-policy estimates that account for how the data was collected.","red_flags":["Assuming it's a bug rather than a systemic property of a deployed model.","Never considering feedback loops or position-bias contamination of the labels.","\"Just retrain\" with no root-cause diagnosis."],"followups":["How do you distinguish concept drift from data drift?","How do you build an offline eval that actually predicts online performance?","What is counterfactual evaluation and when would you use it?"],"section":"Evaluation and experimentation","level":"L6","type":"Debugging","source":"drill deck"},{"id":72,"question":"Shadow deployment vs A/B test vs multi-armed bandit—when do you use each?","say":"They sit on a spectrum from zero risk to full optimization, and in practice you use them in sequence rather than picking one.\n\nShadow deployment runs the new model on live traffic without serving its outputs. It answers \"does this break\" — latency, resources, error rates, wild predictions — before any user is exposed. The limitation is fundamental: nobody ever acts on those predictions, so you compare outputs but never outcomes. Shadow mode cannot tell you the model is better.\n\nA/B testing is the gold standard for that. Random assignment, real business metrics, clean causal inference. The price is speed and waste: you commit to a sample size up front, wait a week or two so day-of-week effects average out, and half your traffic sits on the worse variant the entire time.\n\nBandits — Thompson sampling or UCB — shift traffic toward whatever is winning as evidence accumulates. Use them with many variants, say ten ranking strategies, and when cumulative regret matters more than a clean p-value. The cost is that adaptive allocation makes significance testing awkward and isolating any individual change much harder. So: shadow to prove nothing breaks, A/B to prove it helps, bandits afterwards for ongoing optimization across many variants. For ranking I'd slot interleaving in before the A/B — far more sensitive per unit of traffic.","red_flags":["Treating bandits as strictly better than A/B tests.","Not knowing that shadow mode produces no user-facing outcome data at all.","Going straight to A/B for a risky change, skipping shadow."],"followups":["When would you use interleaving instead?","How do you handle explore-exploit in a bandit with non-stationary traffic?","What is a switchback experiment and when do you need one?"],"section":"Evaluation and experimentation","level":"L5","type":"Trade-off","source":"drill deck"},{"id":73,"question":"You want to target-encode a 50K-cardinality `merchant_id`. Give me the exact construction, and tell me where it leaks if you get it wrong.","say":"Start from the leak, because it motivates the construction. The naive version replaces each merchant with the mean target over its training rows — including the row you're encoding. For a merchant with one transaction, the encoded value is that row's label. Trees find it instantly, training metrics look superb, and it collapses in validation.\n\nTwo ingredients fix it. Shrinkage: encode with the empirical-Bayes posterior mean — n times the merchant's own rate plus m times the global rate, over n plus m — so a merchant with three thousand transactions is trusted and one with two is pulled to the global rate. And out-of-fold: split training into K inner folds, encoding each fold's rows from statistics on the others, so no row's own label reaches its own feature.\n\nThen the rules that make it survive a real pipeline. The encoder you ship is fit on the whole training set and applied to validation, test and serving — those rows contributed no labels, so that isn't leakage. The whole procedure lives inside the outer CV fold; encoding before you split is the worst contamination there is, because the transform carries labels. The inner split must match the outer one's structure — group-aware if that's group-aware, time-aware if temporal — or you've moved the leak, not removed it. And unseen merchants fall back to the prior by construction, which matters at 50K cardinality because new ones appear daily.\n\nIf you'd rather not own that apparatus, CatBoost does ordered target statistics natively.","numbers":["Smoothing prior weight m: typically 5-100"],"red_flags":["Computing the mean over the full training set and calling it done — the definitional failure of this question.","Smoothing but not going out-of-fold, or out-of-fold but not smoothing; the singleton-merchant problem needs both.","Fitting the encoder before the train/test split — \"I encode, then I cross-validate.\""],"followups":["What exactly does m trade off, and how would you choose it?","Your outer split is by month — what does the inner split look like?","Same feature for a logistic regression: what changes?"],"section":"Production craft","level":"L6","type":"Mathematical","source":"drill deck"},{"id":74,"question":"Here is a pipeline. `StandardScaler` on the full dataframe, then median imputation, then `SelectKBest(k=100)` on all rows, then SMOTE to balance, then a 5-fold CV that reports 0.94 AUC. Find the bugs and rank them by damage.","say":"Every stateful step is fit on data that includes the evaluation rows, so all four are train-test contamination — but they aren't equally bad, and ranking them is the point.\n\nWorst is SelectKBest on all rows. Feature selection sees the labels of the rows it will later be scored on, so the held-out folds helped choose the features that predict them. It can manufacture a strong metric from pure noise: in the ESL demonstration, screening five thousand random predictors to the hundred most correlated on fifty samples cross-validates to three percent error where the truth is fifty. With k of a hundred, that's most of the 0.94.\n\nSecond, SMOTE before the split: synthetic minority points interpolate training rows and land in the validation folds, so the model is graded on near-copies of what it memorized. Third, imputation: a global median is mild, but an iterative or kNN imputer fits a model per column across the whole dataset. Mildest is the scaler: a mean and standard deviation over a few extra percent of rows barely moves. Still wrong, still fix it, but it doesn't explain the number.\n\nThe fix is structural: put every step in a pipeline object and cross-validate the pipeline, so each fold refits all of them on its own training portion, resampling training rows only. Then rerun and expect a lower, honest number. I'd also ask whether the split should be temporal or grouped, and whether SMOTE is needed at all versus class weights and a tuned threshold.","numbers":["ESL §7.10.2: 50 samples, 5,000 random predictors, screen top 100 → 3% reported error vs 50% truth"],"red_flags":["\"Looks fine\" — the single most damaging answer available in an applied loop.","Spotting the scaler (the famous example) but missing feature selection (the damaging one), or not noticing that SMOTE must never touch validation rows.","Fixing it by recomputing statistics per fold by hand instead of using a pipeline object."],"followups":["How much of the 0.94 do you expect to survive?","Which of these is still wrong even with a single train/test split?","Where would you put early stopping in the fixed pipeline?"],"section":"Production craft","level":"L5","type":"Debugging","source":"drill deck"},{"id":75,"question":"Fraud is 0.1% of transactions. Walk me through building the classifier.","say":"I would deliberately not start with the imbalance. Two questions first. What is the absolute positive count? A tenth of a percent of 200 million transactions is 200,000 frauds, which is a large dataset with a skewed ratio and a perfectly normal supervised problem. A tenth of a percent of 20,000 rows is twenty frauds, which is a fundamentally different problem where I would be arguing for rules plus anomaly detection. Second, what decision does the score drive - auto-decline, step-up authentication, or a review queue with fixed daily capacity? That determines the metric.\n\nThen, in order. Metric: not accuracy, not raw ROC-AUC. PR-AUC reported against its 0.001 baseline, plus the operational metric - precision in the top k alerts per day, or recall at a fixed false-positive rate. The arithmetic that justifies that: at eighty percent TPR and one percent FPR, a million transactions gives 800 true alerts and about 10,000 false ones, so precision is seven percent while the ROC point looks respectable.\n\nValidation: strictly temporal, because fraud is adversarial, and grouped by card or account. Model: a GBDT on transaction, velocity and entity-history features, with every aggregate anchored point-in-time, because velocity features are the richest leakage surface here. Threshold: from the cost matrix - five dollars of review against a two-hundred-dollar chargeback is about 2.4 percent - or from review capacity. Recalibrate if you weighted anything. And only then resampling, mostly for training-loop economics rather than accuracy.","numbers":["0.1% of 200M = 200K positives; 0.1% of 20K = 20 positives - different problems","TPR 0.8 / FPR 1% on 1M transactions: 800 true vs ~10K false alerts, precision ~7%","Threshold from costs: $5 review vs $200 chargeback gives tau* ~ 2.4%"],"red_flags":["Opening with SMOTE, or any resampling, before naming a metric.","Reporting accuracy, or ROC-AUC alone, at this prevalence.","A random train/test split on adversarial time-series data, or leaving the threshold at 0.5."],"followups":["The chargeback label takes 60 days - how do you evaluate last month?","Review capacity is halved. What changes?","How do you know the model is not just re-learning the rule engine?"],"section":"Production craft","level":"L6","type":"Trade-off","source":"drill deck"},{"id":76,"question":"How would you debug poor embedding quality?","say":"I would go cheapest diagnostic first and only retrain once I know what is broken.\n\nFirst, look at them: a UMAP projection, not t-SNE, which does not preserve global structure, coloured by whatever labels I have. If there is no visible structure at all, the embeddings are fundamentally broken and I stop there. Then I make that quantitative with average intra-class cosine similarity against inter-class. What I care about is the gap, not the absolute numbers, because raw language-model features are anisotropic and everything looks similar, which people misdiagnose as collapse. Both high with no gap is collapse. Intra-class low means the model never learned category structure, and I would go look at the training data.\n\nThen a nearest-neighbour spot check on fifty to a hundred diverse queries: pull the top ten and actually read them. That is where you catch systematic failures, like neighbours that always share surface keywords but not meaning.\n\nIf it is still not obvious, I would run an SVD on a sample of the embedding matrix - if the top few percent of dimensions carry more than ninety percent of the variance, that is dimensional collapse. And I would test on a proxy task, k-NN classification on frozen embeddings, because if the proxy is fine and the real task is not, the problem is downstream. Last, training diagnostics: is the loss still moving, are gradient norms sane, and for contrastive setups, the temperature.","numbers":["Contrastive temperature: unstable below ~0.01, too easy above ~0.5"],"red_flags":["Jumping to \"retrain on more data\" before diagnosing anything.","Relying on t-SNE alone, or on \"the plot looks fine\" with no numbers.","Calling uniformly high cosine similarity collapse without checking the intra-versus-inter gap."],"followups":["What does collapse look like in a UMAP?","How do you tell bad embeddings from a bad evaluation metric?","How would you monitor embedding quality automatically in production?"],"section":"Production craft","level":"L5","type":"Debugging","source":"drill deck"},{"id":77,"question":"How do you handle training-serving skew?","say":"Training-serving skew is when the model sees different feature distributions at serving time than it did in training, and it's the single most common cause of \"works offline, fails in production.\" I handle it as prevention, detection and mitigation — and prevention is where the leverage is.\n\nPrevention means removing the opportunity for two implementations to disagree. A feature store with shared definitions, so each feature is written once and used by both paths. The log-and-train pattern: log the exact feature vector you served and train on those logs rather than recomputing from raw sources — the strongest guarantee available, because the training inputs are literally the serving inputs. And package preprocessing into the model artifact, so normalization and tokenization can't drift away from the model that expects them.\n\nDetection: alert on PSI above about 0.1 comparing serving to training feature distributions; monitor the prediction distribution against offline evaluation, which catches skew you never thought to instrument per-feature; and put an integration test in CI that pushes fixed inputs through both pipelines and requires matching outputs.\n\nMitigation depends on cause. If a pipeline is late, fall back to last-known-good values rather than nulls the model has never seen. If the shift is real and permanent, retrain on data that reflects it. And keep this separate from concept drift: skew is an engineering mismatch, drift is the world moving.","numbers":["Alert threshold: PSI > 0.1 comparing serving to training feature distributions"],"red_flags":["\"Be careful with your features\" with no concrete mechanism.","Not knowing the log-and-train pattern.","Confusing training-serving skew with concept drift."],"followups":["How do you detect skew in embedding features?","What if the skew is intentional, from an upstream product change?","How does log-and-train handle delayed labels?"],"section":"Production craft","level":"L5","type":"Conceptual","source":"drill deck"},{"id":78,"question":"Your model's CTR dropped 5% overnight. Walk through your diagnosis.","say":"I triage in order of prior probability and speed of check, and \"retrain the model\" is last, not first. Overnight is the key word — models don't drift five percent overnight, systems do. First, was there a deploy? New model, config change, feature-store migration, new hosts, load balancer. If a deploy lines up with the drop, roll back first and diagnose after. Then serving health: error rates, latency, timeouts. A latency spike that trips fallbacks to a non-personalized default looks exactly like a CTR drop.\n\nSecond, the data pipeline. Check feature freshness — a batch job that failed quietly leaves the model scoring on stale features. Check for nulls from an upstream schema change, and PSI on the top features to see whether the input distributions actually moved.\n\nThird, external causes. A frontend change that moved the module. A traffic-mix shift from a marketing push or a viral event, where the population changed rather than the model. Calendar effects.\n\nOnly then the model, and only if it retrained overnight: compare offline metrics against the previous version and look at the prediction distribution. A shifted output distribution with no corresponding input shift points at a training bug. Running alongside all of that, confirm the metric is real. A logging change can manufacture a five percent drop that never happened, and that's an embarrassing thing to find on day three.","red_flags":["Starting with \"retrain the model\" before checking system health and data pipelines.","Never asking whether a deployment happened.","Not separating a measurement artifact from a real drop."],"followups":["How do you tell a real drop from a measurement artifact?","What if the drop is confined to one user segment?","How would you build alerting that catches this in 30 minutes instead of overnight?"],"section":"Production craft","level":"L6","type":"Debugging","source":"drill deck"}],"coding":[{"n":1,"section":"Top-k and heaps","title":"Top K Frequent Elements","difficulty":"Medium","prompt":"Given an array of integers and an integer k, return the k most frequent elements.","cue":"'Top k' plus 'you don't need them sorted among themselves' means a heap, not a sort. This is the single most likely pattern on a search team - every ranking stage is a top-k.","approach":"Count with a hash map, then take the k largest by count. A heap of size k keeps the work at n log k instead of n log n. If k is close to n, just sort. If you need it in O(n), quickselect on the counts.","complexity":"Time O(n log k), space O(n). Quickselect variant: O(n) average, O(n^2) worst.","edges":["k equals the number of distinct elements","ties in frequency - ask whether the order among ties matters","empty input"],"followup":"Now the array is a stream you cannot hold in memory. (Count-Min Sketch plus a heap; discuss the approximation.)","code":"def top_k_frequent(nums, k):\n    counts = collections.Counter(nums)\n    # heapq.nlargest is O(n log k); sorting everything would be O(n log n).\n    return heapq.nlargest(k, counts, key=counts.get)"},{"n":2,"section":"Top-k and heaps","title":"Merge K Sorted Lists","difficulty":"Hard","prompt":"Merge k sorted integer lists into one sorted list.","cue":"This is literally what an inverted index does when it merges postings lists. Say that out loud - it lands well on a search team.","approach":"Push the head of each list into a min-heap, pop the smallest, push that list's next element. The heap holds at most k items, so each of the n total elements costs one log k push and pop.","complexity":"Time O(n log k) for n total elements, space O(k).","edges":["some lists empty","all lists empty","k equal to 1","duplicate values across lists"],"followup":"The lists are on disk and do not fit in memory. (External merge; talk about buffer sizing and I/O.)","code":"def merge_k_sorted(lists):\n    heap = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapq.heapify(heap)\n    out = []\n    while heap:\n        val, li, idx = heapq.heappop(heap)\n        out.append(val)\n        if idx + 1 < len(lists[li]):\n            heapq.heappush(heap, (lists[li][idx + 1], li, idx + 1))\n    return out"},{"n":3,"section":"Top-k and heaps","title":"Kth Largest Element in a Stream","difficulty":"Easy","prompt":"Design a class that returns the kth largest element seen so far, supporting repeated add() calls.","cue":"'Stream' plus 'kth largest' means a bounded min-heap. The counter-intuitive part - min-heap for largest - is the whole trick.","approach":"Keep a min-heap of exactly k elements. Its root is the kth largest. On add, push and pop if the size exceeds k. Trim in the constructor too, which is the step people forget.","complexity":"Time O(log k) per add, O(n log k) to construct. Space O(k).","edges":["fewer than k elements at construction","k equal to 1","duplicates"],"followup":"Now support removal of an arbitrary element. (Heap plus lazy deletion, or a balanced BST / SortedList.)","code":"class KthLargest:\n    def __init__(self, k, nums):\n        self.k = k\n        self.heap = list(nums)\n        heapq.heapify(self.heap)\n        while len(self.heap) > k:\n            heapq.heappop(self.heap)\n    def add(self, val):\n        heapq.heappush(self.heap, val)\n        if len(self.heap) > self.k:\n            heapq.heappop(self.heap)\n        return self.heap[0]"},{"n":4,"section":"Tries and prefix matching","title":"Implement Trie","difficulty":"Medium","prompt":"Implement a trie with insert, search, and startsWith.","cue":"Any prefix question. On a search team the trie is the autocomplete data structure, so expect this as a warm-up before the real question.","approach":"A dict of dicts, with a sentinel key marking the end of a word. Factor the shared walk into one helper so search and startsWith differ by one line - interviewers notice that.","complexity":"Time O(L) per operation for a word of length L. Space O(total characters inserted).","edges":["the empty string","insert the same word twice","search a prefix that is not itself a word"],"followup":"Add delete. (Reference-count the nodes, or prune upward while the node has no children and no sentinel.)","code":"class Trie:\n    def __init__(self):\n        self.root = {}\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            node = node.setdefault(ch, {})\n        node['$'] = True\n    def search(self, word):\n        node = self._walk(word)\n        return node is not None and '$' in node\n    def starts_with(self, prefix):\n        return self._walk(prefix) is not None\n    def _walk(self, s):\n        node = self.root\n        for ch in s:\n            if ch not in node:\n                return None\n            node = node[ch]\n        return node"},{"n":5,"section":"Tries and prefix matching","title":"Search Suggestions System","difficulty":"Medium","prompt":"Given a list of products and a search word, return the three lexicographically smallest products with each prefix of the search word, as the user types.","cue":"This is typeahead. Coupang's job posting names 'query recommendation' explicitly, so this exact problem is fair game.","approach":"Two clean options. Sort the products and binary search the prefix each keystroke, scanning at most three past the insertion point. Or build a trie and store the three smallest completions at each node. The sorted-array version is shorter and usually what you want under time pressure; the trie version is what you say scales to a real system.","complexity":"Sorted: O(n log n) to sort, then O(log n + 3) per keystroke. Trie: O(total chars) to build, O(L) to query.","edges":["fewer than three matches","no matches for a prefix - and every later prefix also has none","duplicate product names"],"followup":"Rank by popularity rather than lexicographically. (Store a top-3 heap per trie node; discuss how updates propagate.)","code":"def suggested_products(products, search_word):\n    products = sorted(products)\n    out, lo = [], 0\n    for i, ch in enumerate(search_word):\n        prefix = search_word[:i + 1]\n        lo = bisect.bisect_left(products, prefix, lo)\n        hits = []\n        for p in products[lo:lo + 3]:\n            if p.startswith(prefix):\n                hits.append(p)\n        out.append(hits)\n    return out"},{"n":6,"section":"Strings and edit distance","title":"Edit Distance","difficulty":"Hard","prompt":"Given two strings, return the minimum number of insertions, deletions, or substitutions to turn one into the other.","cue":"The classic DP, and the algorithm behind spell correction - which is a query-understanding component you should be able to connect it to.","approach":"dp[i][j] is the distance between the first i characters of a and the first j of b. Either the last characters match and you inherit dp[i-1][j-1], or you pay one for the best of insert, delete, substitute. Roll the table to one row to get linear space.","complexity":"Time O(mn), space O(min(m,n)) with the rolling row.","edges":["either string empty","identical strings","completely disjoint alphabets"],"followup":"Only report whether the distance is at most 2. (Band the DP to a diagonal of width 2k+1 - O(kn) instead of O(mn). This is the optimisation real spell correctors use.)","code":"def edit_distance(a, b):\n    if len(a) < len(b):\n        a, b = b, a\n    prev = list(range(len(b) + 1))\n    for i, ca in enumerate(a, 1):\n        cur = [i]\n        for j, cb in enumerate(b, 1):\n            cur.append(min(prev[j] + 1,          # delete\n                           cur[j - 1] + 1,       # insert\n                           prev[j - 1] + (ca != cb)))\n        prev = cur\n    return prev[-1]"},{"n":7,"section":"Strings and edit distance","title":"Group Anagrams","difficulty":"Medium","prompt":"Group a list of words so that anagrams of one another are in the same group.","cue":"'Group by some canonical form' - the whole problem is choosing the key. Warm-up difficulty; do not overthink it.","approach":"Canonicalise each word by sorting its characters and bucket by that key. A 26-length count tuple is the O(L) alternative to the O(L log L) sort, and worth mentioning even if you write the sort.","complexity":"Time O(n L log L), or O(n L) with count keys. Space O(n L).","edges":["empty string in the input","single-word input","unicode - the count-vector trick assumes a fixed small alphabet"],"followup":"Now the alphabet is unicode and words are long. (Count keys stop being cheap; hash a frozen Counter, and discuss collisions.)","code":"def group_anagrams(words):\n    groups = collections.defaultdict(list)\n    for w in words:\n        key = tuple(sorted(w))\n        groups[key].append(w)\n    return list(groups.values())"},{"n":8,"section":"Strings and edit distance","title":"Longest Substring Without Repeating Characters","difficulty":"Medium","prompt":"Return the length of the longest substring with no repeated characters.","cue":"Sliding window with a hash map. The bug everyone writes is moving the left pointer backwards.","approach":"Track the last index of each character. When you see a repeat whose last index is at or after the window start, jump the start to one past it. Never move the start backwards - that guard is the correctness condition.","complexity":"Time O(n), space O(alphabet).","edges":["empty string","all characters identical","the repeat lies before the current window start - the case the guard exists for"],"followup":"Allow at most k distinct characters. (Same window, but shrink on distinct count rather than on repeats.)","code":"def longest_unique(s):\n    last, start, best = {}, 0, 0\n    for i, ch in enumerate(s):\n        if ch in last and last[ch] >= start:\n            start = last[ch] + 1\n        last[ch] = i\n        best = max(best, i - start + 1)\n    return best"},{"n":9,"section":"Strings and edit distance","title":"Minimum Window Substring","difficulty":"Hard","prompt":"Given strings s and t, return the shortest substring of s containing every character of t including duplicates.","cue":"Variable-size sliding window with a need-counter. One of the highest-value hard problems to have rehearsed, because the pattern generalises.","approach":"Counter of what you still need. Expand the right edge, decrementing; a character was needed if its count was positive before the decrement. When nothing is missing, contract the left edge while recording the best window. The sign convention on the counter is what makes this short.","complexity":"Time O(|s| + |t|), space O(|t|).","edges":["t longer than s","t has duplicate characters - the reason it is a counter and not a set","no valid window exists"],"followup":"Return all minimum windows, not one. (Keep a list at the current best length, reset it when you find shorter.)","code":"def min_window(s, t):\n    if not s or not t:\n        return \"\"\n    need = collections.Counter(t)\n    missing = len(t)\n    best = (float('inf'), 0, 0)\n    start = 0\n    for end, ch in enumerate(s):\n        if need[ch] > 0:\n            missing -= 1\n        need[ch] -= 1\n        while missing == 0:\n            if end - start + 1 < best[0]:\n                best = (end - start + 1, start, end)\n            need[s[start]] += 1\n            if need[s[start]] > 0:\n                missing += 1\n            start += 1\n    return \"\" if best[0] == float('inf') else s[best[1]:best[2] + 1]"},{"n":10,"section":"Binary search","title":"Search in Rotated Sorted Array","difficulty":"Medium","prompt":"Find a target in a sorted array that has been rotated at an unknown pivot. O(log n).","cue":"Binary search where the invariant is broken. At every midpoint, one of the two halves is still sorted - find which, and decide from there.","approach":"Compare nums[lo] with nums[mid]. If nums[lo] <= nums[mid] the left half is sorted, so check whether the target lies inside that sorted range; otherwise the right half is sorted and you check that range. Getting the <= right at the boundary is the whole problem.","complexity":"Time O(log n), space O(1).","edges":["array not actually rotated","single element","two elements","target absent","duplicates - which break O(log n) and need a separate discussion"],"followup":"Now there are duplicates. (Worst case degrades to O(n); explain why you cannot tell which half is sorted when nums[lo] == nums[mid].)","code":"def search_rotated(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[lo] <= nums[mid]:               # left half is sorted\n            if nums[lo] <= target < nums[mid]:\n                hi = mid - 1\n            else:\n                lo = mid + 1\n        else:                                   # right half is sorted\n            if nums[mid] < target <= nums[hi]:\n                lo = mid + 1\n            else:\n                hi = mid - 1\n    return -1"},{"n":11,"section":"Binary search","title":"Kth Smallest Element in a Sorted Matrix","difficulty":"Medium","prompt":"Given an n x n matrix where each row and column is sorted ascending, return the kth smallest element.","cue":"When a heap solution is obvious but the constraints are large, look for binary search on the answer value rather than on an index. That reframing is the thing being tested.","approach":"Binary search over the value range. For a candidate value, count how many entries are at most it by walking from the bottom-left corner - move right when the entry fits, up when it does not, O(n) per probe. Then narrow. The answer is always an actual matrix entry because the search converges to the smallest value with count at least k.","complexity":"Time O(n log(max - min)), space O(1). The heap alternative is O(k log n).","edges":["n equal to 1","k equal to 1 or n*n","many duplicate values","negative values"],"followup":"Why is the converged value guaranteed to be in the matrix? (Because the predicate count(x) >= k first becomes true exactly at a matrix value.)","code":"def merge_intervals(intervals):\n    if not intervals:\n        return []\n    intervals = sorted(intervals)\n    out = [list(intervals[0])]\n    for start, end in intervals[1:]:\n        if start <= out[-1][1]:\n            out[-1][1] = max(out[-1][1], end)\n        else:\n            out.append([start, end])\n    return out"},{"n":12,"section":"Intervals","title":"Merge Intervals","difficulty":"Medium","prompt":"Given a list of intervals, merge all overlapping ones.","cue":"Almost every interval problem starts with 'sort by start'. Say that first and the rest follows.","approach":"Sort by start. Walk through, and either the current interval starts within the last merged one - extend its end to the max - or it does not, and you append. Copy the intervals before mutating, or you will corrupt the caller's input.","complexity":"Time O(n log n), space O(n).","edges":["empty input","touching but not overlapping - ask whether [1,4] and [4,5] merge","one interval fully inside another","already sorted input"],"followup":"Insert a new interval into an already-merged list in O(n). (Three phases: before, overlapping, after.)","code":"def min_meeting_rooms(intervals):\n    if not intervals:\n        return 0\n    starts = sorted(i[0] for i in intervals)\n    ends = sorted(i[1] for i in intervals)\n    rooms = best = 0\n    j = 0\n    for s in starts:\n        while j < len(ends) and ends[j] <= s:\n            rooms -= 1\n            j += 1\n        rooms += 1\n        best = max(best, rooms)\n    return best"},{"n":13,"section":"Intervals","title":"Meeting Rooms II","difficulty":"Medium","prompt":"Given meeting intervals, return the minimum number of rooms required.","cue":"'Maximum concurrent' means either a sweep line or a min-heap of end times. The sweep is shorter to write.","approach":"Sort starts and ends into two separate arrays. Sweep the starts; before each, release every room whose end time is at or before it. Track the running count and its maximum. Equivalently, a min-heap of end times - same complexity, more code.","complexity":"Time O(n log n), space O(n).","edges":["a meeting ending exactly when another starts - ask if that shares a room","empty input","all meetings identical","zero-length meetings"],"followup":"Return which meeting goes in which room. (Heap of (end_time, room_id) - the sweep loses that information.)","code":"def can_finish(num_courses, prerequisites):\n    graph = collections.defaultdict(list)\n    indeg = [0] * num_courses\n    for course, prereq in prerequisites:\n        graph[prereq].append(course)\n        indeg[course] += 1\n    queue = collections.deque(c for c in range(num_courses) if indeg[c] == 0)\n    seen = 0\n    while queue:\n        node = queue.popleft()\n        seen += 1\n        for nxt in graph[node]:\n            indeg[nxt] -= 1\n            if indeg[nxt] == 0:\n                queue.append(nxt)\n    return seen == num_courses"},{"n":14,"section":"Graphs","title":"Course Schedule","difficulty":"Medium","prompt":"Given a number of courses and prerequisite pairs, determine whether all courses can be finished.","cue":"'Can this be ordered' means cycle detection in a directed graph - Kahn's algorithm. The dependency-resolution problem in disguise.","approach":"Build the adjacency list and in-degree array. Queue every zero in-degree node, pop, decrement its neighbours, enqueue any that hit zero. If you processed every node there is no cycle. Get the edge direction right - prerequisite points to course.","complexity":"Time O(V + E), space O(V + E).","edges":["no prerequisites at all","self-loop","disconnected components","duplicate edges"],"followup":"Return a valid order, not just whether one exists. (Same algorithm; collect the pop order.)","code":"def num_islands(grid):\n    if not grid or not grid[0]:\n        return 0\n    rows, cols = len(grid), len(grid[0])\n    seen = set()\n    count = 0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] != '1' or (r, c) in seen:\n                continue\n            count += 1\n            stack = [(r, c)]                    # iterative: recursion overflows\n            seen.add((r, c))\n            while stack:\n                y, x = stack.pop()\n                for ny, nx in ((y+1,x), (y-1,x), (y,x+1), (y,x-1)):\n                    if 0 <= ny < rows and 0 <= nx < cols \\\n                       and grid[ny][nx] == '1' and (ny, nx) not in seen:\n                        seen.add((ny, nx))\n                        stack.append((ny, nx))\n    return count"},{"n":15,"section":"Graphs","title":"Number of Islands","difficulty":"Medium","prompt":"Count connected components of '1' cells in a 2D grid.","cue":"Grid plus connectivity means flood fill. The only real decision is recursive or iterative.","approach":"Scan every cell; on an unvisited '1', flood fill and increment the count. Write it iteratively with an explicit stack - a 1000x1000 grid of all ones will blow the Python recursion limit, and saying so unprompted is worth a point.","complexity":"Time O(rows * cols), space O(rows * cols) worst case for the stack.","edges":["empty grid","a grid with no land","all land","single row or column"],"followup":"The grid does not fit in memory. (Union-find over row stripes; or discuss a streaming two-pass connected-component labelling.)","code":"def ladder_length(begin, end, word_list):\n    words = set(word_list)\n    if end not in words:\n        return 0\n    queue = collections.deque([(begin, 1)])\n    seen = {begin}\n    while queue:\n        word, steps = queue.popleft()\n        if word == end:\n            return steps\n        for i in range(len(word)):\n            for c in \"abcdefghijklmnopqrstuvwxyz\":\n                nxt = word[:i] + c + word[i+1:]\n                if nxt in words and nxt not in seen:\n                    seen.add(nxt)\n                    queue.append((nxt, steps + 1))\n    return 0"},{"n":16,"section":"Graphs","title":"Word Ladder","difficulty":"Hard","prompt":"Given a start word, an end word, and a dictionary, return the length of the shortest transformation sequence changing one letter at a time.","cue":"'Shortest' on an unweighted graph is BFS, always. The graph is implicit - you generate neighbours rather than store edges.","approach":"BFS from the start. Neighbours are every word one substitution away that is in the dictionary. Mark visited when you enqueue, not when you dequeue, or the queue fills with duplicates. Generating 26L candidates per word beats comparing against every dictionary word when the dictionary is large.","complexity":"Time O(N * L * 26) where N is dictionary size and L word length. Space O(N * L).","edges":["end word not in the dictionary - return 0 immediately","start equals end","empty dictionary"],"followup":"Make it bidirectional BFS. (Search from both ends, expand the smaller frontier; roughly squares down the branching.)","code":"def coin_change(coins, amount):\n    INF = amount + 1\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return -1 if dp[amount] == INF else dp[amount]"},{"n":17,"section":"Dynamic programming","title":"Coin Change","difficulty":"Medium","prompt":"Given coin denominations and an amount, return the fewest coins that make that amount, or -1.","cue":"The canonical unbounded knapsack. Coupang's own interview guidance names dynamic programming explicitly, so have one of these fluent.","approach":"dp[a] is the fewest coins for amount a. dp[0] is zero; for each amount try each coin and take one plus dp[a - coin]. Use amount+1 as the infinity sentinel so you never overflow and the final check is clean. Greedy is wrong here and you should say why - denominations like 1, 3, 4 making 6.","complexity":"Time O(amount * coins), space O(amount).","edges":["amount zero - answer is zero, not -1","no combination exists","a coin larger than the amount","duplicate denominations"],"followup":"Count the number of ways instead of the minimum. (Same table, but the loop order flips - coins outside, amounts inside - or you count permutations instead of combinations.)","code":"import bisect\ndef length_of_lis(nums):\n    tails = []\n    for n in nums:\n        i = bisect.bisect_left(tails, n)\n        if i == len(tails):\n            tails.append(n)\n        else:\n            tails[i] = n\n    return len(tails)"},{"n":18,"section":"Dynamic programming","title":"Longest Increasing Subsequence","difficulty":"Medium","prompt":"Return the length of the longest strictly increasing subsequence.","cue":"The O(n^2) DP is the obvious answer; the O(n log n) patience-sorting version is the one that separates candidates.","approach":"Maintain a 'tails' array where tails[i] is the smallest possible tail of an increasing subsequence of length i+1. For each number, binary search its position and either extend or overwrite. The array is not itself a valid subsequence - say that before they ask, because it shows you understand rather than memorised.","complexity":"Time O(n log n), space O(n).","edges":["empty array","strictly decreasing input","all equal - bisect_left gives strictly increasing, bisect_right gives non-decreasing"],"followup":"Reconstruct the actual subsequence. (Store predecessor indices alongside; the tails array alone cannot reconstruct it.)","code":"class LRUCache:\n    def __init__(self, capacity):\n        self.cap = capacity\n        self.data = collections.OrderedDict()\n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n        return self.data[key]\n    def put(self, key, value):\n        if key in self.data:\n            self.data.move_to_end(key)\n        self.data[key] = value\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)"},{"n":19,"section":"Design and hashing","title":"LRU Cache","difficulty":"Medium","prompt":"Design a cache with O(1) get and put that evicts the least recently used entry at capacity.","cue":"The most-asked design-flavoured coding question there is. On a search team it is also real - your query-rewrite cache is exactly this.","approach":"Hash map plus doubly linked list: the map gives O(1) lookup, the list gives O(1) reordering. In Python, OrderedDict with move_to_end and popitem(last=False) is that structure - use it, but be ready to write the linked list by hand, because some interviewers require it.","complexity":"Time O(1) for both operations, space O(capacity).","edges":["capacity zero","updating an existing key - it counts as a use","get on a missing key must not insert"],"followup":"Make it thread-safe, or make it LFU instead. (LFU needs frequency buckets with a min-frequency pointer.)","code":"def kth_smallest_matrix(matrix, k):\n    n = len(matrix)\n    def count_le(x):\n        # walk from bottom-left: O(n) per probe\n        cnt, r, c = 0, n - 1, 0\n        while r >= 0 and c < n:\n            if matrix[r][c] <= x:\n                cnt += r + 1\n                c += 1\n            else:\n                r -= 1\n        return cnt\n    lo, hi = matrix[0][0], matrix[n-1][n-1]\n    while lo < hi:\n        mid = lo + (hi - lo) // 2\n        if count_le(mid) < k:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo"},{"n":20,"section":"Design and hashing","title":"Rank products by a composite key","difficulty":"Easy","prompt":"Sort products by relevance score descending, then rating descending, then price ascending, then id ascending as a deterministic tie-break.","cue":"Not a hard problem - a correctness-and-care problem, which is exactly what Coupang says it grades. Expect it as a warm-up or embedded in a larger question.","approach":"One sort with a tuple key, negating the descending numeric fields. Do not chain multiple sorts unless you are deliberately relying on stability, and if you do, say so. The final id tie-break matters in production: without it, equal-scoring products shuffle between requests and your A/B test picks up noise.","complexity":"Time O(n log n), space O(n).","edges":["ties across every field - the id makes the order total","negative or missing prices","floating-point score equality, which is why you want an explicit final key"],"followup":"The scores come from a model and are float32. How do you make ranking stable across replicas? (Round to a fixed precision before sorting, or rank by a deterministic key; discuss why float non-determinism across hardware is real.)","code":"def rank_products(products):\n    \"\"\"products: list of dicts with score, rating, price.\n    Rank by score desc, then rating desc, then price asc, then id asc.\"\"\"\n    return sorted(products,\n                  key=lambda p: (-p[\"score\"], -p[\"rating\"], p[\"price\"], p[\"id\"]))"}]}</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" async></script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('deck').textContent);
var WPM = 150, KEY = 'coupang.progress.v1';
var TABS = [
  {id:'brief',    label:'The loop'},
  {id:'deepdive', label:'The set-piece question'},
  {id:'depth',    label:'ML depth',   n:D.depth.length},
  {id:'parth',    label:"Parth's round"},
  {id:'breadth',  label:'ML breadth', n:D.breadth.length},
  {id:'project', label:'Project deep-dive'},
  {id:'coding',  label:'Coding',     n:D.coding.length}
];
var st = {tab:'brief', grades:{}, i:{depth:0,breadth:0}, section:{depth:null,breadth:null},
          revealed:false, open:{}, order:{depth:null,breadth:null}};
var timer = {t0:0, raf:0, running:false};
var dbref = null;

try{ st.grades = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ st.grades = {}; }
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(st.grades)); }catch(e){} }
function persist(){
  saveLocal();
  if(dbref) dbref.set({grades:st.grades, updatedAt:new Date().toISOString()})
    .catch(function(){ sub('saved on this device only'); });
}
function sub(t){ var e=document.getElementById('sub'); if(e) e.textContent=t; }

if(window.claude && window.claude.use){
  window.claude.use('db').then(function(db){
    if(!db) return;
    dbref = db.doc('progress/state');
    dbref.onSnapshot(function(snap){
      var d = snap.exists ? snap.data() : null;
      if(d && d.grades){
        var changed=false;
        for(var k in d.grades){ if(!st.grades[k]){ st.grades[k]=d.grades[k]; changed=true; } }
        if(changed){ saveLocal(); render(); }
      }
      sub('synced');
    }, function(){ sub('local only'); });
    persist();
  });
}

function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function rich(s){
  return s.split(/(\$\$[\s\S]*?\$\$|\$[^$]*\$)/).map(function(p,i){
    if(i%2) return p;
    p = esc(p);
    p = p.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    p = p.replace(/`([^`]+)`/g,'<code>$1</code>');
    return p;
  }).join('');
}
function paras(s){
  return s.split(/\n+/).filter(function(p){return p.trim();})
    .map(function(p){return '<p>'+rich(p.trim())+'</p>';}).join('');
}
function items(a,cls){
  return '<ul class="tight '+(cls||'')+'">'+a.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
}
function mm(s){ return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function isDrill(){ return st.tab==='depth' || st.tab==='breadth'; }
function words(q){ return q.say.split(/\s+/).length; }

function baseOrder(tab){
  if(!st.order[tab]) st.order[tab] = D[tab].map(function(_,i){return i;});
  return st.order[tab];
}
function pool(){
  var tab = st.tab;
  return baseOrder(tab).filter(function(ix){
    return !st.section[tab] || D[tab][ix].section === st.section[tab]; });
}
function current(){ var p=pool(); return D[st.tab][p[Math.min(st.i[st.tab], p.length-1)]]; }

function paintTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab" data-tab="'+t.id+'" aria-selected="'+(st.tab===t.id)+'">'
      + esc(t.label) + (t.n ? '<span class="n">'+t.n+'</span>' : '') + '</button>';
  }).join('');
}
function paintChrome(){
  var el = document.getElementById('chrome');
  if(!isDrill()){ el.innerHTML=''; return; }
  var tab = st.tab, secs = [], counts = {};
  D[tab].forEach(function(q){
    if(counts[q.section]===undefined){ secs.push(q.section); counts[q.section]=0; }
    counts[q.section]++;
  });
  var p = pool();
  var done = p.filter(function(ix){ return st.grades[key(D[tab][ix])]; }).length;
  var solid = p.filter(function(ix){ return st.grades[key(D[tab][ix])]==='solid'; }).length;
  var html = '<div class="spine">' + p.map(function(ix,n){
    var q=D[tab][ix], g=st.grades[key(q)];
    return '<button class="tick" data-n="'+n+'"'+(g?' data-g="'+g+'"':'')
      + (n===st.i[tab]?' aria-current="true"':'')
      + ' title="'+esc(q.question.slice(0,80))+'"></button>';
  }).join('') + '</div>';
  html += '<div class="filters"><button class="chip" data-sec="" aria-pressed="'
       + (!st.section[tab]) + '">All ' + D[tab].length + '</button>'
       + secs.map(function(s){
           return '<button class="chip" data-sec="'+esc(s)+'" aria-pressed="'
             + (st.section[tab]===s)+'">'+esc(s)+' '+counts[s]+'</button>';
         }).join('') + '</div>';
  el.innerHTML = html;
  sub((st.i[tab]+1)+' / '+p.length+'  ·  '+solid+' solid, '+(done-solid)+' to revisit');
}
function key(q){ return st.tab + ':' + q.id; }

function stopTimer(){ timer.running=false; cancelAnimationFrame(timer.raf); }
function startTimer(){
  var target = words(current())/WPM*60;
  timer.t0 = performance.now(); timer.running = true;
  var fill=document.getElementById('fill'), el=document.getElementById('elapsed');
  (function tick(){
    if(!timer.running) return;
    var s=(performance.now()-timer.t0)/1000;
    fill.style.width = Math.min(100, s/(target*1.35)*100)+'%';
    fill.classList.toggle('over', s>target);
    el.textContent = mm(s); el.classList.toggle('over', s>target);
    timer.raf = requestAnimationFrame(tick);
  })();
  var g=document.getElementById('go'); if(g) g.textContent='Stop';
}

function renderCard(){
  var p = pool(), tab = st.tab;
  if(!p.length) return '<div class="card">Nothing in this section.</div>';
  st.i[tab] = Math.max(0, Math.min(st.i[tab], p.length-1));
  var q = current(), target = words(q)/WPM*60, g = st.grades[key(q)];
  var h = '<div class="card">';
  h += '<div class="eyebrow"><span class="n">'+String(q.id).padStart(3,'0')+'</span>'
     + '<span class="sec">'+esc(q.section)+'</span>'
     + '<span>'+esc(q.level)+'</span><span class="dot">/</span><span>'+esc(q.type)+'</span></div>';
  h += '<h2 class="q">'+rich(q.question)+'</h2>';
  h += '<div class="clock"><div class="track"><div class="fill" id="fill"></div>'
     + '<div class="target" style="left:'+(100/1.35)+'%"></div></div>'
     + '<div class="clockrow"><span class="el" id="elapsed">0:00</span>'
     + '<span>of ~'+mm(target)+' spoken</span><span class="spacer"></span>'
     + '<button class="go" id="go">Start answering</button></div></div>';
  if(!st.revealed){
    h += '<div class="veil"><b>Say it out loud first.</b>Then <kbd>space</kbd> for the answer.</div>';
  } else {
    h += '<div class="lab">Say this</div><div class="say">'+paras(q.say)+'</div>';
    if(q.numbers && q.numbers.length)
      h += '<div class="lab">Numbers worth quoting</div><ul class="nums">'
         + q.numbers.map(function(n){return '<li>'+rich(n)+'</li>';}).join('')+'</ul>';
    if(q.whiteboard)
      h += '<div class="lab">If they hand you the marker</div><div class="marker">'+rich(q.whiteboard)+'</div>';
    if(q.coupang)
      h += '<div class="cp"><b>At Coupang.</b> '+rich(q.coupang)+'</div>';
    h += '<div class="lab f">Loses the signal</div>'+items(q.red_flags);
    h += '<div class="lab">Then they ask</div>'+items(q.followups);
    h += '<div class="src">'+esc(q.source||'')+'</div>';
  }
  h += '<div class="grade">'+gbtn('solid','Had it','1',g)+gbtn('shaky','Shaky','2',g)
     + gbtn('again','Again','3',g)+'</div>';
  h += '<div class="nav"><button data-nav="-1">&larr; Previous</button>'
     + '<span class="spacer"></span><button data-nav="1">Next &rarr;</button></div></div>';
  return h;
}
function gbtn(g,label,k,cur){
  return '<button class="gbtn" data-g="'+g+'" aria-pressed="'+(cur===g)
       + '">'+esc(label)+' <span class="k">'+k+'</span></button>';
}

function renderCoding(){
  var section = null, h = '<div class="prose">'+D.codingIntro+'</div>';
  D.coding.forEach(function(p){
    if(p.section !== section){ section = p.section; h += '<h3 class="pgroup" style="margin-top:26px">'+esc(section)+'</h3>'; }
    var open = st.open['c'+p.n];
    h += '<div class="prob"><div class="ptag">Problem '+p.n+' · <span class="d">'
       + esc(p.difficulty)+'</span></div><h3>'+esc(p.title)+'</h3>'
       + '<p class="prompt">'+rich(p.prompt)+'</p>'
       + '<div class="lab">What makes you recognise it</div><div class="say">'+rich(p.cue)+'</div>'
       + '<button class="reveal" data-open="c'+p.n+'">'+(open?'Hide solution':'Show approach and solution')+'</button>';
    if(open){
      h += '<div class="lab">Approach</div><div class="say">'+rich(p.approach)+'</div>'
         + '<div class="lab">Complexity</div><div class="say">'+rich(p.complexity)+'</div>'
         + '<div class="lab">Edge cases to raise before you code</div>'+items(p.edges)
         + '<div class="lab">Reference solution</div><pre><code>'+esc(p.code)+'</code></pre>'
         + '<div class="lab">Then they ask</div><div class="say">'+rich(p.followup)+'</div>';
    }
    h += '</div>';
  });
  return h;
}

function render(){
  paintTabs(); paintChrome(); stopTimer();
  var stage = document.getElementById('stage');
  if(st.tab==='brief')         stage.innerHTML = '<div class="prose">'+D.brief+'</div>';
  else if(st.tab==='deepdive') stage.innerHTML = '<div class="prose">'+D.deepdive+'</div>';
  else if(st.tab==='parth')    stage.innerHTML = '<div class="prose">'+D.breadthRound+'</div>';
  else if(st.tab==='project')  stage.innerHTML = '<div class="prose">'+D.project+'</div>';
  else if(st.tab==='coding')  stage.innerHTML = renderCoding();
  else                        stage.innerHTML = renderCard();
  if(window.MathJax && window.MathJax.typesetPromise)
    window.MathJax.typesetPromise([stage]).catch(function(){});
  if(!isDrill()) sub('');
}

function go(n){ st.i[st.tab] += n; st.revealed=false; render(); }
function grade(g){
  if(!isDrill()) return;
  var q=current(), k=key(q);
  if(st.grades[k]===g) delete st.grades[k]; else st.grades[k]=g;
  persist();
  if(st.grades[k]) go(1); else render();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ st.tab=t.dataset.tab; st.revealed=false; render(); window.scrollTo(0,0); return; }
  if(t.classList.contains('chip')){
    st.section[st.tab] = t.dataset.sec || null; st.i[st.tab]=0; st.revealed=false; render(); return;
  }
  if(t.classList.contains('tick')){ st.i[st.tab]=+t.dataset.n; st.revealed=false; render(); return; }
  if(t.dataset.open){ st.open[t.dataset.open] = !st.open[t.dataset.open]; render(); return; }
  if(t.id==='go'){ timer.running ? (stopTimer(), t.textContent='Start answering') : startTimer(); return; }
  if(t.id==='shuffle'){
    if(!isDrill()) return;
    var o = baseOrder(st.tab);
    for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), s=o[i]; o[i]=o[j]; o[j]=s; }
    st.i[st.tab]=0; st.revealed=false; render(); return;
  }
  if(t.id==='theme'){
    var r=document.documentElement;
    var dark=r.getAttribute('data-theme')==='dark' ||
      (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme', dark?'light':'dark'); return;
  }
  if(t.dataset.nav){ go(+t.dataset.nav); return; }
  if(t.classList.contains('gbtn')){ grade(t.dataset.g); return; }
});

document.addEventListener('keydown', function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  var k=e.key;
  if(k>='1'&&k<='5'&&!isDrill()){ st.tab=TABS[+k-1].id; render(); return; }
  if(!isDrill()) return;
  if(k===' '){ e.preventDefault(); if(st.revealed) go(1); else { st.revealed=true; render(); } }
  else if(k==='ArrowRight'||k==='j'){ e.preventDefault(); go(1); }
  else if(k==='ArrowLeft'||k==='k'){ e.preventDefault(); go(-1); }
  else if(k==='1'){ grade('solid'); }
  else if(k==='2'){ grade('shaky'); }
  else if(k==='3'){ grade('again'); }
  else if(k==='t'){ timer.running ? stopTimer() : startTimer(); }
});

var hot = window.claude && window.claude.hot;
