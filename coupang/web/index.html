<title>Coupang Loop Prep</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#EFF2F0; --card:#FCFDFC; --raise:#F4F7F5;
  --ink:#141A18; --body:#2A3431; --muted:#5E6B66; --faint:#93A19B;
  --accent:#0E6E63; --accent-soft:#D7E6E2; --flag:#A6402C; --flag-soft:#F5E4DF;
  --rule:#DBE2DE; --tick:#C2CDC8; --ok:#0E6E63; --shaky:#B5822A; --again:#A6402C;
  --push:#3A4A6E; --push-soft:#E9EDF5; --num:#7A621A; --num-soft:#F4F1E3;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
  --push:#93A9DC; --push-soft:#1A2030; --num:#D9BE6A; --num-soft:#2A2718;
}}
:root[data-theme="dark"]{
  --ground:#0C110F; --card:#141B19; --raise:#1A2320;
  --ink:#E9EFEC; --body:#C6D2CD; --muted:#8A9A94; --faint:#5E6E68;
  --accent:#4FBFAF; --accent-soft:#17342F; --flag:#E08268; --flag-soft:#33201A;
  --rule:#232E2A; --tick:#33423D; --ok:#4FBFAF; --shaky:#D9A94E; --again:#E08268;
  --push:#93A9DC; --push-soft:#1A2030; --num:#D9BE6A; --num-soft:#2A2718;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--body);font-family:var(--sans);
  font-size:16px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;color:var(--ink);text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono);font-size:.86em;background:var(--raise);
  padding:.08em .32em;border-radius:3px;color:var(--ink)}
a{color:var(--accent)}

.wrap{max-width:840px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-block:11px 0}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--faint);padding-top:6px}
.sub:empty{display:none}
.top .spacer{flex:1}
.tbtn{font-size:.74rem;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:4px}
.tbtn:hover{color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:.83rem;font-weight:600;padding:8px 13px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin-left:5px}

.spine{display:flex;gap:2px;margin-top:9px;height:14px;align-items:flex-end;
  overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.spine::-webkit-scrollbar{display:none}
.tick{flex:1 0 3px;min-width:3px;height:8px;background:var(--tick);border-radius:1px;
  padding:0;transition:height .12s ease}
.tick[data-g="solid"]{background:var(--ok)}
.tick[data-g="shaky"]{background:var(--shaky)}
.tick[data-g="again"]{background:var(--again)}
.tick[aria-current="true"]{height:14px;background:var(--ink)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 12px}
.chip{font-size:.73rem;font-weight:600;padding:4px 9px;border-radius:20px;
  border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C110F}
}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:24px 28px 22px;margin-top:18px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.71rem;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-bottom:11px}
.eyebrow .n{font-family:var(--mono);letter-spacing:0;color:var(--accent)}
.eyebrow .sec{color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:3px}
.eyebrow .dot{color:var(--rule)}
.q{font-size:1.38rem;line-height:1.28;font-weight:600;letter-spacing:-.015em;color:var(--ink)}
.clock{margin-top:18px}
.track{position:relative;height:4px;background:var(--rule);border-radius:2px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:2px}
.fill.over{background:var(--flag)}
.target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45}
.clockrow{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.73rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.clockrow .el{color:var(--ink);font-weight:600;font-size:.88rem}
.clockrow .el.over{color:var(--flag)}
.clockrow .spacer{flex:1}
.go{font-family:var(--sans);font-weight:600;font-size:.77rem;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.go:hover{text-decoration:underline}
.veil{margin-top:20px;padding:18px;border:1px dashed var(--rule);border-radius:8px;
  text-align:center;color:var(--muted);font-size:.87rem}
.veil b{display:block;color:var(--ink);font-weight:600;font-size:1rem;margin-bottom:3px}
.veil kbd{font-family:var(--mono);font-size:.77rem;background:var(--raise);
  border:1px solid var(--rule);border-radius:3px;padding:1px 5px;color:var(--ink)}
.lab{font-size:.69rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:22px 0 6px}
.lab.f{color:var(--flag)}
.say{font-family:var(--serif);font-size:1.06rem;line-height:1.62;color:var(--body);max-width:64ch}
.say p{margin:0 0 .85em}
.say p:last-child{margin-bottom:0}
ul.tight{margin:0;padding-left:1.15em;max-width:64ch}
ul.tight li{margin-bottom:5px}
ul.tight li::marker{color:var(--faint)}
.nums{list-style:none;padding:0;margin:0;max-width:64ch}
.nums li{font-family:var(--mono);font-size:.83rem;line-height:1.5;color:var(--ink);
  padding:6px 0 6px 13px;border-left:2px solid var(--accent-soft)}
.cp{margin-top:18px;background:var(--accent-soft);border-radius:8px;padding:13px 16px;
  font-size:.93rem;color:var(--ink);max-width:64ch}
.cp b{font-weight:700}
.marker{background:var(--raise);border-radius:8px;padding:14px 17px;max-width:64ch;overflow-x:auto}
mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden}
.grade{display:flex;gap:9px;margin-top:24px;padding-top:18px;
  border-top:1px solid var(--rule);flex-wrap:wrap}
.gbtn{flex:1 1 130px;padding:10px 12px;border-radius:7px;border:1px solid var(--rule);
  font-weight:600;font-size:.86rem;color:var(--ink);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn .k{font-family:var(--mono);font-size:.71rem;color:var(--faint);font-weight:400}
.gbtn[data-g="solid"]:hover,.gbtn[data-g="solid"][aria-pressed="true"]{color:var(--ok);border-color:var(--ok)}
.gbtn[data-g="shaky"]:hover,.gbtn[data-g="shaky"][aria-pressed="true"]{color:var(--shaky);border-color:var(--shaky)}
.gbtn[data-g="again"]:hover,.gbtn[data-g="again"][aria-pressed="true"]{color:var(--again);border-color:var(--again)}
.nav{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:.79rem;color:var(--muted)}
.nav button{font-weight:600;color:var(--muted)}
.nav button:hover{color:var(--accent)}
.nav .spacer{flex:1}
.src{margin-top:18px;font-size:.71rem;color:var(--faint);font-family:var(--mono)}

/* prose panes */
.prose{max-width:70ch;margin-top:8px}
.prose h2{font-size:1.7rem;letter-spacing:-.02em;margin:30px 0 10px}
.prose h3{font-size:1.16rem;margin:28px 0 7px;color:var(--accent)}
.prose h4{font-size:1rem;margin:20px 0 5px}
.prose p{margin:0 0 .95em;font-family:var(--serif);font-size:1.05rem;line-height:1.62}
.prose li{font-family:var(--serif);font-size:1.03rem;line-height:1.55;margin-bottom:6px}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 1em}
.prose blockquote{margin:18px 0;padding:14px 18px;background:var(--accent-soft);
  border-radius:8px;border-left:3px solid var(--accent)}
.prose blockquote p{margin:0;font-size:1rem}
.prose hr{border:none;border-top:1px solid var(--rule);margin:26px 0}
.tw{overflow-x:auto;margin:0 0 18px}
.prose table{border-collapse:collapse;width:100%;font-size:.89rem;font-family:var(--sans)}
.prose th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule);
  color:var(--ink);font-weight:700;font-size:.79rem;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap}
.prose td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.prose tbody tr:hover{background:var(--raise)}

/* coding pane */
.prob{background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:20px 24px;margin-top:14px}
.prob h3{font-size:1.14rem;margin-bottom:4px}
.ptag{font-family:var(--mono);font-size:.7rem;color:var(--faint);
  text-transform:uppercase;letter-spacing:.06em}
.ptag .d{color:var(--accent)}
.prompt{font-family:var(--serif);font-size:1.02rem;margin:8px 0 0;color:var(--body)}
.reveal{margin-top:12px;font-size:.79rem;font-weight:600;color:var(--accent);
  letter-spacing:.04em;text-transform:uppercase}
.reveal:hover{text-decoration:underline}
pre{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:13px 15px;overflow-x:auto;margin:0;font-size:.81rem;line-height:1.5}
pre code{background:none;padding:0;font-size:1em}

/* ---- figures: SVG authored once, sized here so cairosvg stays happy ---- */
figure.dg{margin:22px 0 20px;padding:0}
figure.dg svg{display:block;width:100%;max-width:100%;height:auto}
figure.dg figcaption{font-family:var(--sans);font-size:.8rem;line-height:1.5;
  color:var(--muted);margin-top:9px;max-width:66ch}

/* ---- decision blocks: the choice, the alternative, and the price ---- */
.decide{border:1.5px solid var(--accent);border-radius:9px;margin:20px 0;
  overflow:hidden;background:var(--card)}
.decide .dt{background:var(--accent);color:#fff;font-family:var(--sans);
  font-weight:700;font-size:.87rem;padding:7px 13px;letter-spacing:.005em}
:root[data-theme="dark"] .decide .dt{color:#0C110F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .decide .dt{color:#0C110F}
}
.decide .drow{display:flex;gap:12px;padding:8px 13px;
  border-top:1px solid var(--rule);align-items:baseline}
.decide .drow:first-of-type{border-top:none}
.dk{flex:0 0 68px;font-family:var(--mono);font-size:.66rem;font-weight:600;
  letter-spacing:.09em;color:var(--accent);text-transform:uppercase;padding-top:2px}
.dk.over{color:var(--muted)}
.dk.cost,.dk.but{color:var(--num)}
.dk.fallback,.dk.drop-it-if{color:var(--push)}
.dv{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.5;color:var(--body)}

/* ---- callouts ---- */
.co{border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 7px 7px 0;padding:11px 15px;margin:18px 0;
  font-family:var(--serif);font-size:1.02rem;line-height:1.55;color:var(--ink);
  max-width:68ch}
.co .col{display:block;font-family:var(--mono);font-size:.66rem;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
  margin-bottom:4px}
.co.trap{border-left-color:var(--flag);background:var(--flag-soft)}
.co.trap .col{color:var(--flag)}
.co.push{border-left-color:var(--push);background:var(--push-soft)}
.co.push .col{color:var(--push)}
.co.num{border-left-color:var(--num);background:var(--num-soft);
  font-family:var(--mono);font-size:.84rem;line-height:1.7}
.co.num .col{color:var(--num)}

/* ---- display math ---- */
.mathbox{border:1px solid var(--rule);border-radius:8px;background:var(--card);
  padding:2px 14px;margin:16px 0;overflow-x:auto}
.prose pre.fig{background:var(--raise);border:1px solid var(--rule);border-radius:7px;
  padding:14px 16px;overflow-x:auto;margin:4px 0 6px;font-size:.78rem;
  line-height:1.42;color:var(--ink)}
.prose pre.fig.wide{font-size:.7rem}
.figcap{font-family:var(--sans)!important;font-size:.76rem!important;color:var(--muted);
  margin:0 0 20px!important;letter-spacing:.01em}

@media (max-width:600px){
  .wrap{padding-inline:16px}
  .card,.prob{padding:18px 16px}
  .q{font-size:1.18rem}
  .say{font-size:1.01rem}
  .gbtn{flex:1 1 100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:-16px;padding-inline:16px}
  .filters::-webkit-scrollbar{display:none}
  .prose p,.prose li{font-size:1rem}
  /* Diagrams are 62-74 monospace columns; at this size they fit a 390px
     screen instead of scrolling inside their own box. */
  .prose pre.fig{font-size:.6rem;line-height:1.35;padding:10px 11px}
  .prose pre.fig.wide{font-size:.52rem}
  .decide .drow{flex-direction:column;gap:3px;padding:8px 11px}
  .dk{flex:none}
  .dv{font-size:.97rem}
  .co{font-size:.98rem;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="wrap" style="padding-block:0">
    <div class="topbar">
      <span class="brand">Coupang <span>Search &amp; Discovery</span></span>
      <span class="spacer"></span>
      <button class="tbtn" id="shuffle">Shuffle</button>
      <button class="tbtn" id="theme">Theme</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="sub" id="sub"></div>
    <div id="chrome"></div>
  </div>
</div>
<div class="wrap"><div id="stage"></div></div>

<script id="deck" type="application/json">{"brief":"<h2>The loop</h2>\n<p>Four rounds: <strong>ML depth</strong>, <strong>ML breadth</strong>, a <strong>leadership round that is really a technical project deep-dive</strong>, and <strong>DS&amp;A coding</strong>. Staff / L6.</p>\n<h3>What the org actually is</h3>\n<p>Coupang runs Search &amp; Discovery as a revenue centre, not a platform team. Their own job postings say it plainly: <em>&quot;Over half of the Coupang sales are directly attributed to search and recommendation.&quot;</em> That single sentence should shape how you talk in all four rounds — every ranking decision you describe is a decision about half the company&#x27;s revenue, and you should frame trade-offs in those terms rather than in NDCG points alone.</p>\n<p>The published architecture is a conventional three-stage funnel, and knowing their vocabulary for it costs you nothing:</p>\n<ol>\n<li><strong>Query understanding.</strong> Normalisation, segmentation, intent, spell correction, synonyms. The org explicitly hires for &quot;query/intent understanding, query recommendation and search widgets quality.&quot;</li>\n<li><strong>Retrieval.</strong> A few thousand products selected out of tens of millions.</li>\n<li><strong>Ranking.</strong> The few thousand ordered by a model over <strong>100+ criteria</strong> that mix <em>search relevance</em> with what they call <em>product attractiveness</em> — ratings, review counts, price, brand, and delivery speed.</li>\n</ol>\n<p>That second half of the ranking objective is the thing to internalise. At Coupang, ranking is explicitly not a pure relevance problem. A relevant product that cannot be Rocket-delivered tomorrow is worth less to the customer than a slightly less relevant one that can, and the ranker is where that judgement gets made. If you walk in and design a pure relevance system, you have designed someone else&#x27;s search engine.</p>\n<p>Two more facts worth having: the catalogue is millions of products against petabytes of behavioural data, and the index is <strong>multilingual — Korean, English, and Mandarin</strong>. Korean is agglutinative and written without spaces between all morphemes, so tokenisation is a real modelling decision rather than a library call. If you are asked about internationalisation, that is the specific thing to reach for.</p>\n<p>The job description names the tools: Spark, Airflow, Kubeflow, MLflow for pipelines; PyTorch/TensorFlow, XGBoost and LightGBM for models; AWS, GCP, Vertex AI, BigQuery, SageMaker for infrastructure. It also names the three directions they want pushed — <strong>LLMs, embedding-based retrieval, and multi-modal learning</strong>. Have an opinion on each, and specifically have an opinion on where an LLM does <em>not</em> belong in a 200 ms search path.</p>\n<h3>What each round is testing at L6</h3>\n<p><strong>ML depth.</strong> Not &quot;do you know retrieval&quot; — every candidate knows retrieval. The L6 bar is whether you can hold a whole stage of the funnel in your head and defend a choice against the alternative you rejected. Expect to be pushed one level past your first answer every time. The tell that you are at the bar: you volunteer the failure mode of your own proposal before they ask.</p>\n<p><strong>ML breadth.</strong> Coverage without hand-waving. They are checking that you are not a one-system specialist who would be useless when the problem turns out to be a data leak, a calibration bug, or an experiment design flaw. Answers here should be shorter than in depth — two minutes, commit to a position, stop. Rambling in breadth reads as uncertainty.</p>\n<p><strong>Leadership / project deep-dive.</strong> This is the round people underestimate. It is scored against the 15 leadership principles below, but the <em>evidence</em> is technical: they will go three or four levels into one project and see whether the detail holds up. Coupang&#x27;s own interview guidance says to prepare &quot;operation principles, reasons behind choosing a strategy as well as the trade-offs,&quot; and to use <strong>SBI — Situation, Behaviour, Impact</strong>. Their guidance also says to &quot;incorporate data into examples&quot; because &quot;data drives everything that we do.&quot; A story without numbers will not score.</p>\n<p><strong>Coding.</strong> Their published guidance is 2–3 problems, and what they say they grade is revealing: <em>&quot;Clean code, Bug free&quot;</em>, <em>&quot;Code validation, identification of edge cases&quot;</em>, and algorithm mastery in <em>&quot;sorting, recursion, and dynamic programming.&quot;</em> Note what is missing — cleverness. Optimal-but-broken loses to correct-and-tested. State your complexity, then walk one example through your own code out loud before you say you are done.</p>\n<h3>The 15 leadership principles</h3>\n<p>These are Coupang&#x27;s, verbatim, and the deep-dive round is graded against them. The right-hand column is where each one most naturally shows up — you are not expected to hit all 15, you are expected to have two or three stories that hit six or seven of them between them.</p>\n<div class=\"tw\"><table><thead><tr><th>Principle</th><th>Coupang&#x27;s words</th><th>Where it shows up</th></tr></thead><tbody><tr><td><strong>Wow the Customer</strong></td><td>&quot;We exist to transform customers&#x27; lives for the better. The customer is the beginning and the end in every decision we make.&quot;</td><td>Why the metric you optimised was the right proxy for the customer</td></tr><tr><td><strong>Ruthless Prioritization</strong></td><td>&quot;To focus on what we must win, we give up what we want to do. Laser focus requires courage and confidence.&quot;</td><td>What you cut from the project, and what it cost you</td></tr><tr><td><strong>Company-wide Perspective</strong></td><td>&quot;Leaders think like owners… We understand and consider upstream and downstream implications.&quot;</td><td>Who consumed your model&#x27;s output, and what you did to protect them</td></tr><tr><td><strong>Dive Deep</strong></td><td>&quot;Operational excellence requires hands-on leadership with a passion for detail. We dig down to the smallest details.&quot;</td><td>The debugging story. This is the one the depth round is secretly testing</td></tr><tr><td><strong>Think Systematically</strong></td><td>&quot;We build scalable processes with prompt feedback mechanisms. We take measures not only to fix defects, but also to prevent them.&quot;</td><td>The guardrail you added after the incident, not just the fix</td></tr><tr><td><strong>Simplify</strong></td><td>&quot;Complexity is the enemy of scale, speed, and customer experience.&quot;</td><td>The model or pipeline you deleted</td></tr><tr><td><strong>Disagree and Commit</strong></td><td>&quot;Constructive confrontation is essential to good decisions. Leaders challenge openly when they disagree.&quot;</td><td>The time you lost the argument and executed anyway — they want both halves</td></tr><tr><td><strong>Hire and Develop the Best</strong></td><td>&quot;Leaders raise the performance level of the team with every hire and promotion.&quot;</td><td>Mentoring, and a specific person who got better</td></tr><tr><td><strong>Deliver Results with Grit</strong></td><td>&quot;Leaders deliver impact in timely fashion and with high quality. We do not confuse long hours or effort with results.&quot;</td><td>Shipped, measured, still running</td></tr><tr><td><strong>Influence without Authority</strong></td><td>&quot;Leaders lead by communicating their ideas clearly. We drive alignment through data and insights.&quot;</td><td>How you got another team to change their schema for you</td></tr><tr><td><strong>Aim High and Find a Way</strong></td><td>&quot;We aim for jaw-dropping results and work backwards.&quot;</td><td>The goal that looked unreasonable when you set it</td></tr><tr><td><strong>Learn Voraciously</strong></td><td>&quot;We are hungry for the best ideas and seek them from all sources… Ego is the enemy.&quot;</td><td>What you were wrong about</td></tr><tr><td><strong>Demand Excellence</strong></td><td>&quot;Leaders have a passion for excellence and do not tolerate mediocrity.&quot;</td><td>The bar you refused to lower</td></tr><tr><td><strong>Move with Urgency</strong></td><td>&quot;Urgency is a sense of crisis. We treat inaction as a threat to survival. We learn by doing.&quot;</td><td>The thing you shipped in two weeks instead of specifying for two months</td></tr><tr><td><strong>Hate Waste</strong></td><td>&quot;Leaders find ways to do more with less. We save costs rather than simply cut them.&quot;</td><td>The serving-cost or GPU-hour number. Note the distinction they draw: <em>save</em>, not <em>cut</em></td></tr></tbody></table></div>\n<p>Principle 15&#x27;s phrasing is worth a beat. &quot;We save costs rather than simply cut them&quot; means an efficiency story where you removed capability scores badly; one where you held quality flat and halved the cost scores well.</p>\n<h3>Budgeting the time inside a round</h3>\n<p>A 45-minute technical round is roughly three questions. Candidates lose it by spending 20 minutes on the first. Aim for two to three minutes of answer, then stop and let them steer. If you genuinely need longer — a system design — say the shape first (&quot;three stages, and the interesting one is the second&quot;), then expand. Announcing the structure buys you the time; launching into detail without it does not.</p>\n<p>For the deep-dive round, assume 10 minutes of narrative and 35 minutes of interrogation. Most people prepare the 10 and not the 35.</p>","deepdive":"<h2>The question Siwen asks</h2>\n<p>This is the ML depth round. A recruiter read out the scorecard from the same question asked to another candidate, so treat the wording below as close to verbatim.</p>\n<blockquote><strong>Design a retrieval and ranking system for an e-commerce mobile app search bar.</strong> The goal is to retrieve highly relevant products for ambiguous, long-tail queries — for example <em>&quot;durable lightweight winter boots for toddlers&quot;</em> — while ranking the results to optimise CVR. Assume a system is already running and has collected logs for six months. <strong>10M products. 200 QPS. 100 ms latency.</strong></blockquote>\n<h3>What is actually being tested</h3>\n<p>The question has two halves and you own both of them. Retrieval and ranking are named in the prompt, they have different objectives, and a Staff answer holds the whole funnel — including the seam between them, which is where most of the interesting failures live.</p>\n<p>The scorecard from the other candidate is still worth having, but for a narrower reason than it first appears. It was written about someone else, and it is not a prediction about you. What it does tell you is <strong>the vocabulary Siwen probes with on the retrieval side</strong> — &quot;contrastive learning, embedding models, or softmax&quot; is her list, not a generic one — which is a genuine signal about where she considers the bar to be when she digs. It is a reason to be fluent there. It is not a reason to under-weight ranking.</p>\n<p>So: plan for roughly equal time on both, and let her steer. The two halves fail differently and you should be able to say how.</p>\n<p><strong>Retrieval</strong> is judged on recall, is trained contrastively over sampled negatives, and is where candidates most often turn out to be thin — most people have consumed an embedding model without ever having trained one.</p>\n<p><strong>Ranking</strong> is judged on order, is trained on logged feedback that is biased by the very system that produced it, and is where <em>this particular prompt</em> hides a trap: &quot;optimise CVR&quot; has a specific pathology, and stepping around it carefully is worth as much as anything you will say about negatives.</p>\n<p>The seam between them is its own topic and almost nobody raises it unprompted: the ranker is trained on whatever candidate distribution the retriever produced, so changing retrieval silently invalidates the ranker. There is a section on this at the end, and bringing it up yourself is the clearest signal in the whole answer that you have shipped one of these.</p>\n<h3>The first five minutes: what to ask</h3>\n<p>Ask four questions, no more. Each one should visibly change your design, and you should say what it changes — asking a clarifying question and then ignoring the answer is worse than not asking.</p>\n<ol>\n<li><strong>&quot;Is 100 ms the end-to-end server-side p99, or the budget for retrieval alone?&quot;</strong> If it is the whole funnel, cross-encoder reranking is tight and I will size it carefully. If it is retrieval only, I have room. <em>Assume end-to-end p99 unless told otherwise, and say you are assuming it.</em></li>\n<li><strong>&quot;Is 200 QPS peak or average?&quot;</strong> It sets replica count and, more importantly, tells me how much training data six months buys. At 200 QPS average that is roughly 3 billion searches; at 200 peak with a typical diurnal curve, closer to one billion. Either is plenty for a retriever.</li>\n<li><strong>&quot;CVR of what, over what window?&quot;</strong> Conversion per search session, per click, or per impression? Same-session or 7-day attributed? This is the single most consequential clarification in the question and I will come back to it.</li>\n<li><strong>&quot;Is this a marketplace with third-party sellers, and do we control the product text?&quot;</strong> It decides whether catalogue quality is a modelling problem or a data problem, and in a marketplace it is usually the biggest single lever on tail retrieval.</li>\n</ol>\n<p>If you get one more, ask whether ads or sponsored placement blend into the same result set, because that changes the ranking objective from CVR to expected value and you do not want to discover that at minute 50.</p>\n<h3>Numbers you derive from the prompt, out loud</h3>\n<p>Doing this in the first five minutes is worth a lot — it shows the constraints are real to you rather than decorative.</p>\n<div class=\"tw\"><table><thead><tr><th>From</th><th>Derivation</th><th>Number</th></tr></thead><tbody><tr><td>10M products, 256-d fp32</td><td>10e6 x 256 x 4</td><td>10.2 GB of raw vectors</td></tr><tr><td>Same, int8 scalar-quantised</td><td>10e6 x 256 x 1</td><td>2.6 GB — fits in RAM on one box</td></tr><tr><td>HNSW graph, M = 32</td><td>10e6 x 2M x 4 bytes</td><td>~2.6 GB of graph on top</td></tr><tr><td>200 QPS at 100 ms</td><td>Little&#x27;s law: 200 x 0.1</td><td>20 requests in flight</td></tr><tr><td>6 months at 200 QPS avg</td><td>200 x 86400 x 180</td><td>~3.1B searches</td></tr><tr><td>Clicks at ~40% of searches</td><td></td><td>~1.2B click events</td></tr><tr><td>Purchases at ~2% of searches</td><td></td><td>~60M purchase events</td></tr></tbody></table></div>\n<div class=\"co say\"><span class=\"col\">Say this</span>This is not a scale problem, it is a quality problem. Ten million products and two hundred queries a second fit comfortably on a handful of machines. What is hard is recall on ambiguous tail queries and an honest CVR objective.</div>\n<p>10M products and 200 QPS fit comfortably on a handful of machines. Nothing here forces a distributed index or exotic infrastructure, and a candidate who spends twenty minutes on sharding has misread the question. What is hard is recall on ambiguous tail queries and an honest CVR objective.</p>\n<h3>The sixty minutes</h3>\n<p>Her previous round was 15 minutes resume, 60 design, 15 Q&amp;A. Budget the design block like this, and say the plan out loud at the start — it buys you permission to defer things.</p>\n<div class=\"tw\"><table><thead><tr><th>Minutes</th><th>What</th><th>Why</th></tr></thead><tbody><tr><td>0–5</td><td>Clarify, state assumptions, derive the numbers</td><td>Establishes the constraints are real</td></tr><tr><td>5–10</td><td>Whole-system diagram and the latency budget</td><td>Gives her a map; everything later hangs off it</td></tr><tr><td>10–14</td><td>Query understanding for the tail example</td><td>Shows you understand why the query is hard</td></tr><tr><td>14–32</td><td><strong>Retrieval, and how you train it</strong></td><td>Objective, negatives, geometry, evaluation</td></tr><tr><td>32–50</td><td><strong>Ranking: the objective, the label bias, the model</strong></td><td>Equal weight. The CVR trap lives here.</td></tr><tr><td>50–55</td><td>The seam: how the two stages break each other</td><td>The part almost nobody raises unprompted</td></tr><tr><td>55–60</td><td>Evaluation, experimentation, what you would build first</td><td>Staff signal: sequencing under constraint</td></tr></tbody></table></div>\n<p>Two blocks of eighteen minutes, not one of twenty-five. If she interrupts and steers, follow her — but know where you were, and say &quot;let me come back to negatives&quot; rather than losing the thread. If she spends the whole hour on one half, that is her choice and you should have the depth to fill it; the budget above is what to do when she leaves it to you.</p>\n<h2>The system</h2>\n<p>Draw this first and leave it on the board. Everything afterwards is a zoom into one box, and having the map up means you can say &quot;I&#x27;m here&quot; instead of re-explaining context.</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 556\" role=\"img\" aria-label=\"Search funnel: query understanding, three parallel retrieval arms, fusion, two ranking stages and a slate policy, with the latency budget each stage receives\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-funnel\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-funnel\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-funnel\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"140\" y=\"8\" width=\"320\" height=\"32\" rx=\"6\" fill=\"var(--raise)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"28.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">\"durable lightweight winter boots for toddlers\"</text><line x1=\"300\" y1=\"40\" x2=\"300\" y2=\"62\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><rect x=\"150\" y=\"62\" width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"81.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Query understanding</text><text x=\"300.0\" y=\"97.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">spell / segment / attributes / intent</text><text x=\"556\" y=\"90\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">8 ms</text><line x1=\"300\" y1=\"106\" x2=\"300\" y2=\"138\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><text x=\"310\" y=\"126\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">structured query</text><line x1=\"130\" y1=\"138\" x2=\"470\" y2=\"138\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><line x1=\"130\" y1=\"138\" x2=\"130\" y2=\"156\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><rect x=\"55\" y=\"156\" width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Lexical</text><text x=\"130.0\" y=\"192.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">BM25F</text><line x1=\"130\" y1=\"202\" x2=\"130\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><line x1=\"300\" y1=\"138\" x2=\"300\" y2=\"156\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><rect x=\"225\" y=\"156\" width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Dense</text><text x=\"300.0\" y=\"192.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">two-tower + HNSW</text><line x1=\"300\" y1=\"202\" x2=\"300\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><line x1=\"470\" y1=\"138\" x2=\"470\" y2=\"156\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><rect x=\"395\" y=\"156\" width=\"150\" height=\"46\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"470.0\" y=\"176.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Behavioural</text><text x=\"470.0\" y=\"192.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">q to item, from logs</text><line x1=\"470\" y1=\"202\" x2=\"470\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><text x=\"556\" y=\"180\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">25 ms</text><text x=\"556\" y=\"195\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--faint)\">in parallel</text><line x1=\"130\" y1=\"220\" x2=\"470\" y2=\"220\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/><line x1=\"300\" y1=\"220\" x2=\"300\" y2=\"242\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><rect x=\"200\" y=\"242\" width=\"200\" height=\"32\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"262.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Fusion (RRF)</text><line x1=\"18\" y1=\"292\" x2=\"682\" y2=\"292\" stroke=\"var(--flag)\" stroke-width=\"1.1\" stroke-dasharray=\"5 3\"/><text x=\"18\" y=\"287\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--flag)\">RECALL IS SET ABOVE THIS LINE AND NEVER RECOVERED</text><text x=\"682\" y=\"287\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--flag)\">everything below only REORDERS</text><line x1=\"300\" y1=\"274\" x2=\"300\" y2=\"310\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><text x=\"310\" y=\"306\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">~1000 candidates</text><rect x=\"150\" y=\"310\" width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"326.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">L1 ranker</text><text x=\"300.0\" y=\"342.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">cheap; trained to imitate L2</text><text x=\"556\" y=\"333\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">8 ms</text><line x1=\"300\" y1=\"348\" x2=\"300\" y2=\"382\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><text x=\"310\" y=\"378\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">top ~150</text><rect x=\"150\" y=\"382\" width=\"300\" height=\"44\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"401.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">L2 ranker</text><text x=\"300.0\" y=\"417.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">pCTR | pCVR | pRel, calibrated</text><text x=\"556\" y=\"409\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">22 ms</text><line x1=\"300\" y1=\"426\" x2=\"300\" y2=\"460\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><text x=\"310\" y=\"456\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">top ~50</text><rect x=\"150\" y=\"460\" width=\"300\" height=\"38\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"476.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Slate policy</text><text x=\"300.0\" y=\"492.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">dedup / diversity / blend</text><text x=\"556\" y=\"483\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--accent)\">5 ms</text><line x1=\"300\" y1=\"498\" x2=\"300\" y2=\"524\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-funnel)\"/><text x=\"300\" y=\"540\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">24 products on the phone</text></svg><figcaption>Figure 1. The funnel. Each stage sees roughly ten times fewer items and costs ten times more per item, which is why every stage takes about the same wall-clock.</figcaption></figure>\n<div class=\"decide\"><div class=\"dt\">How many retrieval arms?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Lexical + dense + behavioural, fused</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Dense only, which is what the prompt&#x27;s wording tempts you into</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">they fail on disjoint query populations. Dense dies on part numbers and rare identifiers; lexical dies on the paraphrase in the prompt; behavioural is empty on the tail and unbeatable on the head.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">three indexes to keep in sync, and a fusion layer that has to be learned rather than constant</span></div><div class=\"drow\"><span class=\"dk drop-it-if\">DROP IT IF</span><span class=\"dv\">the dense arm&#x27;s unique contribution -- clicked items only it retrieved -- turns out to be small. Measure, do not assume.</span></div></div>\n<p>Three things to say while you draw it.</p>\n<p><strong>The three retrieval arms exist because they fail on disjoint query populations.</strong> Lexical nails exact tokens and part numbers and dies on paraphrase. Dense nails paraphrase and intent and dies on rare identifiers. Behavioural — a query-to-item table mined from six months of logs — beats both on head queries and has nothing at all for the tail. The tail query in the prompt is precisely the case where only the dense arm helps, which is why the question is worded the way it is.</p>\n<p><strong>Recall is set here and can never be recovered.</strong> Everything downstream only reorders. So retrieval gets measured on recall, ranking on order, and confusing the two produces months of wasted experiments.</p>\n<p><strong>L1 exists to protect L2&#x27;s budget.</strong> A cheap model over 1000 candidates lets the expensive model see 150. Without it you either score 1000 with something cheap, or blow the budget.</p>\n<h3>The latency budget, and three ways to spend it</h3>\n<p>I am assuming 100 ms is end-to-end server-side p99, which is the harder reading. Fan-out costs are real and candidates routinely forget them: serialisation, merge, and network between services will eat 15–25 ms before any model runs.</p>\n<p><strong>Option A — all-CPU, no cross-encoder.</strong></p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 190\" role=\"img\" aria-label=\"Three latency budgets against a 100 ms p99 line: all-CPU fits, adding a cross-encoder to the blocking path does not, and progressive ranking moves it off the blocking path\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-latency\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-latency\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-latency\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"132\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"150\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">QU 8</text><rect x=\"187.2\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--accent)\" stroke=\"var(--rule)\"/><text x=\"205.2\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">retrieval 25</text><rect x=\"281.6\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--rule)\" stroke=\"var(--rule)\"/><text x=\"299.6\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">fusion 2</text><rect x=\"359.20000000000005\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--rule)\"/><text x=\"377.20000000000005\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">L1 8</text><rect x=\"414.40000000000003\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--accent)\" stroke=\"var(--rule)\"/><text x=\"432.40000000000003\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">L2 22</text><rect x=\"469.6\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--rule)\" stroke=\"var(--rule)\"/><text x=\"487.6\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">policy 5</text><rect x=\"547.2\" y=\"8\" width=\"14\" height=\"10\" rx=\"2\" fill=\"var(--raise)\" stroke=\"var(--rule)\"/><text x=\"565.2\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">overhead 18</text><text x=\"8\" y=\"17\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--ink)\">STAGES</text><text x=\"8\" y=\"54\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">A   all-CPU</text><rect x=\"132\" y=\"38\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"164.0\" y=\"38\" width=\"100.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"214.0\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">25</text><rect x=\"264.0\" y=\"38\" width=\"8.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"272.0\" y=\"38\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"304.0\" y=\"38\" width=\"88.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"348.0\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">22</text><rect x=\"392.0\" y=\"38\" width=\"20.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"412.0\" y=\"38\" width=\"72.0\" height=\"24\" fill=\"var(--raise)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"448.0\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">18</text><text x=\"492.0\" y=\"54\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--muted)\">88 ms</text><text x=\"8\" y=\"71\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--faint)\">12 ms of headroom. Ship this first.</text><text x=\"8\" y=\"108\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">B   + x-encoder</text><rect x=\"132\" y=\"92\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"164.0\" y=\"92\" width=\"100.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"214.0\" y=\"108\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">25</text><rect x=\"264.0\" y=\"92\" width=\"8.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"272.0\" y=\"92\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"304.0\" y=\"92\" width=\"88.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"348.0\" y=\"108\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">22</text><rect x=\"392.0\" y=\"92\" width=\"20.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"412.0\" y=\"92\" width=\"72.0\" height=\"24\" fill=\"var(--raise)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"448.0\" y=\"108\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">18</text><rect x=\"484.0\" y=\"92\" width=\"60.0\" height=\"24\" fill=\"var(--flag-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"514.0\" y=\"108\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">15</text><text x=\"552.0\" y=\"108\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--flag)\">103 ms</text><text x=\"8\" y=\"125\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--faint)\">over budget, and p99 is now hostage to GPU batch queueing</text><text x=\"8\" y=\"162\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">C   progressive</text><rect x=\"132\" y=\"146\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"164.0\" y=\"146\" width=\"100.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"214.0\" y=\"162\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">25</text><rect x=\"264.0\" y=\"146\" width=\"8.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"272.0\" y=\"146\" width=\"32.0\" height=\"24\" fill=\"var(--accent-soft)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"304.0\" y=\"146\" width=\"88.0\" height=\"24\" fill=\"var(--accent)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"348.0\" y=\"162\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">22</text><rect x=\"392.0\" y=\"146\" width=\"20.0\" height=\"24\" fill=\"var(--rule)\" stroke=\"var(--card)\" stroke-width=\"1\"/><rect x=\"412.0\" y=\"146\" width=\"72.0\" height=\"24\" fill=\"var(--raise)\" stroke=\"var(--card)\" stroke-width=\"1\"/><text x=\"448.0\" y=\"162\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" fill=\"var(--ink)\">18</text><text x=\"492.0\" y=\"162\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11.5\" font-weight=\"600\" fill=\"var(--accent)\">88 ms</text><text x=\"8\" y=\"179\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--faint)\">same blocking path; the x-encoder runs OFF it</text><rect x=\"546.0\" y=\"146\" width=\"60.0\" height=\"24\" rx=\"3\" fill=\"var(--flag-soft)\" stroke=\"var(--accent)\" stroke-dasharray=\"4 3\"/><text x=\"576.0\" y=\"163\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--accent)\">15 async</text><line x1=\"532.0\" y1=\"30\" x2=\"532.0\" y2=\"182\" stroke=\"var(--flag)\" stroke-width=\"1.4\" stroke-dasharray=\"5 3\"/><text x=\"538.0\" y=\"28\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--flag)\">100 ms p99</text></svg><figcaption>Figure 2. Three ways to spend 100 ms. A already leaves only 12 ms of headroom, which is why the cross-encoder does not fit in the blocking path at all.</figcaption></figure>\n<p>Twelve milliseconds of headroom, and everything runs on commodity CPU. This is what I would ship first.</p>\n<p><strong>Option B — put a cross-encoder reranker over the top 50.</strong> A 6-layer MiniLM-class model at 128 tokens, batch 50, runs in roughly 10–15 ms on a T4-class GPU. That is ~103 ms and it is over budget before you have accounted for anything going wrong. And the way it goes wrong is specific: under load, GPU batch formation and admission control dominate, and the tail of a GPU service is far worse behaved than its median — so the number you actually measure at p99 will be worse than 103.</p>\n<p><strong>Option C — progressive ranking, which is the answer I would defend.</strong></p>\n<p>The tempting move is to make the expensive path rare: route tail queries through the cross-encoder and head queries around it. <strong>That does not work, and knowing why is the point.</strong> p99 <em>is</em> the tail. If 30% of queries take 103 ms, then p99 is 103 ms — making the expensive path rare only helps if &quot;rare&quot; means under one percent, and by then it is not doing enough work to matter.</p>\n<p>The same reasoning kills the other reflex. <strong>Caching the head does not help your p99 either</strong>, for exactly the same reason: the cached queries are the fast ones, and p99 is measured on the slow ones. A query cache is a cost and median-latency win, not an SLO win, and saying so unprompted is a small but real signal.</p>\n<p>What does work is taking the expensive model off the blocking path. On a mobile grid the first screen is four to six items. Serve those from the cheap path inside budget, then run the cross-encoder over the remaining candidates during the user&#x27;s dwell time and deliver the reordered result with the next scroll page. The blocking p99 stays at 88 ms; the cross-encoder still improves the session. It costs you a more complicated client contract and a reordering that must be stable enough not to feel like the page is shuffling under the user.</p>\n<p>There is still a role for adaptive depth, but on the retrieval side rather than the ranking side: give tail queries a larger <code>ef_search</code> and deeper candidate sets, since that cost sits inside the parallel arms where there is slack.</p>\n<p>One policy to state without being asked: <strong>never degrade by silently dropping a retrieval arm on timeout.</strong> That converts a latency problem into an invisible quality problem that shows up weeks later as an unattributable relevance regression. Degrade by reducing depth — lower <code>ef_search</code>, fewer L2 candidates — and emit a metric every time you do, so the degradation is measurable.</p>\n<h2>Query understanding on the tail</h2>\n<p>Take the query in the prompt apart on the board, because it demonstrates the problem better than any description of it.</p>\n<div class=\"tw\"><table><thead><tr><th>Token</th><th>What it is</th><th>Binds to</th></tr></thead><tbody><tr><td>durable</td><td>quality attribute, soft</td><td>no catalogue field at all</td></tr><tr><td>lightweight</td><td>physical attribute</td><td>sometimes in specs, usually only in free text</td></tr><tr><td>winter</td><td>season / use-case</td><td>insulation, waterproofing</td></tr><tr><td><strong>boots</strong></td><td><strong>head noun</strong></td><td><strong>category — the one hard constraint</strong></td></tr><tr><td>for toddlers</td><td>audience</td><td>age 1–3, so a size band — a real filter</td></tr></tbody></table></div>\n<p><strong>Hard constraints:</strong> category = boots, audience = toddler. <strong>Soft preferences:</strong> durable, lightweight, winter-appropriate. <strong>What BM25 sees:</strong> six tokens, each appearing in thousands of listings and almost never co-occurring.</p>\n<div class=\"co trap\"><span class=\"col\">The trap</span>Read the example query back to her before you answer. &quot;Durable lightweight winter boots for toddlers&quot; is not decoration -- it was chosen so that lexical retrieval fails, and demonstrating that you noticed is worth more than any architecture you propose in the next five minutes.</div>\n<p>Now the point: <strong>BM25 will return either nothing or garbage here.</strong> Require all six terms and you get near-zero results because no title contains them all. Relax to OR-with-coordination and the scoring is dominated by whichever term is rarest — probably &quot;toddlers&quot; — so you retrieve toddler clothing rather than boots. This is the classic tail failure, and it is why the dense arm is not optional.</p>\n<p>What I would build:</p>\n<p><strong>Head-noun and category prediction, with a confidence gate.</strong> Getting <code>category = boots</code> right is worth more than everything else in query understanding combined. Predict it, and apply it as a retrieval filter <em>only</em> above a high confidence threshold, with a fallback pass that re-runs unfiltered if the filtered pass returns too few. Below threshold it goes in as a ranking feature. The asymmetry matters: a wrong filter deletes results with no recovery, a wrong feature just gets outvoted.</p>\n<p><strong>Attribute extraction as sequence labelling</strong>, trained on catalogue structured data rather than hand annotation. You already know each product&#x27;s category, audience, colour, size. Reverse that into weak labels over the query side by mining queries that led to purchases of products with a given attribute. Six months of logs is exactly what this needs.</p>\n<p><strong>Precompute the head, model the tail.</strong> The top few thousand queries carry a large share of sessions. Precompute their entire understanding offline, review them, and serve from a lookup. That gives you editorial control where the traffic is, costs nothing at serving time, and leaves the live model path for the tail — which is also where you can afford deeper retrieval, per Option C.</p>\n<p><strong>Where an LLM belongs here.</strong> Offline, generating attribute annotations and query rewrites for the tail, distilled into a small model or baked into a table. Not in the 8 ms online path. Say this unprompted; it is a question she will otherwise ask.</p>\n<h2>Retrieval: half the answer</h2>\n<h3>The architecture, and the asymmetry that defines it</h3>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 292\" role=\"img\" aria-label=\"Two-tower retriever: a small online query tower and a much larger offline item tower meeting at a dot product\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-two-tower\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-two-tower\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-two-tower\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"8\" y=\"8\" width=\"330\" height=\"212\" rx=\"8\" fill=\"var(--raise)\" stroke=\"var(--rule)\" stroke-dasharray=\"5 4\"/><rect x=\"354\" y=\"8\" width=\"338\" height=\"212\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-dasharray=\"5 4\"/><text x=\"20\" y=\"28\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--muted)\">ONLINE  -  every request, ~5 ms</text><text x=\"366\" y=\"28\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--accent)\">OFFLINE  -  once a night, 10M items, no budget</text><rect x=\"48\" y=\"44\" width=\"250\" height=\"40\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"173.0\" y=\"68.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">\"winter boots for toddlers\"</text><line x1=\"173\" y1=\"84\" x2=\"173\" y2=\"104\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-two-tower)\"/><rect x=\"78\" y=\"104\" width=\"190\" height=\"54\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"173.0\" y=\"128.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Query tower</text><text x=\"173.0\" y=\"144.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">4-6 layers, distilled</text><text x=\"173\" y=\"176\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">f(q)</text><line x1=\"173\" y1=\"158\" x2=\"173\" y2=\"166\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-two-tower)\"/><rect x=\"390\" y=\"44\" width=\"266\" height=\"40\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"523.0\" y=\"68.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">title + brand + attrs + bullets</text><line x1=\"523\" y1=\"84\" x2=\"523\" y2=\"104\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-two-tower)\"/><rect x=\"404\" y=\"104\" width=\"238\" height=\"84\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"523.0\" y=\"143.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Item tower</text><text x=\"523.0\" y=\"159.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">12+ layers, image features</text><text x=\"523\" y=\"210\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"13\" font-weight=\"600\" fill=\"var(--accent)\">g(d)</text><line x1=\"523\" y1=\"188\" x2=\"523\" y2=\"198\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-two-tower)\"/><line x1=\"173\" y1=\"186\" x2=\"300\" y2=\"244\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-two-tower)\"/><line x1=\"523\" y1=\"224\" x2=\"400\" y2=\"244\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-two-tower)\"/><rect x=\"230\" y=\"244\" width=\"240\" height=\"36\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"266.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">s(q,d) = &lt;f(q), g(d)&gt;</text></svg><figcaption>Figure 4. The two towers are deliberately different sizes. The item tower can be large precisely because nobody is waiting for it -- that is free capacity most candidates leave on the table by drawing two identical boxes.</figcaption></figure>\n<p>State the asymmetry explicitly, because most candidates draw two identical boxes. <strong>The item tower runs offline over 10M products once a night; the query tower runs inside your latency budget on every request.</strong> So you can afford a large item encoder and you cannot afford a large query encoder. That is free capacity most people leave on the table — and it is the reason two-tower beats a single shared encoder in production even though sharing weights looks tidier.</p>\n<p>The other consequence of the architecture: query and item never interact before the dot product. That is what makes ANN possible, and it is also the ceiling on quality. No amount of training makes a two-tower model reason about the interaction between &quot;lightweight&quot; and a particular boot&#x27;s spec sheet the way a cross-encoder can. So the two-tower&#x27;s job is recall, and you accept that. That ceiling has a formal shape -- a dual encoder needs embedding dimension growing linearly with corpus size to express arbitrary rankings -- which is worth one sentence if she pushes on generative retrieval. It is in the next-generation chapter, not in this design.</p>\n<h3>Where the positives come from</h3>\n<p>Six months of logs, and the choice of positive is a modelling decision, not a data-loading detail. Three questions in order: which actions count, how much each is worth, and what the resulting table looks like.</p>\n<h4>The action ladder</h4>\n<div class=\"tw\"><table><thead><tr><th>Action</th><th>Count, 6 months</th><th>Rate</th><th>What it is evidence of</th><th>Value $v(a)$</th></tr></thead><tbody><tr><td>Impression</td><td>~62B</td><td>~20 / search</td><td>the ranker&#x27;s opinion, not the user&#x27;s</td><td>baseline, 0</td></tr><tr><td>Click</td><td>~1.2B</td><td>0.4 / search</td><td>interest <strong>given the thumbnail and price</strong></td><td>1.0</td></tr><tr><td>Add to cart</td><td>~180M</td><td>0.06 / search</td><td>genuine consideration</td><td>1.9</td></tr><tr><td>Purchase</td><td>~60M</td><td>0.02 / search</td><td>intent satisfied</td><td>2.6</td></tr><tr><td>Purchase, returned</td><td>~6M</td><td>10% of purchases</td><td>relevant, but did not fit</td><td>1.6</td></tr></tbody></table></div>\n<p>The naive choice is clicks, because there are 1.2 billion of them. The problem is that a click in commerce is driven by the thumbnail and the price as much as by relevance, so a click-trained retriever learns attractiveness. The naive correction is to train on purchases only — but 60M events spread across 10M products is far too sparse for the tail, and the tail is the question.</p>\n<p>So: <strong>train on clicks for coverage, and weight by the downstream action.</strong></p>\n<h4>How the values are derived, not chosen</h4>\n<p>This is the part worth being precise about, because &quot;a purchase is worth more&quot; is not an answer — <em>how much</em> more is the answer, and picking it by taste is how you end up with a model nobody can debug.</p>\n<p>The weight should be monotone in <strong>the posterior probability that this item is genuinely relevant to this query, given that this action happened.</strong> That is measurable. Take a few thousand query-item pairs, stratified by which action they received, have humans judge relevance, and compute $P(\\text{rel} \\mid a)$ per action. Then set the value to the log-odds, with impression as the baseline:</p>\n<div class=\"mathbox\">$$v(a) \\;=\\; \\mathrm{logit}\\,P(\\text{rel} \\mid a) \\;-\\; \\mathrm{logit}\\,P(\\text{rel} \\mid \\text{impression})$$</div>\n<p>normalised so a click is 1.0. A few thousand judgements is a day of annotation and it converts every weight in the pipeline from an opinion into a measurement.</p>\n<div class=\"co trap\"><span class=\"col\">The trap</span>The calibrated values come out far flatter than intuition. Most people reach for a purchase being ten times a click; the likelihood ratio says about two and a half. The click already carries most of the relevance evidence — the purchase adds price, availability and delivery, which are ranking concerns, not retrieval ones. Say this out loud; it is the kind of thing that only comes from having measured it.</div>\n<p>The returns row carries the same lesson and is worth volunteering. A returned purchase is <strong>still good evidence of relevance</strong> — the customer searched, found it, and bought it. The return usually means fit or quality, not the wrong product. So returns barely move the retriever and matter enormously to the ranker.</p>\n<div class=\"co say\"><span class=\"col\">Say this</span>Returns are a ranking signal, not a retrieval signal. The item was relevant; it just did not fit. I would penalise them heavily in the expected-value objective and almost not at all in the retriever&#x27;s positives.</div>\n<h4>Scoring one pair</h4>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 214\" role=\"img\" aria-label=\"Computing one positive's training weight from six months of events: action counts times values calibrated against human judgements, log-compressed, divided by examination propensity, then normalised\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-positives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-positives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-positives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><text x=\"8\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--muted)\">ONE (query, item) PAIR OVER SIX MONTHS</text><rect x=\"8\" y=\"26\" width=\"196\" height=\"132\" rx=\"7\" fill=\"var(--raise)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"48\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--faint)\">412</text><text x=\"32\" y=\"48\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--faint)\">impressions</text><text x=\"24\" y=\"70\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">37</text><text x=\"32\" y=\"70\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">clicks</text><text x=\"196\" y=\"70\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--accent)\">x 1.0</text><text x=\"24\" y=\"92\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">6</text><text x=\"32\" y=\"92\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">add-to-cart</text><text x=\"196\" y=\"92\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--accent)\">x 1.9</text><text x=\"24\" y=\"114\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--ink)\">3</text><text x=\"32\" y=\"114\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--ink)\">purchases</text><text x=\"196\" y=\"114\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--accent)\">x 2.6</text><text x=\"24\" y=\"136\" text-anchor=\"end\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"12\" font-weight=\"600\" fill=\"var(--faint)\">0</text><text x=\"32\" y=\"136\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"400\" fill=\"var(--faint)\">returns</text><text x=\"8\" y=\"176\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--flag)\">mean rank 4.2</text><text x=\"232\" y=\"40\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--accent)\">CALIBRATED VALUES</text><text x=\"232\" y=\"56\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">from a human-judged</text><text x=\"232\" y=\"71\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">sample, not from taste:</text><text x=\"232\" y=\"90\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\">v(a) = logit P(rel | a)</text><text x=\"232\" y=\"105\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\">     - logit P(rel | impr)</text><text x=\"232\" y=\"128\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">click 1.0   ATC 1.9</text><text x=\"232\" y=\"143\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">purchase 2.6</text><text x=\"232\" y=\"164\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">far flatter than intuition</text><text x=\"232\" y=\"179\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">says -- the click already</text><text x=\"232\" y=\"194\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--flag)\">carries most of the signal</text><line x1=\"210\" y1=\"92\" x2=\"226\" y2=\"92\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-positives)\"/><line x1=\"430\" y1=\"92\" x2=\"452\" y2=\"92\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-positives)\"/><rect x=\"458\" y=\"26\" width=\"234\" height=\"176\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"470\" y=\"50\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\">raw  = 37(1.0)+6(1.9)+3(2.6)</text><text x=\"470\" y=\"67\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">     = 56.2</text><text x=\"470\" y=\"84\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\"></text><text x=\"470\" y=\"101\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\">log(1 + raw)      = 4.05</text><text x=\"470\" y=\"118\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--ink)\">/ propensity(4.2) = 0.55</text><text x=\"470\" y=\"135\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--faint)\">------------------------</text><text x=\"470\" y=\"152\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">w_pair            = 7.36</text><text x=\"470\" y=\"169\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">normalised to mean 1</text><text x=\"470\" y=\"186\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">w                 = 2.45</text></svg><figcaption>Figure 4b. The weight for one (query, item) positive. Counts times calibrated values, log-compressed so a pair with ten thousand clicks does not get ten thousand times the weight of one with a single click, then divided by examination propensit
