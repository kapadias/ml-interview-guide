it works when the tasks are genuinely aligned — click and add-to-cart, say. When they aren't, the trunk gets pulled in conflicting directions and both tasks end up worse than single-task models. That's negative transfer, and it's the failure everyone hits first.\n\nMMoE replaces the single trunk with several expert networks plus a per-task gating network that learns a soft mixture over them. Tasks that are similar learn similar gates and share experts; tasks that conflict learn to route to different ones. So sharing becomes learned rather than architectural, which is the whole contribution. The cost is more parameters and a gate that can collapse onto one expert if you're not watching.\n\nPLE goes further: it splits experts into shared ones and task-specific ones explicitly, so each task always has private capacity that no other task can disturb, and stacks the whole thing in layers. That's the answer when you have tasks that genuinely conflict — CTR and CVR and dwell time and return rate — because it guarantees a floor of private capacity rather than hoping the gate finds it.\n\nMy default for commerce ranking is to start with shared-bottom, measure per-task against single-task baselines to detect negative transfer, and escalate to MMoE and then PLE only when that measurement says to. Escalating without the measurement is how people end up serving a model with four times the parameters and no gain.\n\nAnd the thing that actually matters more than the architecture choice: task loss weighting. Get that wrong and none of these help.","numbers":["Diagnostic: compare each task head against a single-task model trained alone - a drop is negative transfer"],"red_flags":["Choosing PLE by default without measuring negative transfer first.","Not mentioning gate collapse as an MMoE failure mode.","Ignoring task loss weighting, which usually dominates the architecture choice."],"followups":["How do you set the task loss weights? Uncertainty weighting or hand-tuned?","How do you diagnose gate collapse in production?","What do you do when one task has 100x less data than another?"],"section":"Ranking and personalization","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":32,"question":"Explain the sample selection bias problem in CVR prediction. How does ESMM solve it?","say":"The bias is that you train CVR on clicked impressions and serve it on all impressions, so train and serve see different distributions — and the gap is exactly the thing your ranker is trying to change.\n\nConversion is only observed after a click, so the natural training set is clicked items with a convert/no-convert label. But at serving time you score every candidate, including ones that would never have been clicked. The clicked subset is heavily selected — those items were attractive, well-ranked, and well-matched — so a model trained on them systematically misestimates on the rest. On top of that, clicks are a tiny fraction of impressions, so the CVR training set is orders of magnitude smaller than the CTR one and the model is data-starved precisely where it needs to be precise.\n\nESMM's trick is to never train CVR directly. It trains two models on the full impression space — CTR, and CTCVR, the probability of click *and* conversion — both of which have labels on every impression. Then it defines CTCVR as CTR times CVR, so the CVR tower is learned implicitly as the ratio, supervised only through that product. The CVR tower never sees a loss of its own.\n\nTwo consequences worth stating. The bias is gone because both supervised tasks are defined over all impressions. And the CVR tower gets a transfer benefit, because the embeddings are shared with the CTR task, which has vastly more data.\n\nThe practical caveat: the multiplication makes it numerically touchy when CTR is small, and a poorly calibrated CTR tower propagates straight into CVR.","numbers":["CTCVR = CTR x CVR, with CTR and CTCVR both supervised on the full impression space","Clicked impressions are typically 1-5% of all impressions - the CVR training set is that much smaller"],"red_flags":["Describing it as a multi-task trick without naming the selection bias it removes.","Not knowing the CVR tower has no direct loss.","Missing the numerical instability when the CTR estimate is near zero."],"followups":["What happens if your CTR tower is miscalibrated?","How does this interact with delayed conversions?","Would you still need calibration on the CVR output?"],"section":"Ranking and personalization","level":"L6","type":"Conceptual","source":"written for this loop"},{"id":33,"question":"Two-Tower vs. interaction-based models for candidate generation—when would you use each?","say":"Two-tower for candidate generation, interaction-based for ranking, and the reason is the computational budget at each stage rather than which model is more accurate.\n\nCandidate generation takes ten million items down to a thousand, and the only thing that works at that width is a model whose item side can be precomputed. Two-tower encodes user and item independently and scores by dot product, so item embeddings go into an ANN index offline and serving is one user-tower pass plus a sub-millisecond lookup, independent of catalog size. What you pay is expressiveness — the dot product is the only interaction, so there are no cross-features at all.\n\nRanking takes a thousand down to a hundred, so you can afford a forward pass per candidate, and that's where interaction-based models earn their keep. DLRM, DCN, DIN — cross networks, attention over behavior history, MLPs over the joint feature set. They capture things a two-tower structurally cannot, like a user who buys cheap items in one category and premium in another. And by definition they can't be precomputed, because the score depends on the pair.\n\nThe hybrid worth raising is pushing lightweight interaction into the two-tower without losing precomputation — query-item attention inside the item tower at training time, or distilling the ranker into the retrieval model. Retrieval quality goes up and the serving shape doesn't change.","numbers":["Candidate generation ~10M → 1K; ranking ~1K → 100"],"red_flags":["\"Always use interaction-based models, they're more accurate\" — ignores the computational constraint at retrieval.","Not recognizing that the pipeline stage's budget is what drives the choice.","Conflating retrieval and ranking, which have fundamentally different constraints."],"followups":["Can you make a two-tower model more expressive without losing precomputation?","How do you generate hard negatives for two-tower training?","Which ANN algorithm would you use and why?"],"section":"Ranking and personalization","level":"L5","type":"Trade-off","source":"drill deck"},{"id":34,"question":"How do you handle the cold start problem for new users and new items?","say":"Cold start is a data problem, not a modeling problem: the system's job is to collect useful signal fast, and the model is downstream of that.\n\nSplit it into users and items, because they need opposite things. For a new user you have no interactions but you're not blind - device, locale, referral source, sometimes a social login. Serve popularity and content-based recommendations conditioned on whatever you have, ask for a few explicit preferences at onboarding if the product tolerates it, and run a contextual bandit, Thompson sampling or epsilon-greedy, so the first few interactions actively buy information instead of exploiting a weak prior.\n\nFor a new item it's the opposite: rich content, no behavior. Use content features - title, description, images, category, price - to place the item near similar known items in embedding space so it inherits their collaborative signal until it has its own, which is where CLIP-style cross-modal embeddings help. Then explicitly budget exploration: force it in front of a small slice of traffic to earn interaction data, and apply inverse propensity weighting when you train on that data so you don't bake the exploration policy into the model.\n\nThe failure I'd call out is treating exploration purely as a cost. If nothing is shown, nothing is learned, and the tail of the catalog stays permanently cold.","red_flags":["\"Just use collaborative filtering\" - there is nothing to collaborate on yet.","No exploration story, so new items never accumulate the data that would rank them.","Doesn't separate user cold start from item cold start; they need opposite fixes."],"followups":["How do you balance exploration against exploitation here?","When does an item stop being cold?","How would you evaluate whether the cold-start path is working?"],"section":"Ranking and personalization","level":"L5","type":"Conceptual","source":"drill deck"},{"id":35,"question":"Why do recommendation models need calibration? What happens if pCTR is systematically over-confident?","say":"Because the predicted probability isn't only used for ordering - it's consumed as a number in downstream decisions, and those break when it's wrong even if the ranking is perfect.\n\nThree places it's used as an absolute value. Auction pricing: ad rank is pCTR times bid, and what the advertiser is charged is a function of pCTR, so miscalibration is directly mispricing. Budget pacing: the system estimates expected spend per impression from pCTR to spread a daily budget evenly. And absolute thresholds - suppress anything below some pCTR - where a shift changes which items pass at all.\n\nIf pCTR is systematically two times too high, here's the chain. Advertisers overpay for clicks that don't arrive, so measured ROI drops. Budgets burn out faster, so campaigns go dark by mid-afternoon, leaving inventory unfilled with fewer bidders competing - revenue falls at exactly the time of day you needed it. Then the slow damage: advertisers who consistently overpay lower their bids or leave.\n\nAnd here's what makes it insidious. If the overconfidence is uniform, the ranking is completely unchanged. The same ads win in the same order, AUC looks great, every ranking metric on your dashboard looks great. All the damage is in pricing and pacing, which is exactly why calibration has to be monitored separately from AUC.","numbers":["Ad rank = pCTR x bid, so a 2x-overconfident pCTR leaves ranking untouched and doubles implied value"],"red_flags":["\"Calibration doesn't matter if the ranking is correct\" - true for ordering, false for pricing and pacing.","Can't separate ranking quality from calibration quality, or assumes AUC covers both.","Treats calibration as a nice-to-have rather than a revenue-critical property."],"followups":["How would you measure calibration?","Which recalibration method would you use, and why?","How often do you need to recalibrate?"],"section":"Ranking and personalization","level":"L5","type":"Conceptual","source":"drill deck"},{"id":36,"question":"Your CTR model's offline AUC improved by 0.5% but online revenue dropped 3%. Diagnose.","say":"Calibration, first hypothesis, before anything else. A 0.5 percent AUC lift is real, so the model genuinely ranks better — but AUC is invariant to any monotone transform of the scores, and the auction doesn't consume ranks, it consumes probabilities. If the new model over-predicts pCTR by, say, one and a half times, you're charging advertisers above fair value, their daily budgets burn out earlier in the day, and you lose fill in the afternoon. Better ranking, less revenue. The diagnosis is a reliability plot — predicted versus actual CTR by decile — and if it's off the diagonal, recalibrate and rerun.\n\nSecond, ask what the model did to the auction rather than to the ranking. Revenue is pCTR times bid, and AUC knows nothing about bids. If the new model shifted impressions toward higher-true-CTR but lower-bid advertisers, you lose money with a genuinely better model. Compare average winning bid and auction density before and after.\n\nThen the boring ones that are common anyway: training-serving skew — log the features actually computed at serving time and diff them against offline features for the same impressions — and offline-online distribution shift, where your test slice just isn't current traffic.\n\nThe general lesson I'd state: for any model feeding an auction or a threshold, calibration is a launch gate, not a nice-to-have. AUC alone should never be enough to clear a model to ship.","red_flags":["\"0.5% AUC is probably noise\" — at this scale that's a meaningful, reproducible lift.","Not putting calibration first when the downstream consumer is an auction.","Blaming the A/B infrastructure before investigating model-level causes."],"followups":["How would you fix the calibration?","What guardrail metrics would you add to the experiment?","How do you stop this happening on the next launch?"],"section":"Ranking and personalization","level":"L6","type":"Debugging","source":"drill deck"},{"id":37,"question":"Estimate the memory required for DLRM embedding tables with 100M users, 10M items, and 1000 categorical features.","say":"Around 70 gigabytes of embedding tables in FP32, and the interesting part is which term dominates. Users are the biggest single table — 100 million times 128 dimensions times 4 bytes is 51 gigabytes. Items at 10 million are only 5. So the user table alone is most of the user-plus-item total.\n\nFor the thousand categorical features I'd bucket by cardinality rather than pretend they're uniform, and state the assumption out loud. Say fifty high-cardinality features like city or campaign ID at about a million entries each, a couple of hundred medium ones around ten thousand, and the remaining several hundred at a hundred or so, all at dimension 64. The high-cardinality group comes out at 13 gigabytes, medium at half a gigabyte, and the low-cardinality group is noise — under 20 megabytes. Total lands near 70.\n\nThe MLP is under a hundred million parameters, well under a gigabyte, which is the structural point about DLRM: it's a memory system with a small compute head attached.\n\nTraining is where it bites. Adam keeps two moments per parameter, so 12 bytes rather than 4 — call it 210 gigabytes. That doesn't fit on a single accelerator, so you shard the embedding tables model-parallel across GPUs and run the MLP data-parallel. At Meta scale the ID space is in the billions and there are thousands of features, which is how you get to trillion-parameter recommenders.","numbers":["Users 100M × 128 × 4B = 51.2 GB; items = 5.1 GB","Total tables ≈ 70 GB; with Adam state ≈ 210 GB","Adam training: 12 bytes per parameter"],"red_flags":["Forgetting optimizer state — Adam triples parameter memory","Assuming all 1000 features share one vocabulary size","Not noticing that the user table dominates and the MLP is negligible"],"followups":["How would you shard these tables across GPUs?","What breaks if you double the embedding dimension?","How much would mixed-dimension embeddings save?"],"section":"Ranking and personalization","level":"L6","type":"Estimation","source":"drill deck"},{"id":38,"question":"Interleaving vs A/B testing for a ranking change. How does team-draft interleaving work, and when would it mislead you?","say":"Interleaving is dramatically more sensitive than an A/B test because it removes between-user variance — every user sees both rankers, so each user is their own control.\n\nTeam-draft works like picking teams in a playground. Both rankers produce a ranked list. You flip a coin, the winning ranker contributes its top unused result, then the other contributes its top unused result, alternating, with the coin flip re-run each round to avoid a systematic first-slot advantage. You record which team each shown result came from. Then you count clicks by team, and the ranker whose results got more clicks wins that impression. Aggregate over impressions and run a sign test.\n\nThe sensitivity gain is large — commonly cited as one to two orders of magnitude less traffic for the same statistical power, so a comparison that needs a two-week A/B resolves in hours. For a ranking team shipping frequently, that changes what's possible.\n\nWhere it misleads you. It measures relative preference between two lists on the same query — it cannot measure anything about the session or the business. If your new ranker gets more clicks but fewer purchases, or drives the same revenue with more clicks, interleaving says you won and the company lost. It also can't detect effects that need the whole page to be consistent: if the two rankers have different diversity or different price distributions, the interleaved page is a blend that neither ranker would ever produce, and users respond to the blend. And it's blind to novelty and long-term effects entirely.\n\nSo my policy: interleave to choose between candidates cheaply, then A/B the winner to measure the actual business impact before shipping.","numbers":["Interleaving typically needs 10-100x less traffic than A/B for the same power","Team-draft re-flips the coin each round to remove first-slot advantage"],"red_flags":["Claiming interleaving can replace A/B testing rather than pre-filter for it.","Missing that the interleaved page is a blend neither ranker would produce.","Not knowing the coin is re-flipped per round, which is the bias-control detail."],"followups":["What do you do when the two rankers return nearly identical lists?","How would you interleave on a grid layout rather than a list?","Can you interleave three rankers?"],"section":"Evaluation","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":39,"question":"Without launching it, estimate what CTR a new ranking policy would achieve using only logs from the current system.","say":"This is off-policy evaluation, and the estimator is inverse propensity scoring: reweight each logged event by the ratio of the new policy's probability of taking that action to the logging policy's probability.\n\nThe intuition is importance sampling. Your logs are a sample from the old policy's action distribution. You want an expectation under the new policy's distribution. So you reweight each observed reward by how much more or less likely the new policy was to have produced that action. The estimate is the average of propensity-weighted rewards, and it's unbiased provided two conditions hold.\n\nThe conditions are where this lives or dies. First, you must know the logging propensities — which means the logging policy had to be stochastic and you had to record the probabilities. A deterministic ranker gives you propensities of one and zero and the estimator is undefined for everything the new policy would do differently. This is the single biggest reason teams can't do off-policy evaluation: nobody logged the propensities. Second, common support: any action the new policy might take must have had non-zero probability under the old one. If your new ranker surfaces items the old one never showed, you have no data and no amount of maths recovers it.\n\nThe failure mode in practice is variance, not bias. When the policies differ a lot, a few events get enormous weights and dominate the estimate — the effective sample size collapses. The mitigations are weight clipping, which trades bias for variance, self-normalised IPS, and the doubly-robust estimator, which combines IPS with a learned reward model so you're only exposed to variance where the reward model is wrong.\n\nAlways report effective sample size alongside the estimate. Without it the number is uninterpretable.","numbers":["IPS weight = pi_new(a|x) / pi_log(a|x); estimate = mean of weight x reward","Report effective sample size = (sum of weights)^2 / sum of squared weights"],"red_flags":["Not naming the logging-propensity requirement, which is what makes this impossible for most teams.","Ignoring common support - no data means no estimate.","Quoting a point estimate without effective sample size."],"followups":["How would you make your production logging support this going forward?","What does clipping do to the bias-variance trade?","When is doubly robust worse than plain IPS?"],"section":"Evaluation","level":"L7","type":"First Principles","source":"written for this loop"},{"id":40,"question":"Your new recommender lifts NDCG and engagement, but diversity drops, catalogue coverage falls and exposure Gini rises 6 points. Do you ship it?","say":"Not on that evidence, and the deeper problem is that this became a debate at all — it should have been a pre-registered decision rule.\n\nWhy I'd hesitate. Those three numbers together describe a model concentrating exposure on a shrinking set of already-popular items. Short-term that looks great, because popular items convert. The costs are all delayed and all real in a marketplace: sellers of mid-tail inventory lose exposure and eventually leave, which shrinks the catalogue that made you competitive; the feedback loop tightens, because tomorrow's training data comes from today's exposure, so the model's own bias compounds; and you lose the discovery that drives long-term customer value. A 6-point Gini move is not cosmetic — that's a meaningful redistribution of who gets seen.\n\nWhat I'd do rather than argue. Check whether the engagement gain survives when you control for popularity — if the lift is entirely on head items, you've built a popularity ranker with extra steps. Look for the delayed signal: return rate, repeat purchase, session depth, and new-seller retention. And run it long enough to separate novelty from durable effect.\n\nIf the gain holds and I still want it, the fix is usually not to reject the model but to add an exposure constraint at the re-ranking layer — diversify the final list, or apply a fairness-of-exposure objective, and re-measure. You often keep most of the relevance gain for a small fraction of the diversity loss.\n\nThe process answer, which is the one a Staff interviewer is listening for: guardrails and their thresholds get set before the experiment runs, so shipping is a rule and not a negotiation.","numbers":["Gini on exposure: +6 points is a substantial concentration shift, not noise","Check the lift conditioned on item popularity decile before accepting it"],"red_flags":["Shipping on the primary metric because the guardrails were not pre-committed.","Not naming the feedback loop, where today's exposure becomes tomorrow's training data.","Treating diversity as an ethics concern rather than a marketplace supply concern."],"followups":["How would you set the guardrail threshold in advance?","Where in the stack do you enforce diversity, and why there?","How long does the experiment need to run to see seller-side effects?"],"coupang":"Coupang is a marketplace with third-party sellers, so exposure concentration is a supply-side business risk, not just an ML fairness concern.","section":"Evaluation","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":41,"question":"You want to replace most crowd relevance labelling with an LLM judge. Design the program so the labels are trustworthy.","say":"I'd treat the LLM as a labeller that needs the same quality controls as a crowd worker, plus a permanent human anchor set that never goes away.\n\nStart by building a gold set — a few thousand query-product pairs labelled by your best human annotators with adjudicated disagreements. This is the measuring instrument, and it's the thing you never let the LLM touch. Measure LLM agreement against it the way you'd measure a new annotator: Cohen's kappa against the humans, and critically, compare it to human-human agreement. If your annotators agree with each other at 0.7 kappa, an LLM at 0.68 is performing at human level and expecting 0.9 is incoherent.\n\nThen stratify the measurement. Aggregate agreement hides the failure pattern. Break it down by query segment, by category, by language, and by relevance grade — LLM judges are typically good at the extremes and weak in the middle grades, which is exactly where ranking decisions are made.\n\nControls I'd insist on. Position and order randomisation, because these judges have known ordering biases. Calibration of the grade distribution against the human prior, since LLMs drift toward the middle or toward generosity. Self-consistency checks by resampling. And a continuous audit stream where a small random sample of LLM labels goes to humans every week, so drift after a model version change is caught by the process rather than by a confused engineer.\n\nWhat stays human: the gold set, the guideline itself, adjudication of anything the judge is uncertain about, and every label in a new category or language until agreement is demonstrated there specifically. The LLM scales the middle; humans define and police the edges.","numbers":["Benchmark LLM-human kappa against human-human kappa, not against 1.0","Weekly human audit on a random sample of LLM labels to catch version drift"],"red_flags":["Benchmarking against perfect agreement rather than against inter-annotator agreement.","Reporting a single aggregate agreement number without segmenting by grade and category.","No continuous audit, so a model version change silently shifts the label distribution."],"followups":["What do you do when the LLM and the gold set disagree systematically in one category?","How do you stop a model trained on these labels from inheriting the judge's biases?","What is the cost comparison that justifies this?"],"section":"Evaluation","level":"L6","type":"System Design","source":"written for this loop"},{"id":42,"question":"Derive NDCG from first principles, then compute NDCG@3 for a ranking with grades (3, 0, 2) using exponential gain, where the ideal available grades are (3, 2, 0).","say":"Build it in three moves, each fixing the previous one's flaw. Cumulative gain maps each relevance grade to a gain and sums them, but it ignores order entirely — a good document at rank ten counts the same as at rank one. So discount by position: divide the gain at rank i by log base two of i plus one, modelling attention that decays down the page. That's DCG, and it now rewards putting good documents early. But its scale depends on how many good documents that query happens to have, so you can't average it across queries. Normalize by the ideal DCG — the same judged documents sorted best-first — and you get NDCG between zero and one, comparable and averageable.\n\nFor this ranking with exponential gain, two-to-the-relevance minus one turns grades three, zero, two into gains seven, zero, three. The discounts at ranks one to three are one, about 0.63, and 0.5. So DCG at 3 is seven plus zero plus one and a half, which is 8.5. The ideal ordering is three, two, zero, giving gains seven, three, zero, so IDCG is seven plus three times 0.63, about 8.89. NDCG at 3 is 8.5 over 8.89, roughly 0.96.\n\nI'd state the conventions explicitly, because both are choices: exponential gain versus linear, and the log-of-i-plus-one discount, which is what keeps rank one undiscounted.","numbers":["Discounts at ranks 1–3: 1, 0.631, 0.5","DCG@3 = 8.5, IDCG@3 ≈ 8.89, NDCG@3 ≈ 0.96"],"red_flags":["Skipping normalization, or normalizing by the shown list re-sorted instead of the judged ideal","Writing the discount as log₂(i), which divides rank 1 by zero","Getting the arithmetic right but unable to justify the log discount or the exponential gain"],"followups":["What if the grade-2 document were unjudged instead?","Why log rather than 1/i?","What happens to averaging when a query's judged pool has one relevant document?"],"whiteboard":"$$\\mathrm{DCG@}k=\\sum_{i=1}^{k}\\frac{2^{\\mathrm{rel}_i}-1}{\\log_2(i+1)},\\qquad \\mathrm{NDCG@}k=\\frac{\\mathrm{DCG@}k}{\\mathrm{IDCG@}k}$$ Write the discount as $\\log_2(i+1)$ and say aloud that the $+1$ is what stops rank 1 from dividing by zero — then plug the numbers in on the board rather than in your head.","section":"Evaluation","level":"L5","type":"Mathematical","source":"drill deck"},{"id":43,"question":"Your new reranker improved offline NDCG by 4%, but online CTR dropped. Walk me through the diagnosis.","say":"CTR dropping is different from CTR being flat - something actively got worse - and the cheapest check is also the most common cause: latency. A heavier reranker makes pages arrive later, and latency is itself a relevance metric; a hundred milliseconds measurably moves engagement. Worse, if the model blows its L2 time budget the system may silently shrink rerank depth from a hundred candidates to twenty, capping you at the recall ceiling online while the offline eval ran with no budget at all. So: p95 latency and timeout rates in the treatment arm, first.\n\nSecond, presentation and what CTR actually measures. Clicks respond to titles, snippets and images, not relevance in the abstract, so a better ordering that surfaces uglier results loses clicks. And clicks can drop because you succeeded - a good snippet satisfies the user without one. Check conversion, satisfied-session rate and reformulation before calling it a regression.\n\nThird, L3 and score consumers. Business rules may be reordering your new top twenty, so check override rates. And anything calibrated on the old score distribution - thresholds, vertical blending, merge rules - is now misfiring on scores that mean something different.\n\nFourth, the offline eval itself: judged-only NDCG sees a candidate pool production doesn't, click labels inherit the old ranker's position bias, and gains on tail segments can hide losses on head queries that dominate impressions.\n\nMy order: latency dashboards, segment-sliced online deltas, L3 and score-consumer audit, then the label-bias audit.","numbers":["~100 ms of added latency measurably reduces engagement"],"red_flags":["Concludes \"offline metrics are useless\" or retrains on fresh clicks with no diagnosis.","Never mentions latency - the most common real cause and the cheapest to check.","Treats CTR as ground truth, with no good-abandonment or presentation reasoning."],"followups":["Which single dashboard do you open first, and why?","How would you build an offline eval that would have predicted this?","CTR dropped but conversions rose - what does that tell you?"],"section":"Evaluation","level":"L6","type":"Debugging","source":"drill deck"},{"id":44,"question":"Your new embedding model wins offline — +4 points Recall@100 on your evaluation set — but loses the online A/B test. Walk me through your investigation.","say":"I'd treat this as two measurements that disagree and enumerate what differs between them, cheapest and most likely first — and the highest-prior cause usually isn't the model, it's latency. If a much larger encoder replaced a small one, twenty to forty milliseconds of extra query latency will cost more engagement than four points of Recall@100 buys. So I check per-arm latency distributions and guardrail metrics, and confirm the test is bucketed and powered, before touching relevance at all.\n\nNext, serving parity. Was the entire corpus re-embedded? A partially backfilled index fails silently and catastrophically, because vectors from two different models aren't comparable — the un-migrated slice just scores as noise. Then check preprocessing: many of these models expect a query prefix or instruction, and if the offline eval had it and serving doesn't, the advantage is gone.\n\nThird, the ANN interaction. Offline you almost certainly scored with exact search, while production serves from HNSW or IVF-PQ tuned on the old model's geometry. Measure ANN-versus-exact overlap at 100 in both arms and retune the index before judging the model.\n\nFourth, downstream coupling — a reranker or click model trained on the old candidate distribution can mis-score unfamiliar candidates, converting better recall into worse final rankings. Only then would I question the plus-four itself: stale eval sets, and click labels carrying position and selection bias toward whatever the old system surfaced.","red_flags":["\"The A/B is underpowered, ship it anyway\" — or the reverse, \"offline metrics are meaningless\"","Not knowing that two models' embeddings can't share one index","Never considering latency, or assuming production search is exact rather than ANN"],"followups":["How would you retune HNSW for a new embedding distribution?","How do you get unbiased relevance labels out of click logs?","Retrain the reranker before or during the embedder A/B?"],"section":"Evaluation","level":"L6","type":"Debugging","source":"drill deck"}],"breadth":[{"id":45,"question":"Explain the bias-variance tradeoff. Does it apply to deep learning?","say":"It applies, but the famous U-shaped curve does not. The decomposition itself is a mathematical identity — expected squared error splits into bias squared, variance, and irreducible noise — so it holds for a 70B transformer exactly as much as for a linear model. Bias is systematic error, how far the average prediction sits from the truth. Variance is sensitivity to which training set you happened to draw.\n\nWhat breaks in deep learning is the classical claim that there's a sweet spot at intermediate complexity. We train deep in the over-parameterized regime, where classical theory says variance should dominate, and instead test error comes back down past the interpolation point — double descent. The resolution is that parameter count is a bad proxy for effective capacity: SGD has an implicit bias toward flat, simple solutions, so variance stays controlled even when the model is enormous.\n\nPractically I reduce bias by making the model bigger and control variance with more data, augmentation, weight decay, dropout and early stopping. Diagnosing which one you have is cheap — high training error is bias, low training error with high validation error is variance.\n\nThe line I'd land on is that the tradeoff is real but the optimal complexity is far larger than classical theory predicts, and in modern deep learning the binding constraint is almost always data quality and compute, not model capacity.","red_flags":["\"The bias-variance tradeoff doesn't apply to deep learning\" — the decomposition always holds, it's the U-curve that breaks.","Cannot state the three terms of the decomposition when asked.","Never mentions double descent or implicit regularization from SGD."],"followups":["How do you tell high bias from high variance in practice?","Why does weight decay reduce variance?","What is double descent actually measuring on the x-axis?"],"whiteboard":"$$\\mathbb{E}\\big[(y-\\hat f(x))^2\\big] = \\underbrace{\\mathrm{Bias}[\\hat f(x)]^2}_{\\text{underfit}} + \\underbrace{\\mathrm{Var}[\\hat f(x)]}_{\\text{overfit}} + \\underbrace{\\sigma^2}_{\\text{noise}}$$ Write the three terms and name them as you go: systematic error, sensitivity to the training draw, and noise you cannot touch. Then point at the third term and say that's the floor — no model gets below it.","section":"Foundations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":46,"question":"Explain double descent. Why does test error decrease again in the over-parameterized regime?","say":"Double descent is the observation that test error as a function of model capacity isn't the classical U. It goes down, up, and then down again, and that second descent is the regime every modern model lives in.\n\nThe first part is familiar: adding parameters cuts bias faster than it raises variance, until variance takes over and error climbs. The peak sits right at the interpolation threshold, where the model has just barely enough capacity to fit the training set exactly. That's the worst place to be, because there's essentially one interpolating solution and you're forced into it however jagged it is.\n\nPast that point you keep adding capacity and error falls again. Now many parameter settings achieve zero training loss, so the question becomes which one the optimizer picks - and from small random initialization, gradient descent converges to something close to the minimum-norm interpolator, which is smoother and generalizes better. That's implicit regularization: the optimizer, not a penalty term, selects the good solution.\n\nIt also shows up along the epoch axis - test error can peak partway through training and come down again well after the model has memorized the data. So \"more parameters means more overfitting\" just isn't a reliable rule.","red_flags":["\"More parameters always means more overfitting\" - that is exactly the claim double descent refutes.","Describes the second descent without explaining it: no implicit regularization, no minimum-norm story.","Treats the interpolation threshold as ordinary overfitting rather than a specific capacity point."],"followups":["Does explicit regularization remove the peak?","Does this happen along the epoch axis too?","How does this square with scaling laws?"],"section":"Foundations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":47,"question":"What is KL divergence? Why is it not a true distance metric? When do you use it in practice?","say":"KL divergence is the expected number of extra bits you pay for encoding data that really comes from p using a code built for q. It is never negative and it is zero only when the two distributions match, but it is not a distance: it is asymmetric and it does not obey the triangle inequality.\n\nThe asymmetry is the part that actually matters, and I would argue it is a feature. Forward KL, with p in front, is mode-covering: it blows up wherever q puts near-zero mass on something p thinks is likely, so q is forced to spread out and cover everything. That is what you get from maximum likelihood and cross-entropy training, and from knowledge distillation, where you want the student to cover the teacher.\n\nReverse KL, with q in front, is mode-seeking: it punishes q for putting mass where p has none, but it lets q quietly ignore whole modes. That is variational inference. The VAE's ELBO term is reverse KL against the prior, which is why a unimodal Gaussian posterior is tolerable there. It is also the shape of the KL penalty in RLHF, where you are keeping the policy inside the region the reward model was trained on.\n\nThe last thing I would say is that cross-entropy equals the entropy of p plus the KL. The entropy does not depend on your parameters, so minimising cross-entropy is minimising KL. They are not different objectives.","red_flags":["Calls KL a distance, or treats KL(p||q) and KL(q||p) as interchangeable.","Cannot say which direction is mode-covering versus mode-seeking, or name where each one shows up.","Treats KL and cross-entropy as the same quantity - they differ by the entropy of the data distribution."],"followups":["Which KL direction does the VAE's ELBO term use, and why?","How does mutual information relate to KL?","Why does mode-covering matter for distillation?"],"section":"Foundations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":48,"question":"Explain self-attention step by step, including the math.","say":"Every token produces three vectors from the same input through three learned projections — a query, a key and a value. The query is what this position is looking for, the key is what a position advertises, and the value is what it hands over if it gets selected. Keeping them separate matters: it lets a position attend on one basis and retrieve something else, which a single shared projection couldn't do.\n\nYou dot each query against every key, giving an n-by-n matrix of compatibility scores, then divide by the square root of the head dimension. That scaling isn't cosmetic — the dot product of two random vectors has variance proportional to dimension, so at 128 dimensions raw scores are large, the softmax saturates toward one-hot, and gradients vanish. Scaling keeps the logits order one at initialization. Then you softmax each row, so the weights over positions are non-negative and sum to one, and use them to take a weighted average of the value vectors. Causal masking is just setting the future positions to negative infinity before the softmax.\n\nCost is quadratic in sequence length: n-squared times d compute, and naively n-squared memory for the score matrix — though that memory term is what FlashAttention removes by tiling and never materializing the full matrix. Multi-head is all of this done in parallel in several lower-dimensional subspaces, then concatenated.","numbers":["Attention is O(n²d) compute; O(n²) attention-matrix memory unless tiled (FlashAttention)"],"red_flags":["Can't write the formula when handed the marker","Omitting the $1/\\sqrt{d_k}$ scale, or unable to say why it exists","\"It's just a weighted average\" with no account of where the weights come from"],"followups":["How does causal masking change the computation?","Where does the memory saving in FlashAttention come from?","What is the relationship between attention and convolution?"],"whiteboard":"$\\text{Attention}(Q,K,V)=\\mathrm{softmax}\\!\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V$ — write it once, then point at each piece as you talk: $QK^\\top$ is an n×n score matrix, one row per query; $\\sqrt{d_k}$ is variance control so the softmax doesn't saturate; the output is a convex combination of the value vectors.","section":"Transformers","level":"L5","type":"Mathematical","source":"drill deck"},{"id":49,"question":"Why do we need multiple attention heads? What happens with just one head?","say":"One head can only express one attention pattern per layer — a single softmax distribution over positions for each query. Multiple heads let the layer attend in several representation subspaces at once: one head tracking syntactic dependencies like subject-verb, another doing something close to positional adjacency, another semantic similarity. You get several relationships per token instead of a weighted compromise between them.\n\nThe cost argument is the part people get backwards. Multi-head isn't more expensive than single-head at the same model dimension, because you split the dimension across heads — each head projects into d over h dimensions with its own query, key and value projections, so total QKV compute is unchanged. You're not buying capacity, you're buying diversity out of capacity you already had.\n\nThe output projection is what makes it a single layer rather than h disjoint ones. Each head produces its own d-over-h output, they're concatenated, and $W_O$ mixes across them so downstream layers see one combined representation. Leave that out and the heads can never interact.\n\nEmpirically, single-head attention at full dimension performs significantly worse, and the gap widens on tasks that need several kinds of relationship resolved at the same time.","numbers":["Each head projects into d/h dimensions, so h heads cost the same as one full-width head"],"red_flags":["Can't say concretely what \"different subspaces\" means.","Thinking multi-head attention costs more than single-head at the same model dimension.","Never mentioning the output projection $W_O$ and what it does."],"followups":["How would you decide which heads matter? Can you prune heads?","What's the effect of head dimension on quality?","How does this relate to GQA and MQA on the serving side?"],"section":"Transformers","level":"L5","type":"Conceptual","source":"drill deck"},{"id":50,"question":"What is the computational complexity of self-attention? Why is it a problem?","say":"Self-attention is O(n squared times d) in compute and O(n squared) in memory if you materialise the score matrix - quadratic in sequence length, linear in model dimension. It comes from the Q-K-transpose product, which is n-by-d against d-by-n and gives you an n-by-n matrix, and then multiplying that by V costs the same again.\n\nThe reason it is a problem is that doubling the context quadruples both compute and memory. Put a real number on it: at 128K context with 32 heads, the attention matrix alone in float16 is about a terabyte. There is no GPU where that fits, which is why long-context models cannot just be the naive implementation.\n\nThere are three ways out and they differ in kind. Flash Attention is exact - it tiles the computation and never writes the n-by-n matrix out to HBM, so memory drops to linear in n while the compute stays quadratic. That is the one to name first, because it costs you nothing in quality. Then there are architectural changes that actually change the maths: sliding-window attention gets you to n times window size by attending only locally, and linear attention schemes get to order n-d by reordering the products, both at some approximation cost.\n\nSo the honest framing is that Flash Attention fixed the memory wall, not the compute wall. The quadratic FLOPs are still there at long context.","numbers":["128K context, 32 heads, float16: the attention matrix alone is ~1 TB","Attention: O(n^2 d) compute, O(n^2) memory naive, O(n) memory with Flash Attention"],"red_flags":["Says linear, or cannot state O(n^2) at all.","Conflates compute complexity with memory complexity - Flash Attention fixes one, not the other.","No connection to why context length is capped in practice."],"followups":["How does Flash Attention get to O(n) memory?","What do you give up with linear attention?","How does Mamba compare?"],"section":"Transformers","level":"L5","type":"Mathematical","source":"drill deck"},{"id":51,"question":"How does subword tokenization (BPE) interact with embedding quality?","say":"Tokenization sets the granularity at which embeddings are learned, so it decides which words get a trained vector of their own and which have to be reassembled from pieces. Frequent words get a single token and an embedding updated millions of times. Rare words get split - photosynthesis becomes three or four fragments - and the model composes their meaning through attention and the feedforward layers. That works, but it's noisier, because it has seen that particular combination far less often.\n\nSo vocabulary size is a real trade-off, not a free parameter. Llama 3 went to 128K from Llama 2's 32K, and GPT-2 was 50K. Bigger vocabulary means more words get their own token, better per-token semantics, shorter sequences, more text per context window, cheaper inference. The cost is a much larger embedding table and each token seen less often in training, so the right size depends on how much data you have.\n\nWhere it bites is domain and language. English-centric tokenizers shred other languages and code identifiers into fragments, so you get worse per-token embeddings and longer sequences at once. For retrieval over medical terms or product SKUs, expect fragmentation to hurt, and expect domain fine-tuning to help mainly because the model learns to compose those fragments correctly.","numbers":["Vocabulary sizes: GPT-2 50K, Llama 2 32K, Llama 3 128K"],"red_flags":["\"BPE is just OOV handling\" - it shapes the structure of the whole embedding space.","\"Bigger vocabulary is always better\" - the optimum depends on training data size.","Doesn't know English-centric tokenizers disproportionately fragment other languages and code."],"followups":["How would you pick a vocabulary size for a new language model?","What does tokenization do to a multilingual model?","What problem are Matryoshka embeddings solving?"],"section":"Embeddings and representations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":52,"question":"Explain the Word2Vec Skip-gram model. What is the training objective? What is negative sampling and why is it needed?","say":"Skip-gram learns embeddings by predicting context words from a center word. Every word gets two vectors — an input vector used when it's the center, an output vector used when it's context — and that detail matters, because people forget it and then can't explain what gets shipped at the end, which is the input matrix. The objective is to maximize the log probability of the true context words, summed over every center-context pair in the corpus, where that probability is a softmax over the whole vocabulary.\n\nThe problem is that denominator. It sums over the entire vocabulary — a hundred thousand words or more — for every single training pair, so every gradient step touches every output vector. That's the entire reason negative sampling exists.\n\nNegative sampling replaces the multi-class softmax with binary classification. For each real center-context pair you draw k noise words, and you train a logistic classifier to call the observed pair real and the noise pairs fake. That takes the per-example cost from order-vocabulary down to order-k. The one non-obvious piece is the noise distribution: it isn't the raw unigram distribution, it's unigram raised to the three-quarters power. That flattens it, so you draw rare words as negatives more often than their frequency warrants and get more informative gradients than if you sampled \"the\" over and over.","numbers":["Negative sampling: O(V) → O(k) per example","Noise distribution: unigram raised to the 3/4 power"],"red_flags":["Not knowing Skip-gram has two embedding matrices, input and output.","\"Negative sampling just samples wrong words\" without the binary-classification reformulation.","Confusing Skip-gram with CBOW — predict context from center, not the reverse."],"followups":["What's the connection between Word2Vec and PMI?","How do you choose the number of negative samples?","What is subsampling of frequent words and why does it help?"],"section":"Embeddings and representations","level":"L5","type":"Mathematical","source":"drill deck"},{"id":53,"question":"What are the differences between Word2Vec, GloVe and FastText? When would you choose each one?","say":"All three give you one static vector per word. They differ in what they train on and whether they can handle a word they've never seen.\n\nWord2Vec trains a shallow network on local context windows - skip-gram predicts context from the center word, CBOW does the reverse. It streams, so it scales to enormous corpora, but words are atomic: an unseen word has no vector at all.\n\nGloVe goes the other way. It builds the global co-occurrence matrix first, then fits vectors so dot products approximate log co-occurrence counts, using corpus-wide statistics directly rather than hoping local windows aggregate to them. The cost is materializing that matrix, and it's equally helpless on out-of-vocabulary words.\n\nFastText is Word2Vec plus character n-grams: a word's vector is the sum of its subword n-gram vectors. That gives you OOV handling for free and captures morphology, which matters a great deal in inflected languages.\n\nSo FastText for typos, user-generated text, morphologically rich languages, or heavy domain vocabulary; GloVe if I just want good pretrained English vectors off the shelf. But the bigger decision is whether static embeddings are right at all - a contextual model beats all three when you can afford it, and static vectors earn their place on latency, memory and edge deployment.","red_flags":["\"They're all the same, just use BERT\" - dodges the question and misses where static vectors still win.","Doesn't know GloVe uses global co-occurrence counts while Word2Vec uses local windows.","Doesn't know FastText gets OOV handling from character n-grams."],"followups":["How does Levy and Goldberg's result connect Word2Vec to SVD on a PMI matrix?","When would you use static embeddings in a system today?","How is FastText's n-gram decomposition different from BPE?"],"section":"Embeddings and representations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":54,"question":"Why are contextual embeddings better than static embeddings? Give a concrete example of when static embeddings fail.","say":"Because a static embedding has to give one vector to a word that means several different things, and that vector is a compromise that is wrong for every sense.\n\nThe clean example is \"crane\". The crane lifted the steel beam - construction equipment. We saw a crane at the lake - a bird. She had to crane her neck - a verb meaning to stretch. Word2Vec or GloVe puts all three at a single point, somewhere in the average of machinery, wildlife and body movement, which is a location that describes none of them. A contextual model gives you three different vectors, and it does word-sense disambiguation for free, without anyone building a sense inventory.\n\nPolysemy is the headline but not the whole story. Contextual models also encode syntactic role - \"running\" as a noun and as a verb come out differently - and sentence-level effects like negation and quantification propagate into the token representations, which static vectors have no mechanism for at all.\n\nThe empirical jump was large: BERT moved GLUE up by roughly seven points over the previous state of the art, which is not a normal increment on that benchmark.\n\nI would not say static embeddings are dead, though. They are extremely cheap, they make honest baselines, and they are still fine inside larger systems where you need a fast lookup rather than a forward pass.","numbers":["BERT: ~7 points absolute on GLUE over the previous state of the art"],"red_flags":["\"Contextual is better because BERT is better\" with no mechanism.","No concrete polysemy example when asked for one.","Claiming static embeddings are useless today."],"followups":["What do ELMo's different layers capture?","How does BERT build context differently from ELMo?","Where would you still use static embeddings today?"],"section":"Embeddings and representations","level":"L5","type":"Conceptual","source":"drill deck"},{"id":55,"question":"When do you use softmax cross-entropy vs. sigmoid BCE?","say":"It comes down to one question: are the classes mutually exclusive? Softmax cross-entropy assumes exactly one is correct — the normalizer couples all the outputs, so pushing one logit up necessarily pushes the others down. Sigmoid BCE treats every output independently, each logit through its own sigmoid, so any combination of labels can be on at once.\n\nSo single-label goes to softmax: is this a cat, a dog, or a bird. Multi-label goes to sigmoid BCE: does this image contain a cat, a dog, a bird. Using softmax on a multi-label problem is a genuinely common bug, and the symptom is that co-occurring labels get suppressed, because you've forced the model to divide probability mass between labels that aren't actually competing.\n\nAt very large label counts — ten thousand and up — softmax still works but the denominator needs every logit computed, so it gets expensive. That's what sampled softmax, noise-contrastive estimation and hierarchical softmax exist for. Sigmoid BCE scales naturally there because the outputs are independent.\n\nFor hierarchical labels — animal, then dog, then retriever — neither handles it cleanly. I'd either use sigmoid BCE with a term that penalizes hierarchy violations, or separate softmax heads per level with consistency constraints, depending on how strict the taxonomy is.","red_flags":["\"Softmax and sigmoid are interchangeable for binary classification\" — ignores that softmax couples the outputs.","\"I always use softmax because it gives probabilities\" — sigmoid outputs are probabilities too; the distinction is independence.","Reaching for softmax on a multi-label problem without noticing the labels co-occur."],"followups":["What if you have 10,000 classes — does softmax still work?","How do you handle hierarchical labels?","Can you use sigmoid BCE for single-label classification?"],"section":"Training","level":"L5","type":"Conceptual","source":"drill deck"},{"id":56,"question":"Cross-entropy vs.\\ focal loss vs.\\ class-balanced loss for imbalanced classification—what is your decision framework?","say":"I pick based on two separate questions: is the problem class frequency, or is it easy-example dominance? Those are different failures with different fixes.\n\nIf imbalance is mild, say under five to one, plain cross-entropy is usually fine. The minority class still gets enough gradient to learn. Once you're in the five to one through hundred to one range, I reach for class-weighted cross-entropy first: upweight rare classes by inverse frequency, inverse square root, or the effective-number weights if the tail is long. One hyperparameter, and it attacks the thing that's actually wrong.\n\nFocal loss solves something else. The one-minus-p-to-the-gamma factor down-weights examples the model already gets right with high confidence, so it's for the case where the majority class isn't just frequent but trivially easy. The canonical one is object detection, where 99.9 percent of anchors are easy background and the gradient signal drowns in them. If your negatives are genuinely hard, focal buys you little and costs you a gamma to tune plus some calibration damage.\n\nThe point most candidates miss is that these are orthogonal. Weighting controls how much each class contributes, focal controls how much each example contributes by difficulty, and at extreme long-tail imbalance you usually want both: focal loss with effective-number alpha weights.","numbers":["Object detection: ~99.9% of anchors are easy background","Rough bands: under 5:1 plain CE; 5:1-100:1 weighted CE; beyond 100:1 focal"],"red_flags":["\"Always use focal loss for imbalanced data\" - it targets easy-example dominance, not imbalance in general.","Answers with resampling when the question was about the loss; related, but not what was asked.","Treats class weighting and focal loss as alternatives rather than composable."],"followups":["What does focal loss do to calibration?","How do you choose gamma?","When is oversampling the better lever than changing the loss?"],"section":"Training","level":"L5","type":"Trade-off","source":"drill deck"},{"id":57,"question":"Adam vs SGD with momentum—when would you pick each?","say":"Adam for anything transformer-shaped, SGD with momentum where you have a known vision recipe and generalization is the whole game. The mechanical reason is gradient-scale heterogeneity: in a transformer the embeddings, the attention projections and the layer norms sit at very different gradient magnitudes, and one global step size can't serve all of them. Adam's per-parameter normalization handles that for free, which is why nobody trains an LLM with plain SGD.\n\nSGD with momentum still holds up on well-studied convnet tasks with a tuned cosine schedule. The uniform step size acts as implicit regularization — the extra gradient noise helps you settle in flatter minima — and if you have the tuning budget and a recipe someone already validated, it's hard to beat. I'd also reach for Adam for fast prototyping, for GANs, and anywhere extensive learning-rate tuning isn't realistic.\n\nThe nuance I'd volunteer is that the gap has largely closed, and the old \"SGD generalizes better\" folklore mostly came from comparing SGD against Adam with plain L2 rather than decoupled weight decay. In Adam, L2 added into the gradient gets divided by the same running second-moment estimate, so it's attenuated exactly on the parameters with the largest gradients and you end up under-regularized without noticing. AdamW decouples the decay from the adaptive step and mostly erases the difference — ConvNeXt is the clean example of a modern convnet trained that way.","red_flags":["\"Adam always, it converges faster\" — ignores the generalization story on vision","\"SGD is obsolete\"","Not distinguishing L2 in the loss from decoupled weight decay in Adam"],"followups":["Why might Adam generalize worse?","How do adaptive learning rates relate to sharp minima?","How does weight decay interact differently with each optimizer?"],"section":"Training","level":"L5","type":"Trade-off","source":"drill deck"},{"id":58,"question":"Training loss is NaN after 1000 steps. Walk through your debugging process.","say":"NaN means an Inf or an invalid operation got into the graph, and the fact that it's 1000 steps in already tells me something: a bad epsilon or corrupt data usually fires at step one, so I'd start with what grows.\n\nFirst move is to look at gradient norms in the steps before the NaN. If they're climbing — 1e2, then 1e5, then 1e12, then NaN — it's exploding gradients, and the fix is clipping at 1.0, warmup, and probably a lower learning rate. If gradient norms are flat and then it's suddenly NaN, that's a different animal: a single bad op or a single bad batch.\n\nThen in order of how often it's actually the cause. Check FP16 overflow — FP16 tops out around 65,500, and anything past that is Inf and then NaN on the next op; switching to BF16 and watching the problem vanish is a one-experiment diagnosis. Check log of zero and divide by zero: use the framework's fused cross-entropy rather than hand-rolling log-softmax, and make sure every normalization has its epsilon. Assert on the input batch, because corrupt data happens — just less often than people assume.\n\nIf none of that isolates it, register forward hooks and find the first module that emits a NaN. That's mechanical and always works; I don't start there because the gradient-norm trajectory usually answers it in two minutes.","numbers":["FP16 max ~65,504; BF16 range ~3.4e38 (same exponent as FP32)"],"red_flags":["\"Set the LR to 1e-6 and hope\" — that's guessing, and a low enough LR hides the bug while making training useless.","Assuming data first; exploding gradients and numerical instability are more common in practice.","Never looking at the gradient-norm trajectory before the NaN, which is where the diagnosis actually lives."],"followups":["What if it only NaNs in mixed precision and never in FP32?","How do you debug a NaN that only some ranks see in distributed training?","What's the difference in root cause between NaN and Inf?"],"section":"Training","level":"L5","type":"Debugging","source":"drill deck"},{"id":59,"question":"When would you deploy logistic regression instead of gradient boosting in 2026?","say":"Refuse the implied \"never\" and give the conditions, because there are four real ones. First, regulated or contested decisions — credit, insurance, hiring, clinical. There you need a model whose behaviour can be stated as a monotone effect per feature and audited by people who aren't ML engineers. A coefficient table with odds ratios is an artifact a regulator accepts, and adverse-action reasons fall straight out of it. Scorecards — binned features into logistic regression — exist for that reason, not because nobody tried boosting.\n\nSecond, extreme-scale sparse online serving, the ad-CTR heritage: hundreds of millions of hashed features, billions of daily examples, continuous retraining. Logistic regression with FTRL-Proximal trains online in one pass, the L1 term keeps the served model sparse and small, and it scores in microseconds. GBDTs don't update online and don't love ultra-high-cardinality sparse inputs.\n\nThird, small data with a genuinely near-linear signal — a few thousand rows, where a regularized linear model often matches a tuned GBDT and is far more stable across refits. Fourth, calibration: log loss is the Bernoulli likelihood, so you get usable probabilities without a second stage, which matters when the score is multiplied by a value to make a bidding or expected-loss decision.\n\nThen be honest about the default: on mid-scale tabular data with real interactions, boosting wins, usually by a lot. The hybrids are splines and feature crosses to give the linear model curvature, or a GBDT for feature discovery with a linear model in serving.","red_flags":["\"Never, boosting is strictly better\" — the trap the question is built around","\"Logistic regression is more interpretable\" as the entire answer, with no account of when that's a requirement","Not knowing the online sparse regime, where linear models still run at the largest scale in industry"],"followups":["What is FTRL-Proximal doing that plain SGD isn't?","How would you give a linear model nonlinearity without losing interpretability?","How do you show a regulator what the model does?"],"section":"Classical ML and tabular","level":"L6","type":"Trade-off","source":"drill deck"},{"id":60,"question":"Random forest vs. gradient boosting—how do they differ, and when do you reach for each?","say":"They're opposite answers to the same problem — a single deep tree has low bias and terrible variance.\n\nRandom forest attacks the variance. Grow many deep, low-bias trees on bootstrap samples with feature subsampling at each split, then average. Averaging correlated estimators leaves the correlation-weighted part of the variance plus a term that shrinks with the number of trees, so more trees never hurts — you cannot overfit in the number of trees, you only run out of compute. It trains embarrassingly in parallel and gives you out-of-bag validation for free.\n\nBoosting attacks the bias. Add shallow, high-bias trees sequentially, each fit to the negative gradient of the loss at the current predictions. So it's inherently sequential, and it does overfit in the number of rounds, which is why shrinkage and early stopping aren't optional.\n\nThat also explains why the base learners differ, which is a good thing to have ready: averaging needs low-bias learners, so deep trees; sequential correction needs weak learners, so shallow ones.\n\nIn practice, random forest is my first-hour baseline — nearly tuning-free, robust on small or noisy data, free validation from OOB. A tuned LightGBM, XGBoost or CatBoost is what ships, and the gap is usually a few points in boosting's favor. I'd also reach for boosting specifically when I need a custom loss — quantile, Poisson, ranking — or monotonic constraints.","red_flags":["Inverting the mechanism — \"RF reduces bias\" or \"boosting reduces variance.\"","\"More trees overfits a random forest\" — confusing the number of trees with boosting rounds.","Can't say why RF trees are deep while GBDT trees are shallow."],"followups":["Derive the variance of an average of correlated estimators.","Why does feature subsampling help RF but column subsampling is optional for GBDT?","Which is more robust to label noise, and why?"],"section":"Classical ML and tabular","level":"L5","type":"Conceptual","source":"drill deck"},{"id":61,"question":"XGBoost, LightGBM or CatBoost: 600K rows, 45 features of which 14 are categorical including a 40K-cardinality `merchant_id`. Choose and defend.","say":"CatBoost, and the 40,000-cardinality merchant ID is what decides it.\n\nAll three share the same second-order boosted-tree objective, so accuracy differences are small and dataset-specific. What actually differs is categorical handling, speed at scale, overfitting posture and ecosystem - and with fourteen categoricals, one of them at forty thousand levels, categorical handling dominates. One-hot is out immediately; you would be adding forty thousand near-useless indicator columns. Naive target encoding is a leakage trap, because each row's own label leaks into its own feature.\n\nCatBoost's ordered target statistics solve exactly that: the encoding for each row uses only rows that precede it in a random permutation, so it is leak-free by construction, and its feature combinations pick up categorical interactions. At 600,000 rows you are well inside its comfortable speed envelope.\n\nThe defensible alternative is LightGBM. Its native categorical splits sort levels by sum-gradient over sum-hessian, which handles the mid-cardinality features well, plus a properly out-of-fold target or frequency encoding for merchant ID. That iterates faster, but you own the encoding hygiene yourself. XGBoost is the fallback if your platform - Spark pipelines, existing serving - already speaks it; nothing in the data demands it.\n\nAnd I would say the tie-breaker out loud: one afternoon, all three with early stopping on an identical temporal validation split, comparing metric, training time and inference latency. Expect differences of tenths of a point and pick on operational grounds.","red_flags":["One-hot encoding the 40K-cardinality feature without hesitating.","Choosing on \"X is more accurate\" folklore and never mentioning categorical handling.","Proposing in-fold target encoding, or not knowing why CatBoost's ordering avoids the leak."],"followups":["What exactly goes wrong if you target-encode with the full training set?","New merchants appear daily - what happens to each library's encoding?","Now it is 500 million rows. Does your answer change?"],"section":"Classical ML and tabular","level":"L6","type":"Trade-off","source":"drill deck"},{"id":62,"question":"Why does a gradient-boosted tree beat your MLP on this tabular dataset—and when would it not?","say":"It's an inductive-bias match, not a capacity gap, and leading with the mechanism rather than a benchmark is the point. Three findings from the controlled comparisons Grinsztajn and colleagues ran in 2022. Tabular targets are irregular — sharp thresholds and plateaus, exactly what piecewise-constant splits fit natively, while neural network training is biased toward smooth functions. Tables carry many uninformative columns, which a tree ignores by simply never splitting on them, while an MLP has to learn to suppress them. And MLPs are rotation-invariant while tabular data emphatically is not: each feature axis means something specific, so the tree's axis-aligned \"limitation\" is precisely the right prior. The clean demonstration is that randomly rotating the features barely affects an MLP and wrecks a tree, which tells you the axes carry the signal.\n\nThen the pragmatics that matter in practice: native handling of NaNs and mixed types, invariance to monotone transforms, minutes of CPU training, and graceful degradation when hyperparameters are wrong.\n\nWhen would it not hold? Heavy learned embeddings for high-cardinality IDs — that's the recommender regime, and it's neural for good reason — multimodal inputs, online or continual updating, and very large data with dense interactions. And on genuinely small tables, in-context learners like TabPFN v2 now beat tuned GBDTs outright. So boosting is the mid-scale tabular default, not a law of nature.","red_flags":["\"Neural nets are more powerful, it must be a tuning issue\" — capacity isn't the axis, prior match is","No mechanism, just \"trees win on tabular\" as folklore","Unaware that the small-data regime has shifted, or that recommenders are neural for a reason"],"followups":["Design the experiment that tests whether uninformative features are the MLP's problem.","What is TabPFN actually doing at inference time?","Your tabular data has one free-text column — now what?"],"section":"Classical ML and tabular","level":"L6","type":"Conceptual","source":"drill deck"},{"id":63,"question":"Training RMSE 0.31, validation RMSE 0.94, and the two learning curves are still far apart at 200K rows. Diagnose it and name the knobs, on the model of your choice.","say":"That's the variance signature, and the most useful thing on that plot isn't the gap - it's that the curves still haven't met at 200 thousand rows, which tells you more data will help. That's the decision-relevant fact.\n\nBefore I touch a hyperparameter, though, I'd audit the split, because a gap that large has two non-model explanations that no amount of regularization fixes. Leakage or a broken split: a temporal problem split randomly, group leakage where the same user or merchant lands on both sides, or a feature derived from the target. Compare a random split against a grouped or temporal one - if the gap moves, that's your answer. And distribution shift: if validation is a later period, you may be looking at drift rather than variance, and regularization won't touch drift.\n\nOnce that's clear, the knobs depend on the model. GBDT: early stopping on rounds first, because boosting overfits in the number of rounds by construction, then a lower learning rate with more rounds, shallower trees, higher `min_child_weight`, row and column subsampling, more L2. Random forest: this pattern is unusual, since averaging already kills variance, so suspect leakage before tuning, then raise `min_samples_leaf` and lower `max_features`. Ridge or lasso: raise lambda. kNN: raise k, whose variance is exactly sigma squared over k - the cleanest knob in classical ML.\n\nAnd across all of them the same three levers: more rows, fewer features, more averaging.","numbers":["kNN variance is sigma^2 / k, so k is the cleanest variance knob available"],"red_flags":["Reads a train-validation gap this size as high bias and proposes adding capacity.","Jumps straight to hyperparameters without questioning the split.","Recites the bias-variance decomposition but can't say the expectation is over the draw of the training set."],"followups":["How would you estimate the irreducible noise?","The curves have already met - now what?","Does any of this change for a 7B-parameter network?"],"section":"Classical ML and tabular","level":"L5","type":"Debugging","source":"drill deck"},{"id":64,"question":"Compare few-shot prompting, fine-tuning, and RAG for adapting\nan LLM to a new task or domain. When would you use each?","say":"It comes down to three things: how much labeled data you have, how often the knowledge changes, and what your per-query cost budget is.\n\nFew-shot prompting when you have under about fifty examples, the task is well-specified, or it changes frequently. No training, no infrastructure, you iterate in minutes. You pay at inference — long prompts on every call — and it gets inconsistent on genuinely complex tasks while eating context you might want for something else.\n\nFine-tuning, full or LoRA, when you have a thousand-plus labeled examples and the task is stable. You get consistency, and you often get cheaper inference, because a fine-tuned small model with a short prompt beats a large model carrying a huge few-shot prompt on cost per call. The price is training infrastructure, catastrophic-forgetting risk, and a retraining treadmill as your data drifts.\n\nRAG when the knowledge changes faster than you can retrain, when you need grounding or citations, or when the corpus is simply too large to put in weights. It's the right answer whenever being factually current matters. The catch is that retrieval quality caps everything downstream — a bad retriever gives you a confidently wrong answer with a citation attached — and you now own an index and its freshness pipeline.\n\nIn practice they compose, and I'd say so rather than picking one. Fine-tune for format and behavior, RAG for facts, few-shot for the last mile. That's the standard production shape.","red_flags":["Recommending one approach without the tradeoffs.","Not mentioning that they compose — fine-tune for behavior, retrieve for facts.","Ignoring per-query cost and latency, which is often what actually decides it."],"followups":["When would you combine fine-tuning with RAG?","What do you do in a domain with zero labeled data?","How would you evaluate which strategy is winning?"],"section":"LLMs in production","level":"L5","type":"Trade-off","source":"drill deck"},{"id":65,"question":"Your fine-tuned LLM generates fluent but factually wrong answers. Diagnose the issue and propose solutions.","say":"That's hallucination, and I'd separate three causes before proposing anything, because the fix is different for each.\n\nFirst, is the knowledge actually in the model? Compare the base model against the fine-tuned one on a factual QA benchmark. If the base was right and the fine-tune is wrong, you degraded pretrained knowledge — learning rate too high, too many epochs, catastrophic forgetting. It's also worth hand-sampling the fine-tuning data, because if it contains factual errors the model faithfully memorized them, and if your reward signal only scored style, you explicitly trained fluency over accuracy.\n\nSecond, is it decoding? High temperature or wide top-p pushes toward fluent but low-probability continuations. Rerun the eval at temperature zero. If accuracy jumps, the knowledge is there and sampling is introducing the errors — for factual tasks I'd run greedy or keep temperature at 0.3 or below.\n\nThird, is it a knowledge boundary? Models don't know what they don't know and answer confidently regardless. Check whether the errors concentrate on recent events, niche domains, or numbers.\n\nOn fixes, retrieval is far and away the highest-leverage one — put the actual documents in context and the answer is grounded rather than recalled. Layered on top: train the model to abstain when it can't support an answer, require citations so hallucinations become detectable rather than invisible, and use self-consistency across samples as a cheap uncertainty signal for the cases where you can't retrieve.","red_flags":["\"Train on more data\" — volume alone doesn't fix hallucination without a targeted intervention.","Never checking decoding parameters before blaming the model or the data.","Not reaching for retrieval, which is the highest-leverage practical fix."],"followups":["How do you measure hallucination rate?","When does RAG fail?","How does RLHF contribute to hallucination?"],"section":"LLMs in production","level":"L6","type":"Debugging","source":"drill deck"},{"id":66,"question":"How do you detect and reduce hallucination in a production LLM system?","say":"Three layers — prevent, detect, mitigate — plus the honest framing that none of them closes the gap, because pretraining optimizes fluency, not factuality.\n\nPrevention is grounding first — RAG over a curated corpus — then scope: a narrow system prompt, domain fine-tuning, low temperature on factual queries, and a model trained to abstain rather than fabricate. Detection splits by type. Intrinsic, where the answer contradicts the retrieved context, is NLI entailment of each response sentence against that context. Extrinsic is self-consistency sampling and citation verification, with token-level uncertainty as a cheap auxiliary signal. Mitigation is what you do with a flag: citations and disclaimers on low-stakes traffic, human review on high-stakes, feedback routed back into the eval set.\n\nWhat makes that a production answer rather than a menu is three things the menu doesn't give you. Pick the operating point against review capacity, not a benchmark — the detector is a rare-positive classifier, so its false-positive volume, not its precision, decides whether anyone acts on the flags. Instrument the rate: sample production traffic, run the verifier offline where the latency budget doesn't bind, and alert on the trend, because a hallucination rate you aren't measuring is one you'll hear about from users. And where the output drives tools or actions, the control that matters is permissions and gating, not text detection — a detector on the final answer runs after the tool call already fired.","red_flags":["\"RAG solves hallucination\" — the model can still hallucinate from retrieved context, or ignore it.","One technique instead of layered prevent/detect/mitigate.","Claiming RLHF eliminates it; sycophancy is itself a hallucination mode."],"followups":["Intrinsic versus extrinsic hallucination — what's the difference?","What do you do when the retrieved context is itself wrong?","Where does the detector's false-positive budget come from?"],"section":"LLMs in production","level":"L5","type":"Conceptual","source":"drill deck"},{"id":67,"question":"When is random k-fold cross-validation invalid, and what do you use instead?","say":"Random k-fold assumes rows are exchangeable and that validation stands in the same relationship to training that production will. Three things break that.\n\nTime structure. If the data is time-ordered, or deployment means train on the past and score the future, shuffled folds train on the future to predict the past and share period-level structure - a promotion, an outage, a fraud campaign - across the split
