l</strong></td><td>Parameter count or tree count and depth. Feature count. Training time and on what hardware.</td></tr><tr><td><strong>Latency</strong></td><td>p50 and p99, and the budget you were given. Where the time went, by stage.</td></tr><tr><td><strong>Cost</strong></td><td>Serving cost per million requests, or GPU-hours per training run. Before and after.</td></tr><tr><td><strong>Offline result</strong></td><td>The metric, the delta, and the size of the eval set.</td></tr><tr><td><strong>Online result</strong></td><td>The primary metric, the delta, the confidence interval, the experiment duration, the traffic allocation.</td></tr><tr><td><strong>Guardrails</strong></td><td>What you watched that was <em>not</em> allowed to regress, and whether it did.</td></tr><tr><td><strong>Team</strong></td><td>How many engineers, over how long, and which parts were yours specifically.</td></tr></tbody></table></div>\n<p>The last row matters more than people expect. At L6 they are calibrating your scope. Be precise about what you personally did versus what the team did — overclaiming is the fastest way to lose the round, and under-claiming loses it more slowly.</p>\n<h3>The interrogation bank</h3>\n<p>These are the follow-ups. Rehearse against them out loud; most have no single right answer, and the failure mode is hesitation rather than being wrong.</p>\n<h4>Problem framing</h4>\n<ul>\n<li>Why was this the right problem to work on? What did you <em>not</em> do because of it?</li>\n<li>Who decided this mattered — you or someone else? What would you have picked instead?</li>\n<li>How did you size the opportunity before committing? What was the estimate, and how close was it?</li>\n<li>What would have happened if you had done nothing for six months?</li>\n<li>Who was the customer, and how do you know this helped them rather than just moving your metric?</li>\n</ul>\n<h4>Data</h4>\n<ul>\n<li>Where did the training labels come from? What is the bias in that source?</li>\n<li>How did you construct negatives? What happens if you sample them differently?</li>\n<li>What was the train/validation split, and why is it not leaking?</li>\n<li>How stale was the freshest feature at serving time? How did you find out?</li>\n<li>What fraction of your data was junk, and how did you detect it?</li>\n<li>Did the label distribution shift over the period you trained on?</li>\n</ul>\n<h4>The modelling choice</h4>\n<ul>\n<li>Why this architecture and not the obvious simpler thing? What would the simpler thing have scored?</li>\n<li>What was your baseline, and is it a strong baseline or a convenient one?</li>\n<li>What did you try that did not work? Why did it not work?</li>\n<li>How did you pick the hyperparameters? How sensitive was the result to them?</li>\n<li>If you had ten times the data, would you have made the same choice? A tenth?</li>\n<li>What is the failure mode of this model that you have not fixed?</li>\n</ul>\n<h4>Evaluation</h4>\n<ul>\n<li>What was the offline metric, and why that one? What does it fail to capture?</li>\n<li>Did offline and online agree? If they did, why do you trust that they will keep agreeing?</li>\n<li>How long did the experiment run, and why that long? Who chose the sample size?</li>\n<li>What were the guardrail metrics? Did any move? What would you have done if one had?</li>\n<li>Was there a novelty effect? How did you rule it out?</li>\n<li>Could this have been a false positive? What is your multiple-comparisons story?</li>\n</ul>\n<h4>Production</h4>\n<ul>\n<li>What broke in production that you did not see in offline evaluation?</li>\n<li>How did you roll it out? What was the rollback plan and did you ever use it?</li>\n<li>What monitoring did you add? What alert would have caught the bug earlier?</li>\n<li>What is the on-call burden of what you built?</li>\n<li>What happens to this system if you leave tomorrow?</li>\n<li>What did it cost to serve, and what did you do about that?</li>\n</ul>\n<h4>Impact and hindsight</h4>\n<ul>\n<li>Is it still running? Has the effect held up?</li>\n<li>What is the second-order effect — did another team&#x27;s metric move because of you?</li>\n<li>What would you do differently with what you know now?</li>\n<li>What did you get wrong?</li>\n<li>If you had to cut this project in half, which half?</li>\n</ul>\n<h4>Collaboration and conflict</h4>\n<ul>\n<li>Who disagreed with you, and what was their argument? Steelman it.</li>\n<li>What did you do when you could not get a dependency prioritised?</li>\n<li>Tell me about a time you were overruled on this project.</li>\n<li>Who did you make better, and how do you know?</li>\n<li>How did you explain this to someone non-technical, and what did they take away?</li>\n</ul>\n<h3>Mapping your story to the principles</h3>\n<p>Fill this in once and it becomes the thing you revise the night before. You are not trying to hit all 15 — you are trying to have two or three stories that between them give clean evidence for six or seven, with <em>Dive Deep</em>, <em>Wow the Customer</em> and <em>Deliver Results with Grit</em> non-negotiable.</p>\n<div class=\"tw\"><table><thead><tr><th>Principle</th><th>Your evidence</th><th>Number attached</th></tr></thead><tbody><tr><td>Wow the Customer</td><td></td><td></td></tr><tr><td>Ruthless Prioritization</td><td></td><td></td></tr><tr><td>Company-wide Perspective</td><td></td><td></td></tr><tr><td>Dive Deep</td><td></td><td></td></tr><tr><td>Think Systematically</td><td></td><td></td></tr><tr><td>Simplify</td><td></td><td></td></tr><tr><td>Disagree and Commit</td><td></td><td></td></tr><tr><td>Hire and Develop the Best</td><td></td><td></td></tr><tr><td>Deliver Results with Grit</td><td></td><td></td></tr><tr><td>Influence without Authority</td><td></td><td></td></tr><tr><td>Aim High and Find a Way</td><td></td><td></td></tr><tr><td>Learn Voraciously</td><td></td><td></td></tr><tr><td>Demand Excellence</td><td></td><td></td></tr><tr><td>Move with Urgency</td><td></td><td></td></tr><tr><td>Hate Waste</td><td></td><td></td></tr></tbody></table></div>\n<h3>SBI, without sounding like a template</h3>\n<p>Coupang asks for Situation / Behaviour / Impact. Used mechanically it sounds rehearsed. The fix is proportion: <strong>one sentence of situation, four of behaviour, one of impact with a number.</strong> Most candidates invert this and spend four sentences on context.</p>\n<p>Weak: <em>&quot;Our search system had some quality issues, so the team worked on improving relevance, and we saw good results.&quot;</em></p>\n<p>Strong: <em>&quot;Tail queries were returning nothing useful — 15% of tail sessions ended without a click. I pulled a hundred of them and found two thirds were failing at retrieval rather than ranking, which pointed at the lexical index rather than the model everyone was blaming. I built a dense retrieval arm and fused it with RRF rather than a weighted sum, because the score scales were not comparable across queries. The hard part was negatives: in-batch negatives alone gave us a model that matched keywords without matching intent, so I mined hard negatives from the BM25 tail. Zero-result rate on tail queries went from 15% to 4%, and tail-session CTR rose 8% over a three-week A/B on 5% of traffic, with head-query CTR flat inside the guardrail.&quot;</em></p>\n<p>The second one is scoring <em>Dive Deep</em> (pulled a hundred queries), <em>Wow the Customer</em> (framed on customer outcome), <em>Demand Excellence</em> (did not accept the first model), and <em>Deliver Results with Grit</em> (shipped and measured) without ever naming a principle.</p>\n<h3>Anti-patterns</h3>\n<ul>\n<li><strong>The metric with no customer.</strong> &quot;We improved NDCG by 4 points&quot; and nothing about what a user experienced.</li>\n<li><strong>The point estimate.</strong> A lift with no interval, no duration, no traffic share.</li>\n<li><strong>The flawless project.</strong> Nothing went wrong, nothing was cut, no one disagreed. Reads as either shallow involvement or a rehearsed story.</li>\n<li><strong>&quot;We&quot;.</strong> Forty minutes of &quot;we&quot; with no &quot;I&quot; makes your scope unassessable. Use &quot;the team&quot; where it is true and &quot;I&quot; where it is true.</li>\n<li><strong>Defending the rejected alternative badly.</strong> If you cannot argue the option you did not take, the interviewer concludes you never seriously considered it.</li>\n<li><strong>Running out of depth.</strong> Every level you can go down is a level of credibility. The round is designed to find your floor; it should be low.</li>\n</ul>","codingIntro":"<p>Coupang&#x27;s published guidance says 2–3 problems, and names what they grade: <em>&quot;Clean code, Bug free&quot;</em>, <em>&quot;Code validation, identification of edge cases&quot;</em>, and mastery of <em>&quot;sorting, recursion, and dynamic programming.&quot;</em> The word absent from that list is cleverness.</p>\n<p>So the protocol matters as much as the algorithm. Restate the problem. Ask about the edge cases <em>before</em> you write — the list under each problem below is what to ask. State your complexity target out loud, then write. When you think you are finished, walk one concrete example through your own code line by line; that single habit catches most of what loses this round.</p>\n<p>Their guidance also mentions Java and CS fundamentals. The solutions here are Python because that is what an ML candidate will reach for, but if you are asked to use Java, say so early rather than switching halfway.</p>\n<p>Every solution below is exercised by <code>coupang/test_coding.py</code>.</p>","depth":[{"id":1,"question":"Walk me through what happens, end to end, when a customer types a query into Coupang search.","say":"Three stages, and the interesting engineering is in the handoffs between them.\n\nQuery understanding runs first and is cheap — single-digit milliseconds. Normalise and tokenise, correct the spelling, segment the query into meaningful units, classify intent and category, and expand with synonyms. The output isn't a string, it's a structured object: the rewritten query, a category prior, maybe a brand or price constraint lifted out of the text. That object is what the rest of the funnel consumes.\n\nRetrieval takes that object and cuts tens of millions of products down to a few thousand. In practice that's a lexical arm over an inverted index with BM25 and WAND-style pruning, plus a dense arm over an ANN index, fused. The job of this stage is recall, not order — anything it drops is gone for good, and no ranker downstream can recover it.\n\nRanking orders those few thousand, usually in two passes: a cheap L1 that trims to a few hundred, then an expensive L2 over the survivors. The L2 is where the hundred-plus features live, and for commerce it is scoring two things at once — relevance to the query, and how attractive the product is: rating, review count, price, brand, and how fast it can be delivered. Then a final layer applies business rules, diversity, and deduplication over the near-identical listings a marketplace always has.\n\nThe whole thing lives inside a couple of hundred milliseconds, which is what forces the funnel shape in the first place.","numbers":["Tens of millions of products in, a few thousand out of retrieval, tens shown","Coupang's published ranking stage uses 100+ criteria","Typical end-to-end server-side budget: 200-300 ms p99"],"red_flags":["Describing a single-stage system, or not saying why the funnel is a funnel.","Treating query understanding as string preprocessing rather than a structured output the whole funnel consumes.","Ranking purely on relevance, which is the wrong objective for a commerce marketplace."],"followups":["Where would you put an LLM in that, and where would you refuse to?","Which stage do you instrument first if quality drops?","How does personalisation enter - retrieval, ranking, or both?"],"coupang":"This is Coupang's own published decomposition. Using their vocabulary - retrieval then ranking, relevance plus product attractiveness - signals you did the reading.","section":"The funnel","level":"L6","type":"System Design","source":"written for this loop"},{"id":2,"question":"Why is search a multi-stage funnel at all? Why not run your best model over the whole corpus?","say":"Because the cost of your best model times the size of the corpus is a number no latency budget survives.\n\nA cross-encoder that jointly attends over query and document is the most accurate thing you have, and it costs maybe a millisecond per pair on a GPU. Ten million products is ten thousand seconds per query. The funnel exists to spend an accuracy-per-flop budget unevenly: a very cheap model looks at everything, and a very expensive model looks at almost nothing.\n\nThe structure falls out of that. Each stage is roughly an order of magnitude more expensive per item and sees an order of magnitude fewer items, so every stage costs about the same in wall-clock. That's the design invariant — if one stage dominates your latency, your funnel is mis-shaped.\n\nThe thing to say next, because it's what separates people who've run one from people who've read about one: the stages have different objectives, not just different budgets. Retrieval optimises recall, because a product it drops can never be recovered. Ranking optimises order over what survived. Measuring retrieval with NDCG, or ranking with recall, is a category error that produces months of confused experiments.\n\nAnd the funnel has a real cost: cascading errors. Your ranker is only ever as good as the candidates it's handed, so retrieval recall sets a ceiling on end-to-end quality that no amount of ranking work can lift.","numbers":["Cross-encoder: ~1 ms per query-document pair; 10M products = ~3 hours per query","Rule of thumb: each stage ~10x cheaper per item, ~10x more items"],"red_flags":["Only giving the cost argument and missing that the stages optimise different objectives.","Not naming the ceiling retrieval recall places on the whole system.","Claiming ANN alone solves it - ANN makes retrieval cheap, it does not make a cross-encoder cheap."],"followups":["How do you measure whether retrieval is the bottleneck rather than ranking?","When would you collapse two stages into one?","What does the funnel do to your ability to A/B test a single stage?"],"section":"The funnel","level":"L6","type":"First Principles","source":"written for this loop"},{"id":3,"question":"You own a search endpoint with a 250 ms server-side p99. Where does the time go, and what do you cut when you are over?","say":"Budget it as roughly: query understanding 10 ms, retrieval 50, L1 ranking 30, L2 ranking 80, and the rest is fan-out, merge, and serialisation overhead — which is always larger than people expect, often 40 or 50 ms of the total.\n\nThe first thing I'd check is that p99 is actually the tail of the same distribution and not a bimodal mix. In search it usually is bimodal: head queries hit cache and return in 20 ms, tail queries miss everything and take 300. Optimising the mean of that is wasted effort. Separate the populations first.\n\nWhen I'm over, I cut in this order. Cache aggressively at the query-understanding and retrieval layers, because head traffic is enormously skewed and a rewrite cache is nearly free. Then reduce L2 candidate count — going from 1000 to 500 candidates is usually a fraction of a point of NDCG and half the ranking cost, and that's the best exchange rate in the system. Then quantise or distil the L2 model. Then, only then, touch retrieval depth, because that's the one that costs you recall you can't get back.\n\nWhat I wouldn't do is add a timeout that silently drops the dense arm, which is the classic mistake — it converts a latency problem into an invisible quality problem that only shows up as a slow relevance regression nobody can attribute.","numbers":["Illustrative budget: QU 10 ms, retrieval 50, L1 30, L2 80, overhead 40-50","L2 candidates 1000 -> 500: typically <1 NDCG point for ~50% of ranking cost"],"red_flags":["Optimising the mean when the distribution is bimodal between cached head and uncached tail.","Cutting retrieval depth first - it is the one cut that loses recall permanently.","Adding a silent timeout on one retrieval arm, turning latency into unattributable quality loss."],"followups":["What is your cache invalidation story when prices and stock change constantly?","How would you tell whether the dense arm is earning its 30 ms?","Where would you spend 50 ms if you were given it?"],"section":"The funnel","level":"L6","type":"Estimation","source":"written for this loop"},{"id":4,"question":"Design the query understanding system for an e-commerce search engine.","say":"I'd build it as a pipeline that produces a structured query object, and I'd organise the whole thing around the head-torso-tail split, because the right technique is completely different in each segment.\n\nThe stages: normalise — case, width, unicode, and for Korean the morphological analysis, since Korean is agglutinative and a naive whitespace tokeniser destroys the query. Then spell correction. Then segmentation and entity tagging, pulling out brand, category, attribute, and constraints like price or size. Then intent classification — is this navigational to a specific product, a category browse, or an exploratory need. Then expansion with synonyms.\n\nThe architectural decision I'd push on is what's precomputed versus what's live. Head queries are a tiny set covering most traffic, so I'd precompute their entire understanding offline, review the top few thousand by hand, and serve from a lookup table. That gives you editorial control exactly where the traffic is and costs nothing at serving time. Tail queries get the live model path.\n\nThe thing that makes this work or not is that each signal carries a confidence, and low-confidence signals become ranking features rather than retrieval filters. A category prediction you're 95% sure of can restrict retrieval; one you're 60% sure of must not, or you produce zero results for the queries you understood worst. That asymmetry is the whole game.","numbers":["Head/torso/tail: roughly the top 1% of distinct queries carry a large share of volume in mature commerce search","Precomputing the top few thousand queries typically covers a majority of sessions"],"red_flags":["One model path for all queries, ignoring that head traffic is small enough to curate.","Letting a low-confidence signal filter retrieval, which produces zero-result pages exactly where understanding is weakest.","Treating tokenisation as a library call in a multilingual catalogue."],"followups":["How do you evaluate query understanding in isolation, without an end-to-end A/B?","What breaks first when you launch in a new language?","Where does an LLM fit, given the latency budget?"],"coupang":"Coupang hires explicitly for 'query/intent understanding, query recommendation and search widgets quality', and their index is Korean, English and Mandarin - so the morphology point is live, not theoretical.","section":"Query understanding","level":"L6","type":"System Design","source":"written for this loop"},{"id":5,"question":"Design spell correction for a commerce search engine. What breaks a naive dictionary approach?","say":"A dictionary breaks immediately, because in commerce the vocabulary is mostly not words. Brand names, model numbers, SKUs, and deliberate stylisations are all out-of-dictionary and all correct. A dictionary-backed corrector confidently rewrites a real part number into a real word and destroys the query.\n\nWhat I'd build instead is query-log-driven. The signal that a query is misspelled isn't that it's absent from a dictionary — it's that users who typed it reformulated immediately and then clicked. Mine those reformulation pairs from sessions and you get a correction table that's automatically in-domain and self-updating, including the brand names no dictionary has.\n\nUnderneath that, a noisy-channel model: score candidates by the probability of the correction times the probability of the typo given the correction. Generate candidates with edit distance over an index built for it, and make the error model keyboard-aware and language-aware — for Korean, jamo-level confusions, not Latin-letter edits.\n\nThree things I'd insist on. Correct against the catalogue, not against language, so you never correct toward something with no inventory. Prefer showing 'showing results for X, search instead for Y' over silently rewriting, because silent correction of a correct rare query is the worst failure. And never correct a query that already has good results — measure the intervention against zero-result rate and reformulation rate, not against a spelling benchmark.","numbers":["Damerau-Levenshtein distance 1 covers the large majority of real typos; distance 2 adds recall at a steep precision cost"],"red_flags":["Any dictionary-based approach in a catalogue full of brands and part numbers.","Correcting silently rather than offering the correction.","Evaluating on a spelling benchmark instead of zero-result and reformulation rates."],"followups":["How do you handle a brand that is itself a misspelling of a word?","What is your latency budget for this, and does candidate generation fit in it?","How does this interact with the synonym layer?"],"section":"Query understanding","level":"L6","type":"First Principles","source":"written for this loop"},{"id":6,"question":"How do you mine synonyms for query expansion without a hand-built ontology?","say":"Three sources, and they disagree in useful ways.\n\nBehavioural first, and it's the strongest: two queries are synonymous if they lead to clicks on the same products. Build a query-product click bipartite graph and look at the overlap in click distributions. This captures the commerce-specific equivalences no lexical resource has — that a colloquial term and the catalogue's formal term mean the same thing to shoppers. Session reformulations give you the same signal from the other side: a user searching X then immediately Y, then clicking, is telling you X and Y are close.\n\nSecond, embedding neighbourhoods, which give recall where behaviour is sparse — the tail, where you have no clicks. But cosine similarity conflates 'similar' with 'interchangeable', and those are very different. Red and blue are neighbours in embedding space and are not synonyms. So embeddings propose, behaviour confirms.\n\nThird, the catalogue itself: titles and attributes for the same product across sellers give you a free paraphrase corpus.\n\nThe part I'd emphasise is that synonymy in search is directional and query-dependent. 'Laptop' should expand to 'notebook', but expanding 'notebook' to 'laptop' is wrong when the user wants paper. So I'd store directed pairs with a confidence, scope them by query category, and apply high-confidence ones at retrieval and low-confidence ones as ranking features only.","red_flags":["Treating synonymy as symmetric - it is directional and category-dependent.","Using embedding cosine alone, which conflates 'similar' with 'interchangeable'.","Expanding at retrieval with low-confidence pairs, which quietly wrecks precision."],"followups":["How do you stop an expansion loop where A expands to B expands to C?","Index-time or query-time expansion - what is your production policy?","How do you evaluate a synonym set before shipping it?"],"section":"Query understanding","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":7,"question":"When should a query understanding signal change retrieval, and when should it only be a ranking feature?","say":"The rule I'd state is: a signal filters retrieval only when being wrong about it is recoverable, and it's a ranking feature otherwise. Which in practice means it comes down to the signal's precision and the cost of an empty result page.\n\nFiltering at retrieval is a hard constraint. If you predict a category and restrict to it, a wrong prediction doesn't degrade the results — it deletes them. The customer sees nothing, or sees a page of the wrong department, and there's no downstream stage that can recover. Whereas the same signal as a ranking feature lets the model learn how much to trust it, in context, and gets overridden by strong evidence from other features.\n\nSo: high-precision, low-ambiguity, explicitly-stated constraints go into retrieval. A price filter the user typed. A brand token that matches exactly one brand. Everything inferred, probabilistic, or soft belongs in ranking.\n\nThe asymmetry people miss is that the cost isn't symmetric across the query distribution. Your understanding is most confident on head queries, which are also the ones you could have precomputed and curated. It's weakest on tail queries — and tail queries are where zero-result pages hurt most, because there's no obvious reformulation. So the queries where filtering is most tempting are exactly the ones where it's safest, and the queries where you need help most are the ones where it's most dangerous.\n\nThe operational version: filter only with a confidence threshold, and always have a fallback pass that re-runs unfiltered when the filtered pass returns too few.","red_flags":["Filtering on an inferred category without a confidence threshold and a fallback pass.","Not recognising that a retrieval filter is unrecoverable while a ranking feature is not.","Assuming the zero-result cost is uniform across the query distribution."],"followups":["What threshold would you set, and how would you choose it?","How do you detect that a filter is silently over-firing in production?","Does the answer change for a navigational query?"],"section":"Query understanding","level":"L7","type":"Trade-off","source":"written for this loop"},{"id":8,"question":"Your PM wants \"LLM-powered search.\" What do you actually build?","say":"I'd push back on putting an LLM in the online path and put it everywhere else, because the value is real but the latency isn't affordable where people first reach for it.\n\nOffline is where it pays. Generating training data: have an LLM produce relevance judgements at a scale human annotators can't reach, then distil that into a cross-encoder you can actually serve — you get most of the quality at a thousandth of the cost. Enriching the catalogue: normalising messy seller-written titles, extracting structured attributes, generating the text that makes a sparse listing retrievable at all. This is quietly the highest-ROI use in commerce, because most retrieval failures in a marketplace are bad product text, not bad models. And mining query understanding resources — synonyms, segmentation, intent labels — reviewed and then baked into lookup tables.\n\nNear-line, for head queries: precompute LLM-generated rewrites or expansions for the top few thousand queries and serve them from a cache. You get the quality on the traffic that matters with zero online cost.\n\nOnline, I'd only accept it where the latency is already expected: a generative answer or summary rendered alongside results, streamed, not blocking the product grid. Never in the retrieval or ranking path.\n\nAnd I'd say the quiet part: for most commerce search, a well-tuned hybrid retriever plus a distilled cross-encoder beats an LLM in the loop on every axis that matters — latency, cost, and consistency.","numbers":["LLM reranker vs distilled cross-encoder: comparable offline quality at roughly two to three orders of magnitude difference in cost per query"],"red_flags":["Putting an LLM in the online ranking path without costing it against the latency budget.","Missing catalogue enrichment, which is usually the biggest win in a marketplace.","Not proposing distillation as the bridge between LLM quality and servable cost."],"followups":["How would you validate LLM-generated relevance labels before training on them?","What stays human in that labelling program?","How do you stop the distilled model inheriting the LLM's systematic biases?"],"coupang":"The JD explicitly asks for innovation using LLMs, embedding-based retrieval and multi-modal learning. Having a specific, cost-aware answer here rather than enthusiasm is the L6 differentiator.","section":"Query understanding","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":9,"question":"Your search works well in English but is nearly useless in Korean. Diagnose.","say":"Almost always tokenisation, and specifically that you're applying an analyser built for space-delimited languages to one that isn't.\n\nKorean is agglutinative: a single eojeol — the thing between spaces — carries a root plus particles that mark case and topic. Whitespace tokenisation produces tokens that include the particle, so the same noun appears as a dozen distinct index terms depending on its grammatical role, and the query form never matches the document form. Your inverted index fragments and recall collapses. Compound nouns make it worse, because Korean compounds are written without internal spaces and need decompounding to be retrievable by their parts.\n\nSo the diagnosis order: dump what the analyser actually produces for a failing query and for a document that should match it, and compare token by token. That usually ends the investigation in ten minutes. Then check whether index-time and query-time analysers are the same — a mismatch there is silent and devastating.\n\nThe fix is a morphological analyser — Nori or Mecab-ko for Korean — with a custom dictionary for brands and product terms, which is the part that always needs work because commerce vocabulary isn't in a general-purpose lexicon. And normalisation the general pipeline forgets: Hangul jamo composition, and the fact that Korean shoppers mix Latin brand names into Korean queries, so you need both analysers on the same field.\n\nI'd also check the dense arm separately, because a multilingual embedding model can be weak in a language even when tokenisation is fine.","red_flags":["Reaching for a better model before checking what the analyser emits.","Not verifying that index-time and query-time analysis match.","Assuming a multilingual embedding model removes the need for language-specific lexical analysis."],"followups":["How do you handle a query mixing Korean and a Latin-script brand name?","What is your decompounding policy, and what does it cost in precision?","How would you evaluate this without Korean-speaking annotators?"],"coupang":"Coupang's index is explicitly multilingual - Korean, English and Mandarin. This is a live production concern for them, not a hypothetical.","section":"Query understanding","level":"L5","type":"Debugging","source":"written for this loop"},{"id":10,"question":"What do BM25's k1 and b actually control, and when would you change them from the defaults?","say":"k1 controls term-frequency saturation and b controls length normalisation, and in commerce you almost always want to move both away from the text-retrieval defaults.\n\nk1 sets how fast the contribution of repeated terms flattens out. At k1 of zero, term frequency is binary — the term is present or it isn't. As k1 grows, repetition keeps adding score. The defaults around 1.2 to 1.5 come from long prose documents where a term appearing ten times genuinely means more. Product titles are short and don't repeat meaningfully, and a seller repeating a keyword is usually keyword stuffing, not relevance. So for a title field I'd push k1 down, toward 0.5 or lower, which makes matching nearly binary and defuses stuffing.\n\nb controls how much long documents get penalised. At b equal to zero there's no length normalisation; at 1 it's full. The default 0.75 is tuned for documents whose length reflects how much they cover. Product descriptions don't work that way — a long description means a verbose seller, not a more relevant product. So high b on description fields, and low b on titles where length variation is mostly noise.\n\nThe real answer is that you tune these per field, not per index, which is why multi-field BM25F matters more here than the parameters themselves. And you tune them against your own judgement set, because the right values are catalogue-specific.","numbers":["Defaults: k1 = 1.2-1.5, b = 0.75","Commerce titles: k1 around 0.3-0.6, b low; descriptions: b at or near 1.0"],"red_flags":["Reciting the formula without saying what each parameter does to behaviour.","Tuning one k1 and b for the whole index rather than per field.","Not connecting low k1 to keyword-stuffing defence in a marketplace."],"followups":["How does BM25F differ from running BM25 per field and summing?","How would you tune these without a judgement set?","What does this do to your hybrid fusion weights?"],"section":"Lexical retrieval","level":"L5","type":"Conceptual","source":"written for this loop"},{"id":11,"question":"A search for \"red dress\" ranks a product titled \"Red\" with \"dress\" scattered through a long description above an exact \"Red Dress\" title match. Diagnose and fix.","say":"This is field weighting and length normalisation fighting each other, and it's the classic argument for BM25F over naive multi-field scoring.\n\nWhat's happening: you're probably scoring each field separately and taking a max or a sum. The long description gives 'dress' a high raw term frequency, and if b is low on that field, length normalisation isn't discounting it enough. Meanwhile the exact title match scores once for each term with no repetition. Add IDF into it — if 'red' is rarer than 'dress' in your catalogue, a product that's strongly 'red' can outscore one that's both, which is the deeper bug.\n\nThe diagnosis is mechanical: pull the score explanation for both documents. Every serious engine will break the score down per field per term, and it'll show you exactly which component is doing it. Don't theorise before you've looked at that.\n\nThe fix has three parts. Move to BM25F, which pools term frequencies across fields with per-field weights *before* saturation, instead of saturating per field and summing — that's what stops description repetition from accumulating. Raise b on the description field toward 1. And add a coordination or phrase signal: a document matching both query terms in the title should get an explicit boost over one matching them across fields, because in commerce, adjacency in the title is strong evidence of what the product actually is.\n\nLonger term this is what the reranker is for, but the candidate has to survive retrieval first.","red_flags":["Theorising before reading the engine's score explanation, which answers it directly.","Summing per-field BM25 scores rather than pooling term frequencies in BM25F.","Reaching for a neural reranker when the candidate is being mis-ordered inside retrieval."],"followups":["Why does BM25F pool before saturating rather than after?","How would you add a phrase signal without exploding index size?","Would a dense arm have fixed this? Why is that not the answer here?"],"section":"Lexical retrieval","level":"L6","type":"Debugging","source":"written for this loop"},{"id":12,"question":"Explain BM25. Why is it still used in production search systems?","say":"BM25 is a bag-of-words scoring function that fixes the two places raw TF-IDF is naive, and it's still the default lexical retriever in Lucene, Elasticsearch and Solr.\n\nFirst is term-frequency saturation. In TF-IDF a document mentioning your query term twenty times scores twenty times one that mentions it once, which is obviously wrong. BM25 runs the count through a saturating function, controlled by k1, so the fifth occurrence adds far less than the second. Second is length normalization: the denominator scales with document length relative to the corpus average, controlled by b, so a document twice the average needs roughly twice the term frequency to score the same. That stops long documents winning by containing everything.\n\nIt survives because it's an inverted-index lookup, so milliseconds over hundreds of millions of documents; it needs no training data, just corpus statistics, so it works on day one in a new domain; and it's interpretable, so you can say exactly which query terms matched and what each contributed.\n\nBut the real reason is complementarity. Dense retrieval fails on exact matches - part numbers, rare proper nouns, code identifiers - which is precisely what lexical matching is good at, so every serious production system is hybrid.","numbers":["Typical parameters: k1 around 1.2-2.0, b around 0.75"],"red_flags":["\"BM25 is just TF-IDF\" without being able to name what changed.","Doesn't know what k1 and b control.","Treats it as legacy - it is the lexical half of essentially every production hybrid system."],"followups":["What are typical values for k1 and b?","What is BM25F for?","How would you fuse BM25 with a dense retriever?"],"section":"Lexical retrieval","level":"L5","type":"Conceptual","source":"drill deck"},{"id":13,"question":"Design the training recipe for a domain bi-encoder from your search logs. Walk through negatives, denoising, and distillation.","say":"The recipe is: positives from clicks with purchase weighting, negatives mined hard, denoising throughout, and distillation from a cross-encoder at the end. The negatives are where the model is won or lost.\n\nPositives: clicked products, weighted up for add-to-cart and purchase, because a click on a commerce result is a weak signal that often means the thumbnail was attractive rather than the product being right.\n\nNegatives in three tiers. In-batch negatives are free and give you the easy contrast, but they're random products and the model learns to separate 'dress' from 'laptop', which is not the discrimination you need. So you mine hard negatives — products retrieved by BM25 for that query and not clicked. That teaches the distinctions that matter. Then you refresh them against the model itself every epoch or two, because hard negatives mined from BM25 stop being hard once the model beats BM25.\n\nDenoising matters more than people expect. A non-click isn't a negative — it's usually a non-examination, because the user never scrolled that far. So mine negatives only from positions the user plausibly saw, and use a false-negative filter: drop any mined negative the cross-encoder scores above the positive, because you're otherwise training the model that a correct answer is wrong.\n\nThen distillation. Train a cross-encoder on the same data, score a large set of query-document pairs, and train the bi-encoder to match the cross-encoder's score distribution with a soft loss rather than the hard click labels. That transfers ordering information the binary labels don't carry and is usually worth more than any architecture change.","numbers":["In-batch negatives scale with batch size - large batches matter, which is why these models train on big-memory setups","Hard negative refresh every 1-2 epochs; static hard negatives go stale once the model beats the miner"],"red_flags":["Training on in-batch negatives only, which produces a model that matches topic rather than intent.","Treating unclicked as negative without accounting for position and examination.","Skipping false-negative filtering, which actively teaches the model that correct answers are wrong."],"followups":["What is the logQ correction and why do in-batch negatives need it?","How do you decide the ratio of hard to random negatives?","How would you evaluate this before it touches the online system?"],"section":"Semantic retrieval","level":"L6","type":"Architecture Design","source":"written for this loop"},{"id":14,"question":"Why do bi-encoders train with such large batches? Explain in-batch negatives and the logQ correction.","say":"Because with in-batch negatives, batch size *is* the number of negatives per positive, so it directly sets how hard the contrastive task is.\n\nThe trick: in a batch of N query-document pairs, each query's positive is its own document and the other N-1 documents serve as its negatives, for free. No extra forward passes. The softmax is over N candidates, so the task gets harder and the gradient more informative as N grows. That's why these models train at batch sizes in the thousands, often with cross-device negative sharing to get the effective N up further.\n\nThe logQ correction handles a bias that this introduces. Your batch isn't a uniform sample of the corpus — it's sampled from your training distribution, so popular items appear as negatives far more often than rare ones. The model learns to push down popular items simply because they keep showing up as negatives, which in commerce is exactly backwards: the popular items are usually the ones you want to retrieve. The correction subtracts the log of the sampling probability from each logit, so the score reflects relevance rather than how often the item happened to be sampled. Estimate that probability by streaming item frequency during training.\n\nThe other thing worth saying is that large batches are necessary but not sufficient. In-batch negatives are random, so they're easy — the model saturates on them quickly. Past a certain batch size you get very little from more randoms and much more from a handful of mined hard negatives. Both, not one.","numbers":["Typical bi-encoder batch sizes: 1k-16k with cross-device sharing","logQ correction subtracts log of the item's sampling probability from its logit"],"red_flags":["Not knowing why batch size specifically matters for this architecture.","Missing that popularity-biased sampling penalises exactly the items commerce wants surfaced.","Believing more random negatives keeps helping indefinitely."],"followups":["How do you estimate the sampling probability in a streaming setting?","What happens to the logQ correction when you add mined hard negatives?","Does this bias help or hurt if your goal is diversity?"],"section":"Semantic retrieval","level":"L6","type":"First Principles","source":"written for this loop"},{"id":15,"question":"Your HNSW recall@10 drops from 0.95 to 0.6 when users apply a filter matching 2% of the corpus. Why, and what are the fixes?","say":"Because post-filtering and graph traversal interact badly: the graph is built over the whole corpus, so a greedy search navigates through nodes that the filter will throw away, and you exhaust your candidate budget before finding enough that survive.\n\nConcretely, if you search for 10 and filter afterwards, at 2% selectivity you need to have found roughly 500 raw neighbours to end up with 10. Standard HNSW with ef_search around 100 never gets there. Worse, the graph's navigable structure assumes you can move through any node — when you filter during traversal instead, the surviving subgraph can be disconnected, and the search gets stranded in a region with no path to the true neighbours.\n\nThree fixes, in the order I'd try them. First, over-fetch: raise ef_search so the raw candidate pool is large enough to survive the filter — cheap to implement, and fine down to maybe 10% selectivity, but it degrades badly below that and the latency grows. Second, filtered search inside the traversal, where the graph is walked over all nodes but only matching ones enter the result heap — this keeps connectivity while respecting the filter, and it's what the mature libraries implement. Third, and this is the right answer at 2%: partition. Build separate indexes per high-cardinality filter value, or fall back to a brute-force scan, because 2% of a corpus is often small enough that exact search is faster than approximate search over the whole thing.\n\nThe general principle: below some selectivity threshold, ANN stops being the right tool. Measure where that crossover is for your corpus rather than assuming it.","numbers":["At 2% selectivity you need ~500 raw candidates to yield 10 survivors","Typical default ef_search ~100, which is far short of that"],"red_flags":["Not distinguishing post-filtering from in-traversal filtering.","Only raising ef_search, which fails at low selectivity and costs latency.","Missing that brute force beats ANN below a selectivity crossover worth measuring."],"followups":["How would you find that crossover threshold empirically?","What happens to graph connectivity under in-traversal filtering?","How do you handle a filter on a continuous attribute like price?"],"section":"Semantic retrieval","level":"L6","type":"Debugging","source":"written for this loop"},{"id":16,"question":"Dense retrieval tanks on queries containing part numbers. Fix it without abandoning dense retrieval.","say":"Because part numbers are exactly what embeddings are bad at: they're rare, they're often out-of-vocabulary and get shredded into meaningless subword pieces, and the whole point of an embedding is to map similar strings to nearby vectors — which for identifiers is the opposite of what you want. Two part numbers differing by one character are different products, and the model puts them next to each other.\n\nI wouldn't try to fix the embedding. The fix is routing and fusion.\n\nFirst, detect these queries in query understanding — high-entropy alphanumeric tokens, digit-letter mixes, low corpus frequency. That's a cheap, high-precision classifier. When it fires, route the query lexically: BM25 over an exact-match field will nail it, because an exact identifier match is the strongest signal in the entire system.\n\nSecond, make the fusion adaptive rather than fixed. A static hybrid weight is wrong here by construction — you want the lexical arm to dominate for identifier queries and the dense arm to dominate for descriptive ones. So make the fusion weight a function of the query's detected type, or better, let a light reranker over the fused candidates learn it.\n\nThird, on the index side, keep an untouched keyword field with minimal analysis alongside the analysed one, so identifiers survive tokenisation intact.\n\nThe reason to say all of this rather than 'add BM25' is that it's the general principle: dense and lexical fail on disjoint query populations, which is precisely why hybrid works, and your fusion should know which population it's in.","red_flags":["Trying to fine-tune the embedding model to memorise identifiers.","Using a fixed hybrid weight when the optimal weight is query-type dependent.","Losing the exact identifier to subword tokenisation with no unanalysed field to fall back on."],"followups":["How would you build that query-type classifier and what is its precision requirement?","What else besides part numbers falls into this failure class?","How do you A/B test a change that only affects 2% of queries?"],"section":"Semantic retrieval","level":"L6","type":"Debugging","source":"written for this loop"},{"id":17,"question":"Bi-encoder vs. cross-encoder: why not cross-encode everything, and what exactly does the cross-encoder buy?","say":"Because it isn't a constant-factor difference, it's a different complexity class. A bi-encoder's score decomposes: document vectors are computed offline and indexed, so a query costs one encoder pass plus a sublinear index probe, whether the corpus is a million documents or a billion. A cross-encoder scores the pair jointly, so nothing precomputes — scoring N documents means N full forward passes. At 100 million documents and roughly 5×10¹⁰ FLOPs per pair for BERT-base at 256 tokens, that's 5×10¹⁸ FLOPs for one query, thousands of GPU-seconds. No hardware fixes that, because the problem is that the score isn't decomposable.\n\nWhat the joint pass buys is term-level interaction. The bi-encoder has to compress query and document into single vectors before they ever meet, so matching is one dot product over pooled representations and fine-grained correspondence is gone. The cross-encoder attends across the pair token by token, so it can resolve exact identifiers, negation, and which passage answers which aspect of the query. That's why it reliably adds NDCG on top of any first stage.\n\nSo it isn't either-or, it's a funnel: recall-oriented decomposable retrieval feeds a precision-oriented cross-encoder over the top hundred or so, each stage spending more per candidate on fewer candidates. ColBERT sits in between — per-token document embeddings precomputed, MaxSim at query time — recovering much of the interaction quality at a storage multiple. And the stages are coupled in training too: the cross-encoder is the bi-encoder's distillation teacher and the denoiser for its mined hard negatives.","numbers":["BERT-base, 256 tokens: ~5×10¹⁰ FLOPs per query-document pair","Cross-encoding 10⁸ docs = ~5×10¹⁸ FLOPs per query — thousands of GPU-seconds","Affordable rerank window: 10²–10³ candidates"],"red_flags":["Framing it as \"cross-encoders are slow\" without the decomposability argument — that's why no hardware fixes it.","Treating it as an either-or choice rather than two stages of one funnel.","Proposing a cross-encoder as the first-stage retriever over a large corpus."],"followups":["Where does ColBERT sit on this spectrum, and what does it cost?","How would you use the cross-encoder to make the bi-encoder better?","Your reranker budget is 20 ms — what do you serve?"],"section":"Semantic retrieval","level":"L5","type":"Conceptual","source":"drill deck"},{"id":18,"question":"How does HNSW work, and why is it fast?","say":"HNSW is a proximity graph over your vectors with a small-world hierarchy on top, searched greedily with a bounded beam.\n\nEvery vector is a node. Each draws a random top level from a geometric distribution, so layers thin out by a constant factor going up — layer zero holds everything, the top layer a handful. Within a layer each node keeps at most M links, twice that at layer zero, and they're picked with a diversity heuristic rather than being the M literal nearest: you keep neighbors covering different directions, so you get real long-range edges instead of a tight local clique.\n\nSearch enters at the top and greedily hops toward the query, dropping a layer whenever no neighbor improves. At layer zero you widen into a best-first beam of size efSearch and stop when nothing unexplored beats your worst kept result.\n\nThree things make it fast. The hierarchy solves the entry problem — you land in the query's neighborhood in roughly log-many hops instead of walking there through layer zero. Each hop is only M distance computations against a constant-degree list. And the beam gives cheap backtracking, which matters because distance concentration in high dimensions creates local optima that greedy walks fall into. That's why efSearch is the recall-latency dial.\n\nThe caveat I'd volunteer: log scaling is empirical, on data with low intrinsic dimension, not a theorem. And you pay in RAM — vectors plus edges, all resident, with random access that fits disk badly.","numbers":["Degree: at most M links per node per layer, 2M at layer 0"],"red_flags":["Describing it as a tree or a binary search — it's a graph, best-first, with no partitioning and no pruning certificate.","Stating O(log n) as a proven worst-case bound.","Not knowing what efSearch does — it's the parameter every production tuning session revolves around."],"followups":["What happens if efSearch is less than k?","Why is deletion hard?","When would you pick IVF-PQ over HNSW?"],"section":"Semantic retrieval","level":"L5","type":"Conceptual","source":"drill deck"},{"id":19,"question":"Your two-tower model retrieves documents that share keywords with the query but aren't actually relevant. How do you fix this?","say":"The model has learned lexical matching dressed up as embeddings, and the cause is almost always the negatives you trained on. With random or in-batch negatives, the only thing the model has to do is separate a relevant document from a completely unrelated one — keyword overlap solves that, and once the loss is low the gradient from those easy negatives is essentially zero. It never sees an example that shares keywords and isn't relevant, so it never learns the distinction you actually care about.\n\nI'd confirm it cheaply first. Take a hundred diverse queries, pull the top 50, label the false positives, and check whether they share salient query terms. Then score the same queries with BM25 — if BM25 and the two-tower model rank nearly the same documents, you've paid a lot of money for BM25 in embedding space.\n\nThen fix it in order of impact. Mine hard negatives from BM25's top 100, drop anything that's actually a positive, and train against those; mix them with random negatives, roughly 30 percent hard, because training on hard negatives alone is unstable and amplifies label noise. Second, add a cross-encoder reranker over the top 100 — a dual encoder structurally cannot model word-level interaction between query and document, and this is the most reliable fix in production. And start from a retrieval-pretrained encoder like E5 or BGE rather than vanilla BERT.","red_flags":["\"Make the model bigger\" — the training signal is the problem, not capacity","Never mentioning hard negatives","Stripping keywords out of the query, which destroys information rather than fixing the model"],"followups":["How often do you refresh hard negatives during training?","What breaks if you train on hard negatives only?","How would you measure lexical versus semantic matching directly?"],"section":"Semantic retrieval","level":"L5","type":"Debugging","source":"drill deck"},{"id":20,"question":"Cosine similarity vs dot product vs L2 distance for embeddings—when each?","say":"For L2-normalized embeddings all three give you the same ranking, so the choice is about computation, not semantics. Cosine is the dot product after normalization, and squared L2 between unit vectors is two times one minus cosine - a monotone transform. So normalize at index time and use dot product, because that's what maximum inner product search and every ANN library is built for.\n\nThe choice only matters when embeddings aren't normalized, and then it's a question about magnitude. Dot product rewards large norms, and norms correlate with frequency and popularity, because those items got more gradient updates. In a recommender that's often a feature - dot product naturally boosts popular items. In semantic search it's usually a bug, and cosine strips it out.\n\nL2 I reach for when I need an actual metric with the triangle inequality, so k-means or clustering on the embeddings, or when the space was trained with a distance-based loss like triplet or contrastive with Euclidean margins. Match the retrieval metric to the training objective - that's the rule that actually matters.\n\nCLIP and most modern encoders already normalize, so the question is moot there. It comes straight back the moment you concatenate unnormalized side features like price or recency.","numbers":["For unit vectors: ||u - v||^2 = 2(1 - cos(u,v)), so all three rank identically"],"red_flags":["\"Cosine is always right for embeddings\" - only if magnitude carries nothing you want.","Doesn't know the three are rank-equivalent for normalized vectors; that's the most commonly tested fact here.","Picks a metric without asking what loss the embeddings were trained with."],"followups":["What is MIPS, and why is it the standard retrieval primitive?","How does the metric choice interact with your ANN index?","You want cosine semantics but dot-product speed - what do you do?"],"section":"Semantic retrieval","level":"L5","type":"Conceptual","source":"drill deck"},{"id":21,"question":"Explain SPLADE. What do the log-saturation and the FLOPS regulariser each do?","say":"SPLADE is learned sparse retrieval: it produces a sparse vector over the vocabulary, like BM25, but the weights are learned by a transformer rather than counted. So you get semantic matching while still serving from an inverted index — which is the whole appeal, because you keep the mature, cheap, exact infrastructure and the interpretability.\n\nMechanically, you take the masked-language-model head, and for each vocabulary term you max-pool its logit across all input positions. That gives a score per vocabulary entry, including terms that never appeared in the text — which is where expansion comes from. The model learns that a document about a laptop should also carry weight on 'notebook'.\n\nThe log-saturation — log of one plus ReLU of the logit — does two jobs. It forces non-negativity, which is what makes the output a valid inverted-index posting weight. And it saturates, so no single term can dominate, which is the same intuition as BM25's k1.\n\nThe FLOPS regulariser is the part that makes it deployable. Without it, the model happily assigns small weights to thousands of terms, and your postings lists become dense, and query latency explodes — a semantically excellent index that's useless in production. The regulariser penalises the expected number of floating-point operations at query time, which is a smooth, differentiable proxy for posting-list length. So you're explicitly trading retrieval quality against serving cost inside the loss function, which is unusual and is the reason the paper matters.\n\nAgainst BM25 it wins on quality; against dense it's comparable, with better interpretability and no ANN index, but higher query latency than a tuned HNSW.","numbers":["Saturation: w = log(1 + ReLU(logit)), max-pooled over positions","FLOPS regulariser penalises the squared expected term activation - a differentiable proxy for posting-list length"],"red_flags":["Describing it as 'dense retrieval with sparse output' without the inverted-index consequence.","Not knowing what the FLOPS regulariser is for, which is the deployability story.","Claiming it strictly beats dense retrieval - it trades latency for interpretability."],"followups":["How does query latency compare to BM25 at the same index?","Could you serve SPLADE and BM25 from the same index?","Where does this fit against a hybrid BM25 + dense setup?"],"section":"Hybrid retrieval","level":"L6","type":"Conceptual","source":"written for this loop"},{"id":22,"question":"Lexical, dense, or hybrid — argue the retrieval split for a marketplace search engine.","say":"Hybrid — but I'd argue it from the query mix rather than assert it as a default. Marketplace traffic splits three ways: identifier and attribute queries like SKUs and model numbers; head category queries like \"running shoes\"; and a long conceptual tail — \"gift for a coffee snob\", vernacular, misspellings, other languages.\n\nLexical owns the first bucket, and not by accident. Embeddings blur X100 and X200 by construction; the entire point of the geometry is that similar strings land near each other, which is exactly wrong for a one-character part number. BM25 also gives you freshness for free — a new listing is searchable the moment it's indexed, with no encoder version to wait on — plus structured filters on price and category in the same engine, and cheap, explainable head-query serving. Dense owns the tail, where vocabulary mismatch dominates and there's no click history to boost with — plus cross-lingual matching and typo robustness.\n\nThey fail differently and the error sets are complementary, so union the candidates and fuse — reciprocal rank fusion, or better, both scores as features into the reranker. Never sum BM25 and cosine directly; the scales aren't comparable.\n\nTwo staff-level additions. Make it a routing decision, not only a fusion decision — detect identifier-like tokens and weight lexical up rather than running everything at full depth. And be honest about cost: hybrid doubles the operational surface, so a team without eval infrastructure should fix lexical and query understanding first: spell correction, synonyms, zero-result relaxation.","red_flags":["\"Dense replaces lexical\" — fatal in a marketplace with SKUs, filters and churning inventory","A 50/50 hand-wave with no query-mix analysis and no routing story","Summing BM25 and cosine scores without addressing the scale mismatch"],"followups":["Your dense retriever tanks on part-number queries — fix it without removing it.","One retrieval improvement this quarter: which one?","How does the answer change for a documentation-search product?"],"section":"Hybrid retrieval","level":"L6","type":"Trade-off","source":"drill deck"},{"id":23,"question":"You run BM25 and dense retrieval in parallel. How do you combine them - and why does half BM25 plus half cosine fail?","say":"The weighted sum fails because the two scores are not on comparable scales, and the mismatch is query-dependent, which is what makes it unfixable by rescaling. BM25 is unbounded and its magnitude moves with query length and term rarity, so a query containing one very rare term inflates BM25 for every candidate and drowns the dense signal at any fixed alpha. Cosine is bounded and concentrates in a narrow band. Any alpha you tune on one query mix quietly breaks on another.\n\nPer-query min-max or z-scoring does not rescue it either. You are normalising by order statistics of a small, noisy candidate sample, assuming distribution shapes neither system has, and throwing away absolute-confidence information.\n\nWhat I would ship first is reciprocal rank fusion: sum one over k plus rank across the retrievers, with k around sixty. It is rank-based, so it is invariant to any monotone rescaling of either score - the incompatibility problem disappears by construction. The k constant damps top-rank dominance; at sixty, rank one and rank ten contribute comparably, so a document both retrievers agree on can outrank one system's top hit. No tuning, no training data, and it degrades gracefully if a retriever goes down.\n\nThe end state is better than RRF, though. RRF throws away score magnitude and cannot learn that dense should dominate conceptual queries while lexical dominates identifier lookups. So you union the candidates and hand the ranker both raw scores, both ranks, and query features, and fusion becomes learned and query-conditional.","numbers":["RRF: score = sum of 1/(k + rank), k ~ 60"],"red_flags":["Proposing the weighted sum without flagging the scale problem - interviewers use this as a competence gate.","\"Just normalise per query\" - that is the second layer of the trap, not the fix.","Knowing the RRF formula but not what k does or why rank-based fusion is robust."],"followups":["What does k = 0 do to RRF?","When would learned fusion beat RRF materially?","One retriever goes down - what does your fusion degrade to?"],"section":"Hybrid retrieval","level":"L5","type":"Conceptual","source":"drill deck"},{"id":24,"question":"Explain LambdaRank to a strong engineer who knows GBDT but has never done ranking.","say":"The problem LambdaRank solves is that the metric you care about — NDCG — has zero gradient almost everywhere. It depends only on the order of the list, so nudging a score changes nothing until two items swap, at which point the metric jumps. You can't do gradient descent on a step function.\n\nThe insight is that you don't need a loss function at all — you only need the gradients. So skip defining a loss and write the gradient directly. For every pair of documents where one is more relevant than the other, compute what the pairwise logistic gradient would be, then multiply it by the absolute change in NDCG you'd get from swapping just those two. That product is the lambda. Each document's gradient is the sum of lambdas over all pairs it participates in.\n\nWhat that multiplier buys you is the thing pure pairwise ranking gets wrong. RankNet treats every inversion as equally bad, so it spends capacity fixing a swap at positions 50 and 51, which no user sees. The delta-NDCG weight makes a swap at positions 1 and 2 worth far more, because NDCG's positional discount says so. So the model concentrates its effort at the top of the list, which is where the product lives.\n\nAnd it drops straight into GBDT — LambdaMART is just gradient boosting where the gradients come from this construction instead of from a loss. That's why it's still the default for feature-rich commerce ranking: you get listwise-aware optimisation with all of GBDT's handling of heterogeneous tabular features.","numbers":["lambda = (pairwise logistic gradient) x |delta NDCG from swapping the pair|"],"red_flags":["Not saying why NDCG cannot be optimised directly.","Describing it as pairwise without the delta-NDCG weighting, which is the entire idea.","Not knowing that LambdaMART is this gradient plugged into GBDT."],"followups":["Why does it work if the lambdas do not correspond to any actual loss function?","How does this interact with position bias in your training labels?","When would you move to a neural ranker instead?"],"coupang":"Coupang's JD names XGBoost and LightGBM explicitly, and their ranking stage is described as 100+ criteria - a feature-rich tabular setting where LambdaMART is the strong default.","section":"Learning to rank","level":"L6","type":"Conceptual","source":"written for this loop"},{"id":25,"question":"How would you estimate position-bias propensities without degrading the user experience?","say":"Three approaches, in increasing order of how much they cost you.\n\nThe textbook answer is RandPair: randomly swap the results at two positions for a small slice of traffic and measure the click ratio. It's unbiased and simple, and it's also the one that hurts, because you're deliberately showing worse results. I'd use it as a calibration reference, not as the production mechanism, and I'd run it on a fraction of a percent of traffic.\n\nBetter: intervention harvesting. You're already running A/B tests, and different rankers put the same query-document pair at different positions. That variation is free randomisation you've already paid for. Mine your existing experiment logs for pairs that appeared at multiple positions and estimate the propensity from the click-rate ratio across positions. Zero additional user cost, and at Coupang's traffic volume there's plenty of it.\n\nThird: jointly estimate the propensity and the relevance model from click logs, using a regression-EM or a dual-tower examination model where one tower sees only position-and-context features and the other sees query-document features. This needs no randomisation at all. The catch is identifiability — you need genuine position variation in the logs for the two towers to be separable, otherwise the examination model absorbs relevance and you've learned nothing.\n\nThe thing I'd add is that position isn't the only bias. On a commerce grid, row and column both matter, and so does whether the item was above the fold on the device the user had. So the propensity should be conditioned on layout and device, not just rank index.","numbers":["RandPair on 0.1-1% of traffic is usually enough for a calibration reference","Grid layouts need propensities conditioned on row, column, device and fold - not rank alone"],"red_flags":["Proposing full result randomisation on meaningful traffic.","Ignoring intervention harvesting from experiments you already ran.","Modelling position as a single rank index on a grid layout."],"followups":["What makes the dual-tower model identifiable, and how do you check it?","What happens to IPS training when a propensity estimate is near zero?","How do you handle trust bias, where users click a top result because it is on top?"],"section":"Learning to rank","level":"L6","type":"System Design","source":"written for this loop"},{"id":26,"question":"GBDT or neural network for your L2 ranker? Decide for a commerce search engine with rich engineered features.","say":"For a commerce search engine with a hundred-plus engineered tabular features, GBDT — LambdaMART on LightGBM or XGBoost — and I'd need a specific reason to move off it.\n\nThe reason is what the feature space looks like. Those hundred features are heterogeneous and mostly hand-built: BM25 scores per field, price percentile within category, rating, review count, seller quality, delivery speed, historical CTR. They're on wildly different scales, many are monotone by construction, and there are relatively few of them. That's exactly the regime where boosted trees dominate — they're scale-invariant, they capture thresholds and interactions without you specifying them, they train in minutes on CPU, and they support monotonic constraints, which matters commercially when you need to guarantee that a higher-rated product never ranks lower for that reason alone.\n\nNeural nets win when the signal is in raw high-cardinality IDs and sequences — user history, item embeddings, long behavioural sequences — because that's representation learning, which trees can't do. So the honest answer for a mature commerce ranker is usually both: a neural model produces embeddings and sequence-derived features offline, and those go into the GBDT as features alongside everything else. You get representation learning where it helps and tree robustness where it helps.\n\nThe operational argument also matters at L6. GBDT retrains in minutes, which means you can retrain daily against a catalogue that churns. Feature importance is legible to the PM asking why a product ranked where it did. And there's no GPU in the serving path.\n\nI'd revisit if the feature count went to thousands of sparse IDs, or if I needed true end-to-end learning with the retrieval stage.","numbers":["GBDT on ~100 tabular features: minutes to train on CPU; neural equivalents are hours on GPU","Monotonic constraints are a GBDT feature with no clean neural equivalent"],"red_flags":["Choosing neural because it is newer rather than because the feature space calls for it.","Missing the hybrid answer, where neural embeddings become GBDT features.","Ignoring retrain cadence and interpretability, which are real constraints on a commerce ranker."],"followups":["What would make you move fully neural?","How do you get a user-history sequence signal into a GBDT?","What do monotonic constraints cost you in accuracy?"],"coupang":"Their JD lists XGBoost and LightGBM alongside PyTorch and TensorFlow, which is a fair signal that both live in their stack - the hybrid answer is the one that matches.","section":"Learning to rank","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":27,"question":"Your new LTR model improves overall NDCG but tail-query relevance regresses. Why, and what do you change?","say":"Because your training distribution is dominated by head queries and your loss is an unweighted average, so the optimiser is correctly trading tail quality for head quality — it's doing what you asked.\n\nThe mechanism is usually specific: tail queries have sparse behavioural features. Historical CTR for a query-product pair, query-level popularity priors, and click-derived features are all near-zero or missing on the tail. The model learns to lean hard on those features because they're enormously predictive where they exist, and on the tail it's left with nothing but the weak content features it never learned to use well. So performance doesn't degrade gracefully — it falls off a cliff at the point where behavioural coverage runs out.\n\nDiagnosis: bucket your eval by query frequency decile and look at NDCG per bucket. That turns one number into the shape of the problem, and you'll usually see the regression is concentrated in the bottom two deciles. Then check feature coverage per bucket to confirm the mechanism.\n\nThe fixes. Stratify your training sample so the tail isn't drowned out — upweight or oversample tail queries relative to their natural frequency. Train with explicit missingness rather than imputing zeros, so the model can learn a separate regime instead of treating 'no data' as 'bad'. Add content and semantic features that are dense everywhere, which is the structural fix. And consider separate models or a query-frequency feature that lets one model condition on which regime it's in.\n\nThe reporting change matters too: make segmented NDCG a shipping gate, not a diagnostic you run after someone complains.","numbers":["Bucket eval by query-frequency decile; regressions usually concentrate in the bottom two"],"red_flags":["Reporting a single aggregate NDCG and calling it a win.","Imputing zero for missing behavioural features rather than modelling missingness.","Not recognising that the loss is correctly optimising the distribution you gave it."],"followups":["Would you ship separate head and tail models? What does that cost operationally?","How do you set the upweighting factor without overfitting the tail?","What is the business case for protecting tail quality at all?"],"section":"Learning to rank","level":"L6","type":"Debugging","source":"written for this loop"},{"id":28,"question":"Editorial judgments say A beats B for this query; click data says B massively outperforms A. Which do you trust?","say":"Neither, until I know why they disagree — because the disagreement is almost always informative rather than a tie to break.\n\nThere are three common explanations and they lead to opposite actions. One: the clicks are biased. B sat at position one, or had a better thumbnail, or a lower price that got the click and then a return. Position and presentation bias produce exactly this pattern, and the test is whether B still wins after propensity weighting, or in the counterfactual slice where both appeared at similar positions. Two: the judges are wrong about the intent. Annotators score topical relevance from a guideline; shoppers have a need. If the query is ambiguous, judges may be scoring the wrong sense of it — and the click data is then the better evidence about what people actually want. Three: they're measuring different things and both are right. A is more relevant, B converts better because it's cheaper and ships tomorrow. That's not a conflict, it's the actual commerce objective showing through.\n\nSo: check the downstream signal. If B gets the click but also the return, the bounce, or the low satisfaction, the judges were right and clicks were a bad proxy. If B gets the click *and* the purchase *and* no return, the judges were scoring a guideline that doesn't reflect customer value, and the guideline should change.\n\nThe L6 version of this answer is that editorial judgements are for measuring relevance and clicks are for measuring preference, and a commerce ranker needs both as separate signals — not one blended label that hides the disagreement you just found.","red_flags":["Picking a side without diagnosing the source of the disagreement.","Trusting raw clicks without a position-bias correction.","Blending both into one label, which destroys the information the conflict carries."],"followups":["What downstream signals would you add to adjudicate this?","How would you change the annotation guideline based on what you found?","Should the ranker have one head or two here?"],"coupang":"Coupang's ranking explicitly mixes relevance with 'product attractiveness'. This question is a direct probe of whether you understand that those are two objectives, not one.","section":"Learning to rank","level":"L6","type":"Trade-off","source":"written for this loop"},{"id":29,"question":"Pointwise vs.\\ pairwise vs.\\ listwise ranking losses—when do you use each?","say":"Pick by what your labels look like and by what the score has to do downstream.\n\nPointwise — cross-entropy on click, MSE on a relevance grade — treats every item independently and you get the ranking by sorting. Its real virtue is calibration: the score is a probability, which you need if it feeds an ad auction or a threshold. Its weakness is that it knows nothing about position, so an error at rank one costs the same as one at rank a thousand.\n\nPairwise — BPR, RankNet, margin loss — optimizes relative order within a query. That's the natural fit for implicit feedback, where all you really have is \"the user clicked this one and not that one.\" The cost is that every pair is weighted equally, so a swap between one and two costs the same as ninety-nine and a hundred, and the pair count grows quadratically.\n\nListwise — LambdaRank, ListNet — optimizes the whole list. LambdaRank scales each pair's gradient by the NDCG change that swap would cause, so top-of-list swaps dominate, which is the closest you get to optimizing your actual metric. The price is graded relevance labels and a harder debugging story.\n\nSo: calibrated scores for bidding, pointwise. Binary implicit feedback, pairwise. Editorial graded labels with NDCG as the target, listwise. In a two-stage system I'd run InfoNCE or pairwise in the retriever and listwise or pointwise in the ranker.","red_flags":["\"Listwise is always better because it's more sophisticated\" — it needs graded labels and adds real complexity.","\"Pointwise can't rank\" — it ranks fine, it just doesn't optimize the ranking metric.","Never mentioning calibration, which is the whole reason to keep a pointwise head."],"followups":["How does LambdaRank approximate NDCG optimization?","How do you handle position bias in the click data?","Can you combine pointwise and pairwise objectives in one model?"],"section":"Learning to rank","level":"L6","type":"Trade-off","source":"drill deck"},{"id":30,"question":"Your click-trained ranker keeps favoring the items that have historically sat at position 1—better new items never rise. Diagnose and fix.","say":"This is the position-bias feedback loop, and it gets in through three doors at once — labels, features, and the loop itself. You have to close all three, because fixing one leaves the others reintroducing the same bias.\n\nLabels first. Clicks are examination-gated — position one gets several times the examination of position five — so click-derived labels systematically overrate whatever the old ranker put on top. The model learns to predict what was ranked high, not what's relevant.\n\nFeatures second, and this is the door people miss. Historical CTR and engagement aggregates are accumulated exposure, not merit. Incumbents arrive with a fat prior; a new item arrives with an empty one the model reads as \"bad\" rather than \"unknown.\" Feature importance on those priors tells you immediately if that's what's happening.\n\nAnd the loop: this model's output decides tomorrow's exposure, which decides tomorrow's labels and features. Every retrain entrenches the incumbents further.\n\nFixes in order of leverage. On labels, train counterfactually — inverse propensity weighting on examination, propensities from adjacent-pair randomization or regression EM, clipped for variance; the cheap version is position as a training feature held constant at serving. On features, impression-normalize to rates, Bayesian-smooth toward a category prior so empty history reads as prior rather than bad. On the loop, dedicate exploration traffic, keep a small always-on randomized slice as your unbiased eval set, and put new-item exposure share into the launch criteria.","red_flags":["Proposing a hand-tuned freshness boost and stopping — treats the symptom, leaves all three doors open.","No propensities and no randomization anywhere in the answer.","Debiasing labels but leaving the engagement features, which reintroduce the same bias through a second door."],"followups":["How exactly would you estimate the propensities here?","Your IPS-trained model's offline NDCG dropped versus the biased baseline — is that bad?","How much exploration traffic is enough?"],"section":"Learning to rank","level":"L6","type":"Debugging","source":"drill deck"},{"id":31,"question":"Shared-bottom vs MMoE vs PLE for multi-task ranking. Give me a decision framework.","say":"The framework is one question: how correlated are your tasks? That determines how much parameter sharing you can afford before negative transfer eats you.\n\nShared-bottom is one trunk with per-task heads. Maximum sharing, minimum parameters, and
