y, then normalised so the dataset mean is 1.</figcaption></figure>\n<div class=\"mathbox\">$$w(q,d) \\;=\\; \\frac{\\log\\!\\big(1 + \\sum_a n_a(q,d)\\, v(a)\\big)}{\\hat{\\pi}\\big(\\overline{\\text{rank}}, \\text{surface}\\big)}$$</div>\n<p>Three choices inside that formula, each of which she can push on.</p>\n<p><strong>The log.</strong> Without it, a pair with 10,000 clicks contributes 10,000 times the gradient of a pair with one, and your retriever becomes a popularity model. The log is the same saturation intuition as BM25&#x27;s $k_1$, applied to training weight instead of term frequency.</p>\n<p><strong>The propensity divisor.</strong> A click at rank 1 is weak evidence because rank 1 is examined regardless; a click at rank 20 is strong evidence because the user had to work for it. Dividing by $\\hat{\\pi}$ up-weights the deep clicks. <strong>Clip it</strong> — $\\hat{\\pi} \\geq 0.05$ or so — because a propensity estimate near zero produces a weight that dominates the entire batch.</p>\n<p><strong>The normalisation.</strong> Scale weights to mean 1 across the dataset so the loss magnitude, and therefore your learning rate, does not move when you change the value table.</p>\n<h4>Where the weight actually goes</h4>\n<p>Two mechanically different options, and the choice matters more than it looks.</p>\n<div class=\"decide\"><div class=\"dt\">How do you apply the positive weight?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Sample positives with probability proportional to $w$, capped, and then train unweighted</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Keeping the batch uniform and multiplying each example&#x27;s loss term by $w$</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">with in-batch negatives every positive is simultaneously a negative for the other queries in the batch. Loss-weighting only scales its role as a positive, so a heavily weighted pair is a loud positive and a normal-volume negative -- an asymmetry nobody intends. Sampling changes both roles consistently.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">sampling amplifies popularity, so the log compression and the cap are load-bearing, and you lose the ability to tune weights without rebuilding the sampler</span></div><div class=\"drow\"><span class=\"dk fallback\">FALLBACK</span><span class=\"dv\">sample for the bulk of the signal and loss-weight only the returns adjustment, which is small</span></div></div>\n<h4>Session-level attribution for the tail</h4>\n<p>For a tail query with a handful of events, a single click is noise. But reformulation chains are signal, and this is the cheapest tail data you have.</p>\n<p>The rule I would write down, because &quot;attribute the session&quot; is not specific enough to implement:</p>\n<ul>\n<li>A session is one user, events within a 30-minute gap.</li>\n<li>If query $q_1$ produced no click, the user reformulated to $q_2$, and then clicked or purchased item $d$ — attribute $d$ as a positive for <strong>both</strong> $q_1$ and $q_2$.</li>\n<li>Discount the inferred one: $q_1$ gets $0.5 \\times w$, because the attribution is an inference and $q_2$ is the observation.</li>\n<li>Cap the chain at two reformulations. Beyond that the user has changed intent.</li>\n<li>Require the two queries to share a token or exceed a similarity threshold, or you will attribute &quot;toddler boots&quot; to &quot;phone charger&quot; in the same session.</li>\n</ul>\n<p>On this corpus that typically recovers training pairs for a meaningful slice of tail queries that otherwise have no positive at all — which is exactly the population the prompt is about.</p>\n<h3>The shape of the training data</h3>\n<p>Two tables, and <strong>they are different shapes on purpose</strong>.</p>\n<h4>The event log — what you read from</h4>\n<pre class=\"fig\"><code>search_event      search_id, user_id, ts, query_raw, query_norm,\n                  surface, locale, ranker_version, retriever_version\nimpression_event  search_id, item_id, position(row,col), above_fold, ts\naction_event      search_id, item_id, action, ts, order_id</code></pre>\n<p><code>ranker_version</code> and <code>retriever_version</code> are not bookkeeping — they are what makes intervention harvesting possible later, because they identify the natural position randomisation your A/B tests already produced.</p>\n<h4>The retriever&#x27;s table — aggregated to the pair</h4>\n<pre class=\"fig\"><code>retriever_pairs                                        ~180M rows\n  query_norm          string\n  item_id             int64\n  n_impr, n_click, n_atc, n_purchase, n_return   int\n  mean_position       float\n  propensity          float        -- clipped\n  weight              float        -- the formula above, normalised\n  query_freq_bucket   enum(head, torso, tail)\n  split               enum(train, val, test)</code></pre>\n<p><strong>Why aggregate.</strong> The retriever has no user features — the query tower sees a string and nothing else — so per-event rows add no information, and they add popularity skew: a pair shown a million times would contribute a million gradient steps for a signal that is fully captured by its counts. Aggregating deduplicates it and costs nothing.</p>\n<p>Filters worth naming: drop pairs with zero clicks, drop queries with fewer than three distinct clicked items (no contrast to learn from), drop bot and scraper traffic by session-rate heuristics, and drop pairs whose item is no longer in the catalogue.</p>\n<h4>The ranker&#x27;s table — per impression</h4>\n<pre class=\"fig wide\"><code>ranker_impressions                                     ~62B, sampled to ~2B\n  search_id, item_id, position, surface, device, ts\n  feature_vector      float32[~200]   -- LOGGED at serve time, not recomputed\n  label_click, label_atc, label_purchase, label_return  bool\n  propensity          float\n  split               enum</code></pre>\n<p>The ranker <em>does</em> have user and context features, so it needs per-impression rows, and it needs the negatives that never got clicked — which the retriever&#x27;s table has thrown away. The <code>feature_vector</code> is logged rather than recomputed, for the skew reason in Figure 13.</p>\n<div class=\"co say\"><span class=\"col\">Say this</span>The two tables are different shapes because the retriever has no user context. That is not an implementation detail — it is why the retriever can be trained on an aggregate a thousand times smaller than the ranker&#x27;s.</div>\n<h4>The batch that comes out</h4>\n<div class=\"tw\"><table><thead><tr><th>Tensor</th><th>Shape</th><th>Notes</th></tr></thead><tbody><tr><td><code>query_ids</code></td><td><code>[4096, 16]</code></td><td>queries are short; 16 tokens covers almost all</td></tr><tr><td><code>pos_item_ids</code></td><td><code>[4096, 96]</code></td><td>title + brand + attributes</td></tr><tr><td><code>hard_neg_ids</code></td><td><code>[4096, 4, 96]</code></td><td>2 from BM25, 2 from the current ANN index</td></tr><tr><td><code>uni_neg_ids</code></td><td><code>[4096, 2, 96]</code></td><td>uniform over the 10M index</td></tr><tr><td><code>weights</code></td><td><code>[4096]</code></td><td>only if you loss-weight rather than sample</td></tr><tr><td><code>log_q</code></td><td><code>[4096, 4102]</code></td><td>sampling log-prob per candidate, for the logQ correction</td></tr></tbody></table></div>\n<p>Candidates per query: 1 positive + 4095 in-batch + 4 mined + 2 uniform ≈ <strong>4102</strong>.</p>\n<div class=\"co num\"><span class=\"col\">Numbers</span>Item-tower forward passes per step: 4096 positives + 4096 x 6 explicit negatives = 28,672. In-batch negatives are free; every mined or uniform negative is a full encoder pass. That factor of seven is the real cost of the negative strategy, and it is the number to quote if she asks what it costs.</div>\n<p>The mitigation, which is what ANCE does in practice: cache item embeddings from the last index refresh and reuse them for mined negatives, recomputing only on the refresh cadence. You trade a little staleness for most of the compute.</p>\n<h4>The negative sources, side by side</h4>\n<div class=\"tw\"><table><thead><tr><th>Source</th><th>Per positive</th><th>Cost per step</th><th>What it fixes</th><th>Fails if</th></tr></thead><tbody><tr><td><strong>In-batch</strong></td><td>~4095</td><td>free — already encoded</td><td>general contrast, cheaply</td><td>used alone: popularity-biased, cannot reach the tail</td></tr><tr><td><strong>Mined, BM25</strong></td><td>2</td><td>2 encoder passes</td><td>keyword match vs intent match</td><td>not filtered — BM25&#x27;s top-k is full of false negatives</td></tr><tr><td><strong>Mined, ANN</strong></td><td>2</td><td>2 passes + re-index</td><td>the model&#x27;s <em>current</em> errors</td><td>not refreshed — they go stale once the model beats the miner</td></tr><tr><td><strong>Uniform</strong></td><td>2</td><td>2 passes</td><td>the zero-engagement tail</td><td>nothing: they are cheap and they are the only source that covers it</td></tr></tbody></table></div>\n<h4>Splits</h4>\n<p><strong>Split by time, never randomly.</strong> The last 14 days are test, the 14 before are validation, everything earlier is train. A random split leaks: the same (query, item) pair appears on both sides, and you will serve forward in time, so a random split measures a task you will never perform.</p>\n<p>Hold out a second, <strong>query-disjoint</strong> split as well — whole tail queries the model has never seen — because time-based splitting still lets a head query&#x27;s embedding be learned from the training period and evaluated in the test period. That second split is the one that tells you about the tail.</p>\n<h3>The objective</h3>\n<p>Retrieval is trained as a classification problem over the corpus: given the query, pick the right item out of everything. The full softmax over 10M items is intractable, so you sample.</p>\n<div class=\"mathbox\">$$\\mathcal{L} \\;=\\; -\\log\n\\frac{\\exp\\!\\big(s(q,d^{+})/\\tau\\big)}\n     {\\sum_{d \\in \\{d^{+}\\}\\cup N} \\exp\\!\\big(s(q,d)/\\tau\\big)}$$</div>\n<p>where $s(q,d)=\\langle f(q), g(d)\\rangle$, $\\tau$ is the temperature, and $N$ is the sampled negative set for this query. It is a cross-entropy over a sampled candidate set: push the positive up, push everything else down, with $\\tau$ setting how sharply.</p>\n<h3>Which loss, and why not the others</h3>\n<p>This is worth being properly fluent on, because &quot;contrastive learning … or softmax&quot; is two thirds of what her scorecard named. The families differ in one thing that explains everything else: <strong>what a single gradient step is allowed to see.</strong></p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 272\" role=\"img\" aria-label=\"What one gradient step sees under four loss families: a single absolute target, one positive against one negative with a margin, one positive normalised against many negatives, and a whole position-discounted list\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-losses\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-losses\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-losses\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"8\" y=\"8\" width=\"165\" height=\"254\" rx=\"7\" fill=\"var(--card)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><rect x=\"8\" y=\"8\" width=\"165\" height=\"30\" rx=\"7\" fill=\"var(--muted)\"/><rect x=\"8\" y=\"2 "254\" rx=\"7\" fill=\"var(--card)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><rect x=\"181\" y=\"8\" width=\"165\" height=\"30\" rx=\"7\" fill=\"var(--muted)\"/><rect x=\"181\" y=\"28\" width=\"165\" height=\"10\" fill=\"var(--muted)\"/><text x=\"263.5\" y=\"28\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#FFFFFF\">PAIRWISE</text><text x=\"263.5\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">triplet, BPR, RankNet</text><circle cx=\"263.5\" cy=\"88\" r=\"15\" fill=\"var(--accent-soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text x=\"263.5\" y=\"92\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--ink)\">q</text><circle cx=\"225.5\" cy=\"150\" r=\"15\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"225.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">d+</text><circle cx=\"301.5\" cy=\"150\" r=\"15\" fill=\"var(--accent-soft)\" stroke=\"var(--flag)\" stroke-width=\"1.2\"/><text x=\"301.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--flag)\">d-</text><line x1=\"255.5\" y1=\"103\" x2=\"230.5\" y2=\"133\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-losses)\"/><line x1=\"271.5\" y1=\"103\" x2=\"296.5\" y2=\"133\" stroke=\"var(--flag)\" stroke-width=\"1.4\" marker-end=\"url(#arrowF-losses)\"/><line x1=\"240.5\" y1=\"176\" x2=\"286.5\" y2=\"176\" stroke=\"var(--ink)\" stroke-width=\"1\"/><text x=\"263.5\" y=\"192\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--ink)\">fixed margin m</text><text x=\"190\" y=\"214\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">ONE negative at a time,</text><text x=\"190\" y=\"229\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">and an absolute margin</text><text x=\"190\" y=\"244\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">in a space you scale</text><rect x=\"354\" y=\"8\" width=\"165\" height=\"254\" rx=\"7\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><rect x=\"354\" y=\"8\" width=\"165\" height=\"30\" rx=\"7\" fill=\"var(--accent)\"/><rect x=\"354\" y=\"28\" width=\"165\" height=\"10\" fill=\"var(--accent)\"/><text x=\"436.5\" y=\"28\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#FFFFFF\">SAMPLED SOFTMAX</text><text x=\"436.5\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">InfoNCE / MNRL</text><circle cx=\"436.5\" cy=\"88\" r=\"15\" fill=\"var(--accent-soft)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text x=\"436.5\" y=\"92\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--ink)\">q</text><circle cx=\"382.5\" cy=\"150\" r=\"15\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"382.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--accent)\">d+</text><circle cx=\"420.5\" cy=\"150\" r=\"13\" fill=\"var(--accent-soft)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><text x=\"420.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--muted)\">d-</text><circle cx=\"456.5\" cy=\"150\" r=\"13\" fill=\"var(--accent-soft)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><text x=\"456.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--muted)\">d-</text><circle cx=\"492.5\" cy=\"150\" r=\"13\" fill=\"var(--accent-soft)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><text x=\"492.5\" y=\"154\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--muted)\">d-</text><line x1=\"426.5\" y1=\"103\" x2=\"388.5\" y2=\"134\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-losses)\"/><line x1=\"431.38\" y1=\"103\" x2=\"421.78\" y2=\"134\" stroke=\"var(--muted)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-losses)\"/><line x1=\"442.9\" y1=\"103\" x2=\"454.9\" y2=\"134\" stroke=\"var(--muted)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-losses)\"/><line x1=\"454.42\" y1=\"103\" x2=\"488.02\" y2=\"134\" stroke=\"var(--muted)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-losses)\"/><rect x=\"366\" y=\"170\" width=\"141\" height=\"20\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/><text x=\"436.5\" y=\"184\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"600\" fill=\"var(--accent)\">normalised over ALL</text><text x=\"363\" y=\"214\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--ink)\">N negatives at once, and</text><text x=\"363\" y=\"229\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--ink)\">NO absolute target --</text><text x=\"363\" y=\"244\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--ink)\">only relative order</text><rect x=\"527\" y=\"8\" width=\"165\" height=\"254\" rx=\"7\" fill=\"var(--card)\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><rect x=\"527\" y=\"8\" width=\"165\" height=\"30\" rx=\"7\" fill=\"var(--muted)\"/><rect x=\"527\" y=\"28\" width=\"165\" height=\"10\" fill=\"var(--muted)\"/><text x=\"609.5\" y=\"28\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11.5\" font-weight=\"700\" fill=\"#FFFFFF\">LISTWISE</text><text x=\"609.5\" y=\"54\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9.5\" font-weight=\"400\" fill=\"var(--muted)\">LambdaRank / ListNet</text><rect x=\"549\" y=\"74\" width=\"78.0\" height=\"14\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"0.9\"/><text x=\"541\" y=\"85\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9\" font-weight=\"400\" fill=\"var(--muted)\">1</text><text x=\"633\" y=\"85\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"8.5\" font-weight=\"400\" fill=\"var(--accent)\">1.00</text><rect x=\"549\" y=\"95\" width=\"49.14\" height=\"14\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"0.9\"/><text x=\"541\" y=\"106\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9\" font-weight=\"400\" fill=\"var(--muted)\">2</text><text x=\"633\" y=\"106\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"8.5\" font-weight=\"400\" fill=\"var(--accent)\">0.63</text><rect x=\"549\" y=\"116\" width=\"39.0\" height=\"14\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"0.9\"/><text x=\"541\" y=\"127\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9\" font-weight=\"400\" fill=\"var(--muted)\">3</text><text x=\"633\" y=\"127\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"8.5\" font-weight=\"400\" fill=\"var(--accent)\">0.50</text><rect x=\"549\" y=\"137\" width=\"33.54\" height=\"14\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"0.9\"/><text x=\"541\" y=\"148\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9\" font-weight=\"400\" fill=\"var(--muted)\">4</text><text x=\"633\" y=\"148\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"8.5\" font-weight=\"400\" fill=\"var(--accent)\">0.43</text><rect x=\"549\" y=\"158\" width=\"30.42\" height=\"14\" rx=\"2\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"0.9\"/><text x=\"541\" y=\"169\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"9\" font-weight=\"400\" fill=\"var(--muted)\">5</text><text x=\"633\" y=\"169\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"8.5\" font-weight=\"400\" fill=\"var(--accent)\">0.39</text><text x=\"609.5\" y=\"192\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"600\" fill=\"var(--ink)\">position discount</text><text x=\"536\" y=\"214\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">the WHOLE list, weighted</text><text x=\"536\" y=\"229\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">by what a swap does to</text><text x=\"536\" y=\"244\" text-anchor=\"start\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"9.8\" font-weight=\"400\" fill=\"var(--muted)\">the metric you report</text></svg><figcaption>Figure 5b. One gradient step, four ways. Regression needs an absolute target that click data does not provide. Pairwise sees one negative and a margin measured in a space whose scale the model controls. Sampled softmax sees many negatives and has no absolute target at all — only relative order. Listwise sees the whole list and weights each swap by what it does to the metric.</figcaption></figure>\n<h4>The one-question rule</h4>\n<p>Ask what the output is <strong>consumed as</strong>, and the loss follows:</p>\n<div class=\"tw\"><table><thead><tr><th>The output is consumed as</th><th>Use</th><th>Because</th></tr></thead><tbody><tr><td>An ordering over millions of items</td><td><strong>Sampled softmax / InfoNCE</strong></td><td>only relative order matters, and normalising over sampled negatives is the cheapest unbiased way to get it</td></tr><tr><td>An ordering over a short list where position matters</td><td><strong>Listwise, metric-weighted</strong> (LambdaRank)</td><td>you can afford to look at the whole list, and NDCG&#x27;s discount should drive the gradient</td></tr><tr><td>A probability you will multiply or threshold</td><td><strong>Pointwise BCE</strong>, then calibrate</td><td>the expected-value product is meaningless unless the number is a probability</td></tr><tr><td>A yes/no decision at a threshold</td><td><strong>Contrastive pair / triplet</strong></td><td>you need an absolute decision boundary in the metric, not a ranking</td></tr><tr><td>A number with units</td><td><strong>Regression</strong> (Huber over MSE, for outliers)</td><td>there is a real target and its magnitude is the answer</td></tr><tr><td>A teacher&#x27;s ordering</td><td><strong>Margin-MSE or KL</strong></td><td>the ordering is the signal; the teacher&#x27;s absolute scale is not</td></tr></tbody></table></div>\n<h4>Why not MSE</h4>\n<p>Three reasons, and the first one ends the conversation.</p>\n<p><strong>There is no target.</strong> A click is not a similarity of 1.0. To use MSE you would have to invent the label, and whatever you invented would be the thing the model learned. Retrieval supervision is ordinal by nature: this item beat that one for this query. MSE requires cardinal supervision you do not have.</p>\n<p><strong>It optimises the wrong quantity.</strong> Even granting a target, retrieval only ever uses the <em>order</em> of the scores. MSE spends capacity matching magnitudes that are never read, and the capacity comes out of the ordering you do care about.</p>\n<p><strong>Nothing forces the positive to win.</strong> MSE has no normalisation across candidates. A model that outputs 0.3 for every pair has a respectable MSE against a mostly-negative dataset and precisely zero retrieval utility. The softmax&#x27;s denominator is the entire point: the positive can only score well by <em>beating the others</em>.</p>\n<p>There is a fourth, quieter one: the gradient is dominated by the easy mass. Almost every query-item pair in a 10M catalogue is trivially unrelated and already predicted near zero, so most of the MSE gradient is spent confirming things the model already knows.</p>\n<h4>Why not triplet, and when it is actually right</h4>\n<p>Triplet is not a silly choice — it is the previous generation&#x27;s answer, and it still wins in one setting. But for retrieval the softmax dominates it on four axes.</p>\n<p><strong>One negative per step.</strong> Triplet&#x27;s gradient says &quot;be further from this one thing.&quot; The softmax&#x27;s says &quot;beat all of these at once,&quot; which is a far lower variance estimate of the objective you actually serve.</p>\n<p><strong>The margin is absolute in a space you control.</strong> With unnormalised embeddings the model can satisfy any margin by inflating norms and learning nothing about the geometry. That is why triplet effectively forces L2 normalisation — and once you are on the unit sphere, distances live in a fixed narrow range and the margin becomes a very tight budget to tune. The softmax&#x27;s temperature does the same job <em>relatively</em>, so it is scale-free.</p>\n<p><strong>The hinge switches off.</strong> Once a triplet satisfies the margin, its loss is exactly zero and it contributes no gradient. Late in training most of the batch contributes nothing, which is why semi-hard mining exists and why it is fiddly. The softmax is smooth: every negative always contributes something, weighted by how close it came.</p>\n<p><strong>Collapse.</strong> With easy negatives, triplet can drive everything to a point and report a happy loss curve. The normalisation makes that much harder to achieve under a softmax.</p>\n<div class=\"co push\"><span class=\"col\">She pushes</span>&quot;So triplet is just worse?&quot; — No. Triplet and contrastive-pair losses give you a <em>calibrated distance</em> with a decision boundary; softmax gives you an ordering with no absolute meaning. If the product needs &quot;are these two things the same?&quot; as a yes/no at a threshold, you want the margin. That is verification, not retrieval.</div>\n<p>And that case exists in this very system. <strong>Catalogue deduplication</strong> — deciding whether two seller listings are the same physical product, which a marketplace has to do constantly and which feeds the slate policy&#x27;s dedup step — is a verification problem with a threshold. I would train that with a contrastive pair loss, not a softmax, and I would say so if she asks whether contrastive losses have any place here.</p>\n<h4>Where MSE is actually the right answer</h4>\n<p>Two places, both inside this design, and naming them is the cleanest way to show you are not just reciting &quot;softmax good, MSE bad.&quot;</p>\n<p><strong>Distilling the cross-encoder into the bi-encoder.</strong> The teacher produces real scores, so regression is available. But regress the <strong>margin</strong>, not the raw score — $s(q,d^{+}) - s(q,d^{-})$ for the student matched to the same difference for the teacher. The teacher&#x27;s absolute scale is arbitrary, so fitting it forces the student to waste capacity on an offset that means nothing; the margin is what carries the ordering, and it is invariant to that scale. That is Margin-MSE, and it is the reason plain MSE distillation underperforms.</p>\n<p>The alternative is KL over the softmax of the candidate set, which transfers the whole distribution rather than pairwise gaps. Margin-MSE is simpler and robust; KL carries more information when your candidate sets are consistent. I would start with Margin-MSE.</p>\n<p><strong>Training L1 to imitate L2.</strong> L1&#x27;s job is to not discard anything L2 would have wanted, so it is a distillation problem, and regression onto L2&#x27;s scores is a reasonable objective — with the same caveat, that a ranking-aware distillation beats plain MSE because only the top-k ordering matters.</p>\n<h4>The whole system, loss by loss</h4>\n<p>If she asks you to put it together — and this is a good thing to volunteer — every trained component in the design has a different loss, for a reason:</p>\n<div class=\"tw\"><table><thead><tr><th>Component</th><th>Loss</th><th>Why that one</th></tr></thead><tbody><tr><td>Two-tower retriever</td><td>Sampled softmax + logQ correction</td><td>ordering over 10M, no calibration needed downstream</td></tr><tr><td>Cross-encoder teacher</td><td>Listwise CE on graded labels</td><td>short candidate sets, graded judgements available</td></tr><tr><td>Bi-encoder distillation</td><td>Margin-MSE, or KL over candidates</td><td>transfers ordering, invariant to teacher scale</td></tr><tr><td>L1 ranker</td><td>Ranking distillation from L2</td><td>measured on recall of L2&#x27;s top-k, not NDCG</td></tr><tr><td>pCTR, pCVR, pReturn</td><td>BCE, then post-hoc calibration</td><td>they get multiplied by price</td></tr><tr><td>pRel gate</td><td>Listwise, or distilled from the cross-encoder</td><td>a gate, not a probability</td></tr><tr><td>Slate re-ranking layer</td><td>Listwise over the final top-k</td><td>list context is the whole point</td></tr><tr><td>Catalogue dedup</td><td>Contrastive pair with a margin</td><td>verification at a threshold</td></tr><tr><td>Delivery-time feature</td><td>Huber regression</td><td>a real number with units, and outliers</td></tr></tbody></table></div>\n<div class=\"decide\"><div class=\"dt\">Which loss for the retriever?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Sampled softmax / InfoNCE over the sampled candidate set, with the logQ correction</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Triplet with a margin, BPR/RankNet, and MSE regression</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">retrieval consumes only the ordering, and the softmax is the only one of these that normalises over many candidates at once — so the gradient estimates &quot;beat everything&quot; rather than &quot;beat this one thing&quot;, and it needs no absolute target, which click data cannot provide anyway</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">large batches to get enough negatives, a temperature to tune, and an output with no probabilistic meaning</span></div><div class=\"drow\"><span class=\"dk but\">BUT</span><span class=\"dv\">keep a contrastive pair loss for catalogue dedup, which is verification at a threshold rather than ranking, and Margin-MSE for distilling the cross-encoder</span></div></div>\n<p>Three things follow.</p>\n<p><strong>The number of negatives is the difficulty knob.</strong> More negatives means a harder classification task and a better-conditioned gradient, which is why these models train at batch sizes in the thousands with cross-device negative sharing.</p>\n<p><strong>Temperature matters more than people expect.</strong> With L2-normalised embeddings the score lives in [-1, 1], so without a small temperature the softmax is nearly uniform and there is almost no gradient. Typical values are 0.01–0.05. Push it too low and the gradient concentrates entirely on the single hardest negative, which is unstable and can collapse the representation. It can be learned — CLIP learns log-temperature with a clamp — and I would start at 0.05, tune it, and watch the positive-score distribution rather than only the loss.</p>\n<h3>Negatives: where this model is actually won or lost</h3>\n<p>This is the sub-topic to be deepest on. It is named in the scorecard and it is where a candidate with real experience separates from one who has read papers.</p>\n<h4>In-batch negatives, and the bias they introduce</h4>\n<p>In a batch of N pairs, use the other N-1 items as negatives for each query. Free — no extra forward passes, since you already encoded them.</p>\n<p>The catch: <strong>your batch is not a uniform sample of the corpus.</strong> It is sampled from the click stream, so an item appears as a negative in proportion to how often it is clicked. Popular items are therefore pushed down constantly, and the model learns to under-score exactly the items that convert best. In commerce that is precisely backwards.</p>\n<p>The fix is the <strong>logQ correction</strong>, also called sampling-bias correction:</p>\n<div class=\"mathbox\">$$s&#x27;(q,d) \\;=\\; s(q,d) \\;-\\; \\log p(d)$$</div>\n<p>$p(d)$ is the probability that item $d$ is drawn as a sampled negative, which is essentially its frequency in the training stream. Estimate it online with a streaming counter: track the average gap in steps between consecutive occurrences of $d$, and take $p(d)\\approx 1/\\text{gap}$.</p>\n<p>The intuition to say out loud: an item that shows up as a negative ten times as often should be penalised a tenth as hard each time. Without it, the retriever has a systematic anti-popularity bias. This is the correction from the YouTube two-tower work, and naming it is worth doing.</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 232\" role=\"img\" aria-label=\"Three negative sources over the corpus; only uniform sampling reaches the zero-engagement tail\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-negatives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-negatives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-negatives\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><text x=\"8\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"600\" fill=\"var(--muted)\">THE 10M-ITEM CORPUS</text><rect x=\"8\" y=\"28\" width=\"684\" height=\"92\" rx=\"6\" fill=\"var(--raise)\" stroke=\"var(--rule)\"/><rect x=\"14\" y=\"34\" width=\"150\" height=\"80\" rx=\"4\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/><text x=\"89\" y=\"62\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"var(--accent)\">items with</text><text x=\"89\" y=\"77\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"var(--accent)\">engagement</text><text x=\"89\" y=\"96\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">~ a few %</text><text x=\"428\" y=\"66\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"var(--flag)\">zero-engagement tail</text><text x=\"428\" y=\"84\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" font-weight=\"400\" fill=\"var(--flag)\">never a positive, so NEVER an in-batch negative</text><text x=\"428\" y=\"101\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"10\" font-weight=\"400\" fill=\"var(--muted)\">nothing ever pushes these down</text><rect x=\"8\" y=\"168\" width=\"216\" height=\"52\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"116.0\" y=\"191.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--accent)\">In-batch</text><text x=\"116.0\" y=\"207.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">the other items in the batch</text><rect x=\"242\" y=\"168\" width=\"216\" height=\"52\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"191.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">Mined hard</text><text x=\"350.0\" y=\"207.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">BM25 / current ANN top-k</text><rect x=\"476\" y=\"168\" width=\"216\" height=\"52\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--flag)\" stroke-width=\"1.2\"/><text x=\"584.0\" y=\"191.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--flag)\">Uniform</text><text x=\"584.0\" y=\"207.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">drawn from the FULL index</text><line x1=\"116\" y1=\"168\" x2=\"89\" y2=\"120\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-negatives)\"/><line x1=\"350\" y1=\"168\" x2=\"300\" y2=\"120\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-negatives)\"/><line x1=\"584\" y1=\"168\" x2=\"500\" y2=\"120\" stroke=\"var(--flag)\" stroke-width=\"1.4\" marker-end=\"url(#arrowF-negatives)\"/></svg><figcaption>Figure 6b. Where each negative source can reach. In-batch negatives are drawn from the click stream, so they can only ever be items that appear as a positive somewhere in the batch. At 10M products with a long tail, that leaves most of the corpus untouched.</figcaption></figure>\n<h4>The negatives that are never sampled at all</h4>\n<p>Here is the part most candidates miss, and it matters enormously at 10M products. <strong>In-batch negatives can only ever be items that appear as a positive somewhere in the batch</strong> — that is, items with engagement. In a 10M-product catalogue with a long tail, a large fraction of items have essentially zero clicks in six months. Those items are never negatives for anyone. The model has therefore never been trained to push them down, their embeddings sit wherever initialisation and the item-text encoder put them, and they can surface spuriously in ANN results for unrelated queries.</p>\n<div class=\"decide\"><div class=\"dt\">Where do negatives come from?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">In-batch with the logQ correction, plus mined hard negatives refreshed from the current model, plus uniform draws from the full index</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">In-batch only, which is the default in every tutorial</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">in-batch alone is biased toward popular items and structurally cannot reach the zero-engagement tail; hard negatives teach the distinctions that matter; uniform draws are the only source that covers the whole corpus</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">a mining pipeline, a cross-encoder to filter false negatives, and a ratio to tune</span></div></div>\n<p>The fix is <strong>mixed negative sampling</strong>: in-batch negatives plus a set of negatives drawn uniformly from the full item index. The uniform ones are easy and contribute little gradient individually, but they are the only thing covering the zero-engagement tail, and they are cheap.</p>\n<h4>Hard negatives</h4>\n<p>Random and in-batch negatives are mostly trivially wrong — a laptop for a boots query. The model saturates on them quickly and stops learning the distinctions that matter. Hard negatives are items that look right and are not: toddler <em>shoes</em> for a toddler <em>boots</em> query; adult winter boots; boots that are neither lightweight nor durable.</p>\n<p>Two sources, in order of sophistication:</p>\n<ul>\n<li><strong>BM25 top-k, not clicked.</strong> Cheap, no model needed, and a good first pass.</li>\n<li><strong>The model&#x27;s own ANN top-k, refreshed periodically</strong> — this is ANCE. As the model improves, yesterday&#x27;s hard negatives stop being hard, so you re-mine from the current index every epoch or two. Static hard negatives go stale and you silently stop learning from them.</li>\n</ul>\n<p>A typical recipe: one positive, a handful of mined hard negatives, the whole batch as in-batch negatives, plus uniform negatives. The ratio is worth tuning; all-hard is a known failure mode.</p>\n<h4>False negatives, and why they are worse than no negatives</h4>\n<p>A mined &quot;hard negative&quot; is often just an unclicked relevant item — the user bought one pair of boots, not all five good ones. Training on it teaches the model that a correct answer is wrong, which is actively destructive rather than merely unhelpful.</p>\n<p><strong>Denoise with a cross-encoder.</strong> Score every mined negative with a cross-encoder teacher and drop any that scores above the positive, or above a threshold. This is the RocketQA recipe and it is usually worth more than any architecture change you could make instead. If she asks what to do without a cross-encoder: drop mined negatives that were clicked by anyone for a similar query, and drop those whose category matches the query&#x27;s predicted category exactly.</p>\n<h3>Distillation: the highest-leverage step people skip</h3>\n<p>Train a cross-encoder on the same data. It is far more accurate because query and item interact. Then use it as a teacher: score a large set of query-item pairs and train the bi-encoder to match the teacher&#x27;s <em>score distribution</em> rather than the binary click label — KL on the softmax over the candidate set, or a margin-MSE on score differences.</p>\n<p>Why this is worth saying: the binary label carries one bit. The teacher&#x27;s scores carry the full ordering, including how much better the positive is than each negative. That ordering information is exactly what a retriever needs and what clicks cannot provide. In my experience this buys more than doubling the embedding dimension or adding layers.</p>\n<p>And it closes the loop nicely: you need the cross-encoder anyway for false-negative filtering and for the progressive reranker, so you get three uses out of training it once.</p>\n<h3>Embedding geometry</h3>\n<p>Three decisions, each with a specific consequence.</p>\n<p><strong>Normalise or not.</strong> L2-normalise both towers and use cosine, and every item lives on the unit sphere so magnitude cannot encode popularity. That is what you want for a relevance retriever; popularity belongs in the ranker where it can be traded off explicitly. Leaving embeddings unnormalised lets magnitude carry a quality prior, which helps in pure recsys retrieval and hurts here.</p>\n<div class=\"decide\"><div class=\"dt\">Normalise the embeddings?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">L2-normalise both towers, cosine similarity, temperature in the loss</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Unnormalised dot product, where magnitude carries a popularity prior</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">popularity belongs in the ranker where it can be traded off explicitly, not smuggled into the retrieval score where you cannot see it</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">you need the temperature, since cosine lives in [-1, 1] and the softmax is otherwise nearly flat</span></div></div>\n<p><strong>Whatever you choose, serve it the same way.</strong> Training with unnormalised dot product and then serving a cosine index silently discards the magnitude the model learned to use. This is a real and common production bug and worth naming as one.</p>\n<p><strong>Dimension.</strong> 256 for 10M items. Storage, ANN memory and query latency are all roughly linear in dimension, and the quality gain past ~256 on a catalogue this size is small. If she pushes: train with Matryoshka representation learning so the first 64 or 128 dimensions are independently usable, then you can serve a cheap 64-d first pass and rescore with the full 256 without training twice.</p>\n<h3>Putting the training loop together</h3>\n<ol>\n<li><strong>Build pairs</strong> from six months of logs — clicks, add-to-cart and purchases, weighted by action, position-debiased, session-attributed for tail queries.</li>\n<li><strong>Mine negatives</strong> — BM25 top-k not clicked, plus ANN top-k from the <em>current</em> model, refreshed every one to two epochs.</li>\n<li><strong>Denoise</strong> — score every mined negative with the cross-encoder teacher and drop anything scoring above the positive.</li>\n<li><strong>Assemble the batch</strong> — in-batch negatives with the logQ correction, plus the mined hard negatives, plus uniform draws from the full index.</li>\n<li><strong>Train</strong> — InfoNCE at $\\tau\\approx 0.05$, large batch, cross-device negative sharing, with KL distillation from the cross-encoder.</li>\n<li><strong>Embed the corpus</strong> — item tower over 10M products nightly, incremental for new and changed listings.</li>\n<li><strong>Build the index</strong> — HNSW over int8 vectors, rebuilt nightly and hot-swapped, with the model version pinned into the index metadata.</li>\n</ol>\n<p>Two operational points that signal you have run one of these.</p>\n<p><strong>The index and the model must be versioned together.</strong> A query embedded by model v2 against an index built by model v1 produces silent garbage — not an error, just bad results. Pin the model version into the index metadata and refuse to serve a mismatch.</p>\n<p><strong>Refresh cadence is a product decision.</strong> Nightly full rebuild plus an incremental path for new listings, because in commerce a product that cannot be found for 24 hours after listing is a seller-facing problem. For 10M items a full item-tower pass is a few GPU-hours, so nightly is comfortable.</p>\n<h3>Evaluating the retriever without fooling yourself</h3>\n<p>Recall@K against held-out clicked or purchased items, where K is the candidate count the ranker actually receives — Recall@1000, not Recall@10. Measuring retrieval at 10 is measuring the ranker.</p>\n<div class=\"co push\"><span class=\"col\">She pushes</span>&quot;Your Recall@1000 is up six points. Ship it?&quot; -- No, not on that evidence. The held-out positives came from the incumbent&#x27;s own impressions, so a retriever that finds better items the old one never showed gets no credit and can score worse while being better.</div>\n<p><strong>Now the trap, and I would raise it before she does.</strong> Your held-out positives are items the <em>current</em> system retrieved and displayed. A new retriever that surfaces a better item the old system never showed gets no credit for it, and can score <em>worse</em> than the incumbent while being better. Offline recall against logged positives is systematically biased toward the system that generated the logs.</p>\n<p>Four things I would do about it:</p>\n<ul>\n<li><strong>Pooled judgement.</strong> Take the union of top-K from the incumbent and the candidate, judge the pool with humans or an LLM judge calibrated against humans, and evaluate both systems against the pooled set. This is the TREC method and it exists precisely for this problem.</li>\n<li><strong>Measure the new-item rate.</strong> What fraction of the candidate&#x27;s top-100 the incumbent never retrieved? Send exactly those to judgement — it is the cheapest possible labelling budget and it answers the question directly.</li>\n<li><strong>Segment by query frequency.</strong> Aggregate recall is dominated by head traffic. Report head / torso / tail separately and make tail recall the headline number, because that is what the prompt asks for.</li>\n<li><strong>Let interleaving be the arbiter.</strong> Offline recall chooses what to test; online interleaving decides. And interleaving is enormously more sensitive than an A/B for a retrieval change, so this is cheap.</li>\n</ul>\n<p>Also track <strong>zero-result rate and low-result rate on tail queries</strong> as a direct product metric. For the query in the prompt, that is the outcome that matters.</p>\n<h3>The ANN index</h3>\n<p>For 10M x 256 the answer is HNSW and I would say so quickly — this is not the interesting part of the question and spending time here is a mistake.</p>\n<div class=\"decide\"><div class=\"dt\">Which ANN index?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">HNSW over int8-quantised vectors, no product quantisation</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">IVF-PQ</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">at 10M x 256 the whole thing is about 5 GB and fits in RAM on one machine. PQ trades recall for memory you do not need; reach for it at a billion vectors, not ten million.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">higher memory than IVF-PQ, and a graph that must be rebuilt rather than updated in place</span></div></div>\n<p><code>M = 32</code>, <code>efConstruction = 200</code>, <code>efSearch</code> tuned to hit a recall target against exact search. Int8 scalar quantisation of the vectors: 2.6 GB of vectors plus roughly 2.6 GB of graph, so about 5 GB, which fits in RAM on one machine with room for replicas. <strong>No PQ.</strong> IVF-PQ trades recall for memory you do not need at this size; reach for it at a billion vectors, not ten million.</p>\n<p>The one genuinely interesting ANN issue here is <strong>filtered search</strong>. Search has hard filters — in stock, ships to this address, category. HNSW degrades badly under low selectivity because the graph is built over everything and the traversal wastes its budget on nodes the filter will discard. Post-filtering at 2% selectivity means you need ~500 raw candidates to yield 10. Use in-traversal filtering, and below some selectivity threshold fall back to brute force over the filtered subset, because a few hundred thousand exact dot products is faster than approximate search over ten million. Measure where your crossover is.</p>\n<h3>Fusion</h3>\n<p>Three ranked lists, incomparable score scales. A weighted sum of BM25 and cosine fails because BM25 is unbounded and query-dependent while cosine is in [-1, 1], so the effective weight varies per query in a way you did not choose.</p>\n<p>Start with <strong>reciprocal rank fusion</strong> — sum of 1/(k + rank) across arms, k ~ 60. Rank-based, so scale-free, and it is a strong baseline that needs no tuning.</p>\n<p>Then replace it with the L1 ranker, which takes each arm&#x27;s rank and score as features along with query-understanding signals, and learns the fusion. That is strictly better than RRF because the right blend is query-dependent — identifier queries want the lexical arm, tail paraphrase queries want the dense arm — and a model can condition on that where a fixed constant cannot.</p>\n<h2>Ranking: the other half</h2>\n<h3>&quot;Optimise CVR&quot; is a trap, and saying so is the point</h3>\n<div class=\"co trap\"><span class=\"col\">The trap</span>&quot;Optimise CVR&quot; is the trap in this question. Taken literally it produces a ranker that sorts by cheapness, goes blind on the exact tail queries the prompt is about, and compounds through the exposure loop. Name the pathology, then propose expected value.</div>\n<p>Do not accept the objective as stated. A ranker trained to maximise conversion probability and nothing else has three specific pathologies, and naming them is worth more than any architecture you could propose.</p>\n<p><strong>It ranks by cheapness.</strong> Conversion probability is highest for low-commitment purchases. Sort by pCVR and a twelve-dollar pair of toddler socks outranks the hundred-dollar boots the customer actually came for. Conversions go up, GMV goes down, and the customer did not get what they searched for.</p>\n<p><strong>It is blind to relevance when nothing converts.</strong> For a genuinely rare query, every candidate has a near-zero and near-identical pCVR, so the ordering is driven by noise in a model that has no signal. That is exactly the tail query in the prompt.</p>\n<p><strong>It compounds.</strong> Tomorrow&#x27;s training data is today&#x27;s exposure. A ranker that concentrates on safe converting items sees only those items converting, and the loop tightens.</p>\n<div class=\"decide\"><div class=\"dt\">What does the ranker actually optimise?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Expected value -- pCTR x pCVR x value -- with a hard relevance gate and a returns penalty</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Pure pCVR, which is what the question literally asks for</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">conversion probability is highest for low-commitment purchases, so a pure pCVR ranker sorts by cheapness; it is also blind on tail queries where nothing converts, and it compounds through the exposure loop</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">you now need calibrated probabilities and a business input for value, and you have to defend the deviation from the stated objective</span></div><div class=\"drow\"><span class=\"dk fallback\">FALLBACK</span><span class=\"dv\">if she wants CVR literally, keep pCVR ordering but make the relevance gate a hard constraint and GMV per session a guardrail that cannot regress</span></div></div>\n<p>So I would rank on <strong>expected value with a relevance gate</strong>:</p>\n<div class=\"mathbox\">$$\\mathrm{score}(q,d) \\;=\\;\np_{\\mathrm{CTR}}\\cdot p_{\\mathrm{CVR}}\\cdot \\mathrm{value}(d)\\cdot g(p_{\\mathrm{rel}})\n\\;-\\; \\lambda\\, p_{\\mathrm{return}}\\cdot \\mathrm{value}(d)$$</div>\n<p>$\\mathrm{value}(d)$ is margin, or price, or contribution -- a business input, not a model output, and worth asking which one they optimise. $g(p_{\\mathrm{rel}})$ is a relevance gate: hard-drop below a threshold, then a mild monotone boost. $p_{\\mathrm{return}}$ matters because returns are negative revenue <em>and</em> negative trust, so a CVR objective that ignores them optimises for regret.</p>\n<div class=\"co say\"><span class=\"col\">Say this</span>CVR is the metric. Expected value is the objective. Those are different sentences and the difference is the whole answer.</div>\n<p>Then offer the fallback if she pushes back and wants CVR literally: keep pure pCVR ordering but make the relevance gate a hard constraint and add GMV per session as a guardrail that cannot regress. That is a reasonable position and it shows you can take direction without abandoning judgement.</p>\n<h3>What you are actually training on</h3>\n<p>Before any model choice, two properties of the training set decide how good the ranker can be, and both are consequences of the fact that the data came from the ranker you already have.</p>\n<p><strong>The label.</strong> Impressions are free, clicks are plentiful, conversions are scarce. The natural move is graded relevance — impression 0, click 1, add-to-cart 2, purchase 3, returned purchase back to 0 — and that is what a listwise objective wants. But if you are building the expected-value score in Figure 8 you need <em>separate calibrated heads</em>, not one graded label, so the label design is downstream of the objective decision below. Decide the objective first.</p>\n<p><strong>The candidate distribution is your own output.</strong> A ranker&#x27;s training examples are impressions, and an impression is something that survived retrieval <em>and</em> that this ranker placed high enough to be seen. So the model is trained on the consequences of its own decisions. Items it wrongly buries generate no data, so it never learns it was wrong about them, and the error is stable rather than self-correcting. This is the ranking counterpart of the retrieval evaluation bias and the reason the exploration section below is not optional.</p>\n<p><strong>Negative downsampling breaks calibration, and you must correct it.</strong> You have perhaps a hundred impressions per click, so you will downsample negatives to keep training tractable. That shifts the base rate, and a model trained on the downsampled data over-predicts. With negatives kept at rate <code>w</code>, recover the true probability with</p>\n<div class=\"mathbox\">$$q \\;=\\; \\frac{p}{\\,p + (1-p)/w\\,}$$</div>\n<p>$w$ is the negative keep rate and $p$ is the model&#x27;s output on the downsampled data. At $w=0.1$ and $p=0.5$ the corrected probability is $0.09$ -- a factor of five. Forget this and every downstream multiplication by price is wrong by a constant you did not choose.</p>\n<p>Forget this and every downstream multiplication by price is wrong by a constant factor you did not choose. It is a two-line fix and a very common production bug.</p>\n<h3>The objective: pointwise, pairwise, listwise — and the constraint most people miss</h3>\n<p>Three families, and the usual answer is &quot;listwise, obviously.&quot; For this question that answer is wrong, and being able to say why is worth real credit.</p>\n<p><strong>Pointwise</strong> predicts a number per item independently — pCTR, pCVR — and you sort by it. Trained with binary cross-entropy. It does not optimise order directly, and it has no idea that position 1 matters more than position 20. Its one enormous advantage: the output is a <strong>calibrated probability</strong>.</p>\n<p><strong>Pairwise</strong> — RankNet, BPR — optimises the probability that the better item is scored above the worse one. Closer to the thing you care about, but it treats every inversion as equally bad, so it will happily spend capacity fixing a swap at positions 50 and 51 that no user will ever see.</p>\n<p><strong>Listwise</strong> — LambdaRank and its GBDT form, LambdaMART — fixes exactly that.</p>\n<div class=\"mathbox\">$$\\lambda_{ij} \\;=\\;\n\\big(\\text{pairwise logistic gradient for } (i,j)\\big)\n\\;\\times\\;\n\\big|\\Delta\\mathrm{NDCG}_{ij}\\big|$$</div>\n<p>NDCG depends only on the ordering, so it is a step function of the scores: zero gradient almost everywhere, a jump when two items swap. LambdaRank&#x27;s move is to skip defining a loss and write the gradient directly. Each item&#x27;s gradient is the sum of $\\lambda_{ij}$ over every pair it appears in, and the $|\\Delta\\mathrm{NDCG}|$ factor is the whole idea -- a swap at ranks 1 and 2 is worth far more than one at 50 and 51, so capacity concentrates at the top of the list. LambdaMART is these gradients plugged into gradient boosting.</p>\n<div class=\"co push\"><span class=\"col\">She pushes</span>&quot;Why not just use LambdaMART then?&quot; -- Because a LambdaMART score is not a probability, and the expected-value objective multiplies by price. Calibration is the constraint, not accuracy.</div>\n<p><strong>Now the constraint.</strong> The expected-value score in Figure 8 multiplies pCTR by pCVR by price. That multiplication is only meaningful if those are <em>probabilities</em>. LambdaMART emits a relevance score with no probabilistic interpretation at all — you cannot multiply it by a hundred dollars and get expected revenue. So a pure listwise ranker is incompatible with the objective this question asks for.</p>\n<div class=\"decide\"><div class=\"dt\">Pointwise, pairwise or listwise?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Pointwise BCE for the probability heads, listwise only for relevance and for a list-context layer on the final top-k</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">LambdaMART as the single ranker, which is the reflex answer</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">the expected-value score multiplies probabilities by price, and that is only meaningful if they are calibrated. A LambdaMART score has no probabilistic interpretation, so you cannot multiply it by a hundred dollars.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">pointwise does not optimise order directly, which is exactly why the list-context layer goes back on top</span></div></div>\n<p>How I would resolve it, and this is the answer I would defend:</p>\n<ul>\n<li><strong>Train the probability heads pointwise</strong> with BCE — pCTR, pCVR, pReturn — because the EV combination requires calibration, and calibrate them post-hoc.</li>\n<li><strong>Train a separate listwise relevance model</strong> if you want one, and let its score enter the EV formula as the relevance gate <code>g(pRel)</code>, not as the score.</li>\n<li><strong>Add a list-context re-ranking layer on the final top-k</strong>, after the pointwise scores. This is where listwise thinking legitimately belongs: a small model that sees the whole slate — DLCM, PRM, Seq2Slate in the literature — and adjusts for the fact that an item&#x27;s appeal depends on what it is sitting next to. Three near-identical boots compete with each other; a pointwise model cannot see that and a slate model can.</li>\n</ul>\n<p>That layering also matches the latency budget: the expensive list-context model only ever runs over the ~50 items you are about to show.</p>\n<h3>The CVR model has a data problem before it has a model problem</h3>\n<h4>Sample selection bias, and ESMM</h4>\n<p>Conversion is only observed after a click, so the natural CVR training set is clicked impressions. But at serving time you score every candidate, including ones that would never be clicked. Train on a selected subset, serve on the full distribution — and the gap is exactly what your ranker is trying to change.</p>\n<p>On top of that, clicked impressions are perhaps 1–5% of all impressions, so the CVR training set is one to two orders of magnitude smaller than the CTR one, precisely where you need precision.</p>\n<p>ESMM removes both problems by never training CVR directly:</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 240\" role=\"img\" aria-label=\"ESMM: CTR and CTCVR towers supervised on all impressions, with the CVR tower learned implicitly through their product\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-esmm\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-esmm\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-esmm\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><rect x=\"190\" y=\"8\" width=\"320\" height=\"34\" rx=\"6\" fill=\"var(--raise)\" stroke=\"var(--rule)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"22.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"var(--ink)\">IMPRESSION SPACE</text><text x=\"350.0\" y=\"38.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">every impression is labelled</text><line x1=\"280\" y1=\"42\" x2=\"200\" y2=\"74\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-esmm)\"/><line x1=\"420\" y1=\"42\" x2=\"500\" y2=\"74\" stroke=\"var(--ink)\" stroke-width=\"1.4\" marker-end=\"url(#arrow-esmm)\"/><rect x=\"90\" y=\"74\" width=\"220\" height=\"52\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"200.0\" y=\"97.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">pCTR tower</text><text x=\"200.0\" y=\"113.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">loss: BCE on clicks</text><rect x=\"390\" y=\"74\" width=\"220\" height=\"52\" rx=\"6\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\" stroke-width=\"1.2\"/><text x=\"500.0\" y=\"97.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--ink)\">pCTCVR tower</text><text x=\"500.0\" y=\"113.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">loss: BCE on click AND convert</text><line x1=\"200\" y1=\"126\" x2=\"320\" y2=\"176\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-esmm)\"/><line x1=\"500\" y1=\"126\" x2=\"380\" y2=\"176\" stroke=\"var(--accent)\" stroke-width=\"1.4\" marker-end=\"url(#arrowA-esmm)\"/><text x=\"350\" y=\"160\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11\" font-weight=\"400\" fill=\"var(--muted)\">pCTCVR = pCTR x pCVR</text><rect x=\"230\" y=\"176\" width=\"240\" height=\"52\" rx=\"6\" fill=\"var(--flag-soft)\" stroke=\"var(--flag)\" stroke-width=\"1.2\"/><text x=\"350.0\" y=\"199.0\" text-anchor=\"middle\" font-family=\"'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--flag)\">pCVR tower</text><text x=\"350.0\" y=\"215.0\" text-anchor=\"middle\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"10.5\" fill=\"var(--muted)\">NO loss of its own</text></svg><figcaption>Figure 11. ESMM. Both supervised tasks live on the full impression space, so the selection bias is gone and CVR is learned as the ratio. The cost: the product is numerically touchy when pCTR is small, and a miscalibrated CTR tower propagates straight through.</figcaption></figure>\n<p>Both supervised tasks are defined over all impressions, so the bias is gone, and the CVR tower inherits representations from the CTR task which has vastly more data. The caveat to volunteer: the product is numerically touchy when pCTR is small, and a miscalibrated CTR tower propagates straight into CVR.</p>\n<h4>Delayed feedback</h4>\n<p>A conversion can land hours or days after the click. So at training time a &quot;negative&quot; might just be a conversion that has not happened yet, and your label is a function of how long you waited.</p>\n<p>Three things I would do. Pick an attribution window from the actual conversion delay distribution — measure it, do not guess; in most commerce categories the bulk lands within 24 hours but considered purchases have a long tail. Treat recent unconverted clicks as censored rather than negative, and either exclude the most recent window from training or use a delayed-feedback model that jointly models conversion and delay. And retrain often enough that the censoring window is a small fraction of your training period.</p>\n<p>The failure if you ignore it: your model systematically under-predicts CVR on exactly the most recent data, which is the data most representative of now.</p>\n<h4>Position bias, and how you actually estimate the propensities</h4>\n<p>Your labels came out of a ranked list, so a click at rank 1 and a click at rank 20 are not equivalent evidence. Rank 1 gets examined regardless. Train on raw clicks and you learn the ranking you already had — the model&#x27;s strongest discovered feature becomes &quot;where did the old ranker put this,&quot; and good new items can never rise. It is a self-fulfilling loop and it is the reason a ranker can look excellent offline and never improve anything.</p>\n<p>The standard correction is inverse propensity scoring: weight each example by one over the probability that the user examined that position. The interesting part is where the propensities come from, and there are three answers with very different costs.</p>\n<p><strong>RandPair — swap two positions at random on a slice of traffic.</strong> Unbiased and simple. It is also the one that hurts, because you are deliberately showing worse results. I would run it on a fraction of a percent as a calibration reference, not as the production mechanism.</p>\n<p><strong>Intervention harvesting — free, and the one I would build.</strong> You are already running A/B tests, and different rankers put the same query-item pair at different positions. That is randomisation you have already paid for. Mine the existing experiment logs for pairs that appeared at multiple positions and take the click-rate ratio across positions. Zero additional user cost, and at 200 QPS over six months there is plenty of it.</p>\n<p><strong>Jointly estimate propensity and relevance from clicks</strong> — regression-EM, or a dual-tower examination model where one tower sees only position and layout features and the other sees query-item features. No randomisation at all. The catch is identifiability: without genuine position variation in the logs the examination tower simply absorbs relevance and you have learned nothing. Check it, do not assume it.</p>\n<p>Three refinements worth naming, because they are where the textbook answer stops and production begins.</p>\n<p><strong>Position is not one number on a grid.</strong> A mobile app shows a two-column grid, so examination depends on row, column, device, and whether the item was above the fold on that screen size. Condition the propensity on layout, not on a rank index. Getting this wrong on mobile is worse than not correcting at all, because the correction is confidently wrong.</p>\n<p><strong>Trust bias is separate from examination bias.</strong> Users click top-ranked results partly <em>because</em> they are top-ranked — they trust the ranking — not only because they looked. IPS on examination alone does not remove that, and the fix is a click model that has a separate trust term per position.</p>\n<p><strong>IPS has a variance problem.</strong> Small propensities produce enormous weights, a handful of examples dominate the gradient, and validation metrics oscillate. Clip the weights, which trades a little bias for a lot of variance; or use self-normalised IPS; or go doubly robust, combining IPS with a learned reward model so you are only exposed to variance where the reward model is wrong. Always report effective sample size alongside anything IPS-weighted.</p>\n<h4>Calibration</h4>\n<p>If you multiply pCVR by price, pCVR must be a probability, not a score. A model that ranks perfectly but is systematically 3x over-confident produces a completely wrong expected-value ordering as soon as prices vary.</p>\n<p>So: reliability diagrams on held-out data, ECE as a tracked metric, and a post-hoc calibration map — Platt or isotonic on a held-out set — refit on a schedule. Report calibration per price decile and per category, because aggregate calibration hides the segments where it is broken.</p>\n<h3>The ranking model</h3>\n<div class=\"tw\"><table><thead><tr><th>Head</th><th>Loss</th><th>Feeds</th></tr></thead><tbody><tr><td>pCTR</td><td>BCE on clicks over all impressions</td><td>the EV product</td></tr><tr><td>pCVR</td><td>none directly — learned through ESMM&#x27;s product</td><td>the EV product</td></tr><tr><td>pRel</td><td>listwise, or distilled from the cross-encoder</td><td>the relevance gate</td></tr><tr><td>pReturn</td><td>BCE on returns among purchases</td><td>the penalty term</td></tr></tbody></table></div>\n<p>Shared bottom first. Escalate to MMoE and then PLE only when you have <em>measured</em> negative transfer — each head against a single-task model trained alone. Task loss weighting usually dominates the architecture choice anyway.</p>\n<div class=\"decide\"><div class=\"dt\">GBDT or neural for the L2?</div><div class=\"drow\"><span class=\"dk chose\">CHOSE</span><span class=\"dv\">Both -- a neural model produces user-history and query-item embeddings offline, and those enter a LambdaMART/LightGBM ranker as features</span></div><div class=\"drow\"><span class=\"dk over\">OVER</span><span class=\"dv\">Pure neural, or pure GBDT</span></div><div class=\"drow\"><span class=\"dk why\">WHY</span><span class=\"dv\">200 heterogeneous engineered features is tree territory -- scale-invariant, minutes to train on CPU, monotonic constraints available, legible importances. Representation learning over raw IDs and history sequences is not, and trees cannot do it.</span></div><div class=\"drow\"><span class=\"dk cost\">COST</span><span class=\"dv\">two training pipelines and an embedding-freshness dependency</span></div><div class=\"drow\"><span class=\"dk but\">BUT</span><span class=\"dv\">multi-task goes neural first, because a GBDT does not do multi-task cleanly and ESMM needs shared representations</span></div></div>\n<p><strong>Which model.</strong> For an L2 with ~200 engineered tabular features, LambdaMART on LightGBM is the strong default: minutes to train on CPU, scale-invariant, monotonic constraints available when you need to guarantee that a higher-rated product never ranks lower for that reason, and legible feature importance when a PM asks why something ranked where it did. Neural wins when the signal is in raw high-cardinality IDs and user history sequences. The honest production answer is both: a neural model produces user-history and query-item embeddings offline, and those become features in the GBDT.</p>\n<p>Multi-task is the one place I would go neural first, because a GBDT does not do multi-task cleanly and ESMM needs shared representations.</p>\n<p><strong>Features, in four groups.</strong> Query-item match: BM25 per field, dense cosine, the arm ranks, category agreement, attribute overlap. Item: price percentile within category, rating, review count, seller quality, delivery speed, stock, image count. Query: frequency bucket, predicted category, length, intent. User and context: history embedding, price sensitivity, device, surface, time.</p>\n<p><strong>The freshness trap.</strong> The behavioural features — historical CTR and CVR for a query-item pair — will dominate feature importance and are near-empty on tail queries. Train with explicit missingness rather than imputing zero, so the model can learn a distinct regime instead of reading &quot;no data&quot; as &quot;bad.&quot; Then bucket your eval by query frequency and check the tail decile specifically, because aggregate NDCG will look fine while the tail falls off a cliff.</p>\n<h3>The L1/L2 split: how you train the cheap model</h3>\n<p>Everyone draws the two-stage ranker and almost nobody says how L1 is trained, which is a shame because the answer is interesting and it mirrors retrieval.</p>\n<p>L1&#x27;s job is <strong>not</strong> to rank well. Its job is to not throw away anything L2 would have wanted. So do not train it on clicks — train it to <strong>imitate L2</strong>. Score a large sample of candidates with L2 offline, and fit L1 to reproduce L2&#x27;s ordering, or at minimum L2&#x27;s top-k membership. That is distillation, and it is the right objective because it is literally the thing L1 is for.</p>\n<p>Which means the metric for L1 is <strong>recall of L2&#x27;s top-k</strong>, not NDCG. If L1 keeps 98% of what L2 would have put in the top 100, L1 is doing its job regardless of how it orders them. Reporting NDCG for L1 is the same category error as reporting NDCG for retrieval.</p>\n<p>Keep it genuinely cheap: a small tree ensemble or a linear model over a feature subset that avoids anything requiring a remote fetch. The moment L1 needs the same features as L2, it has stopped being a filter and you have paid for two L2s.</p>\n<h3>Features, freshness, and the skew that eats rankers</h3>\n<p>Four groups, and roughly two hundred of them for a commerce ranker. <strong>Query-item match</strong>: BM25 per field, dense cosine, each retrieval arm&#x27;s rank and score, category agreement, attribute overlap. <strong>Item</strong>: price percentile within category, rating, review count, seller quality, delivery speed, stock, image count, age. <strong>Query</strong>: frequency bucket, predicted category, length, intent class. <strong>User and context</strong>: history embedding, price sensitivity, device, surface, hour, session depth.</p>\n<p>Three failure modes matter more than the feature list.</p>\n<p><strong>Point-in-time correctness.</strong> The single largest source of leakage in ranking is computing a feature using data from after the impression. A &quot;30-day item CTR&quot; computed at training time from a table built today includes clicks that happened <em>after</em> the impression you are training on — including the click you are trying to predict. The model learns a feature it cannot have at serving time and offline metrics look wonderful. Your feature store must support as-of joins, and you must test them.</p>\n<p><strong>Log the features, do not recompute them.</strong> The robust fix for training-serving skew is to log the exact feature vector the model scored at request time, and train on those logged values. Then skew is impossible by construction: whatever was wrong at serving is equally wrong at training, so the model learns around it.</p>\n<figure class=\"dg\"><svg viewBox=\"0 0 700 146\" role=\"img\" aria-label=\"Recomputing features at training time creates skew; logging the served feature vector removes it by construction\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-skew\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--ink)\"/></marker><marker id=\"arrowA-skew\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--accent)\"/></marker><marker id=\"arrowF-skew\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"var(--flag)\"/></marker></defs><text x=\"8\" y=\"18\" text-anchor=\"start\" font-family=\"'JetBrains Mono',ui-monospace,Menlo,monospace\" font-size=\"11\" font-weight=\"600\" fill=\"var(--flag)\">RECOMPUTE  (fragile)</text><rect x=\"8\" y=\"28\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--card)\" stroke=\"var
