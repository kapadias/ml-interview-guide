<svg viewBox="0 0 700 214" role="img" aria-label="Computing one positive's training weight from six months of events: action counts times values calibrated against human judgements, log-compressed, divided by examination propensity, then normalised" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-positives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-positives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-positives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><text x="8" y="18" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#5E6B66">ONE (query, item) PAIR OVER SIX MONTHS</text><rect x="8" y="26" width="196" height="132" rx="7" fill="#F1F5F3" stroke="#C9D4CF"/><text x="24" y="48" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#93A19B">412</text><text x="32" y="48" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#93A19B">impressions</text><text x="24" y="70" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#141A18">37</text><text x="32" y="70" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">clicks</text><text x="196" y="70" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0E6E63">x 1.0</text><text x="24" y="92" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#141A18">6</text><text x="32" y="92" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">add-to-cart</text><text x="196" y="92" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0E6E63">x 1.9</text><text x="24" y="114" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#141A18">3</text><text x="32" y="114" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">purchases</text><text x="196" y="114" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0E6E63">x 2.6</text><text x="24" y="136" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#93A19B">0</text><text x="32" y="136" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#93A19B">returns</text><text x="8" y="176" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#A6402C">mean rank 4.2</text><text x="232" y="40" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="600" fill="#0E6E63">CALIBRATED VALUES</text><text x="232" y="56" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5E6B66">from a human-judged</text><text x="232" y="71" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5E6B66">sample, not from taste:</text><text x="232" y="90" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18">v(a) = logit P(rel | a)</text><text x="232" y="105" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18">     - logit P(rel | impr)</text><text x="232" y="128" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">click 1.0   ATC 1.9</text><text x="232" y="143" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">purchase 2.6</text><text x="232" y="164" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#A6402C">far flatter than intuition</text><text x="232" y="179" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#A6402C">says -- the click already</text><text x="232" y="194" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#A6402C">carries most of the signal</text><line x1="210" y1="92" x2="226" y2="92" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-positives)"/><line x1="430" y1="92" x2="452" y2="92" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-positives)"/><rect x="458" y="26" width="234" height="176" rx="7" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="470" y="50" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18">raw  = 37(1.0)+6(1.9)+3(2.6)</text><text x="470" y="67" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">     = 56.2</text><text x="470" y="84" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18"></text><text x="470" y="101" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18">log(1 + raw)      = 4.05</text><text x="470" y="118" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#141A18">/ propensity(4.2) = 0.55</text><text x="470" y="135" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#93A19B">------------------------</text><text x="470" y="152" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">w_pair            = 7.36</text><text x="470" y="169" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">normalised to mean 1</text><text x="470" y="186" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">w                 = 2.45</text></svg>