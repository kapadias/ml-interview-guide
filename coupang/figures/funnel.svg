<svg viewBox="0 0 700 556" role="img" aria-label="Search funnel: query understanding, three parallel retrieval arms, fusion, two ranking stages and a slate policy, with the latency budget each stage receives" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-funnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-funnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-funnel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><rect x="140" y="8" width="320" height="32" rx="6" fill="#F1F5F3" stroke="#C9D4CF" stroke-width="1.2"/><text x="300.0" y="28.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">"durable lightweight winter boots for toddlers"</text><line x1="300" y1="40" x2="300" y2="62" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><rect x="150" y="62" width="300" height="44" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="300.0" y="81.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Query understanding</text><text x="300.0" y="97.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">spell / segment / attributes / intent</text><text x="556" y="90" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0E6E63">8 ms</text><line x1="300" y1="106" x2="300" y2="138" stroke="#141A18" stroke-width="1.4"/><text x="310" y="126" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">structured query</text><line x1="130" y1="138" x2="470" y2="138" stroke="#141A18" stroke-width="1.4"/><line x1="130" y1="138" x2="130" y2="156" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><rect x="55" y="156" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="130.0" y="176.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Lexical</text><text x="130.0" y="192.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">BM25F</text><line x1="130" y1="202" x2="130" y2="220" stroke="#141A18" stroke-width="1.4"/><line x1="300" y1="138" x2="300" y2="156" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><rect x="225" y="156" width="150" height="46" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="300.0" y="176.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Dense</text><text x="300.0" y="192.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">two-tower + HNSW</text><line x1="300" y1="202" x2="300" y2="220" stroke="#141A18" stroke-width="1.4"/><line x1="470" y1="138" x2="470" y2="156" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><rect x="395" y="156" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="470.0" y="176.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Behavioural</text><text x="470.0" y="192.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">q to item, from logs</text><line x1="470" y1="202" x2="470" y2="220" stroke="#141A18" stroke-width="1.4"/><text x="556" y="180" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0E6E63">25 ms</text><text x="556" y="195" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#93A19B">in parallel</text><line x1="130" y1="220" x2="470" y2="220" stroke="#141A18" stroke-width="1.4"/><line x1="300" y1="220" x2="300" y2="242" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><rect x="200" y="242" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="300.0" y="262.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Fusion (RRF)</text><line x1="18" y1="292" x2="682" y2="292" stroke="#A6402C" stroke-width="1.1" stroke-dasharray="5 3"/><text x="18" y="287" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="600" fill="#A6402C">RECALL IS SET ABOVE THIS LINE AND NEVER RECOVERED</text><text x="682" y="287" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="600" fill="#A6402C">everything below only REORDERS</text><line x1="300" y1="274" x2="300" y2="310" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><text x="310" y="306" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">~1000 candidates</text><rect x="150" y="310" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="300.0" y="326.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">L1 ranker</text><text x="300.0" y="342.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">cheap; trained to imitate L2</text><text x="556" y="333" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0E6E63">8 ms</text><line x1="300" y1="348" x2="300" y2="382" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><text x="310" y="378" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">top ~150</text><rect x="150" y="382" width="300" height="44" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="300.0" y="401.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">L2 ranker</text><text x="300.0" y="417.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">pCTR | pCVR | pRel, calibrated</text><text x="556" y="409" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0E6E63">22 ms</text><line x1="300" y1="426" x2="300" y2="460" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><text x="310" y="456" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">top ~50</text><rect x="150" y="460" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="300.0" y="476.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Slate policy</text><text x="300.0" y="492.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">dedup / diversity / blend</text><text x="556" y="483" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#0E6E63">5 ms</text><line x1="300" y1="498" x2="300" y2="524" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-funnel)"/><text x="300" y="540" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#141A18">24 products on the phone</text></svg>