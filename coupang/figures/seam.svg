<svg viewBox="0 0 700 240" role="img" aria-label="A closed loop: retriever feeds ranker feeds logs feeds both models" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-seam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-seam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-seam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><rect x="250" y="10" width="200" height="44" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="350.0" y="29.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Retriever</text><text x="350.0" y="45.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">trained on clicks</text><line x1="350" y1="54" x2="350" y2="96" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-seam)"/><text x="360" y="79" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" fill="#5E6B66">produces the candidate distribution</text><rect x="250" y="96" width="200" height="44" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="350.0" y="115.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Ranker</text><text x="350.0" y="131.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">trained on THOSE candidates only</text><line x1="350" y1="140" x2="350" y2="182" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-seam)"/><text x="360" y="165" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" fill="#5E6B66">decides what is shown</text><rect x="250" y="182" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="350.0" y="201.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Click logs</text><text x="350.0" y="217.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">the only feedback you get</text><path d="M250,204 L120,204 L120,32 L250,32" fill="none" stroke="#A6402C" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowF-seam)"/><path d="M450,204 L580,204 L580,118 L450,118" fill="none" stroke="#A6402C" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrowF-seam)"/><text x="112" y="118" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#A6402C">trains</text><text x="588" y="160" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#A6402C">trains</text></svg>