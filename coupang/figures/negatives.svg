<svg viewBox="0 0 700 232" role="img" aria-label="Three negative sources over the corpus; only uniform sampling reaches the zero-engagement tail" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-negatives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-negatives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-negatives" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><text x="8" y="18" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#5E6B66">THE 10M-ITEM CORPUS</text><rect x="8" y="28" width="684" height="92" rx="6" fill="#F1F5F3" stroke="#C9D4CF"/><rect x="14" y="34" width="150" height="80" rx="4" fill="#D7E6E2" stroke="#0E6E63"/><text x="89" y="62" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#0E6E63">items with</text><text x="89" y="77" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#0E6E63">engagement</text><text x="89" y="96" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="400" fill="#5E6B66">~ a few %</text><text x="428" y="66" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#A6402C">zero-engagement tail</text><text x="428" y="84" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="400" fill="#A6402C">never a positive, so NEVER an in-batch negative</text><text x="428" y="101" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#5E6B66">nothing ever pushes these down</text><rect x="8" y="168" width="216" height="52" rx="6" fill="#FFFFFF" stroke="#0E6E63" stroke-width="1.2"/><text x="116.0" y="191.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#0E6E63">In-batch</text><text x="116.0" y="207.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">the other items in the batch</text><rect x="242" y="168" width="216" height="52" rx="6" fill="#FFFFFF" stroke="#141A18" stroke-width="1.2"/><text x="350.0" y="191.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Mined hard</text><text x="350.0" y="207.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">BM25 / current ANN top-k</text><rect x="476" y="168" width="216" height="52" rx="6" fill="#FFFFFF" stroke="#A6402C" stroke-width="1.2"/><text x="584.0" y="191.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#A6402C">Uniform</text><text x="584.0" y="207.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">drawn from the FULL index</text><line x1="116" y1="168" x2="89" y2="120" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-negatives)"/><line x1="350" y1="168" x2="300" y2="120" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-negatives)"/><line x1="584" y1="168" x2="500" y2="120" stroke="#A6402C" stroke-width="1.4" marker-end="url(#arrowF-negatives)"/></svg>