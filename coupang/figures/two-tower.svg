<svg viewBox="0 0 700 292" role="img" aria-label="Two-tower retriever: a small online query tower and a much larger offline item tower meeting at a dot product" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-two-tower" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-two-tower" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-two-tower" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><rect x="8" y="8" width="330" height="212" rx="8" fill="#F1F5F3" stroke="#C9D4CF" stroke-dasharray="5 4"/><rect x="354" y="8" width="338" height="212" rx="8" fill="#D7E6E2" stroke="#0E6E63" stroke-dasharray="5 4"/><text x="20" y="28" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#5E6B66">ONLINE  -  every request, ~5 ms</text><text x="366" y="28" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0E6E63">OFFLINE  -  once a night, 10M items, no budget</text><rect x="48" y="44" width="250" height="40" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="173.0" y="68.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">"winter boots for toddlers"</text><line x1="173" y1="84" x2="173" y2="104" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-two-tower)"/><rect x="78" y="104" width="190" height="54" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="173.0" y="128.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Query tower</text><text x="173.0" y="144.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">4-6 layers, distilled</text><text x="173" y="176" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#141A18">f(q)</text><line x1="173" y1="158" x2="173" y2="166" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-two-tower)"/><rect x="390" y="44" width="266" height="40" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="523.0" y="68.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#141A18">title + brand + attrs + bullets</text><line x1="523" y1="84" x2="523" y2="104" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-two-tower)"/><rect x="404" y="104" width="238" height="84" rx="6" fill="#FFFFFF" stroke="#0E6E63" stroke-width="1.2"/><text x="523.0" y="143.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">Item tower</text><text x="523.0" y="159.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">12+ layers, image features</text><text x="523" y="210" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#0E6E63">g(d)</text><line x1="523" y1="188" x2="523" y2="198" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-two-tower)"/><line x1="173" y1="186" x2="300" y2="244" stroke="#141A18" stroke-width="1.4" marker-end="url(#arrow-two-tower)"/><line x1="523" y1="224" x2="400" y2="244" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-two-tower)"/><rect x="230" y="244" width="240" height="36" rx="6" fill="#FFFFFF" stroke="#0E6E63" stroke-width="1.2"/><text x="350.0" y="266.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#141A18">s(q,d) = &lt;f(q), g(d)&gt;</text></svg>