<svg viewBox="0 0 700 146" role="img" aria-label="Recomputing features at training time creates skew; logging the served feature vector removes it by construction" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-skew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-skew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-skew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><text x="8" y="18" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#A6402C">RECOMPUTE  (fragile)</text><rect x="8" y="28" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="83.0" y="45.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">serving</text><text x="83.0" y="61.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">computes features</text><rect x="8" y="92" width="150" height="40" rx="6" fill="#FFFFFF" stroke="#C9D4CF" stroke-width="1.2"/><text x="83.0" y="109.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">training</text><text x="83.0" y="125.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">recomputes them</text><line x1="83" y1="68" x2="83" y2="88" stroke="#A6402C" stroke-width="1.4" marker-end="url(#arrowF-skew)"/><text x="168" y="84" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#A6402C">different code, different</text><text x="168" y="99" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#A6402C">cutoff -&gt; skew you find</text><text x="168" y="114" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#A6402C">three months later</text><text x="372" y="18" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="#0E6E63">LOG-AND-TRAIN  (robust)</text><rect x="372" y="28" width="150" height="40" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="447.0" y="45.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">serving</text><text x="447.0" y="61.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">computes features</text><line x1="522" y1="48" x2="556" y2="48" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-skew)"/><rect x="556" y="28" width="136" height="40" rx="6" fill="#FFFFFF" stroke="#0E6E63" stroke-width="1.2"/><text x="624.0" y="52.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">log the vector</text><line x1="624" y1="68" x2="624" y2="88" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-skew)"/><rect x="480" y="92" width="212" height="40" rx="6" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="586.0" y="109.0" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#141A18">training reads exactly</text><text x="586.0" y="125.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#5E6B66">what serving computed</text></svg>