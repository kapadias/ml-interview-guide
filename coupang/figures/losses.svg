<svg viewBox="0 0 700 272" role="img" aria-label="What one gradient step sees under four loss families: a single absolute target, one positive against one negative with a margin, one positive normalised against many negatives, and a whole position-discounted list" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow-losses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#141A18"/></marker><marker id="arrowA-losses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0E6E63"/></marker><marker id="arrowF-losses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#A6402C"/></marker></defs><rect x="8" y="8" width="165" height="254" rx="7" fill="#FFFFFF" stroke="#5E6B66" stroke-width="1.2"/><rect x="8" y="8" width="165" height="30" rx="7" fill="#5E6B66"/><rect x="8" y="28" width="165" height="10" fill="#5E6B66"/><text x="90.5" y="28" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">REGRESSION</text><text x="90.5" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5E6B66">MSE / Huber</text><circle cx="90.5" cy="88" r="15" fill="#D7E6E2" stroke="#141A18" stroke-width="1.2"/><text x="90.5" y="92" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">q</text><circle cx="90.5" cy="150" r="15" fill="#D7E6E2" stroke="#141A18" stroke-width="1.2"/><text x="90.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">d</text><line x1="90.5" y1="103" x2="90.5" y2="133" stroke="#5E6B66" stroke-width="1.4" marker-end="url(#arrow-losses)"/><text x="90.5" y="182" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#A6402C">target = 1.0</text><text x="17" y="214" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">one pair, and an</text><text x="17" y="229" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">ABSOLUTE target that</text><text x="17" y="244" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">does not exist for clicks</text><rect x="181" y="8" width="165" height="254" rx="7" fill="#FFFFFF" stroke="#5E6B66" stroke-width="1.2"/><rect x="181" y="8" width="165" height="30" rx="7" fill="#5E6B66"/><rect x="181" y="28" width="165" height="10" fill="#5E6B66"/><text x="263.5" y="28" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">PAIRWISE</text><text x="263.5" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5E6B66">triplet, BPR, RankNet</text><circle cx="263.5" cy="88" r="15" fill="#D7E6E2" stroke="#141A18" stroke-width="1.2"/><text x="263.5" y="92" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">q</text><circle cx="225.5" cy="150" r="15" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="225.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">d+</text><circle cx="301.5" cy="150" r="15" fill="#D7E6E2" stroke="#A6402C" stroke-width="1.2"/><text x="301.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#A6402C">d-</text><line x1="255.5" y1="103" x2="230.5" y2="133" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-losses)"/><line x1="271.5" y1="103" x2="296.5" y2="133" stroke="#A6402C" stroke-width="1.4" marker-end="url(#arrowF-losses)"/><line x1="240.5" y1="176" x2="286.5" y2="176" stroke="#141A18" stroke-width="1"/><text x="263.5" y="192" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">fixed margin m</text><text x="190" y="214" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">ONE negative at a time,</text><text x="190" y="229" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">and an absolute margin</text><text x="190" y="244" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">in a space you scale</text><rect x="354" y="8" width="165" height="254" rx="7" fill="#FFFFFF" stroke="#0E6E63" stroke-width="1.2"/><rect x="354" y="8" width="165" height="30" rx="7" fill="#0E6E63"/><rect x="354" y="28" width="165" height="10" fill="#0E6E63"/><text x="436.5" y="28" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">SAMPLED SOFTMAX</text><text x="436.5" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5E6B66">InfoNCE / MNRL</text><circle cx="436.5" cy="88" r="15" fill="#D7E6E2" stroke="#141A18" stroke-width="1.2"/><text x="436.5" y="92" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">q</text><circle cx="382.5" cy="150" r="15" fill="#D7E6E2" stroke="#0E6E63" stroke-width="1.2"/><text x="382.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#0E6E63">d+</text><circle cx="420.5" cy="150" r="13" fill="#D7E6E2" stroke="#5E6B66" stroke-width="1.2"/><text x="420.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#5E6B66">d-</text><circle cx="456.5" cy="150" r="13" fill="#D7E6E2" stroke="#5E6B66" stroke-width="1.2"/><text x="456.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#5E6B66">d-</text><circle cx="492.5" cy="150" r="13" fill="#D7E6E2" stroke="#5E6B66" stroke-width="1.2"/><text x="492.5" y="154" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#5E6B66">d-</text><line x1="426.5" y1="103" x2="388.5" y2="134" stroke="#0E6E63" stroke-width="1.4" marker-end="url(#arrowA-losses)"/><line x1="431.38" y1="103" x2="421.78" y2="134" stroke="#5E6B66" stroke-width="1.4" marker-end="url(#arrow-losses)"/><line x1="442.9" y1="103" x2="454.9" y2="134" stroke="#5E6B66" stroke-width="1.4" marker-end="url(#arrow-losses)"/><line x1="454.42" y1="103" x2="488.02" y2="134" stroke="#5E6B66" stroke-width="1.4" marker-end="url(#arrow-losses)"/><rect x="366" y="170" width="141" height="20" rx="4" fill="#D7E6E2" stroke="#0E6E63"/><text x="436.5" y="184" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="600" fill="#0E6E63">normalised over ALL</text><text x="363" y="214" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#141A18">N negatives at once, and</text><text x="363" y="229" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#141A18">NO absolute target --</text><text x="363" y="244" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#141A18">only relative order</text><rect x="527" y="8" width="165" height="254" rx="7" fill="#FFFFFF" stroke="#5E6B66" stroke-width="1.2"/><rect x="527" y="8" width="165" height="30" rx="7" fill="#5E6B66"/><rect x="527" y="28" width="165" height="10" fill="#5E6B66"/><text x="609.5" y="28" text-anchor="middle" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">LISTWISE</text><text x="609.5" y="54" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9.5" font-weight="400" fill="#5E6B66">LambdaRank / ListNet</text><rect x="549" y="74" width="78.0" height="14" rx="2" fill="#D7E6E2" stroke="#0E6E63" stroke-width="0.9"/><text x="541" y="85" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9" font-weight="400" fill="#5E6B66">1</text><text x="633" y="85" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="8.5" font-weight="400" fill="#0E6E63">1.00</text><rect x="549" y="95" width="49.14" height="14" rx="2" fill="#D7E6E2" stroke="#0E6E63" stroke-width="0.9"/><text x="541" y="106" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9" font-weight="400" fill="#5E6B66">2</text><text x="633" y="106" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="8.5" font-weight="400" fill="#0E6E63">0.63</text><rect x="549" y="116" width="39.0" height="14" rx="2" fill="#D7E6E2" stroke="#0E6E63" stroke-width="0.9"/><text x="541" y="127" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9" font-weight="400" fill="#5E6B66">3</text><text x="633" y="127" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="8.5" font-weight="400" fill="#0E6E63">0.50</text><rect x="549" y="137" width="33.54" height="14" rx="2" fill="#D7E6E2" stroke="#0E6E63" stroke-width="0.9"/><text x="541" y="148" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9" font-weight="400" fill="#5E6B66">4</text><text x="633" y="148" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="8.5" font-weight="400" fill="#0E6E63">0.43</text><rect x="549" y="158" width="30.42" height="14" rx="2" fill="#D7E6E2" stroke="#0E6E63" stroke-width="0.9"/><text x="541" y="169" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="9" font-weight="400" fill="#5E6B66">5</text><text x="633" y="169" text-anchor="start" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="8.5" font-weight="400" fill="#0E6E63">0.39</text><text x="609.5" y="192" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10" font-weight="600" fill="#141A18">position discount</text><text x="536" y="214" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">the WHOLE list, weighted</text><text x="536" y="229" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">by what a swap does to</text><text x="536" y="244" text-anchor="start" font-family="'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.8" font-weight="400" fill="#5E6B66">the metric you report</text></svg>